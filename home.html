<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />

<title>AIFT | Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="feed.css">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

:root{
  --blue:#0a66c2;
  --blue-dark:#004182;
  --green:#057642;
  --bg:#f3f2ef;
  --card:#ffffff;
  --text:#191919;
  --muted:#666666;
  --line:#d8d8d8;
  --shadow:0 1px 2px rgba(0,0,0,.08);
  --radius:12px;
  --max:1128px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

a{
  text-decoration:none;
  color:inherit;
}

.hidden{
  display:none!important;
}

.container{
  width:min(var(--max),calc(100% - 24px));
  margin:auto;
}

/* TOPBAR */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.top-inner{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  height:44px;
  width:104px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex-shrink:0;
}

.brand img{
  height:48px;
  width:auto;
  max-width:130px;
  object-fit:contain;
  display:block;
}

.search{
  position:relative;
  width:380px;
  max-width:42vw;
  margin-left:2px;
}

.search input{
  width:100%;
  height:34px;
  border:1px solid #cfd8e3;
  background:#eef3f8;
  border-radius:6px;
  padding:0 12px 0 36px;
  outline:none;
  transition:.2s ease;
}

.search input:focus{
  border-color:#9cc3ea;
  background:#fff;
}

.search svg{
  position:absolute;
  left:11px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  stroke:#64748b;
  fill:none;
  stroke-width:2;
}

.search-clear{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#64748b;
  font-size:18px;
  width:24px;
  height:24px;
  border-radius:50%;
}

.search-clear:hover{
  background:#e5e7eb;
}

.search-panel{
  position:absolute;
  top:42px;
  left:0;
  width:min(520px,90vw);
  background:#fff;
  border:1px solid #d8d8d8;
  border-radius:12px;
  box-shadow:0 18px 40px rgba(15,23,42,.14);
  overflow:hidden;
  z-index:2000;
}

.search-section{
  padding:10px;
  border-bottom:1px solid #eef0f3;
}

.search-section:last-child{
  border-bottom:0;
}

.search-section-title{
  font-size:12px;
  font-weight:900;
  color:#666;
  margin:0 0 8px;
}

.search-result{
  width:100%;
  border:0;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border-radius:8px;
  text-align:left;
}

.search-result:hover{
  background:#f3f2ef;
}

.search-result img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#eef2f7;
}

.search-result strong{
  display:block;
  font-size:13px;
  color:#111;
}

.search-result span{
  display:block;
  font-size:12px;
  color:#666;
  margin-top:2px;
}

.search-empty{
  padding:14px;
  color:#666;
  font-size:13px;
}

.top-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:2px;
}

.top-link{
  position:relative;
  border:0;
  background:#fff;
  color:#666;
  width:78px;
  height:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  border-bottom:2px solid transparent;
}

.top-link.active{
  color:#111;
  border-bottom-color:#111;
}

.top-link svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}

.top-link:hover{
  color:#111;
}

.top-avatar{
  width:24px;
  height:24px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
}

.nav-badge{
  position:absolute;
  top:7px;
  right:18px;
  min-width:17px;
  height:17px;
  padding:0 5px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #fff;
}

/* PAGE */

.page{
  padding:16px 0 40px;
}

.layout{
  display:grid;
  grid-template-columns:225px minmax(0,1fr) 300px;
  gap:16px;
  align-items:start;
}

.left-col,
.right-col{
  position:sticky;
  top:74px;
}

.feed-col{
  min-width:0;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* PROFILE CARD */

.profile-card{
  overflow:hidden;
}

.profile-cover{
  height:64px;
  background:
    linear-gradient(135deg,
      rgba(10,102,194,.28),
      rgba(34,197,94,.18)),
    #c7d2fe;
  background-size:cover;
  background-position:center;
}

.profile-body{
  padding:0 16px 16px;
}

.profile-avatar{
  width:74px;
  height:74px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  background:#fff;
  margin-top:-38px;
}

.profile-name{
  margin:12px 0 4px;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
}

.profile-headline{
  color:#444;
  font-size:13px;
  line-height:1.45;
}

.profile-location{
  margin-top:8px;
  color:#777;
  font-size:12px;
}

.profile-role-badge{
  display:inline-flex;
  align-items:center;
  margin-top:8px;
  color:#0a66c2;
  font-size:12px;
  font-weight:700;
  background:none;
  padding:0;
  border:none;
}

.profile-stats{
  margin-top:16px;
  border-top:1px solid #eee;
}

.profile-stat{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  font-size:12px;
}

.profile-stat strong{
  color:var(--blue);
}

.profile-premium{
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:12px;
  font-size:12px;
  color:#555;
  line-height:1.5;
}

.profile-premium strong{
  display:block;
  color:#111;
  margin-bottom:4px;
}

.left-menu{
  margin-top:12px;
  overflow:hidden;
}

.left-menu button{
  width:100%;
  border:0;
  background:#fff;
  padding:13px 16px;
  text-align:left;
  color:#444;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
}

.left-menu button:hover{
  background:#f3f2ef;
}

.left-menu svg{
  width:18px;
  height:18px;
  stroke:#64748b;
  fill:none;
  stroke-width:2;
}

/* FEED CREATE */

.create-post{
  padding:14px;
  margin-bottom:12px;
}

.create-top{
  display:flex;
  gap:10px;
}

.create-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.create-trigger{
  flex:1;
  height:48px;
  border-radius:999px;
  border:1px solid #999;
  background:#fff;
  text-align:left;
  padding:0 18px;
  color:#666;
  font-weight:700;
}

.create-trigger:hover{
  background:#f3f2ef;
}

.create-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  margin-top:10px;
}

.create-actions button{
  border:0;
  background:#fff;
  padding:12px;
  border-radius:8px;
  color:#555;
  font-weight:700;
}

.create-actions button:hover{
  background:#f3f2ef;
}
.guest-gate-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.48);
  backdrop-filter:blur(6px);
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.guest-gate-backdrop.show{
  display:flex;
}

.guest-gate-card{
  width:min(460px,100%);
  background:#fff;
  border-radius:26px;
  padding:28px;
  box-shadow:0 30px 80px rgba(15,23,42,.26);
  text-align:center;
  border:1px solid #e5e7eb;
}

.guest-gate-logo{
  width:145px;
  height:54px;
  object-fit:contain;
  margin:0 auto 12px;
}

.guest-gate-card h2{
  margin:0;
  font-size:25px;
  line-height:1.2;
  font-weight:900;
  color:#111827;
}

.guest-gate-card p{
  margin:12px 0 22px;
  color:#64748b;
  font-size:14px;
  line-height:1.65;
}

.guest-gate-actions{
  display:grid;
  gap:10px;
}

.gate-btn{
  height:46px;
  border-radius:999px;
  border:1px solid #0a66c2;
  background:#fff;
  color:#0a66c2;
  font-weight:900;
  cursor:pointer;
}

.gate-btn.primary{
  background:#0a66c2;
  color:#fff;
}

.gate-close{
  margin-top:14px;
  border:0;
  background:transparent;
  color:#64748b;
  font-weight:800;
  cursor:pointer;
}

</style>
</head>

  <script>

const API = "https://backend-1-9b6f.onrender.com";

const FALLBACK_AVATAR =
  "https://cdn-icons-png.flaticon.com/512/149/149071.png";

const state = {
  me:null,
  suggestions:[]
};


/* =========================
   AUTH
========================= */

function token(){
  return (
    localStorage.getItem("schoolToken") ||
    localStorage.getItem("teacherToken") ||
    localStorage.getItem("studentToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("talentToken") ||
    localStorage.getItem("agentToken") ||
    localStorage.getItem("token")
  );
}

function role(){
  return localStorage.getItem("role") || "";
}

function currentUserId(){
  return localStorage.getItem("userId");
}

function headers(extra = {}){
  const t = token();

  return {
    ...(t ? { Authorization:`Bearer ${t}` } : {}),
    ...extra
  };
}
function isGuest(){
  return !token();
}

function enableGuestHome(){
  state.me = {
    name:"Guest",
    headline:"Previewing AIFT",
    location:"Sign in to personalize your workspace",
    role:"guest",
    profileImage:FALLBACK_AVATAR,
    profileViews:0,
    postImpressions:0
  };

  renderMe();
  updateDashboardButtons();

  document.body.classList.add("guest-mode");

  setTimeout(() => {
    showGuestGate("continue using AIFT", true);
  }, 60000);
}

function requireLogin(action = "continue"){
  if(!isGuest()) return true;

  showGuestGate(action, false);
  return false;
}

function showGuestGate(action = "continue", locked = false){
  let modal = document.getElementById("guestGateModal");

  if(!modal){
    modal = document.createElement("div");
    modal.id = "guestGateModal";
    modal.className = "guest-gate-backdrop";

    modal.innerHTML = `
      <div class="guest-gate-card">
        <img src="images/aift-logo.png" class="guest-gate-logo" alt="AIFT">

        <h2>Join AIFT to ${escapeHtml(action)}</h2>

        <p>
          You can preview the feed, but signing in lets you post, comment,
          message people, apply for jobs, join groups, and save your activity.
        </p>

        <div class="guest-gate-actions">
          <button class="gate-btn primary" onclick="location.href='login.html'">
            Sign in
          </button>

          <button class="gate-btn" onclick="location.href='register.html'">
            Create account
          </button>
        </div>

        <button id="guestGateClose"
                class="gate-close"
                onclick="closeGuestGate()">
          Continue preview
        </button>
      </div>
    `;

    document.body.appendChild(modal);
  }

  modal.dataset.locked = locked ? "true" : "false";
  modal.classList.add("show");

  const closeBtn = document.getElementById("guestGateClose");
  if(closeBtn){
    closeBtn.style.display = locked ? "none" : "inline-flex";
  }
}

function closeGuestGate(){
  const modal = document.getElementById("guestGateModal");

  if(!modal) return;

  if(modal.dataset.locked === "true"){
    return;
  }

  modal.classList.remove("show");
}
/* =========================
   HELPERS
========================= */

function escapeHtml(v=""){
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function api(path,options={}){

  const res = await fetch(API + path,{
    ...options,
    headers:{
      ...(options.headers || {})
    }
  });

  const text = await res.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }catch{
    data = { message:text };
  }

  if(!res.ok){
    throw new Error(data.message || "Request failed");
  }

  return data;
}

/* =========================
   USER
========================= */

async function loadMe(){

  if(!token()){
    enableGuestHome();
    return;
  }

  const data = await api("/api/users/me",{
    headers:headers()
  });

  state.me = data.user || data;

  if(state.me?._id){
    localStorage.setItem("userId", state.me._id);
  }

  if(state.me?.role){
    localStorage.setItem("role", state.me.role);
  }

  renderMe();
}

    function getRoleLabel(roleValue = ""){
  const r = String(roleValue).toLowerCase();

if(r === "employer") return "Employer";
if(r === "school") return "School";
if(r === "agent") return "Recruiter";
if(r === "talent") return "Job Seeker";
  if(r === "teacher") return "Teacher";
  if(r === "student") return "Student";
  if(r === "admin") return "Admin";

  return "AIFT Member";
}
function renderMe(){

  const me = state.me || {};

  const avatar =
    me.profileImage ||
    FALLBACK_AVATAR;

  document.getElementById("profileAvatar").src = avatar;
  document.getElementById("topAvatar").src = avatar;
  document.getElementById("createAvatar")?.setAttribute("src", avatar);

  document.getElementById("profileName").textContent =
    me.companyName ||
    me.schoolName ||
    me.name ||
    "AIFT User";

document.getElementById("profileHeadline").textContent =
  me.headline ||
  me.profession ||
  "";

  document.getElementById("profileLocation").textContent =
    me.location ||
    "Location not added";

document.getElementById("profileRoleBadge").textContent =
  getRoleLabel(me.role);

  document.getElementById("viewerCount").textContent =
    me.profileViews ||
    me.followers?.length ||
    0;

  document.getElementById("impressionCount").textContent =
    me.postImpressions ||
    0;

  if(me.bannerImage){

    document.getElementById("profileCover").style.backgroundImage =
      `linear-gradient(
        135deg,
        rgba(10,102,194,.24),
        rgba(34,197,94,.16)
      ),
      url('${me.bannerImage}')`;

  }

  updateDashboardButtons();
}

function updateDashboardButtons(){

  const r = String(state.me?.role || role() || "").toLowerCase();

  const allowed =
    ["employer","school","admin","agent","talent"]
      .includes(r);

  document.getElementById("dashboardMenuBtn")
    ?.classList.toggle("hidden", !allowed);

}

/* =========================
   SUGGESTIONS
========================= */

async function loadSuggestions(){

  try{

    const data = await api(
      "/api/users/suggestions",
      {
        headers:headers()
      }
    );

    state.suggestions =
      Array.isArray(data)
        ? data
        : [];

  }catch(err){

    console.warn("Suggestions failed");

    state.suggestions = [];

  }

  renderSuggestions();
}

function renderSuggestions(){

  const mount =
    document.getElementById("suggestionsMount");

  if(!state.suggestions.length){

    mount.innerHTML = `
      <div class="side-loading">
        No suggestions available yet.
      </div>
    `;

    return;
  }

  mount.innerHTML =
    state.suggestions.slice(0,5).map(user => `

      <div class="side-user">

        <img
          src="${
            user.profileImage ||
            FALLBACK_AVATAR
          }"
        >

        <div>

          <h4>
            ${
              escapeHtml(
                user.companyName ||
                user.name ||
                "User"
              )
            }
          </h4>

          <p>
            ${
              escapeHtml(
                user.headline ||
                user.profession ||
                user.role ||
                "Professional"
              )
            }
          </p>

          <button
            class="follow-btn"
            onclick="followUser('${user._id}')"
          >
            Follow
          </button>

        </div>

      </div>

    `).join("") + `
  <button class="view-network-btn" onclick="goNetwork()">
    View more
  </button>
`;
}

async function followUser(id){

  try{

    await api(
      `/api/users/${id}/follow`,
      {
        method:"PATCH",
        headers:headers()
      }
    );

    await loadSuggestions();

  }catch(err){

    console.error(err);

  }
}
async function loadNotificationBadge(){
  const badge = document.getElementById("notificationBadge");
  if(!badge) return;

  try{
    let count = 0;

    try{
      const unread = await api("/api/notifications/unread", {
        headers: headers()
      });

      count =
        unread.count ||
        unread.unreadCount ||
        unread.total ||
        (Array.isArray(unread) ? unread.length : 0);

    }catch{
      const data = await api("/api/notifications", {
        headers: headers()
      });

      const list = Array.isArray(data)
        ? data
        : data.notifications || [];

      count = list.filter(n => !n.read && !n.isRead).length;
    }

    badge.textContent = count > 99 ? "99+" : String(count);
    badge.classList.toggle("hidden", count <= 0);

  }catch(err){
    badge.classList.add("hidden");
  }
}
    let searchTimer = null;
let searchResults = {
  users: [],
  jobs: []
};

function userProfileUrl(user){
  const id = user?._id || user?.id;
  const r = String(user?.role || "").toLowerCase();

  if(!id) return "home.html";

  if(r === "employer"){
    return `employer-public-profile.html?id=${id}`;
  }

  if(r === "school"){
    return `school.html?id=${id}`;
  }

  return `agent-public-profile.html?id=${id}`;
}

function openSearchPanel(){
  const input = document.getElementById("globalSearchInput");
  if(input?.value.trim()){
    document.getElementById("globalSearchPanel")?.classList.remove("hidden");
  }
}

function clearGlobalSearch(){
  const input = document.getElementById("globalSearchInput");
  const panel = document.getElementById("globalSearchPanel");
  const clear = document.getElementById("globalSearchClear");

  if(input) input.value = "";
  if(panel){
    panel.innerHTML = "";
    panel.classList.add("hidden");
  }
  clear?.classList.add("hidden");
}

function handleGlobalSearchInput(event){
  const q = event.target.value.trim();
  const clear = document.getElementById("globalSearchClear");

  clear?.classList.toggle("hidden", !q);

  clearTimeout(searchTimer);

  if(q.length < 2){
    renderSearchPanel("", [], []);
    return;
  }

  searchTimer = setTimeout(() => {
    runGlobalSearch(q);
  }, 300);
}

function handleGlobalSearchKey(event){
  const q = event.target.value.trim();

  if(event.key === "Enter" && q){
    event.preventDefault();
    location.href = `network.html?search=${encodeURIComponent(q)}`;
  }

  if(event.key === "Escape"){
    clearGlobalSearch();
  }
}

async function runGlobalSearch(q){
  try{
    const [usersData, jobsData] = await Promise.allSettled([
      api(`/api/users/network?search=${encodeURIComponent(q)}&limit=5`, {
        headers: headers()
      }),
      api(`/api/jobs?search=${encodeURIComponent(q)}&limit=5`, {
        headers: headers()
      })
    ]);

    const users =
      usersData.status === "fulfilled"
        ? (
            Array.isArray(usersData.value)
              ? usersData.value
              : usersData.value.users || usersData.value.results || []
          )
        : [];

    const jobs =
      jobsData.status === "fulfilled"
        ? (
            Array.isArray(jobsData.value)
              ? jobsData.value
              : jobsData.value.jobs || jobsData.value.results || []
          )
        : [];

    searchResults = { users, jobs };
    renderSearchPanel(q, users, jobs);

  }catch(err){
    renderSearchPanel(q, [], []);
  }
}

function renderSearchPanel(q, users, jobs){
  const panel = document.getElementById("globalSearchPanel");
  if(!panel) return;

  if(!q){
    panel.innerHTML = "";
    panel.classList.add("hidden");
    return;
  }

  const userHtml = users.slice(0,5).map(user => `
    <button class="search-result" onclick="location.href='${userProfileUrl(user)}'">
      <img src="${user.profileImage || FALLBACK_AVATAR}" alt="">
      <span>
        <strong>${escapeHtml(user.companyName || user.schoolName || user.name || "AIFT User")}</strong>
        <span>${escapeHtml(user.headline || user.profession || user.role || "Profile")}</span>
      </span>
    </button>
  `).join("");

  const jobHtml = jobs.slice(0,5).map(job => `
    <button class="search-result" onclick="location.href='jobs.html?job=${job._id || job.id}'">
      <img src="${job.companyLogo || job.logo || FALLBACK_AVATAR}" alt="">
      <span>
        <strong>${escapeHtml(job.title || "Job opportunity")}</strong>
        <span>${escapeHtml(job.companyName || job.company || job.location || "AIFT Job")}</span>
      </span>
    </button>
  `).join("");

  panel.innerHTML = `
    ${
      users.length
        ? `<div class="search-section">
            <p class="search-section-title">People and companies</p>
            ${userHtml}
          </div>`
        : ""
    }

    ${
      jobs.length
        ? `<div class="search-section">
            <p class="search-section-title">Jobs</p>
            ${jobHtml}
          </div>`
        : ""
    }

    ${
      !users.length && !jobs.length
        ? `<div class="search-empty">No results found for "${escapeHtml(q)}"</div>`
        : ""
    }
  `;

  panel.classList.remove("hidden");
}

document.addEventListener("click", function(event){
  const search = document.querySelector(".search");
  if(search && !search.contains(event.target)){
    document.getElementById("globalSearchPanel")?.classList.add("hidden");
  }
});

    document.addEventListener("click", function(event){
  if(!isGuest()) return;

  const blocked = event.target.closest(`
    button,
    a[href],
    [onclick],
    .aift-action-btn,
    .aift-composer,
    .aift-like-btn,
    .aift-comment-btn,
    .aift-share-btn
  `);

  if(!blocked) return;

const href = blocked.getAttribute?.("href") || "";

const allowed =
  blocked.closest(".guest-gate-card") ||
  blocked.closest(".brand") ||
  href.includes("network.html") ||
  href.includes("jobs.html");

if(allowed) return;

  event.preventDefault();
  event.stopPropagation();

  showGuestGate("use this feature", false);
}, true);

   NAVIGATION

function goHome(){

}

function goNetwork(){

function openDashboard(){

  if(r === "talent"){
    location.href = "talent.html";
    return;
  }

  if(r === "school"){
    location.href = "school.html";
    return;
  }

  if(r === "employer"){
    location.href = "employer.html";

  if(r === "agent"){
    location.href = "agent.html";
    return;
  }

  if(r === "admin"){
    location.href = "admin.html";

  }

  openProfile();
}

function openProfile(){
  const id = state.me?._id || currentUserId();
  if(!id) return;

  const r = String(state.me?.role || role()).toLowerCase();

  if(r === "employer"){
    location.href = `employer-public-profile.html?id=${id}`;

  if(r === "agent" || r === "talent"){
    location.href = `agent-public-profile.html?id=${id}`;

  if(r === "school"){
    location.href = "school.html";
    return;

  location.href = `agent-public-profile.html?id=${id}`;
}

async function mountFeed(){

  if(window.AIFTFeed && typeof window.AIFTFeed.mount === "function"){

    AIFTFeed.mount("feedMount", {

      infiniteScroll: true,
      realtime: true

  mount.innerHTML = `

      Make sure feed.js is connected correctly.
    </div>
  `;
}
async function mountGuestFeedPreview(){
  const mount = document.getElementById("feedMount");

  mount.innerHTML = `
    <div class="card" style="padding:24px;text-align:center;color:#666;font-size:14px;">
      Loading AIFT public preview...
    </div>
  `;

  try{
    const res = await fetch(API + "/api/posts/public?limit=10");

    if(!res.ok){
      throw new Error("Guest feed is blocked by backend.");

    const posts = Array.isArray(data)

      mount.innerHTML = `

      const name = author.companyName || author.schoolName || author.name || "AIFT Member";
      const avatar = author.profileImage || FALLBACK_AVATAR;

  post.mediaUrl ||
  post.media?.[0]?.url ||
  post.image ||
  post.video ||
  "";

      return `
        <article class="aift-post-card card" style="margin-bottom:12px;overflow:hidden;">

          </div>
        </article>
      `;
    }).join("");

  }catch(err){
    mount.innerHTML = `
      <div class="card" style="padding:24px;color:#666;font-size:14px;line-height:1.6;">
        Guest feed preview could not load because the backend is blocking public post access.
        <br><br>
        Backend needed:
        <strong>GET /api/posts/public</strong>

        <strong>GET /api/posts?limit=10</strong>.

    `;
  }
}

function enhanceFeedAfterRender(){

  const posts =
    document.querySelectorAll(
      "#feedMount .post-card"
    );

  posts.forEach(post=>{

    post.style.borderRadius = "12px";
    post.style.overflow = "hidden";

  });
}

/* =========================
   OBSERVER
========================= */

const observer =
  new MutationObserver(()=>{

    enhanceFeedAfterRender();

  });

observer.observe(
  document.body,
  {
    childList:true,
    subtree:true
  }
);

/* =========================
   SCROLL
========================= */

let lastScroll = 0;

window.addEventListener("scroll",()=>{

  if(window.innerWidth > 760){
    return;
  }

  const nav =
    document.querySelector(".mobile-nav");

  const current =
    window.scrollY;

  if(current > lastScroll && current > 80){

    nav.style.transform =
      "translateY(100%)";

  }else{

    nav.style.transform =
      "translateY(0)";

  }

  lastScroll = current;
});

/* =========================
   ERROR SAFE
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled promise rejection:",
      event.reason
    );

  }
);

window.addEventListener(
  "error",
  event => {

    console.error(
      "Global error:",
      event.error
    );

  }
);

/* =========================
   INIT
========================= */

async function init(){

  try{

    await loadMe();

await Promise.allSettled([
  loadSuggestions(),
  loadNotificationBadge()
]);

    await mountFeed();

    enhanceFeedAfterRender();

    document.getElementById(
      "feedMount"
    ).innerHTML = `
      <div class="card" style="
        padding:26px;
        text-align:center;
      ">

          color:#666;
        ">
          ${
            escapeHtml(
              err.message ||
              "Something went wrong."
            )
          }
        </p>

      </div>
    `;
  }
}

init();

<style>

/* =========================
   FEED OVERRIDES
========================= */

#feedMount{
  min-height:300px;
}

#feedMount .aift-feed-shell{
  width:100%!important;
  max-width:100%!important;
  margin:0!important;
}

#feedMount .aift-composer{
  display:block!important;
}

#feedMount .aift-post-card{
  border-radius:12px!important;
  border:1px solid #d8d8d8!important;
  box-shadow:0 1px 2px rgba(0,0,0,.08)!important;
  margin-bottom:12px!important;
  overflow:hidden!important;
}

#feedMount .aift-post-header{
  padding:12px 14px 8px!important;
}

#feedMount .aift-author-name strong{
  font-size:14px!important;
  font-weight:800!important;
  color:#191919!important;
}

#feedMount .aift-author-text span{
  font-size:12px!important;
  color:#666!important;
}

#feedMount .aift-post-text{
  padding:2px 14px 12px!important;
  font-size:14px!important;
  line-height:1.58!important;
  color:#222!important;
}

#feedMount .aift-post-media{
  max-height:720px!important;
  object-fit:cover!important;
}

#feedMount .aift-post-actions{
  padding:4px 8px!important;
  border-top:1px solid #eee!important;
}

#feedMount .aift-action-btn:hover{
  background:#f3f2ef!important;
}

@media(max-width:760px){
  #feedMount .aift-post-card{
    border-radius:0!important;
    border-left:0!important;
    border-right:0!important;
    margin-bottom:8px!important;
  }

  #feedMount .aift-post-media{
    max-height:520px!important;
  }
}

/* =========================
   LOADING
========================= */

.feed-skeleton{
  background:#fff;
  border:1px solid #d8d8d8;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  animation:pulse 1.4s infinite;
}

.feed-skeleton-line{
  height:12px;
  border-radius:999px;
  background:#ececec;
  margin-bottom:10px;
}

.feed-skeleton-line.large{
  height:18px;
  width:50%;
}

.feed-skeleton-line.medium{
  width:80%;
}

.feed-skeleton-line.small{
  width:35%;
}

.feed-skeleton-media{
  height:260px;
  border-radius:12px;
  background:#ececec;
  margin-top:12px;
}

@keyframes pulse{
  0%{
    opacity:.55;
  }
  50%{
    opacity:1;
  }
  100%{
    opacity:.55;
  }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
  width:10px;
}

::-webkit-scrollbar-thumb{
  background:#c7ccd3;
  border-radius:999px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

/* =========================
   TRANSITIONS
========================= */

.card,
button,
input{
  transition:.2s ease;
}

/* =========================
   DESKTOP POLISH
========================= */

@media(min-width:761px){

  .feed-col{
    min-width:0;
  }

  .create-post:hover{
    box-shadow:
      0 2px 6px rgba(0,0,0,.08),
      0 8px 24px rgba(10,102,194,.05);
  }

  .profile-card:hover,
  .side-card:hover{
    box-shadow:
      0 2px 6px rgba(0,0,0,.08),
      0 10px 24px rgba(0,0,0,.05);
  }

}

/* =========================
   MOBILE FEED
========================= */

@media(max-width:760px){

  #feedMount .post-card,
  #feedMount .feed-post,
  #feedMount .feed-item{
    border-radius:0!important;
    border-left:0!important;
    border-right:0!important;
    margin-bottom:8px!important;
  }

  #feedMount video,
  #feedMount img{
    max-height:520px!important;
  }

  .mobile-nav{
    transition:transform .28s ease;
  }

}

/* =========================
   SAFE AREA
========================= */

@supports(padding:max(0px)){

  .mobile-nav{
    padding-bottom:
      max(0px,env(safe-area-inset-bottom));
  }

}

/* =========================
   FINAL
========================= */

body.loaded{
  opacity:1;
}

body{
  opacity:0;
  transition:opacity .25s ease;
}

</style>

<script>

/* =========================
   FINAL PAGE READY
========================= */

window.addEventListener(
  "load",
  ()=>{

    document.body.classList.add("loaded");

  }
);


/* =========================
   FEED READY WATCHER
========================= */

const feedWatcher =
  setInterval(()=>{

    const hasPosts =
      document.querySelector(
        "#feedMount .post-card, #feedMount .feed-post"
      );

    if(hasPosts){

      clearInterval(feedWatcher);

      enhanceFeedAfterRender();

    }

  },600);

</script>
  <script>
function focusComposer(){
  const composer = document.querySelector("#feedMount .aift-composer");
  const textarea =
    composer?.querySelector("textarea") ||
    composer?.querySelector("[contenteditable='true']") ||
    composer?.querySelector("input[type='text']");

  if(composer){
    composer.scrollIntoView({ behavior:"smooth", block:"center" });
  }

  if(textarea){
    setTimeout(() => textarea.focus(), 300);
  }
}
</script>
</body>
</html>
