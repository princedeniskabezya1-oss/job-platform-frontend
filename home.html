<style>

:root{
  --blue:#0a66c2;
  --blue-dark:#004182;
  --green:#057642;
  --bg:#f3f2ef;
  --card:#ffffff;
  --text:#191919;
  --muted:#666666;
  --line:#d8d8d8;
  --shadow:0 1px 2px rgba(0,0,0,.08);
  --radius:12px;
  --max:1128px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

a{
  text-decoration:none;
  color:inherit;
}

.hidden{
  display:none!important;
}

.container{
  width:min(var(--max),calc(100% - 24px));
  margin:auto;
}

/* TOPBAR */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.top-inner{
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
}

.brand{
  width:34px;
  height:34px;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:900;
  flex-shrink:0;
}

.search{
  position:relative;
  width:280px;
  max-width:40vw;
}

.search input{
  width:100%;
  height:34px;
  border:1px solid #cfd8e3;
  background:#eef3f8;
  border-radius:6px;
  padding:0 12px 0 36px;
  outline:none;
  transition:.2s ease;
}

.search input:focus{
  border-color:#9cc3ea;
  background:#fff;
}

.search svg{
  position:absolute;
  left:11px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  stroke:#64748b;
  fill:none;
  stroke-width:2;
}

.top-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:2px;
}

.top-link{
  position:relative;
  border:0;
  background:#fff;
  color:#666;
  width:78px;
  height:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  border-bottom:2px solid transparent;
}

.top-link.active{
  color:#111;
  border-bottom-color:#111;
}

.top-link svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}

.top-link:hover{
  color:#111;
}

.top-avatar{
  width:24px;
  height:24px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
}

/* PAGE */

.page{
  padding:16px 0 40px;
}

.layout{
  display:grid;
  grid-template-columns:225px minmax(0,1fr) 300px;
  gap:16px;
  align-items:start;
}

.left-col,
.right-col{
  position:sticky;
  top:74px;
}

.feed-col{
  min-width:0;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* PROFILE CARD */

.profile-card{
  overflow:hidden;
}

.profile-cover{
  height:64px;
  background:
    linear-gradient(135deg,
      rgba(10,102,194,.28),
      rgba(34,197,94,.18)),
    #c7d2fe;
  background-size:cover;
  background-position:center;
}

.profile-body{
  padding:0 16px 16px;
}

.profile-avatar{

  height:74px;
  border-radius:50%;

  border:3px solid #fff;
  background:#fff;
  margin-top:-38px;
}

.profile-name{

  font-weight:800;

.profile-headline{

.profile-location{

.profile-company{

  font-size:13px;
  font-weight:700;

.profile-company img{

.profile-stats{

.profile-stat{

.profile-stat strong{

.profile-premium{

  <script>

const API = "https://backend-1-9b6f.onrender.com";

const FALLBACK_AVATAR =
  "https://cdn-icons-png.flaticon.com/512/149/149071.png";

const state = {
  me:null,
  suggestions:[]
};


/* =========================
   AUTH
========================= */

function token(){
  return (
    localStorage.getItem("employerToken") ||
    localStorage.getItem("talentToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("agentToken") ||
    localStorage.getItem("schoolToken") ||
    localStorage.getItem("token")
  );
}

function role(){
  return localStorage.getItem("role") || "";
}

function currentUserId(){
  return localStorage.getItem("userId");
}

function headers(extra = {}){
  const t = token();

  return {
    ...(t ? { Authorization:`Bearer ${t}` } : {}),
    ...extra
  };
}

/* =========================
   HELPERS
========================= */

function escapeHtml(v=""){
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function api(path,options={}){

  const res = await fetch(API + path,{
    ...options,
    headers:{
      ...(options.headers || {})
    }
  });

  const text = await res.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }catch{
    data = { message:text };
  }

  if(!res.ok){
    throw new Error(data.message || "Request failed");
  }

  return data;
}

/* =========================
   USER
========================= */

async function loadMe(){

  if(!token()){
    location.href = "login.html";
    return;
  }

  const data = await api("/api/users/me",{
    headers:headers()
  });

state.me = data.user || data;

if(state.me?._id){
  localStorage.setItem("userId", state.me._id);
}

if(state.me?.role){
  localStorage.setItem("role", state.me.role);
}

renderMe();
}

function renderMe(){

  const me = state.me || {};

  const avatar =
    me.profileImage ||
    FALLBACK_AVATAR;

  document.getElementById("profileAvatar").src = avatar;
  document.getElementById("topAvatar").src = avatar;
  document.getElementById("createAvatar")?.setAttribute("src", avatar);

  document.getElementById("profileName").textContent =
    me.companyName ||
    me.schoolName ||
    me.name ||
    "AIFT User";

  document.getElementById("profileHeadline").textContent =
    me.headline ||
    me.profession ||
    me.role ||
    "AIFT member";

  document.getElementById("profileLocation").textContent =
    me.location ||
    "Location not added";

  document.getElementById("profileCompany").textContent =
    me.companyName ||
    me.schoolName ||
    "AIFT";

  document.getElementById("viewerCount").textContent =
    me.profileViews ||
    me.followers?.length ||
    0;

  document.getElementById("impressionCount").textContent =
    me.postImpressions ||
    0;

  if(me.bannerImage){

    document.getElementById("profileCover").style.backgroundImage =
      `linear-gradient(
        135deg,
        rgba(10,102,194,.24),
        rgba(34,197,94,.16)
      ),
      url('${me.bannerImage}')`;

  }

  updateDashboardButtons();
}

function updateDashboardButtons(){

  const r = String(state.me?.role || role() || "").toLowerCase();

  const allowed =
    ["employer","school","admin","agent"]
      .includes(r);

  document.getElementById("dashboardMenuBtn")
    ?.classList.toggle("hidden", !allowed);

}

/* =========================
   SUGGESTIONS
========================= */

async function loadSuggestions(){

  try{

    const data = await api(
      "/api/users/suggestions",
      {
        headers:headers()
      }
    );

    state.suggestions =
      Array.isArray(data)
        ? data
        : [];

  }catch(err){

    console.warn("Suggestions failed");

    state.suggestions = [];

  }

  renderSuggestions();
}

function renderSuggestions(){

  const mount =
    document.getElementById("suggestionsMount");

  if(!state.suggestions.length){

    mount.innerHTML = `
      <div class="side-loading">
        No suggestions available yet.
      </div>
    `;

    return;
  }

  mount.innerHTML =
    state.suggestions.map(user => `

      <div class="side-user">

        <img
          src="${
            user.profileImage ||
            FALLBACK_AVATAR
          }"
        >

        <div>

          <h4>
            ${
              escapeHtml(
                user.companyName ||
                user.name ||
                "User"
              )
            }
          </h4>

          <p>
            ${
              escapeHtml(
                user.headline ||
                user.profession ||
                user.role ||
                "Professional"
              )
            }
          </p>

          <button
            class="follow-btn"
            onclick="followUser('${user._id}')"
          >
            Follow
          </button>

        </div>

      </div>

    `).join("");
}

async function followUser(id){

  try{

    await api(
      `/api/users/${id}/follow`,
      {
        method:"PATCH",
        headers:headers()
      }
    );

    await loadSuggestions();

  }catch(err){

    console.error(err);

  }
}

  if(r === "school"){
    location.href = "school.html";

  }

  if(r === "employer"){

  if(r === "agent"){
    location.href = "agent.html";
    return;
  }

if(r === "admin"){

function openProfile(){
  if(!state.me?._id) return;

  const r = String(state.me.role || role()).toLowerCase();

  if(r === "school"){
    location.href = `school-public-profile.html?id=${state.me._id}`;
    return;

  if(r === "employer"){

    return;

  if(r === "agent"){
    location.href = `agent-public-profile.html?id=${state.me._id}`;
    return;

  location.href = `public-profile.html?id=${state.me._id}`;
}

<script>

/* =========================
   FEED
========================= */

function mountFeed(){

  const mount =
    document.getElementById("feedMount");

if(
  AIFTFeed &&
  typeof AIFTFeed.mount === "function"
){

AIFTFeed.mount("feedMount", {
  mode: "home",
  showComposer: true,
  infiniteScroll: true,
  realtime: true
});

    return;
  }

  mount.innerHTML = `
    <div class="card" style="
      padding:24px;
      text-align:center;
      color:#666;
      font-size:14px;
    ">
      Feed system not detected.<br><br>
      Make sure feed.js is connected correctly.
    </div>
  `;
}


/* =========================
   UI EFFECTS
========================= */

function pulseNotifications(){

  const alertsBtn =
    document.querySelectorAll(".top-link")[4];

  if(!alertsBtn) return;

  alertsBtn.animate(
    [
      { transform:"scale(1)" },
      { transform:"scale(1.08)" },
      { transform:"scale(1)" }
    ],
    {
      duration:600
    }
  );
}

/* =========================
   FEED POLISH
========================= */

function enhanceFeedAfterRender(){

  const posts =
    document.querySelectorAll(
      "#feedMount .post-card"
    );

  posts.forEach(post=>{

    post.style.borderRadius = "12px";
    post.style.overflow = "hidden";

  });
}

/* =========================
   OBSERVER
========================= */

const observer =
  new MutationObserver(()=>{

    enhanceFeedAfterRender();

  });

observer.observe(
  document.body,
  {
    childList:true,
    subtree:true
  }
);

/* =========================
   SCROLL
========================= */

let lastScroll = 0;

window.addEventListener("scroll",()=>{

  if(window.innerWidth > 760){
    return;
  }

  const nav =
    document.querySelector(".mobile-nav");

  const current =
    window.scrollY;

  if(current > lastScroll && current > 80){

    nav.style.transform =
      "translateY(100%)";

  }else{

    nav.style.transform =
      "translateY(0)";

  }

  lastScroll = current;
});

/* =========================
   ERROR SAFE
========================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled promise rejection:",
      event.reason
    );

  }
);

window.addEventListener(
  "error",
  event => {

    console.error(
      "Global error:",
      event.error
    );

  }
);

/* =========================
   INIT
========================= */

async function init(){

  try{

    await loadMe();

    await Promise.allSettled([
      loadSuggestions()
    ]);

    mountFeed();

    enhanceFeedAfterRender();

  }catch(err){

    console.error(err);

    document.getElementById(
      "feedMount"
    ).innerHTML = `
      <div class="card" style="
        padding:26px;
        text-align:center;
      ">

        <h2 style="
          margin:0 0 10px;
          font-size:22px;
        ">
          Unable to load home
        </h2>

        <p style="
          margin:0;
          color:#666;
        ">
          ${
            escapeHtml(
              err.message ||
              "Something went wrong."
            )
          }
        </p>

      </div>
    `;
  }
}

init();

</script>

/* =========================
   FEED READY WATCHER
========================= */

const feedWatcher =
  setInterval(()=>{

    const hasPosts =
      document.querySelector(
        "#feedMount .post-card, #feedMount .feed-post"
      );

    if(hasPosts){

      clearInterval(feedWatcher);

      enhanceFeedAfterRender();

    }

  },600);

<script>
document.addEventListener("change", function(e){
  const input = e.target;

  if(!input || input.type !== "file") return;

  const file = input.files && input.files[0];
  if(!file) return;

  const composer =
    input.closest(".aift-composer") ||
    document.querySelector("#feedMount .aift-composer");

  if(!composer) return;

  let preview = composer.querySelector(".aift-media-preview");

  if(!preview){
    preview = document.createElement("div");
    preview.className = "aift-media-preview";
    composer.appendChild(preview);
  }

  const url = URL.createObjectURL(file);

  if(file.type.startsWith("video/")){
    preview.innerHTML = `
      <video controls style="
        width:100%;
        max-height:420px;
        border-radius:12px;
        margin-top:12px;
        background:#000;
      ">
        <source src="${url}" type="${file.type}">
      </video>
    `;
  }else{
    preview.innerHTML = `
      <img src="${url}" style="
        width:100%;
        max-height:420px;
        object-fit:cover;
        border-radius:12px;
        margin-top:12px;
      ">
    `;
  }
});
</script>
  <script>
function focusComposer(){
  const composer = document.querySelector("#feedMount .aift-composer");
  const textarea =
    composer?.querySelector("textarea") ||
    composer?.querySelector("[contenteditable='true']") ||
    composer?.querySelector("input[type='text']");

  if(composer){
    composer.scrollIntoView({ behavior:"smooth", block:"center" });
  }

  if(textarea){
    setTimeout(() => textarea.focus(), 300);
  }
}
</script>
