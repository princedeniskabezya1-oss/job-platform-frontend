<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>AIFT Jobs | Find opportunities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


<link rel="stylesheet" href="shared-post-composer.css">
  <link rel="stylesheet" href="jobs-mobile.css">

<style>
:root{
  --aift-blue:#2557a7;
  --aift-blue-dark:#164081;
  --aift-blue-soft:#eef5ff;
  --aift-green:#087f5b;
  --aift-yellow:#f59e0b;

  --bg:#f3f2ef;
  --card:#ffffff;
  --ink:#111827;
  --text:#1f2937;
  --muted:#64748b;
  --soft:#f8fafc;
  --line:#e5e7eb;
  --line-dark:#d1d5db;

  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow-sm:0 8px 22px rgba(15,23,42,.06);
  --shadow-md:0 16px 42px rgba(15,23,42,.09);
  --shadow-lg:0 28px 80px rgba(15,23,42,.16);

  --radius-sm:12px;
  --radius:18px;
  --radius-lg:26px;
  --radius-xl:32px;

  --sidebar:260px;
  --mobile-top:54px;
  --mobile-bottom:58px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body.jobs-loading{
  cursor:progress;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

svg{
  flex:none;
}

/* Desktop safety: mobile-only items must never show on desktop */
.jobs-bottom-bar,
.mobile-nav,
.shared-mobile-nav,
.jobs-filter-toggle{
  display:none!important;
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
  position:absolute!important;
  width:0!important;
  height:0!important;
  overflow:hidden!important;
}

/* APP SHELL */

.jobs-app{
  min-height:100vh;
  display:grid;
  grid-template-columns:var(--sidebar) minmax(0,1fr);
}

/* DESKTOP SIDEBAR */

.jobs-sidebar{
  position:sticky;
  top:0;
  height:100vh;
  z-index:30;
  background:#fff;
  border-right:1px solid var(--line);
  padding:18px 14px;
}

.jobs-brand{
  display:flex;
  align-items:center;
  padding:8px 10px 18px;
  margin-bottom:14px;
  border-bottom:1px solid var(--line);
}

.jobs-brand img{
  width:142px;
  height:50px;
  object-fit:contain;
}

.jobs-nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.jobs-nav a,
.jobs-nav button{
  width:100%;
  min-height:44px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:14px;
  color:#334155;
  font-weight:800;
  font-size:13px;
  text-align:left;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}

.jobs-nav a:hover,
.jobs-nav button:hover{
  background:#f1f5f9;
  color:var(--aift-blue);
}

.jobs-nav .active{
  color:var(--aift-blue);
  background:#eff6ff;
}

.jobs-nav svg{
  width:19px;
  height:19px;
  stroke-width:2.2;
}

/* MAIN */

.jobs-main{
  min-width:0;
  padding:18px;
}

/* DESKTOP SEARCH */

.jobs-search-card{
  position:sticky;
  top:14px;
  z-index:25;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow-md);
  padding:14px;
}

.jobs-search-grid{
  display:grid;
  grid-template-columns:1.45fr .9fr .75fr .75fr auto;
  gap:10px;
  align-items:center;
}

.jobs-field{
  height:46px;
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#f8fafc;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}

.jobs-field:focus-within{
  background:#fff;
  border-color:rgba(37,87,167,.58);
  box-shadow:0 0 0 4px rgba(37,87,167,.09);
}

.jobs-field svg{
  width:18px;
  height:18px;
  color:#64748b;
}

.jobs-field input,
.jobs-field select{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#0f172a;
  font-size:13px;
  font-weight:650;
}

.jobs-field input::placeholder{
  color:#7a8699;
  font-weight:500;
}

.jobs-search-btn{
  height:46px;
  border:0;
  border-radius:999px;
  padding:0 20px;
  background:var(--aift-blue);
  color:#fff;
  font-weight:900;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  box-shadow:0 10px 20px rgba(37,87,167,.18);
  transition:background .16s ease,transform .16s ease,box-shadow .16s ease;
}

.jobs-search-btn:hover{
  background:var(--aift-blue-dark);
  transform:translateY(-1px);
  box-shadow:0 14px 26px rgba(37,87,167,.22);
}

.jobs-search-btn svg{
  width:18px;
  height:18px;
}

/* HERO */

.jobs-hero{
  margin-top:18px;
  border-radius:28px;
  border:1px solid rgba(37,87,167,.13);
  background:
    radial-gradient(circle at 8% 12%,rgba(37,87,167,.13),transparent 28%),
    radial-gradient(circle at 92% 4%,rgba(8,127,91,.12),transparent 26%),
    linear-gradient(135deg,#ffffff,#f4f8ff);
  padding:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  overflow:hidden;
  box-shadow:var(--shadow-xs);
}

.jobs-hero-copy{
  min-width:0;
}





.jobs-hero h1{
  margin:0;
  max-width:760px;
  color:#0f172a;
  font-size:32px;
  line-height:1.06;
  letter-spacing:-.065em;
  font-weight:900;
}

.jobs-hero p{
  margin:10px 0 0;
  max-width:780px;
  color:#64748b;
  font-size:13px;
  line-height:1.65;
  font-weight:600;
}

.jobs-hero-stats{
  min-width:330px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.jobs-stat{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(226,232,240,.95);
  border-radius:18px;
  padding:14px 10px;
  text-align:center;
  box-shadow:0 8px 18px rgba(15,23,42,.04);
}

.jobs-stat strong{
  display:block;
  color:#0f172a;
  font-size:22px;
  line-height:1;
  letter-spacing:-.05em;
  font-weight:900;
}

.jobs-stat span{
  display:block;
  margin-top:6px;
  color:#64748b;
  font-size:11px;
  font-weight:900;
}

/* CONTENT LAYOUT */

.jobs-layout{
  margin-top:18px;
  display:grid;
  grid-template-columns:minmax(350px,430px) minmax(0,1fr);
  gap:18px;
  align-items:start;
}

.jobs-list-panel,
.jobs-detail-panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow-md);
  overflow:hidden;
}

/* LIST HEADER */

.jobs-list-head{
  padding:16px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.jobs-list-title{
  min-width:0;
}

.jobs-list-title h2{
  margin:0;
  color:#0f172a;
  font-size:16px;
  line-height:1.15;
  letter-spacing:-.03em;
  font-weight:900;
}

.jobs-list-title span{
  display:block;
  margin-top:4px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

.jobs-list-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.jobs-small-btn{
  min-height:34px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:#334155;
  padding:0 12px;
  font-size:12px;
  font-weight:900;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  white-space:nowrap;
}

.jobs-small-btn:hover{
  background:#f8fafc;
}

.jobs-small-btn svg{
  width:15px;
  height:15px;
}

/* JOB CARDS */

.jobs-list{
  max-height:calc(100vh - 304px);
  overflow:auto;
  padding:10px;
  scroll-behavior:smooth;
}

.jobs-list::-webkit-scrollbar{
  width:8px;
}

.jobs-list::-webkit-scrollbar-track{
  background:transparent;
}

.jobs-list::-webkit-scrollbar-thumb{
  background:#d5dbe5;
  border-radius:999px;
}

.job-card{
  position:relative;
  width:100%;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  background:#fff;
  cursor:pointer;
  margin-bottom:10px;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
}

.job-card:hover{
  border-color:#bfdbfe;
  background:#fbfdff;
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}

.job-card.active{
  border-color:rgba(37,87,167,.62);
  box-shadow:0 0 0 4px rgba(37,87,167,.09);
}

.job-card-top{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.job-card-logo{
  width:46px;
  height:46px;
  border-radius:14px;
  object-fit:cover;
  background:#f1f5f9;
  border:1px solid var(--line);
  flex:none;
}

.job-card-main{
  min-width:0;
  flex:1;
}

.job-title{
  margin:0;
  color:#111827;
  font-size:16px;
  line-height:1.28;
  letter-spacing:-.035em;
  font-weight:900;
}

.company{
  margin-top:5px;
  color:#334155;
  font-size:13px;
  line-height:1.35;
  font-weight:800;
}

.meta{
  margin-top:9px;
  display:flex;
  flex-wrap:wrap;
  gap:7px 9px;
  color:#64748b;
  font-size:12px;
  font-weight:700;
}

.meta span{
  min-width:0;
  display:inline-flex;
  align-items:center;
  gap:5px;
}

.meta svg{
  width:14px;
  height:14px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:11px;
}

.tag{
  max-width:140px;
  padding:6px 9px;
  border-radius:999px;
  background:#eef3f8;
  border:1px solid #dbeafe;
  color:#334155;
  font-size:11px;
  line-height:1;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.job-snippet{
  margin:10px 0 0;
  color:#64748b;
  font-size:12px;
  line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.job-card-foot{
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.job-posted{
  color:#64748b;
  font-size:11px;
  font-weight:800;
}

.job-open{
  color:var(--aift-blue);
  font-size:12px;
  font-weight:900;
}

/* DESKTOP DETAIL PANEL */

.jobs-detail-panel{
  position:sticky;
  top:100px;
  min-height:calc(100vh - 118px);
}

.jobs-detail-empty,
.jobs-state-card{
  padding:34px 22px;
  text-align:center;
  color:#64748b;
}

.jobs-detail-empty svg,
.jobs-state-card svg{
  width:42px;
  height:42px;
  color:#64748b;
  margin-bottom:12px;
}

.jobs-detail-empty h3,
.jobs-state-card h3{
  margin:0;
  color:#0f172a;
  font-size:17px;
  letter-spacing:-.03em;
  font-weight:900;
}

.jobs-detail-empty p,
.jobs-state-card p{
  margin:8px auto 0;
  max-width:430px;
  font-size:13px;
  line-height:1.6;
  font-weight:600;
}

.jobs-detail-cover{
  height:116px;
  background:linear-gradient(135deg,#dbeafe,#f8fafc);
  position:relative;
}

.jobs-company-logo{
  position:absolute;
  left:22px;
  bottom:-38px;
  width:78px;
  height:78px;
  border-radius:22px;
  border:4px solid #fff;
  object-fit:cover;
  background:#fff;
  box-shadow:0 12px 28px rgba(15,23,42,.14);
}

.jobs-detail-body{
  padding:52px 22px 22px;
}

.jobs-detail-title{
  margin:0;
  color:#0f172a;
  font-size:25px;
  line-height:1.16;
  letter-spacing:-.055em;
  font-weight:900;
}

.jobs-detail-company{
  margin-top:7px;
  color:#334155;
  font-size:14px;
  font-weight:900;
}

.jobs-detail-sub{
  display:flex;
  flex-wrap:wrap;
  gap:9px 12px;
  margin-top:11px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

.jobs-detail-sub span{
  display:flex;
  align-items:center;
  gap:5px;
}

.jobs-detail-sub svg{
  width:15px;
  height:15px;
}

.jobs-detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:19px;
}

.jobs-action-btn{
  min-height:44px;
  border:1px solid var(--line);
  background:#fff;
  color:#334155;
  border-radius:999px;
  padding:0 16px;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.jobs-action-btn.primary{
  border:0;
  background:var(--aift-blue);
  color:#fff;
}

.jobs-action-btn.saved{
  background:#eef2ff;
  color:#4338ca;
  border-color:#c7d2fe;
}

.jobs-detail-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.jobs-info-box{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
}

.jobs-info-box span{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.jobs-info-box strong{
  display:block;
  margin-top:6px;
  color:#0f172a;
  font-size:13px;
  font-weight:900;
}

.jobs-section{
  border-top:1px solid var(--line);
  padding-top:18px;
  margin-top:18px;
}

.jobs-section h3{
  margin:0 0 10px;
  color:#0f172a;
  font-size:16px;
  letter-spacing:-.03em;
  font-weight:900;
}

.jobs-description{
  color:#334155;
  font-size:13px;
  line-height:1.75;
  white-space:pre-wrap;
}

.job-pro-badge{
  display:inline-flex;
  align-items:center;
  margin-left:6px;
  padding:3px 7px;
  border-radius:999px;
  background:#dcfce7;
  color:#057642;
  font-size:9px;
  line-height:1;
  font-weight:900;
  vertical-align:middle;
}
  /* cleaner desktop action row */
.jobs-detail-actions{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}

.jobs-action-btn{
  width:auto;
  min-width:118px;
  height:42px;
  border-radius:999px;
}

.jobs-action-btn svg{
  width:18px;
  height:18px;
}

.jobs-action-btn.primary{
  min-width:132px;
}

/* desktop banner image */
.jobs-detail-cover.has-banner{
  background-size:cover!important;
  background-position:center!important;
}

.jobs-detail-cover.has-banner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(15,23,42,.08),rgba(15,23,42,.18));
}

/* calmer LinkedIn-style hero */
.jobs-hero{
  background:#fff!important;
  border:1px solid #dbe3ee!important;
  box-shadow:none!important;
}

.jobs-hero h1{
  font-size:28px!important;
  color:#1f2937!important;
  letter-spacing:-.04em!important;
}

.jobs-hero p{
  color:#64748b!important;
  max-width:420px!important;
}

@media(max-width:760px){
  .job-pro-badge{
    font-size:8px;
    padding:3px 6px;
  }
}
/* RESPONSIVE DESKTOP */

@media(max-width:1150px) and (min-width:761px){
  .jobs-search-grid{
    grid-template-columns:1fr 1fr;
  }

  .jobs-search-btn{
    grid-column:1 / -1;
  }

  .jobs-layout{
    grid-template-columns:380px minmax(0,1fr);
  }

  .jobs-detail-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* Final desktop protection */
@media(min-width:761px){
  .jobs-bottom-bar,
  .mobile-nav,
  .shared-mobile-nav,
  .jobs-filter-toggle{
    display:none!important;
    visibility:hidden!important;
    opacity:0!important;
    pointer-events:none!important;
    position:absolute!important;
    width:0!important;
    height:0!important;
    overflow:hidden!important;
  }

  .jobs-search-grid{
    grid-template-columns:1.45fr .9fr .75fr .75fr auto!important;
  }

  .jobs-main{
    padding:18px!important;
  }
}
  /* Indeed-style hero title */
.jobs-hero h1{
  font-size:24px!important;
  line-height:1.2!important;
  font-weight:800!important;
  letter-spacing:-.025em!important;
  color:var(--aift-blue)!important;
}

.jobs-hero p{
  margin-top:4px!important;
  font-size:14px!important;
  line-height:1.35!important;
  font-weight:500!important;
  color:#64748b!important;
}

@media(max-width:760px){
  .jobs-hero h1{
    font-size:24px!important;
    line-height:1.15!important;
    font-weight:800!important;
    color:var(--aift-blue)!important;
  }

  .jobs-hero p{
    font-size:14px!important;
    color:#64748b!important;
    font-weight:500!important;
  }
}
  .jobs-page-loader{
  position:fixed;
  inset:0;
  z-index:999999;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  transition:opacity .25s ease, visibility .25s ease;
}

.jobs-page-loader img{
  width:132px;
  height:auto;
  object-fit:contain;
}

.jobs-loader-spinner{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #dbeafe;
  border-top-color:var(--aift-blue);
  animation:jobsSpin .75s linear infinite;
}

.jobs-page-loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

@keyframes jobsSpin{
  to{
    transform:rotate(360deg);
  }
}
  .job-share-modal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.45);
  padding:18px;
}

.job-share-modal.show{
  display:flex;
}

.job-share-box{
  width:min(820px,calc(100vw - 48px));
  max-height:82vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 30px 80px rgba(15,23,42,.24);
}

.job-share-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.job-share-head strong{
  font-size:18px;
  font-weight:900;
}

.job-share-head button{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f3f4f6;
  font-size:22px;
}

.job-share-search,
.job-share-link-row input{
  width:100%;
  height:42px;
  border:1px solid #e5e7eb;
  border-radius:999px;
  padding:0 14px;
  outline:none;
}

.job-share-people{
  display:grid;
  gap:8px;
  margin:14px 0;
}

.job-share-person{
  display:flex;
  align-items:center;
  gap:10px;

<script>
const API = "https://backend-1-9b6f.onrender.com";

/* =========================
   GLOBAL STATE
========================= */

const state = {
  me:null,
  jobs:[],
  filtered:[],
  selectedJobId:null,
  savedIds:new Set(),
  viewedIds:new Set(),
  filters:{
    keyword:"",
    location:"",
    type:"",
    setup:""
  },
  ui:{
    loading:false,
    lastSearch:"",
    listScroll:0
  }
};

/* =========================
   DOM REFERENCES
========================= */

const els = {
  keywordInput:document.getElementById("keywordInput"),
  locationInput:document.getElementById("locationInput"),
  typeFilter:document.getElementById("typeFilter"),
  workSetupFilter:document.getElementById("workSetupFilter"),
  searchBtn:document.getElementById("searchBtn"),
  clearBtn:document.getElementById("clearBtn"),
  jobList:document.getElementById("jobList"),
  listState:document.getElementById("listState"),
  detailPanel:document.getElementById("detailPanel"),
  resultsMeta:document.getElementById("resultsMeta"),
  statTotal:document.getElementById("statTotal"),
  statShown:document.getElementById("statShown"),
  statSaved:document.getElementById("statSaved"),
  toast:document.getElementById("toast"),
  guestModal:document.getElementById("guestModal"),
  guestModalText:document.getElementById("guestModalText"),
  mobileTopSearch:document.getElementById("mobileTopSearch"),
  mobileTopSearchClear:document.getElementById("mobileTopSearchClear"),
  meBtn:document.getElementById("meBtn"),
  dashboardBtn:document.getElementById("dashboardBtn")
};

/* =========================
   AUTH + ROLE HELPERS
========================= */

function getRole(){
  return localStorage.getItem("role") || "";
}

function getToken(){
  const role = getRole();

  return (
    localStorage.getItem(role + "Token") ||
    localStorage.getItem("schoolToken") ||
    localStorage.getItem("teacherToken") ||
    localStorage.getItem("studentToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("talentToken") ||
    localStorage.getItem("agentToken") ||
    localStorage.getItem("token") ||
    ""
  );
}

function isGuest(){
  return !getToken();
}

function authHeaders(extra = {}){
  const token = getToken();

  return {
    ...extra,
    ...(token ? { Authorization:"Bearer " + token } : {})
  };
}

function requireLogin(action = "use this feature"){
  if(!isGuest()) return true;

  showGuestModal(action);
  return false;
}

/* =========================
   SAFE DATA HELPERS
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeArray(value){
  if(Array.isArray(value)){
    return value.filter(Boolean);
  }

  if(typeof value === "string" && value.trim()){
    return value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);
  }

  return [];
}

function normalize(value){
  return String(value || "")
    .toLowerCase()
    .trim();
}

function includes(value, term){
  if(!term) return true;
  return normalize(value).includes(term);
}
  function savedJobId(value){
  return String(
    value?._id ||
    value?.id ||
    value?.jobId?._id ||
    value?.jobId ||
    value ||
    ""
  );
}

function compactText(value, fallback = ""){
  const text = String(value || fallback || "").trim();
  return text.replace(/\s+/g," ");
}

function numberFormat(value){
  const num = Number(value || 0);

  if(num >= 1000000){
    return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + "M";
  }

  if(num >= 1000){
    return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + "k";
  }

  return String(num);
}

/* =========================
   JOB FIELD HELPERS
========================= */

function companyName(job){
  return (
    job?.company ||
    job?.employerId?.companyName ||
    job?.employerId?.name ||
    "Company"
  );
}

function logoOf(job){
  const company = companyName(job);

  return (
    job?.employerId?.profileImage ||
    job?.employerId?.avatar ||
    job?.companyLogo ||
    "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(company) +
      "&background=e0f2fe&color=0f172a"
  );
}

function bannerOf(job){
  return (
    job?.employerId?.bannerImage ||
    job?.employerId?.coverImage ||
    job?.employerId?.coverPhoto ||
    job?.employerId?.banner ||
    job?.companyBanner ||
    ""
  );
}

function salaryOf(job){
  return job?.salary || job?.salaryRange || "Not specified";
}

function levelOf(job){
  return job?.experienceLevel || job?.level || "Not specified";
}

function locationOf(job){
  return job?.location || "Location not added";
}

function typeOf(job){
  return job?.type || "Full-time";
}

function formatDate(value){
  if(!value) return "Recently posted";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "Recently posted";
  }

  const diff = Date.now() - date.getTime();
  const days = Math.floor(diff / 86400000);

  if(days <= 0) return "Today";
  if(days === 1) return "1 day ago";
  if(days < 30) return days + " days ago";

  return date.toLocaleDateString(undefined,{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function jobSummary(job){
  return compactText(
    job?.description,
    "No description added yet."
  );
}

function jobSkills(job, limit = 3){
  return safeArray(job?.skills).slice(0, limit);
}

function cleanOwnerId(value){
  if(!value) return "";

  if(typeof value === "string"){
    return value.trim();
  }

  if(typeof value === "object"){
    return String(
      value._id ||
      value.id ||
      value.userId ||
      value.ownerId ||
      value.employerId ||
      value.createdBy ||
      value.postedBy ||
      ""
    ).trim();
  }

  return String(value).trim();
}

function employerProfileUrl(job){
  const id =
    cleanOwnerId(job?.employerId) ||
    cleanOwnerId(job?.employer) ||
    cleanOwnerId(job?.createdBy) ||
    cleanOwnerId(job?.userId) ||
    cleanOwnerId(job?.postedBy) ||
    cleanOwnerId(job?.owner) ||
    cleanOwnerId(job?.author) ||
    cleanOwnerId(job?.company?.owner) ||
    cleanOwnerId(job?.company?.userId) ||
    cleanOwnerId(job?.company?.employerId);

  if(!id || id === "undefined" || id === "null" || id === "[object Object]"){
    return "#";
  }

  return `employer-public-profile.html?id=${encodeURIComponent(id)}`;
}

/* =========================
   PROFILE + DASHBOARD ROUTING
========================= */

function dashboardUrl(){
  const role = getRole();

  if(role === "employer") return "employer.html";
  if(role === "talent") return "talent.html";
  if(role === "agent") return "agent.html";
  if(role === "school") return "school.html";
  if(role === "teacher") return "teacher.html";
  if(role === "student") return "student.html";
  if(role === "admin") return "admin.html";

  return "home.html";
}

function profileUrl(){
  const id = localStorage.getItem("userId") || state.me?._id;

  if(!id){
    return "login.html";
  }

  const role = getRole();

  if(role === "employer" || role === "school"){
    return "employer-public-profile.html?id=" + encodeURIComponent(id);
  }

  if(role === "agent" || role === "talent"){
    return "agent-public-profile.html?id=" + encodeURIComponent(id);
  }

  if(role === "student"){
    return "student-public-profile.html?id=" + encodeURIComponent(id);
  }

  return "public-profile.html?id=" + encodeURIComponent(id);
}

/* =========================
   TOAST + GUEST MODAL
========================= */

function showToast(message){
  if(!els.toast) return;

  els.toast.textContent = message;
  els.toast.classList.add("show");

  clearTimeout(window.__jobsToastTimer);

  window.__jobsToastTimer = setTimeout(() => {
    els.toast.classList.remove("show");
  }, 2800);
}

function showGuestModal(action){
  if(els.guestModalText){
    els.guestModalText.textContent =
      "Create your free AIFT account to " + action + ".";
  }

  els.guestModal?.classList.add("show");
}

function closeGuestModal(){
  els.guestModal?.classList.remove("show");
}

window.closeGuestModal = closeGuestModal;

/* =========================
   API HELPER
========================= */

async function fetchJSON(url, options = {}){
  const res = await fetch(url, options);

  let data = null;

  try{
    data = await res.json();
  }catch{}

  if(!res.ok){
    throw new Error(data?.message || "Request failed");
  }

  return data;
}

/* =========================
   URL FILTER SYNC
========================= */

function readFiltersFromURL(){
  const params = new URLSearchParams(location.search);

  const keyword = params.get("q") || "";
  const locationValue = params.get("location") || "";
  const type = params.get("type") || "";
  const setup = params.get("setup") || "";

  state.filters.keyword = keyword;
  state.filters.location = locationValue;
  state.filters.type = type;
  state.filters.setup = setup;

  if(els.keywordInput) els.keywordInput.value = keyword;
  if(els.locationInput) els.locationInput.value = locationValue;
  if(els.typeFilter) els.typeFilter.value = type;
  if(els.workSetupFilter) els.workSetupFilter.value = setup;
  if(els.mobileTopSearch) els.mobileTopSearch.value = keyword;

  updateMobileSearchClear();
}

function writeFiltersToURL(){
  const params = new URLSearchParams();

  if(state.filters.keyword) params.set("q", state.filters.keyword);
  if(state.filters.location) params.set("location", state.filters.location);
  if(state.filters.type) params.set("type", state.filters.type);
  if(state.filters.setup) params.set("setup", state.filters.setup);

  const query = params.toString();
  const nextUrl = query ? `${location.pathname}?${query}` : location.pathname;

  history.replaceState(null,"",nextUrl);
}

function updateMobileSearchClear(){
  if(!els.mobileTopSearchClear || !els.mobileTopSearch) return;

  els.mobileTopSearchClear.classList.toggle(
    "hidden",
    !els.mobileTopSearch.value.trim()
  );
}

/* =========================
   LOADING STATE
========================= */

function setLoading(isLoading){
  state.ui.loading = Boolean(isLoading);
  document.body.classList.toggle("jobs-loading", state.ui.loading);

  const pageLoader = document.getElementById("jobsPageLoader");

  if(pageLoader && !isLoading){
    pageLoader.classList.add("hide");

    setTimeout(() => {
      pageLoader.remove();
    }, 300);
  }

  if(els.searchBtn){
    els.searchBtn.disabled = state.ui.loading;
  }
}
  /* =========================
   LOAD CURRENT USER
========================= */

async function loadMe(){
  if(isGuest()){
    state.me = { role:"guest" };
    return;
  }

  try{
    state.me = await fetchJSON(`${API}/api/users/me`, {
      headers:authHeaders()
    });

    if(state.me?._id){
      localStorage.setItem("userId", state.me._id);
    }

    if(state.me?.role){
      localStorage.setItem("role", state.me.role);
    }

state.savedIds.clear();

safeArray(state.me?.savedJobs).forEach(item => {
  const id = savedJobId(item);

  if(id && id !== "[object Object]"){
    state.savedIds.add(id);
  }
});

    renderStats();
  }catch(err){
    console.warn("ME LOAD FAILED:", err.message);
    state.me = null;
  }
}

/* =========================
   LOAD JOBS
========================= */

async function loadJobs(){
  setLoading(true);

  setListState(
    "loading",
    "Loading jobs",
    "AIFT is getting the latest jobs from your backend."
  );

  if(els.jobList){
    els.jobList.innerHTML = "";
  }

  if(els.resultsMeta){
    els.resultsMeta.textContent = "Loading jobs...";
  }

  try{
    const jobs = await fetchJSON(`${API}/api/jobs`, {
      headers:isGuest() ? {} : authHeaders()
    });

    state.jobs = safeArray(jobs)
      .filter(job => job && job._id)
      .map(normalizeJob);

    applyFilters({
      shouldSyncURL:false,
      shouldSelectDesktop:true
    });

    if(!state.filtered.length){
      renderEmptyList();
    }
  }catch(err){
    console.error("LOAD JOBS FAILED:", err);

    state.jobs = [];
    state.filtered = [];

    renderStats();

    if(els.jobList){
      els.jobList.innerHTML = "";
    }

    setListState(
      "error",
      "Jobs could not load",
      err.message || "Please check your backend connection and try again."
    );

    if(els.resultsMeta){
      els.resultsMeta.textContent = "Failed to load jobs";
    }
  }finally{
    setLoading(false);
  }
}

/* =========================
   NORMALIZE JOB OBJECT
========================= */

function normalizeJob(job){
  const normalized = {
    ...job,
    _id:String(job._id),
    title:compactText(job.title, "Untitled job"),
    company:companyName(job),
    location:locationOf(job),
    type:typeOf(job),
    salary:salaryOf(job),
    experienceLevel:levelOf(job),
    description:jobSummary(job),
    skills:safeArray(job.skills),
    createdAt:job.createdAt || job.updatedAt || null,
    viewsCount:Number(job.viewsCount || 0),
    saveCount:Number(job.saveCount || 0)
  };

  normalized.__searchText = [
    normalized.title,
    normalized.company,
    normalized.location,
    normalized.type,
    normalized.salary,
    normalized.experienceLevel,
    normalized.description,
    normalized.skills.join(" "),
    job?.employerId?.companyName,
    job?.employerId?.name
  ]
    .map(value => normalize(value))
    .join(" ");

  normalized.__setupText = [
    normalized.location,
    normalized.type,
    normalized.description,
    job?.workSetup,
    job?.setup,
    job?.workType
  ]
    .map(value => normalize(value))
    .join(" ");

  normalized.__createdTime = new Date(normalized.createdAt || 0).getTime() || 0;
  normalized.__isPro = job?.employerId?.isPro ? 1 : 0;

  return normalized;
}

/* =========================
   FILTER COLLECTION
========================= */

function readFiltersFromInputs(){
  state.filters.keyword = normalize(els.keywordInput?.value || "");
  state.filters.location = normalize(els.locationInput?.value || "");
  state.filters.type = normalize(els.typeFilter?.value || "");
  state.filters.setup = normalize(els.workSetupFilter?.value || "");

  if(els.mobileTopSearch){
    els.mobileTopSearch.value = els.keywordInput?.value || "";
  }

  updateMobileSearchClear();
}

function applyFilters(options = {}){
  const {
    shouldSyncURL = true,
    shouldSelectDesktop = false
  } = options;

  readFiltersFromInputs();

  let list = [...state.jobs];

  if(state.filters.keyword){
    list = list.filter(job => {
      return job.__searchText.includes(state.filters.keyword);
    });
  }

  if(state.filters.location){
    list = list.filter(job => {
      return normalize(job.location).includes(state.filters.location);
    });
  }

  if(state.filters.type){
    list = list.filter(job => {
      return normalize(job.type).includes(state.filters.type);
    });
  }

  if(state.filters.setup){
    list = list.filter(job => {
      return job.__setupText.includes(state.filters.setup);
    });
  }

  list.sort(sortJobs);

  state.filtered = list;

  renderList();
  renderStats();

  if(shouldSyncURL){
    writeFiltersToURL();
  }

  if(state.selectedJobId && !state.filtered.some(job => String(job._id) === String(state.selectedJobId))){
    state.selectedJobId = null;
    renderEmptyDetail();
  }

  if(shouldSelectDesktop && window.innerWidth > 760 && state.filtered.length){
    selectJob(state.filtered[0]._id, false);
  }
}

/* =========================
   SORTING ALGORITHM
========================= */

function sortJobs(a,b){
  const proDiff = Number(b.__isPro || 0) - Number(a.__isPro || 0);

  if(proDiff !== 0){
    return proDiff;
  }

  const savedA = state.savedIds.has(String(a._id)) ? 1 : 0;
  const savedB = state.savedIds.has(String(b._id)) ? 1 : 0;

  if(savedA !== savedB){
    return savedB - savedA;
  }

  return Number(b.__createdTime || 0) - Number(a.__createdTime || 0);
}

async function saveJob(jobId){
  if(!requireLogin("save jobs")){
    return;
  }

  const job = state.jobs.find(item => String(item._id) === String(jobId));

  if(!job){
    showToast("This job could not be found.");
    return;
  }

  if(isJobOwner(job)){
    showToast("You cannot save your own job.");
    return;
  }

  const id = String(jobId);
  const wasSaved = state.savedIds.has(id);

  if(wasSaved){
    state.savedIds.delete(id);
    job.saveCount = Math.max(0, Number(job.saveCount || 0) - 1);
  }else{
    state.savedIds.add(id);
    job.saveCount = Number(job.saveCount || 0) + 1;
  }

  renderStats();
  renderList();

  if(state.selectedJobId === id){
    renderDetail(job);
  }

  try{
    const res = await fetchJSON(`${API}/api/jobs/${id}/save`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });

    if(res.saved){
      state.savedIds.add(id);
      showToast("Job saved.");
    }else{
      state.savedIds.delete(id);
      showToast("Job removed from saved jobs.");
    }

    job.saveCount = Number(res.saveCount ?? job.saveCount ?? 0);

    await loadMe();

    renderStats();
    renderList();

    if(state.selectedJobId === id){
      renderDetail(job);
    }

  }catch(err){
    if(wasSaved){
      state.savedIds.add(id);
      job.saveCount = Number(job.saveCount || 0) + 1;
    }else{
      state.savedIds.delete(id);
      job.saveCount = Math.max(0, Number(job.saveCount || 0) - 1);
    }

    renderStats();
    renderList();

    if(state.selectedJobId === id){
      renderDetail(job);
    }

    showToast(err.message || "Could not save job.");
  }
}

window.saveJob = saveJob;

  const wrap = document.getElementById("jobSharePeopleList");
  if(!wrap) return;

  const q = String(document.getElementById("jobShareSearch")?.value || "")

  const people = jobSharePeople
    .filter(p => {

        .toLowerCase()
        .includes(q);
    })
    .slice(0, 50);

  wrap.innerHTML = people.length

        const id = String(p._id || p.id || "");
        const checked = selectedJobSharePeople.has(id) ? "checked" : "";
        const avatar = p.profileImage || p.avatar || p.photo || "https://ui-avatars.com/api/?name=AIFT&background=e0f2fe&color=0f172a";

}

function toggleJobSharePerson(id, checked){
  if(checked) selectedJobSharePeople.add(String(id));
  else selectedJobSharePeople.delete(String(id));
}

async function copyJobShareLink(){
  if(!activeShareJobId) return;

  try{
    await navigator.clipboard.writeText(fullJobLink(activeShareJobId));
    showToast("Job link copied.");
  }catch{
    showToast("Could not copy link.");
  }
}

async function sendJobToSelectedPeople(){
  if(!activeShareJobId) return;

  const recipients = Array.from(selectedJobSharePeople);

  if(!recipients.length){
    showToast("Select at least one person.");
    return;
  }

  const job = state.jobs.find(item => String(item._id) === String(activeShareJobId));
  const url = fullJobLink(activeShareJobId);

  const message = `Check this job on AIFT: ${job?.title || "Job opportunity"}${job ? " at " + companyName(job) : ""}\n${url}`;

  try{
    await Promise.all(
      recipients.map(receiverId => {
        return fetchJSON(`${API}/api/messages`, {
          method:"POST",
          headers:authHeaders({ "Content-Type":"application/json" }),
          body:JSON.stringify({
            receiverId,
            recipientId:receiverId,
            to:receiverId,
            text:message,
            message,
            jobId:activeShareJobId,
            type:"job_share"
          })
        });
      })
    );

    closeJobShareModal();
    showToast("Job sent.");
  }catch(err){
    console.warn("SEND JOB MESSAGE FAILED:", err.message);
    showToast(err.message || "Could not send job.");
  }
}

function shareJob(jobId){
  openJobShareModal(jobId);
}

function bindEvents(){
  const filterInputs = [
    els.keywordInput,
    els.locationInput,
    els.typeFilter,
    els.workSetupFilter
  ].filter(Boolean);

  filterInputs.forEach(input => {
    input.addEventListener("input", debounce(() => {
      applyFilters({
        shouldSyncURL:true,
        shouldSelectDesktop:false
      });
    }, 180));

    input.addEventListener("change", () => {
      applyFilters({
        shouldSyncURL:true,
        shouldSelectDesktop:false
      });
    });
  });

  if(els.searchBtn){
    els.searchBtn.addEventListener("click", () => {
      applyFilters({
        shouldSyncURL:true,
        shouldSelectDesktop:false
      });

      if(window.innerWidth <= 760){
        document.activeElement?.blur?.();
        window.scrollTo({ top:0, behavior:"smooth" });
      }
    });
  }

  if(els.clearBtn){
    els.clearBtn.addEventListener("click", clearFilters);
  }

  if(els.mobileTopSearch){
    els.mobileTopSearch.addEventListener("input", debounce(() => {
      const value = els.mobileTopSearch.value || "";

      if(els.keywordInput){
        els.keywordInput.value = value;
      }

      updateMobileSearchClear();

      applyFilters({
        shouldSyncURL:true,
        shouldSelectDesktop:false
      });
    }, 160));

    els.mobileTopSearch.addEventListener("focus", () => {
      if(window.innerWidth <= 760){
        document.querySelector(".jobs-search-card")?.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });
      }
    });
  }

  if(els.mobileTopSearchClear){
    els.mobileTopSearchClear.addEventListener("click", () => {
      els.mobileTopSearch.value = "";

      if(els.keywordInput){
        els.keywordInput.value = "";
      }

      updateMobileSearchClear();

      applyFilters({
        shouldSyncURL:true,
        shouldSelectDesktop:false
      });
    });
  }

  if(els.meBtn){
    els.meBtn.addEventListener("click", handleProfileClick);
  }

  if(els.dashboardBtn){
    els.dashboardBtn.addEventListener("click", handleDashboardClick);
  }

  window.addEventListener("resize", debounce(handleResponsiveMode, 180));
  window.addEventListener("popstate", handleBrowserNavigation);
}

function clearFilters(){
  if(els.keywordInput) els.keywordInput.value = "";
  if(els.locationInput) els.locationInput.value = "";

  if(els.workSetupFilter) els.workSetupFilter.value = "";

/* =========================
   DEBOUNCE
========================= */

function debounce(fn, wait = 180){
  let timer = null;

  return function debounced(...args){
    clearTimeout(timer);

    timer = setTimeout(() => {
      fn.apply(this,args);
    }, wait);
  };
}

/* =========================
   MOBILE TOPBAR BEHAVIOR
========================= */

(function setupMobileChrome(){
  let lastScroll = 0;
  let ticking = false;

  function handleScroll(){
    if(window.innerWidth > 760) return;

    const topbar = document.querySelector(".topbar");
    const nav = document.querySelector(".mobile-nav");

    if(!topbar || !nav) return;

    const current = Math.max(window.scrollY || 0, 0);
    const goingDown = current > lastScroll + 4;
    const goingUp = current < lastScroll - 4;

    topbar.classList.toggle("is-glass", current > 20);

    if(goingDown && current > 650){
      topbar.classList.add("is-hidden");
      nav.classList.add("is-pulled-down");
    }

    if(goingUp || current < 120){
      topbar.classList.remove("is-hidden");
      nav.classList.remove("is-pulled-down");
    }

    lastScroll = current;
  }

  function onScroll(){
    if(ticking) return;

    ticking = true;

    requestAnimationFrame(() => {
      handleScroll();
      ticking = false;
    });
  }

  window.addEventListener("scroll", onScroll, { passive:true });

  document.addEventListener("DOMContentLoaded", handleScroll);
})();

/* =========================
   NOTIFICATION BADGE PLACEHOLDER
   Uses existing backend later if you already have it.
========================= */

async function loadNotificationBadge(){
  const badge = document.getElementById("notificationBadge");

  if(!badge || isGuest()){
    return;
  }

  try{
    const data = await fetchJSON(`${API}/api/notifications`, {
      headers:authHeaders()
    });

    const unread = safeArray(data).filter(item => !item.read).length;

    badge.textContent = unread > 99 ? "99+" : String(unread);
    badge.classList.toggle("hidden", unread <= 0);
  }catch(err){
    console.warn("NOTIFICATION BADGE FAILED:", err.message);
  }
}

/* =========================
   RESTORE SELECTED JOB
========================= */

function restoreSelectedJobDesktop(){
  if(window.innerWidth <= 760){
    return;
  }

  const savedJobId = localStorage.getItem("selectedJobId");

  if(savedJobId && state.filtered.some(job => String(job._id) === String(savedJobId))){
    selectJob(savedJobId, false);
    return;
  }

  if(state.filtered.length){
    selectJob(state.filtered[0]._id, false);
  }
}

/* =========================
   SAFE STARTUP
========================= */

async function initJobsPage(){
  try{
    readFiltersFromURL();
    bindEvents();

    await loadMe();
    await loadJobs();

    restoreSelectedJobDesktop();
    loadNotificationBadge();

    const pendingShareJobId = localStorage.getItem("pendingShareJobId");

    if(pendingShareJobId){
      localStorage.removeItem("pendingShareJobId");

      const cleanUrl = location.pathname;
      history.replaceState(null, "", cleanUrl);

      const jobExists = state.jobs.some(job => String(job._id) === String(pendingShareJobId));

      if(jobExists){
        setTimeout(() => {
          openJobShareModal(pendingShareJobId);
        }, 350);
      }else{
        showToast("This job could not be shared.");
      }
    }

  }catch(err){
    console.error("JOBS PAGE INIT FAILED:", err);

    setListState(
      "error",
      "Jobs page could not start",
      err.message || "Please refresh the page and try again."
    );
  }
}

document.addEventListener("DOMContentLoaded", initJobsPage);
