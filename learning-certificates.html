<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Certificates | AIFT Learning</title>
  <link rel="icon" href="images/aift-logo.png">
  <style>
    :root{--gold:#bd7d10;--blue:#1787e8;--ink:#122037;--muted:#718096;--line:#e3e7ed;--bg:#f7f8fb;--card:#fff;--soft:#fff4da}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.topbar-inner{max-width:1380px;height:66px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:14px}.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:#43536a;background:#fff;border:1px solid var(--line);border-radius:50%}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:70px;height:32px;object-fit:contain}.brand span{padding-left:10px;color:var(--gold);border-left:1px solid var(--line)}.theme-btn{margin-left:auto}.hero{padding:38px 22px 26px;background:radial-gradient(circle at 84% 0,#fff1cd,transparent 29%),linear-gradient(180deg,#fff,var(--bg))}.hero-inner,.content{max-width:1380px;margin:auto}.eyebrow{margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,5vw,54px);letter-spacing:-.055em}.hero p{max-width:670px;margin:10px 0 0;color:var(--muted);line-height:1.55}.controls{margin-top:22px;display:grid;grid-template-columns:minmax(250px,1fr) 200px;gap:10px}.search,.filter{height:48px;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}.search input,.filter select{width:100%;border:0;outline:0;color:var(--ink);background:transparent}.content{padding:24px 22px 48px}.summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.summary h2{margin:0;font-size:20px}.summary span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.certificate{position:relative;min-width:0;overflow:hidden;padding:18px;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(40,65,96,.08)}.certificate:before{content:"";position:absolute;top:-35px;right:-30px;width:95px;height:95px;background:var(--soft);border-radius:50%}.seal{position:relative;width:50px;height:50px;display:grid;place-items:center;color:var(--gold);background:var(--soft);border-radius:15px}.seal svg{width:27px;height:27px}.status{position:absolute;top:16px;right:15px;color:var(--gold);font-size:9px;font-weight:900;text-transform:uppercase}.certificate h3{min-height:42px;margin:15px 0 0;font-size:15px;line-height:1.35}.issuer{margin:7px 0 0;color:var(--muted);font-size:11px}.issued{margin:12px 0 0;font-size:10px;font-weight:750}.credential{margin-top:12px;padding-top:10px;color:var(--muted);border-top:1px dashed var(--line);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{grid-column:1/-1;min-height:280px;display:grid;place-items:center;align-content:center;padding:30px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px}.state .seal{margin-bottom:13px}.spinner{width:34px;height:34px;margin-bottom:12px;border:3px solid #fff0c8;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.state h3{margin:0 0 7px}.state p{max-width:480px;margin:0;color:var(--muted);line-height:1.5}
    html[data-learning-theme="dark"]{color-scheme:dark;--ink:#f3f7fc;--muted:#aab7c9;--line:#304055;--bg:#101923;--card:#172230;--soft:#493a1c}html[data-learning-theme="dark"] .topbar{background:rgba(16,25,35,.9)}html[data-learning-theme="dark"] .icon-btn{color:#c4d0df;background:#172230;border-color:#34445a}html[data-learning-theme="dark"] .hero{background:radial-gradient(circle at 84% 0,rgba(117,78,23,.38),transparent 30%),linear-gradient(180deg,#172230,var(--bg))}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.topbar-inner{height:58px;padding:0 11px;gap:8px}.icon-btn{width:36px;height:36px}.brand img{width:60px;height:28px}.brand span{padding-left:7px;font-size:14px}.hero{padding:12px 10px 11px;background:var(--bg)}.hero .eyebrow,.hero h1,.hero> .hero-inner>p{display:none}.controls{margin-top:0;grid-template-columns:minmax(0,1fr) 112px;gap:7px}.search,.filter{height:43px;padding:0 10px;border-radius:12px}.filter select,.search input{font-size:12px}.content{padding:14px 10px 32px}.summary h2{font-size:17px}.summary span{font-size:11px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.certificate{padding:10px 7px;border-radius:12px;box-shadow:0 6px 16px rgba(40,65,96,.07)}.certificate:before{top:-27px;right:-24px;width:67px;height:67px}.seal{width:38px;height:38px;border-radius:12px}.seal svg{width:21px;height:21px}.status{top:9px;right:7px;font-size:6.5px}.certificate h3{min-height:34px;margin-top:9px;font-size:10.5px}.issuer{margin-top:4px;font-size:8px}.issued{margin-top:7px;font-size:7.5px}.credential{margin-top:7px;padding-top:6px;font-size:6.5px}.state{min-height:220px;padding:20px}}
    .topbar-inner{position:relative}.brand{position:absolute;left:50%;transform:translateX(-50%)}.learning-menu-wrap{position:relative;margin-left:auto}.learning-menu{position:absolute;top:calc(100% + 10px);right:0;width:260px;padding:8px;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(20,35,59,.18);backdrop-filter:blur(18px)}.learning-menu.hidden{display:none}.learning-menu a,.learning-menu button{width:100%;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:11px;color:var(--ink);text-align:left;text-decoration:none;background:transparent;border:0;border-radius:10px;font-size:13px;font-weight:750}.learning-menu a:hover,.learning-menu button:hover{color:var(--blue);background:var(--soft)}.learning-menu svg{flex:0 0 auto;width:18px;height:18px}.learning-menu-divider{height:1px;margin:6px 4px;background:var(--line)}html[data-learning-theme="dark"] .learning-menu,html[data-theme="dark"] .learning-menu{background:rgba(23,34,48,.98);border-color:#34445a}html[data-learning-theme="dark"] .learning-menu a,html[data-learning-theme="dark"] .learning-menu button,html[data-theme="dark"] .learning-menu a,html[data-theme="dark"] .learning-menu button{color:#f4f7fb}html[data-learning-theme="dark"] .learning-menu a:hover,html[data-learning-theme="dark"] .learning-menu button:hover,html[data-theme="dark"] .learning-menu a:hover,html[data-theme="dark"] .learning-menu button:hover{background:#203249}html[data-learning-theme="dark"] .learning-menu-divider,html[data-theme="dark"] .learning-menu-divider{background:#34445a}@media(max-width:760px){.learning-menu{position:fixed;top:64px;right:10px;width:min(270px,calc(100vw - 20px))}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><button class="icon-btn" type="button" onclick="location.href='groups.html'" aria-label="Back to Learning"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button><a class="brand" href="groups.html" aria-label="AIFT Learning home"><img src="images/aift-logo.png" alt="AIFT"></a><div class="learning-menu-wrap"><button class="icon-btn" id="learningMenuButton" type="button" onclick="toggleLearningMenu(event)" aria-label="Open Learning menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><nav class="learning-menu hidden" id="learningMenu" aria-label="Learning menu"><a href="learning-courses.html"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>Learn a Skill</a><a href="learning-teachers.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-2a7 7 0 0 1 14 0v2M18 8h4M20 6v4"></path></svg>Find a Teacher</a><a href="learning-certificates.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"></circle><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"></path></svg>Certificates</a><a href="learning-dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Dashboard</a><div class="learning-menu-divider"></div><button type="button" onclick="toggleTheme();closeLearningMenu()"><svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg><span id="menuThemeLabel">Use dark theme</span></button></nav></div></div></header>
  <section class="hero"><div class="hero-inner"><p class="eyebrow">Earn certificates</p><h1>Credentials that travel with you.</h1><p>Review verified AIFT learning achievements and the skills connected to each certificate.</p><div class="controls"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="search" type="search" placeholder="Search certificates" aria-label="Search certificates"></label><label class="filter"><select id="status" aria-label="Filter certificates"><option value="">All status</option><option value="verified">Verified</option><option value="issued">Issued</option><option value="completed">Completed</option></select></label></div></div></section>
  <main class="content"><div class="summary"><h2>My certificates</h2><span id="count"></span></div><div class="grid" id="grid"><div class="state"><div class="spinner"></div><h3>Loading certificates</h3><p>Retrieving verified learning achievements.</p></div></div></main>
  <script>
    const API="https://backend-1-9b6f.onrender.com",state={items:[],query:"",status:""};
    const token=()=>localStorage.getItem("schoolToken")||localStorage.getItem("teacherToken")||localStorage.getItem("studentToken")||localStorage.getItem("adminToken")||localStorage.getItem("employerToken")||localStorage.getItem("talentToken")||localStorage.getItem("agentToken")||localStorage.getItem("token");const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);const name=(value,fallback="AIFT")=>String(value?.name||value?.schoolName||value?.companyName||fallback);const date=value=>{const parsed=value?new Date(value):null;return!parsed||Number.isNaN(parsed.getTime())?"":parsed.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
    function notifyChrome(active){if(parent!==window)parent.postMessage({type:"aift:learning-chrome",active:!!active},location.origin)}function applyTheme(value){const dark=value==="dark",label=document.getElementById("menuThemeLabel");document.documentElement.dataset.learningTheme=dark?"dark":"light";if(label)label.textContent=dark?"Use light theme":"Use dark theme"}function toggleTheme(){const next=document.documentElement.dataset.learningTheme==="dark"?"light":"dark";localStorage.setItem("aiftLearningTheme",next);applyTheme(next)}
    function certificateStatus(item){return String(item.status||(item.verifiedByAIFT?"verified":"issued")).toLowerCase()}function searchable(item){return[item.title,item.className,item.programName,item.schoolName,item.issuer,item.certificateNumber,item.verificationCode,...(item.skills||[])].join(" ").toLowerCase()}function render(){const q=state.query.trim().toLowerCase(),items=state.items.filter(item=>(!q||searchable(item).includes(q))&&(!state.status||certificateStatus(item)===state.status)),grid=document.getElementById("grid");document.getElementById("count").textContent=`${items.length} shown`;if(!items.length){grid.innerHTML='<div class="state"><div class="seal"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"></circle><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"></path></svg></div><h3>No certificates here yet</h3><p>Certificates will appear after an eligible AIFT course is completed and the credential is issued.</p></div>';return}grid.innerHTML=items.map(item=>{const title=item.title||item.className||item.programName||"AIFT Certificate",issuer=item.schoolName||name(item.schoolId,"AIFT"),issued=date(item.issuedAt||item.completedAt||item.createdAt)||item.year||"",code=item.certificateNumber||item.verificationCode||"";return`<article class="certificate"><div class="seal"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"></circle><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"></path></svg></div><span class="status">${esc(certificateStatus(item))}</span><h3>${esc(title)}</h3><p class="issuer">${esc(issuer)}</p>${issued?`<p class="issued">Issued ${esc(issued)}</p>`:""}${code?`<div class="credential">ID: ${esc(code)}</div>`:""}</article>`}).join("")}
    async function load(){try{const response=await fetch(`${API}/api/certificates/my`,{headers:{Accept:"application/json",Authorization:`Bearer ${token()}`}}),data=await response.json().catch(()=>({}));if(response.status===403){state.items=[];render();return}if(!response.ok)throw new Error(data.message||"Certificates could not be loaded");state.items=Array.isArray(data)?data:data.certificates||data.items||[];render()}catch(error){document.getElementById("grid").innerHTML=`<div class="state"><h3>Unable to load certificates</h3><p>${esc(error.message)}</p></div>`}}
    function init(){if(!token()){location.replace("login.html");return}applyTheme(localStorage.getItem("aiftLearningTheme"));notifyChrome(true);addEventListener("pagehide",()=>notifyChrome(false),{once:true});document.getElementById("search").addEventListener("input",event=>{state.query=event.target.value;render()});document.getElementById("status").addEventListener("change",event=>{state.status=event.target.value;render()});load()}
    function closeLearningMenu(){const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton");menu?.classList.add("hidden");button?.setAttribute("aria-expanded","false")}function toggleLearningMenu(event){event?.stopPropagation();const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton"),opening=menu?.classList.contains("hidden");if(!menu)return;menu.classList.toggle("hidden",!opening);button?.setAttribute("aria-expanded",String(opening))}document.addEventListener("click",event=>{if(!event.target.closest(".learning-menu-wrap"))closeLearningMenu()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLearningMenu()});
    init();
  </script>
</body>
</html>
