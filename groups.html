    function menuThemeItem(){return `<div class="learning-menu-divider"></div><button type="button" onclick="toggleLearningTheme();closeLearningMenu()">${icons.award}<span id="menuThemeLabel">Use dark theme</span></button>`}
    function navMarkup(item){return `<button type="button" ${item.url?`onclick="location.href='${item.url}'"`:`onclick="${item.action}"`}>${esc(item.label)}</button>`}
    function menuMarkup(item){return item.url?`<a href="${esc(item.url)}">${item.label==="Teachers"?icons.users:item.label==="Certificates"?icons.award:item.label==="Dashboard"?icons.dashboard:icons.book}${esc(item.label)}</a>`:`<button type="button" onclick="${item.action};closeLearningMenu()">${icons.dashboard}${esc(item.label)}</button>`}
    function applyRoleExperience(){
      const viewerRole=role(state.viewer?.role),experience=roleExperiences[viewerRole];
      document.body.dataset.learningRole=viewerRole||"member";
      if(!experience){document.body.classList.remove("role-pending");return}
      document.getElementById("topNav").innerHTML=experience.nav.map(navMarkup).join("");
      document.getElementById("learningMenu").innerHTML=experience.nav.map(menuMarkup).join("")+menuThemeItem();
      const cards=[...document.querySelectorAll(".path")];
      experience.cards.forEach((card,index)=>{
        const button=cards[index];if(!button)return;
        button.removeAttribute("onclick");
        button.dataset.serviceType=card.service||"";
        button.dataset.destination=card.url||"";
        button.innerHTML=`<span class="path-icon">${icons[card.icon]||icons.book}</span><span class="path-copy"><strong>${esc(card.title)}</strong><span>${esc(card.description)}</span></span><span class="path-arrow">${icons.arrow}</span>`;
        button.onclick=()=>card.service?openLearningService(card.service):(location.href=card.url);
      });
      const employer=viewerRole==="employer";
      document.querySelector(".top-search")?.classList.toggle("hidden",employer);
      document.getElementById("mobileLearningSearch")?.classList.toggle("hidden",employer);
      applyLearningTheme(document.documentElement.dataset.learningTheme);
      document.body.classList.remove("role-pending");
    }
    function statusLabel(value){return String(value||"new").replaceAll("_"," ")}
    function requestFeedback(ticket){return String(ticket?.metadata?.lastFeedback||"").trim()}
    function renderServiceDashboardPreview(){
      const viewerRole=role(state.viewer?.role);

      const section=document.getElementById("dashboardPreview"),card=document.getElementById("dashboardFocusCard"),requests=state.serviceRequests||[],latest=requests[0],open=requests.filter(item=>!["resolved","dismissed"].includes(item.status)).length,inProgress=requests.filter(item=>["in_progress","waiting"].includes(item.status)).length,resolved=requests.filter(item=>item.status==="resolved").length;

      const link=section.querySelector(".dashboard-link");link.href="#hero";link.innerHTML=`New request ${icons.arrow}`;link.onclick=()=>document.getElementById("hero").scrollIntoView({behavior:"smooth",block:"start"});

      card.innerHTML=`<div><p class="eyebrow">${latest?esc(statusLabel(latest.status)):"Ready when you are"}</p><h3>${esc(latest?.title||"Request support from AIFT")}</h3><p>${esc(latest?(requestFeedback(latest)||"AIFT has received this request and will provide the next update here."):"Choose one of the services above and send the details to AIFT.")}</p><div class="preview-actions"><a href="#hero"> ${latest?"Create another request":"Start a request"}</a>${latest?`<span class="service-status">${esc(statusLabel(latest.status))}</span>`:""}</div></div><div class="preview-stats"><div class="preview-stat"><strong>${requests.length}</strong><span>Submitted</span></div><div class="preview-stat"><strong>${open}</strong><span>Open</span></div><div class="preview-stat"><strong>${inProgress}</strong><span>In progress</span></div><div class="preview-stat"><strong>${resolved}</strong><span>Completed</span></div></div>`;

    }
    async function submitLearningService(event){
      event.preventDefault();const button=event.submitter;if(button)button.disabled=true;
      try{
        const data=await apiJSON("/api/admin/work-tickets/learning-service","POST",{
          serviceType:state.serviceType,
          title:document.getElementById("serviceRequestTitle").value,
          participantCount:Number(document.getElementById("serviceParticipantCount").value||0),
          preferredDate:document.getElementById("servicePreferredDate").value,
          location:document.getElementById("serviceLocation").value,
          deliveryMode:document.getElementById("serviceDeliveryMode").value,

    }

    function dashboardUpdates(items=[]){const box=document.getElementById("dashboardUpdates");box.innerHTML=items.length?items.slice(0,4).map(item=>`<div class="preview-update"><strong>${esc(item.title||"Learning update")}</strong><span>${esc(item.text||date(item.createdAt)||"Your Learning activity was updated.")}</span></div>`).join(""):'<p class="preview-empty">Your course announcements, training requests and progress updates will appear here.</p>'}
    function renderDashboardPreview(){
      if(renderServiceDashboardPreview())return;
      const d=state.dashboard,section=document.getElementById("dashboardPreview"),card=document.getElementById("dashboardFocusCard");if(!d)return;section.classList.remove("hidden");
      if(d.mode==="teacher"){
        document.getElementById("dashboardPreviewLabel").textContent="Teacher workspace";document.getElementById("dashboardPreviewTitle").textContent="Your teaching at a glance";document.getElementById("dashboardPreviewSubtitle").textContent="Courses, learners and training requests waiting for you.";
        const course=d.courses?.[0],metrics=d.metrics||{};card.classList.add("teacher-focus");card.innerHTML=`<div><p class="eyebrow">${metrics.trainingRequests||0} training requests</p><h3>${esc(course?.title||"Build your next course")}</h3><p>${course?`${course.studentCount||0} learners · ${course.published?"Published":"Not published"}`:"Submit a course or open your teacher dashboard to begin."}</p><div class="preview-actions"><a href="learning-dashboard.html">Open teacher dashboard</a></div></div><div class="preview-stats"><div class="preview-stat"><strong>${metrics.activeLearners||0}</strong><span>Active learners</span></div><div class="preview-stat"><strong>${metrics.totalCourses||0}</strong><span>Total courses</span></div><div class="preview-stat"><strong>${metrics.publishedCourses||0}</strong><span>Published</span></div><div class="preview-stat"><strong>${metrics.pendingCourses||0}</strong><span>Pending review</span></div></div>`;
      }else{
        const course=d.continueCourse,metrics=d.metrics||{},progress=Number(course?.progress||0),lessonId=id(course?.nextLesson?.id),destination=course?`class-view.html?classId=${encodeURIComponent(id(course))}${lessonId?`&lessonId=${encodeURIComponent(lessonId)}`:""}`:"learning-courses.html";card.classList.remove("teacher-focus");card.innerHTML=`<div><p class="eyebrow">${course?"Continue learning":"Start learning"}</p><h3>${esc(course?.title||"Choose your first course")}</h3><p>${course?`${course.completedLessons||0} of ${course.totalLessons||0} lessons completed${course.nextLesson?.title?` · Next: ${course.nextLesson.title}`:""}`:"Enroll in a published AIFT course and your progress will appear here."}</p><div class="preview-actions"><a href="${esc(destination)}">${course?"Continue":"Browse courses"}</a><span>${esc(d.level?.name||"Beginner")} level</span></div></div><div class="preview-progress" style="--progress:${Math.max(0,Math.min(100,progress))}"><strong>${progress}%</strong></div><div class="preview-stats"><div class="preview-stat"><strong>${metrics.enrolledCourses||0}</strong><span>Courses</span></div><div class="preview-stat"><strong>${metrics.completedLessons||0}</strong><span>Lessons finished</span></div><div class="preview-stat"><strong>${metrics.completedThisWeek||0}</strong><span>This week</span></div><div class="preview-stat"><strong>${metrics.certificates||0}</strong><span>Certificates</span></div></div>`;
      }
      dashboardUpdates(d.updates||d.trainingRequests||[]);
    }
    function profileImageMarkup(url,label,cls){const safe=image(url);return safe?`<span class="${cls}"><img src="${esc(safe)}" alt=""></span>`:`<span class="${cls}">${esc(initials(label))}</span>`}
    function setNav(path="home"){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===path))}
    function resetHome(){state.path="";state.query="";document.getElementById("resultSearch").value="";document.getElementById("topSearch").value="";document.getElementById("results").classList.add("hidden");document.querySelectorAll(".path").forEach(b=>b.classList.remove("active"));setNav();document.getElementById("hero").scrollIntoView({behavior:"smooth",block:"start"})}
    async function choosePath(path){if(!copy[path])return;state.path=path;state.query="";document.querySelectorAll(".path").forEach(b=>b.classList.toggle("active",b.dataset.path===path));setNav(path);const c=copy[path];document.getElementById("resultLabel").textContent=c.label;document.getElementById("resultTitle").textContent=c.title;document.getElementById("resultDescription").textContent=c.description;document.getElementById("resultSearch").placeholder=c.placeholder;document.getElementById("resultSearch").value="";document.getElementById("topSearch").value="";document.getElementById("results").classList.remove("hidden");loading(path);if(!state.loaded[path])await load(path);else render();document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"})}
    function openMobileLearningSearch(){location.href="learning-courses.html?focus=search"}
    function loading(path){const label=path==="teachers"?"teachers":path==="certificates"?"certificates":"learning opportunities";document.getElementById("resultGrid").innerHTML=`<div class="state"><div class="spinner"></div><h3>Loading ${esc(label)}...</h3><p>AIFT is retrieving the latest information.</p></div>`}
    async function load(path){try{state.errors[path]="";if(path==="learn"){const d=await api("/api/classes/discover?limit=60");state.classes=Array.isArray(d)?d:d.classes||d.items||[]}if(path==="teachers"){const d=await api("/api/users/network"),users=Array.isArray(d)?d:d.users||d.items||d.results||[];state.teachers=users.filter(u=>role(u.role)==="teacher").sort((a,b)=>Number(!!b.aiftVerified)-Number(!!a.aiftVerified)||name(a).localeCompare(name(b)))}if(path==="certificates"){const r=role(state.viewer?.role);if(["student","talent","admin"].includes(r)){try{const d=await api("/api/certificates/my");state.certificates=Array.isArray(d)?d:d.certificates||d.items||[]}catch(e){state.certificates=profileCertificates(state.viewer?.certifications);if(e.status!==403)throw e}}else state.certificates=profileCertificates(state.viewer?.certifications)}state.loaded[path]=true}catch(e){console.error(e);state.errors[path]=e.message||"This information could not be loaded."}if(state.path===path)render()}
    function profileCertificates(items){return Array.isArray(items)?items.map((x,i)=>typeof x==="string"?{_id:`profile-${i}`,title:x,issuer:"AIFT profile"}:{...x,_id:x._id||`profile-${i}`}):[]}
    function list(){return state.path==="teachers"?state.teachers:state.path==="certificates"?state.certificates:state.classes}
    function searchable(x){if(state.path==="teachers")return[name(x),x.subject,x.department,x.headline,...(x.skills||[]),...(x.languages||[])].join(" ");if(state.path==="certificates")return[x.title,x.certificateNumber,x.verificationCode,x.schoolName,x.className,x.programName,x.issuer,name(x.schoolId,"")].join(" ");return[x.title,x.subtitle,x.subject,x.category,x.description,x.level,x.language,name(x.schoolId,""),name(x.teacherId,"")].join(" ")}
    function empty(title,description){const icon=state.path==="teachers"?icons.users:state.path==="certificates"?icons.award:icons.book;return`<div class="state"><div class="state-icon">${icon}</div><h3>${esc(title)}</h3><p>${esc(description)}</p></div>`}
    function render(){const grid=document.getElementById("resultGrid"),error=state.errors[state.path];if(error){grid.innerHTML=empty("Unable to load this section",error);return}const q=state.query.toLowerCase().trim(),items=list().filter(x=>!q||searchable(x).toLowerCase().includes(q));if(!items.length){const searching=!!q,title=searching?"No matching results":state.path==="teachers"?"No teachers are available yet":state.path==="certificates"?"No certificates yet":"No published learning opportunities yet",desc=searching?"Try a different name, subject, skill or keyword.":state.path==="teachers"?"AIFT teachers will appear here when their profiles become available.":state.path==="certificates"?"Certificates connected to this account will appear here after they are issued.":"Active classes will appear here after a school publishes them for Learning discovery.";grid.innerHTML=empty(title,desc);return}grid.innerHTML=state.path==="teachers"?items.map(teacherCard).join(""):state.path==="certificates"?items.map(certificateCard).join(""):items.map(courseCard).join("")}
    function canOpen(c){if(c.isEnrolled)return true;const r=role(state.viewer?.role),viewer=id(state.viewer);return r==="admin"||(r==="teacher"&&id(c.teacherId)===viewer)||(r==="school"&&id(c.schoolId)===viewer)}
    function courseCard(c){const cid=id(c),title=c.title||"Untitled class",school=name(c.schoolId,"AIFT school"),teacher=name(c.teacherId,"Instructor to be announced"),cover=image(c.coverImage||c.appearanceSettings?.thumbnailImage||c.bannerImage),description=c.subtitle||c.description||"Published learning opportunity from AIFT.",chips=[c.subject||c.category,c.level,c.language,duration(c.estimatedDurationMinutes)].filter(Boolean).slice(0,3),schoolImage=c.schoolId?.profileImage||c.schoolId?.schoolLogo||c.schoolId?.logo,open=canOpen(c),destination=open?`class-view.html?classId=${encodeURIComponent(cid)}&from=learning`:profile(c.schoolId),action=open?"Open class":"View school";return`<article class="result-card"><div class="course-cover">${cover?`<img src="${esc(cover)}" alt="">`:`<span class="book-icon">${icons.book}</span>`}${c.learningSettings?.certificatesEnabled?'<span class="badge">Certificate</span>':""}</div><div class="card-content"><div class="card-label">${esc(c.subject||c.category||"AIFT class")}</div><h3>${esc(title)}</h3><p class="card-copy">${esc(description)}</p><div class="chips">${chips.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="card-footer"><div class="provider">${profileImageMarkup(schoolImage,school,"small-avatar")}<span class="provider-copy"><strong>${esc(school)}</strong><span>${esc(teacher)}</span></span></div><button class="action" type="button" onclick="location.href='${esc(destination)}'">${action} ${icons.arrow}</button></div></div></article>`}
    function teacherCard(t){const teacher=name(t,"AIFT teacher"),photo=t.profileImage||t.avatar,subtitle=t.headline||t.subject||t.department||"AIFT teacher",skills=[...(t.skills||[]),...(t.languages||[])].filter(Boolean).slice(0,4),destination=profile(t);return`<article class="result-card teacher-card">${profileImageMarkup(photo,teacher,"teacher-avatar")}<div><h3>${esc(teacher)} ${t.aiftVerified?'<span class="verified" aria-label="AIFT verified">●</span>':""}</h3><p class="card-copy">${esc(subtitle)}</p></div><div class="teacher-skills">${skills.length?skills.map(x=>`<span class="chip">${esc(x)}</span>`).join(""):'<span class="chip">Teacher</span>'}</div><button class="action" type="button" onclick="location.href='${esc(destination)}'">View teacher ${icons.arrow}</button></article>`}
    function certificateCard(c){const title=c.title||c.className||c.programName||"AIFT Certificate",issuer=c.schoolName||name(c.schoolId,"")||c.issuer||name(c.issuedBy,"AIFT"),issued=date(c.issuedAt||c.completedAt||c.createdAt)||c.year||"",status=String(c.status||(c.verifiedByAIFT?"verified":"issued")),code=c.certificateNumber||c.verificationCode||"",skills=Array.isArray(c.skills)?c.skills.map(x=>typeof x==="string"?x:x.name||x.title).filter(Boolean):[];return`<article class="result-card certificate-card"><div class="seal">${icons.award}</div><div class="card-label">${esc(status)}</div><h3>${esc(title)}</h3><p class="card-copy">Issued by ${esc(issuer)}${issued?` · ${esc(issued)}`:""}</p>${skills.length?`<div class="chips">${skills.slice(0,3).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}${code?`<div class="credential">Credential: ${esc(code)}</div>`:""}</article>`}
    function applyLearningTheme(value){const theme=value==="dark"?"dark":"light",dark=theme==="dark",label=document.getElementById("menuThemeLabel");document.documentElement.dataset.learningTheme=theme;if(label)label.textContent=dark?"Use light theme":"Use dark theme"}
    function toggleLearningTheme(){const next=document.documentElement.dataset.learningTheme==="dark"?"light":"dark";localStorage.setItem("aiftLearningTheme",next);applyLearningTheme(next)}
    function closeLearningMenu(){const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton");menu?.classList.add("hidden");button?.setAttribute("aria-expanded","false")}function toggleLearningMenu(event){event?.stopPropagation();const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton"),opening=menu?.classList.contains("hidden");if(!menu)return;menu.classList.toggle("hidden",!opening);button?.setAttribute("aria-expanded",String(opening))}document.addEventListener("click",event=>{if(!event.target.closest(".learning-menu-wrap"))closeLearningMenu()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLearningMenu()});
    function bind(){const top=document.getElementById("topSearch");top?.addEventListener("keydown",event=>{if(event.key!=="Enter")return;const query=String(top.value||"").trim();location.href=`learning-courses.html${query?`?q=${encodeURIComponent(query)}`:""}`})}
    let lastScroll=0,chromeHidden=false,ticking=false;function notify(hidden){if(parent!==window)parent.postMessage({type:"aift:section-scroll",hidden:!!hidden},location.origin)}function notifyLearningChrome(active){if(parent!==window)parent.postMessage({type:"aift:learning-chrome",active:!!active},location.origin)}function mobileScroll(){if(innerWidth>760)return;const current=Math.max(Number((document.scrollingElement||document.documentElement).scrollTop||scrollY||0),0),down=current>lastScroll+3,up=current<lastScroll-3;let next=chromeHidden;if(down&&current>12)next=true;if(up||current<=8)next=false;const bar=document.getElementById("topbar");bar.classList.toggle("is-glass",current>20);bar.classList.toggle("is-hidden",next);if(next!==chromeHidden||current<=8){chromeHidden=next;notify(next)}lastScroll=current}function installScroll(){if(innerWidth>760)return;notifyLearningChrome(true);addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{mobileScroll();ticking=false})},{passive:true});addEventListener("pagehide",()=>{notify(false);notifyLearningChrome(false)},{once:true});mobileScroll()}
    async function init(){applyLearningTheme(localStorage.getItem("aiftLearningTheme"));if(!token()){location.replace("login.html");return}bind();installScroll();try{state.viewer=await api("/api/users/me");applyRoleExperience();await loadLearningServiceRequests();const avatar=document.getElementById("viewerAvatar"),viewerName=name(state.viewer,"AIFT"),photo=image(state.viewer.profileImage||state.viewer.avatar||state.viewer.logo);avatar.href=profile(state.viewer);avatar.innerHTML=photo?`<img src="${esc(photo)}" alt="">`:esc(initials(viewerName));}catch(e){document.body.classList.remove("role-pending");console.error(e);toast("Unable to load your Learning dashboard",e.message,"error")}}
