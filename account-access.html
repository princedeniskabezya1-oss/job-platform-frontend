<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIFT | Account Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#edf6ff,#f8fbff 50%,#edfdf5);font-family:Inter,Arial,sans-serif;color:#172033;display:grid;place-items:center;padding:22px}.shell{width:min(480px,100%);background:#fff;border:1px solid #dde6f0;border-radius:22px;box-shadow:0 24px 70px rgba(15,45,80,.14);overflow:hidden}.head{padding:22px 25px;background:linear-gradient(125deg,#082a60,#0a66c2);color:#fff}.head img{width:94px;filter:brightness(0) invert(1)}.body{padding:26px}.eyebrow{font-size:11px;font-weight:800;color:#0a66c2;text-transform:uppercase;letter-spacing:.09em}h1{margin:8px 0;font-size:25px}p{margin:0 0 20px;color:#667085;line-height:1.6;font-size:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{height:48px;border:1px solid #cfd8e3;border-radius:12px;padding:0 13px;font:inherit;outline:none}.field input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.1)}button{width:100%;height:48px;border:0;border-radius:12px;background:#0a66c2;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}button:disabled{opacity:.55}.message{display:none;margin-top:15px;padding:12px;border-radius:11px;font-size:13px;line-height:1.5}.message.show{display:block}.message.error{background:#fff1f2;color:#9f1239}.message.success{background:#ecfdf5;color:#067647}.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.links a{color:#0a66c2;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:520px){body{padding:0;background:#fff}.shell{min-height:100vh;border:0;border-radius:0;box-shadow:none}.body{padding:26px 20px}}
</style>
</head>
<body><main class="shell"><header class="head"><img src="images/aift-logo.png" alt="AIFT"></header><section class="body"><div class="eyebrow">Account security</div><h1 id="title">Secure your account</h1><p id="copy"></p><form id="form"></form><div id="message" class="message"></div><div class="links"><a href="login.html">Back to sign in</a><a href="register.html">Create account</a></div></section></main>
<script>
const API="https://backend-1-9b6f.onrender.com/api/auth";
const params=new URLSearchParams(location.search),mode=params.get("mode")||"forgot",token=params.get("token")||"";
const title=document.getElementById("title"),copy=document.getElementById("copy"),form=document.getElementById("form"),message=document.getElementById("message");
const savedEmail=sessionStorage.getItem("aiftPendingVerificationEmail")||"";
function show(text,type="success"){message.textContent=text;message.className="message show "+type}
async function post(path,body){const response=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Request failed");return data}
function emailForm(button){form.innerHTML='<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required value="'+savedEmail.replaceAll('"','&quot;')+'"></div><button>'+button+'</button>'}
if(mode==="verify"){title.textContent="Verifying your email";copy.textContent="Please wait while AIFT confirms your secure verification link.";form.innerHTML="";if(!token)show("The verification link is missing.","error");else post("/verify-email",{token}).then(data=>{show(data.message);setTimeout(()=>location.href="login.html",1800)}).catch(error=>show(error.message,"error"))}
else if(mode==="reset"){title.textContent="Choose a new password";copy.textContent="Create a secure password with at least 8 characters.";form.innerHTML='<div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button>Reset password</button>';form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm)return show("Passwords do not match.","error");try{const data=await post("/reset-password",{token,password});show(data.message);form.reset();setTimeout(()=>location.href="login.html",1800)}catch(error){show(error.message,"error")}})}
else if(mode==="resend"){title.textContent="Verify your email";copy.textContent="Check your inbox for the AIFT verification email, or request a new secure link.";emailForm("Resend verification email");form.addEventListener("submit",async e=>{e.preventDefault();try{const data=await post("/resend-verification",{email:document.getElementById("email").value});show(data.message)}catch(error){show(error.message,"error")}})}
else{title.textContent="Forgot your password?";copy.textContent="Enter the email address registered with your AIFT account.";emailForm("Send reset link");form.addEventListener("submit",async e=>{e.preventDefault();try{const data=await post("/forgot-password",{email:document.getElementById("email").value});show(data.message)}catch(error){show(error.message,"error")}})}
</script></body></html>
