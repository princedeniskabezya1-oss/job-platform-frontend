<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIFT | Account Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#edf6ff,#f8fbff 50%,#edfdf5);font-family:Inter,Arial,sans-serif;color:#172033;display:grid;place-items:center;padding:22px}.shell{width:min(480px,100%);background:#fff;border:1px solid #dde6f0;border-radius:22px;box-shadow:0 24px 70px rgba(15,45,80,.14);overflow:hidden}.head{padding:22px 25px;background:linear-gradient(125deg,#082a60,#0a66c2);color:#fff}.head img{width:94px;filter:brightness(0) invert(1)}.body{padding:26px}.eyebrow{font-size:11px;font-weight:800;color:#0a66c2;text-transform:uppercase;letter-spacing:.09em}h1{margin:8px 0;font-size:25px}p{margin:0 0 20px;color:#667085;line-height:1.6;font-size:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{height:48px;border:1px solid #cfd8e3;border-radius:12px;padding:0 13px;font:inherit;outline:none}.field input:focus{border-color:#0a66c2;box-shadow:0 0 0 3px rgba(10,102,194,.1)}button{width:100%;height:48px;border:0;border-radius:12px;background:#0a66c2;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}button:disabled{opacity:.55;cursor:not-allowed}.password-note{font-size:12px;color:#667085;line-height:1.5;margin-top:8px}.google-reset{width:100%;min-width:0;margin-top:18px}.google-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:#8490a1;font-size:11px;font-weight:800;text-transform:uppercase}.google-divider::before,.google-divider::after{content:"";height:1px;background:#e1e7ee;flex:1}.google-holder{width:100%;min-height:44px;display:flex;justify-content:center;overflow:hidden}.message{display:none;margin-top:15px;padding:12px;border-radius:11px;font-size:13px;line-height:1.5}.message.show{display:block}.message.error{background:#fff1f2;color:#9f1239}.message.success{background:#ecfdf5;color:#067647}.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.links a{color:#0a66c2;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:520px){body{padding:0;background:#fff}.shell{min-height:100vh;border:0;border-radius:0;box-shadow:none}.body{padding:26px 20px}}
</style>
</head>
<body><main class="shell"><header class="head"><img src="images/aift-logo.png" alt="AIFT"></header><section class="body"><div class="eyebrow">Account security</div><h1 id="title">Secure your account</h1><p id="copy"></p><form id="form"></form><div id="message" class="message"></div><div class="links"><a id="primaryLink" href="login.html">Back to sign in</a><a id="secondaryLink" href="register.html">Create account</a></div></section></main>
<script>
const API="https://backend-1-9b6f.onrender.com/api/auth";
const GOOGLE_CLIENT_ID="137825461456-ihqf0q7c8fien1vf66iueiidcgdd0k2f.apps.googleusercontent.com";
const params=new URLSearchParams(location.search),mode=params.get("mode")||"forgot",token=params.get("token")||"",currentAccount=params.get("account")==="current";
const title=document.getElementById("title"),copy=document.getElementById("copy"),form=document.getElementById("form"),message=document.getElementById("message"),primaryLink=document.getElementById("primaryLink"),secondaryLink=document.getElementById("secondaryLink");
const savedEmail=sessionStorage.getItem("aiftPendingVerificationEmail")||"";
function show(text,type="success"){message.textContent=text;message.className="message show "+type}
async function request(path,body,{method="POST",authToken=""}={}){const headers={"Content-Type":"application/json"};if(authToken)headers.Authorization="Bearer "+authToken;const response=await fetch(API+path,{method,headers,body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.message||"Request failed");error.code=data.code||"";throw error}return data}
function authToken(){const role=String(localStorage.getItem("role")||"").toLowerCase();return localStorage.getItem(role+"Token")||localStorage.getItem("token")||localStorage.getItem("studentToken")||localStorage.getItem("teacherToken")||localStorage.getItem("schoolToken")||localStorage.getItem("employerToken")||localStorage.getItem("talentToken")||localStorage.getItem("agentToken")||localStorage.getItem("adminToken")||""}
function clearAuth(){["token","employerToken","talentToken","adminToken","agentToken","schoolToken","studentToken","teacherToken","userId","role"].forEach(key=>localStorage.removeItem(key))}
function setBusy(button,busy,busyText){if(!button)return;button.disabled=busy;if(busy){button.dataset.label=button.textContent;button.textContent=busyText}else button.textContent=button.dataset.label||button.textContent}
function emailForm(button){form.innerHTML='<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required value="'+savedEmail.replaceAll('"','&quot;')+'"></div><button>'+button+'</button>'}
function addGoogleReset(showDivider=true){form.insertAdjacentHTML("beforeend",'<div class="google-reset">'+(showDivider?'<div class="google-divider">or verify with Google</div>':'')+'<div id="googleResetButton" class="google-holder" aria-label="Reset password with Google"></div></div>');let attempts=0;const render=()=>{const holder=document.getElementById("googleResetButton");if(!holder)return;if(!window.google?.accounts?.id){if(attempts++<80)setTimeout(render,100);else show("Google verification could not load. Check your connection and try again.","error");return}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,auto_select:false,callback:async response=>{show("Google verified your account. Preparing password reset...");try{const path=currentAccount?"/google-reset-authorize/current":"/google-reset-authorize";const options=currentAccount?{authToken:authToken()}:undefined;const data=await request(path,{credential:response.credential},options);location.replace("account-access.html?mode=reset&token="+encodeURIComponent(data.resetToken))}catch(error){show(error.message,"error")}}});google.accounts.id.renderButton(holder,{type:"standard",theme:"outline",size:"large",text:"continue_with",shape:"rectangular",logo_alignment:"left",width:Math.min(400,Math.max(240,holder.clientWidth))})};render()}
if(mode==="change"){
  const tokenValue=authToken();
  if(!tokenValue){location.replace("login.html?next="+encodeURIComponent("account-access.html?mode=change"))}
  else{
    title.textContent="Change your password";copy.textContent="Confirm your current password, then create a new secure password.";
    primaryLink.textContent="Back to AIFT";primaryLink.href="home.html";secondaryLink.textContent="Forgot password?";secondaryLink.href="account-access.html?mode=forgot&account=current";
    form.innerHTML='<div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div><div class="password-note">Use at least 8 characters, including a letter and a number.</div><button type="submit">Change password</button>';
    form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button"),currentPassword=document.getElementById("currentPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value;if(newPassword!==confirmPassword)return show("New password and confirmation do not match.","error");if(newPassword.length<8||!/[A-Za-z]/.test(newPassword)||!/\\d/.test(newPassword))return show("Use at least 8 characters with a letter and a number.","error");setBusy(button,true,"Changing password...");try{const data=await request("/change-password",{currentPassword,newPassword,confirmPassword},{method:"PATCH",authToken:tokenValue});show(data.message+" Please sign in again.");clearAuth();form.reset();setTimeout(()=>location.replace("login.html"),1800)}catch(error){show(error.message,"error");if(error.code==="AUTH_SESSION_INVALID"||error.code==="AUTH_TOKEN_INVALID")setTimeout(()=>location.replace("login.html"),1600)}finally{setBusy(button,false)}})
  }
}
else if(mode==="verify"){title.textContent="Verifying your email";copy.textContent="Please wait while AIFT confirms your secure verification link.";form.innerHTML="";if(!token)show("The verification link is missing.","error");else request("/verify-email",{token}).then(data=>{show(data.message);setTimeout(()=>location.href="login.html",1800)}).catch(error=>show(error.message,"error"))}
else if(mode==="reset"){title.textContent="Choose a new password";copy.textContent="Create a secure password with at least 8 characters.";form.innerHTML='<div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button>Reset password</button>';form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm)return show("Passwords do not match.","error");try{const data=await request("/reset-password",{token,password});show(data.message);form.reset();setTimeout(()=>location.href="login.html",1800)}catch(error){show(error.message,"error")}})}
else if(mode==="resend"){title.textContent="Verify your email";copy.textContent="Check your inbox for the AIFT verification email, or request a new secure link.";emailForm("Resend verification email");form.addEventListener("submit",async e=>{e.preventDefault();try{const data=await request("/resend-verification",{email:document.getElementById("email").value});show(data.message)}catch(error){show(error.message,"error")}})}
else if(currentAccount&&authToken()){title.textContent="Reset your password";copy.textContent="Verify your identity with Google to choose a new AIFT password.";form.innerHTML="";primaryLink.textContent="Back to settings";primaryLink.href="home.html";secondaryLink.hidden=true;addGoogleReset(false)}
else{title.textContent="Forgot your password?";copy.textContent="Verify with Google or enter the email registered with AIFT.";secondaryLink.hidden=true;emailForm("Send reset link");form.addEventListener("submit",async e=>{e.preventDefault();try{const data=await request("/forgot-password",{email:document.getElementById("email").value});show(data.message)}catch(error){show(error.message,"error")}});addGoogleReset()}
</script></body></html>
