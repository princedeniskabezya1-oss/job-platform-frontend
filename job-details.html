<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>AIFT Job Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#2557a7;
  --blue-dark:#164081;
  --blue-soft:#eef5ff;
  --green:#087f5b;
  --bg:#f3f2ef;
  --card:#ffffff;
  --ink:#111827;
  --text:#1f2937;
  --muted:#64748b;
  --line:#e5e7eb;
  --line-dark:#d1d5db;
  --soft:#f8fafc;
  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow-sm:0 8px 22px rgba(15,23,42,.06);
  --shadow-md:0 18px 48px rgba(15,23,42,.10);
  --radius:18px;
  --radius-lg:26px;
  --top:56px;
  --bottom:76px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button{
  font-family:inherit;
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.6;
}

a{
  color:inherit;
  text-decoration:none;
}

svg{
  flex:none;
}

/* =========================
   PAGE
========================= */

.detail-page{
  min-height:100vh;
  padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom,0px));
  background:var(--bg);
}

.detail-topbar{
  position:sticky;
  top:0;
  z-index:60;
  height:var(--top);
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.back-btn{
  width:39px;
  height:39px;
  border:0;
  border-radius:999px;
  background:#f3f4f6;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn:active{
  transform:scale(.97);
}

.back-btn svg{
  width:23px;
  height:23px;
  stroke-width:2.6;
}

.detail-top-title{
  min-width:0;
  flex:1;
}

.detail-top-title strong{
  display:block;
  color:#111827;
  font-size:15px;
  font-weight:900;
}

.detail-top-title span{
  display:block;
  margin-top:1px;
  color:#64748b;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-action{
  width:39px;
  height:39px;
  border:0;
  border-radius:999px;
  background:#f3f4f6;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-action svg{
  width:20px;
  height:20px;
}

/* =========================
   CONTENT CARD
========================= */

.detail-shell{
  max-width:980px;
  margin:0 auto;
  padding:12px 12px 22px;
}

.detail-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow-xs);
}

.cover{
  height:136px;
  background:
    radial-gradient(circle at 12% 18%,rgba(37,87,167,.16),transparent 30%),
    radial-gradient(circle at 90% 4%,rgba(8,127,91,.13),transparent 28%),
    linear-gradient(135deg,#dbeafe,#f8fafc);
  position:relative;
}

.logo{
  position:absolute;
  left:18px;
  bottom:-38px;
  width:78px;
  height:78px;
  border-radius:22px;
  border:4px solid #fff;
  background:#fff;
  object-fit:cover;
  box-shadow:0 12px 28px rgba(15,23,42,.16);
}

.content{
  padding:52px 18px 22px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--blue);
  font-size:11px;
  font-weight:900;
  margin-bottom:8px;
}

.eyebrow::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(8,127,91,.12);
}

.title{
  margin:0;
  color:#0f172a;
  font-size:26px;
  line-height:1.12;
  letter-spacing:-.06em;
  font-weight:900;
}

.company{
  margin-top:8px;
  color:#334155;
  font-size:15px;
  font-weight:900;
}

.company-link{
  color:var(--blue);
}

.meta{
  margin-top:13px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.meta-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  color:#475569;
  font-size:12px;
  font-weight:800;
}

.meta-pill svg{
  width:14px;
  height:14px;
}

.actions{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  min-height:46px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:#334155;
  padding:0 14px;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn svg{
  width:17px;
  height:17px;
}

.btn.primary{
  border:0;
  background:var(--blue);
  color:#fff;
  box-shadow:0 10px 20px rgba(37,87,167,.18);
}

.btn.primary:active{
  background:var(--blue-dark);
}

.btn.saved{
  background:#eef2ff;
  color:#4338ca;
  border-color:#c7d2fe;
}

.btn.full{
  grid-column:1 / -1;
}

/* =========================
   QUICK FACTS
========================= */

.quick-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick-box{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
}

.quick-box span{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.quick-box strong{
  display:block;
  margin-top:6px;
  color:#0f172a;
  font-size:14px;
  line-height:1.25;
  font-weight:900;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--line);
}

.section h2{
  margin:0 0 11px;
  color:#0f172a;
  font-size:19px;
  letter-spacing:-.035em;
  font-weight:900;
}

.description{
  color:#334155;
  font-size:14px;
  line-height:1.75;
  white-space:pre-wrap;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tag{
  padding:7px 10px;
  border-radius:999px;
  background:#eef3f8;
  border:1px solid #dbeafe;
  color:#334155;
  font-size:12px;
  font-weight:900;
}

/* =========================
   COMPANY PANEL
========================= */

.company-panel{
  margin-top:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fbfdff;
  display:flex;
  gap:12px;
  align-items:center;
}

.company-panel img{
  width:48px;
  height:48px;
  border-radius:15px;
  object-fit:cover;
  border:1px solid var(--line);
  background:#fff;
}

.company-panel strong{
  display:block;
  color:#111827;
  font-size:14px;
  font-weight:900;
}

.company-panel span{
  display:block;
  margin-top:4px;
  color:#64748b;
  font-size:12px;
  font-weight:700;
}

/* =========================
   STICKY APPLY
========================= */

.sticky-apply{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:70;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:none;
}

.sticky-apply.show{
  display:block;
}

.sticky-apply-inner{
  max-width:980px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}

.sticky-apply-title{
  min-width:0;
}

.sticky-apply-title strong{
  display:block;
  color:#111827;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sticky-apply-title span{
  display:block;
  margin-top:2px;
  color:#64748b;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sticky-apply button{
  min-width:138px;
  height:46px;
  border:0;
  border-radius:999px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:900;
}

/* =========================
   STATES
========================= */

.state-card{
  margin:14px 12px;
  padding:30px 18px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  color:#64748b;
  box-shadow:var(--shadow-xs);
}

.state-icon{
  width:48px;
  height:48px;
  border-radius:18px;
  margin:0 auto 13px;
  background:#eef5ff;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}

.state-icon svg{
  width:25px;
  height:25px;
}

.state-card h2{
  margin:0;
  color:#111827;
  font-size:19px;
  letter-spacing:-.03em;
  font-weight:900;
}

.state-card p{
  margin:8px auto 0;
  max-width:440px;
  color:#64748b;
  font-size:13px;
  line-height:1.55;
  font-weight:600;
}

.state-card .btn{
  margin:16px auto 0;
  width:max-content;
  min-width:160px;
}

/* =========================
   GUEST MODAL / TOAST
========================= */

.guest-gate-backdrop{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(15,23,42,.48);
  backdrop-filter:blur(6px);
}

.guest-gate-backdrop.show{
  display:flex;
}

.guest-gate-card{
  width:min(460px,100%);
  background:#fff;
  border-radius:26px;
  padding:26px 20px;
  box-shadow:0 30px 80px rgba(15,23,42,.26);
  text-align:center;
  border:1px solid #e5e7eb;
}

.guest-gate-logo{
  width:145px;
  height:54px;
  object-fit:contain;
  margin:0 auto 12px;
}

.guest-gate-card h2{
  margin:0;
  font-size:24px;
  line-height:1.2;
  font-weight:900;
  color:#111827;
}

.guest-gate-card p{
  margin:12px 0 22px;
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

.guest-gate-actions{
  display:grid;
  gap:10px;
}

.gate-btn{
  height:46px;
  border-radius:999px;
  border:1px solid var(--blue);
  background:#fff;
  color:var(--blue);
  font-weight:900;
}

.gate-btn.primary{
  background:var(--blue);
  color:#fff;
}

.gate-close{
  margin-top:14px;
  border:0;
  background:transparent;
  color:#64748b;
  font-weight:900;
}

.toast{
  position:fixed;
  left:14px;
  right:14px;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  z-index:9999;
  background:#0f172a;
  color:#fff;
  padding:12px 14px;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(15,23,42,.25);
  font-size:13px;
  font-weight:900;
  text-align:center;
  transform:translateY(18px);
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =========================
   DESKTOP ENHANCEMENT
========================= */

</head>

<body>

<div id="jobDetailsLoader" class="job-details-loader">
  <img src="images/aift-logo.png" alt="AIFT">
  <div class="job-loader-spinner"></div>
</div>

<div class="detail-page">
  <header class="detail-topbar">
    <button class="back-btn" type="button" onclick="goBackToJobs()" aria-label="Go back">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 18 9 12l6-6"></path>
      </svg>
    </button>

    <div class="detail-top-title">
      <strong>Job details</strong>
      <span id="topSubText">AIFT opportunities</span>
    </div>

<button class="top-action" type="button" onclick="toggleJobMoreMenu()" aria-label="More options">
  ⋯
</button>
  </header>

  <main class="detail-shell" id="jobMount">
<div></div>
  </main>
</div>

<div class="sticky-apply" id="stickyApply">

<script>
const API = "https://backend-1-9b6f.onrender.com";

/* =========================
   STATE
========================= */

const state = {
  me:null,
  job:null,
  savedIds:new Set(),
  jobId:new URLSearchParams(location.search).get("id") || localStorage.getItem("selectedJobId") || ""
};

/* =========================
   DOM
========================= */

const els = {
  mount:document.getElementById("jobMount"),
  stickyApply:document.getElementById("stickyApply"),
  stickyApplyBtn:document.getElementById("stickyApplyBtn"),
  stickyJobTitle:document.getElementById("stickyJobTitle"),
  stickyCompany:document.getElementById("stickyCompany"),
  topSubText:document.getElementById("topSubText"),
  guestModal:document.getElementById("guestModal"),
  guestModalText:document.getElementById("guestModalText"),
  toast:document.getElementById("toast")
};

/* =========================
   AUTH
========================= */

function getRole(){
  return localStorage.getItem("role") || "";
}

function getToken(){
  const role = getRole();

  return (
    localStorage.getItem(role + "Token") ||
    localStorage.getItem("schoolToken") ||
    localStorage.getItem("teacherToken") ||
    localStorage.getItem("studentToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("talentToken") ||
    localStorage.getItem("agentToken") ||
    localStorage.getItem("token") ||
    ""
  );
}

function isGuest(){
  return !getToken();
}

function authHeaders(extra = {}){
  const token = getToken();

  return {
    ...extra,
    ...(token ? { Authorization:"Bearer " + token } : {})
  };
}

function requireLogin(action = "use this feature"){
  if(!isGuest()) return true;

  showGuestModal(action);
  return false;
}

/* =========================
   HELPERS
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeArray(value){
  if(Array.isArray(value)){
    return value.filter(Boolean);
  }

  if(typeof value === "string" && value.trim()){
    return value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);
  }

  return [];
}

function compactText(value, fallback = ""){
  return String(value || fallback || "").trim().replace(/\s+/g," ");
}
  function savedJobId(value){
  return String(
    value?._id ||
    value?.id ||
    value?.jobId?._id ||
    value?.jobId ||
    value ||
    ""
  );
}

function numberFormat(value){
  const num = Number(value || 0);

  if(num >= 1000000){
    return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + "M";
  }

  if(num >= 1000){
    return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + "k";
  }

  return String(num);
}

function companyName(job){
  return (
    job?.company ||
    job?.employerId?.companyName ||
    job?.employerId?.name ||
    "Company"
  );
}

function logoOf(job){
  const company = companyName(job);

  return (
    job?.employerId?.profileImage ||
    job?.companyLogo ||
    "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(company) +
      "&background=e0f2fe&color=0f172a"
  );
}
  function bannerOf(job){
  return (
    job?.employerId?.bannerImage ||
    job?.employerId?.coverImage ||
    job?.employerId?.coverPhoto ||
    job?.employerId?.banner ||
    job?.employerId?.backgroundImage ||
    job?.companyBanner ||
    job?.bannerImage ||
    ""
  );
}

function locationOf(job){
  return job?.location || "Location not added";
}

function typeOf(job){
  return job?.type || "Full-time";
}

function salaryOf(job){
  return job?.salary || job?.salaryRange || "Not specified";
}

function levelOf(job){
  return job?.experienceLevel || job?.level || "Not specified";
}

function jobSummary(job){
  return compactText(job?.description, "No description added yet.");
}

function formatDate(value){
  if(!value) return "Recently posted";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return "Recently posted";
  }

  const diff = Date.now() - date.getTime();
  const days = Math.floor(diff / 86400000);

  if(days <= 0) return "Today";
  if(days === 1) return "1 day ago";
  if(days < 30) return days + " days ago";

  return date.toLocaleDateString(undefined,{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function employerProfileUrl(job){
  const owner =
    job?.employerId ||
    job?.employer ||
    job?.createdBy ||
    job?.userId ||
    job?.postedBy ||
    job?.owner ||
    job?.author ||
    null;

  const rawId =
    owner?._id ||
    owner?.id ||
    job?.employerId?._id ||
    job?.createdBy?._id ||
    job?.userId?._id ||
    job?.postedBy?._id ||
    job?.employerId ||
    job?.createdBy ||
    job?.userId ||
    job?.postedBy ||
    "";

  const id = String(rawId || "").trim();

  if(!id || id === "undefined" || id === "null" || id === "[object Object]"){
    return "#";
  }

  return `employer-public-profile.html?id=${encodeURIComponent(id)}`;
}

/* =========================
   UI HELPERS
========================= */
  function hideJobDetailsLoader(){
  const loader = document.getElementById("jobDetailsLoader");

  if(!loader) return;

  loader.classList.add("hide");

  setTimeout(() => {
    loader.remove();
  }, 300);
}

function showToast(message){
  if(!els.toast) return;

  els.toast.textContent = message;
  els.toast.classList.add("show");

  clearTimeout(window.__jobDetailsToastTimer);

  window.__jobDetailsToastTimer = setTimeout(() => {
    els.toast.classList.remove("show");
  }, 2800);
}

function showGuestModal(action){

    els.guestModalText.textContent =

  }

  els.guestModal?.classList.add("show");
}

function closeGuestModal(){
  els.guestModal?.classList.remove("show");
}

window.closeGuestModal = closeGuestModal;

function showState(type,title,message,buttonHTML = ""){

        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
      </svg>
    `
    : `
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 6V5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v1"></path>
        <path d="M4 7h16v13H4z"></path>
        <path d="M4 12h16"></path>
      </svg>
    `;

  els.mount.innerHTML = `
    <div class="state-card">
      <div class="state-icon">${icon}</div>
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(message)}</p>
      ${buttonHTML}
    </div>
  `;

  els.stickyApply?.classList.remove("show");
}

/* =========================
   API
========================= */

async function fetchJSON(url, options = {}){
  const res = await fetch(url, options);

  let data = null;

  try{
    data = await res.json();
  }catch{}

  if(!res.ok){
    throw new Error(data?.message || "Request failed");
  }

  return data;
}

/* =========================
   LOAD USER
========================= */

async function loadMe(){
  if(isGuest()){
    state.me = { role:"guest" };
    return;
  }

  try{
    state.me = await fetchJSON(`${API}/api/users/me`, {
      headers:authHeaders()
    });

    if(state.me?._id){
      localStorage.setItem("userId", state.me._id);
    }

    if(state.me?.role){
      localStorage.setItem("role", state.me.role);
    }

state.savedIds.clear();

safeArray(state.me?.savedJobs).forEach(item => {
  const id = savedJobId(item);

  if(id && id !== "[object Object]"){
    state.savedIds.add(id);
  }
});
  }catch(err){
    console.warn("ME LOAD FAILED:", err.message);
  }
}

/* =========================
   LOAD JOB
========================= */

async function loadJob(){
  if(!state.jobId){
    hideJobDetailsLoader();

    showState(
      "error",
      "Job not found",
      "Missing job id.",
      `<button class="btn primary" type="button" onclick="goBackToJobs()">Back to jobs</button>`
    );
    return;
  }

  try{
    const jobs = await fetchJSON(`${API}/api/jobs`, {
      headers:isGuest() ? {} : authHeaders()
    });

    const job = safeArray(jobs).find(item => String(item?._id) === String(state.jobId));

    if(!job){
      hideJobDetailsLoader();

      showState(
        "error",
        "Job not found",
        "This job may have been removed or is no longer available.",
        `<button class="btn primary" type="button" onclick="goBackToJobs()">Back to jobs</button>`
      );
      return;
    }

    state.job = normalizeJob(job);
    localStorage.setItem("selectedJobId", String(state.job._id));

    renderJob(state.job);
    hideJobDetailsLoader();
    trackView(state.job._id);

  }catch(err){
    hideJobDetailsLoader();

    console.error("LOAD JOB DETAILS FAILED:", err);

    showState(
      "error",
      "Could not load job",
      err.message || "Please try again.",
      `<button class="btn primary" type="button" onclick="location.reload()">Try again</button>`
    );
  }
}

function normalizeJob(job){
  return {
    ...job,
    _id:String(job._id),
    title:compactText(job.title, "Untitled job"),
    company:companyName(job),
    location:locationOf(job),
    type:typeOf(job),
    salary:salaryOf(job),
    experienceLevel:levelOf(job),
    description:jobSummary(job),
    skills:safeArray(job.skills),
    viewsCount:Number(job.viewsCount || 0),
    saveCount:Number(job.saveCount || 0),
    createdAt:job.createdAt || job.updatedAt || null
  };
}

/* =========================
   TRACK VIEW
========================= */

async function trackView(jobId){
  if(isGuest()) return;

  try{
    const data = await fetchJSON(`${API}/api/jobs/${jobId}/view`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });

    if(state.job){
      state.job.viewsCount = Number(data?.viewsCount ?? state.job.viewsCount ?? 0);
      renderJob(state.job);
    }
  }catch(err){
    console.warn("VIEW TRACK FAILED:", err.message);
  }
}
function jobOwnerId(job){
  return (
    job?.employerId?._id ||
    job?.employerId ||
    job?.createdBy?._id ||
    job?.createdBy ||
    job?.userId?._id ||
    job?.userId ||
    ""
  );
}

function currentViewerId(){
  return (
    state.me?._id ||
    localStorage.getItem("userId") ||
    ""
  );
}

function isJobOwner(job){
  const ownerId = jobOwnerId(job);
  const viewerId = currentViewerId();

  return Boolean(
    ownerId &&
    viewerId &&
    String(ownerId) === String(viewerId)
  );
}

/* =========================
   RENDER JOB
========================= */

function renderJob(job){
const skills = safeArray(job.skills);
const saved = state.savedIds.has(String(job._id));
const employerUrl = employerProfileUrl(job);
const ownerView = isJobOwner(job);

  if(els.topSubText){

  }

els.stickyApply?.classList.remove("show");

>

        </div>

        <div class="meta">

            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M12 21s7-4.4 7-11a7 7 0 1 0-14 0c0 6.6 7 11 7 11Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            ${escapeHTML(job.location || "Location not added")}

          <span class="meta-pill">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M4 7h16v13H4z"></path>

          <span class="meta-pill">

<div class="desktop-job-actions">

        </button>

        </button>

        </button>

        </button>

<div class="actions detail-actions">

/* =========================
   SAVE JOB
========================= */

async function saveJob(jobId){
  if(!requireLogin("save jobs")) return;

  const role = getRole();

  if(!["talent","agent","student"].includes(role)){
    showToast("Only talents, students, or agents can save jobs.");
    return;
  }

  if(!state.job || String(state.job._id) !== String(jobId)){
    showToast("This job could not be found.");
    return;
  }

  const wasSaved = state.savedIds.has(String(jobId));

  if(wasSaved){
    state.savedIds.delete(String(jobId));
  }else{
    state.savedIds.add(String(jobId));
  }

  state.job.saveCount = Math.max(
    0,
    Number(state.job.saveCount || 0) + (wasSaved ? -1 : 1)
  );

  renderJob(state.job);

  try{
    const res = await fetchJSON(`${API}/api/jobs/${jobId}/save`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });

    if(res.saved){
      state.savedIds.add(String(jobId));
      showToast("Job saved.");
    }else{
      state.savedIds.delete(String(jobId));
      showToast("Job removed from saved jobs.");
    }

    state.job.saveCount = Number(res.saveCount ?? state.job.saveCount ?? 0);
    renderJob(state.job);
  }catch(err){
    if(wasSaved){
      state.savedIds.add(String(jobId));
    }else{
      state.savedIds.delete(String(jobId));
    }

    state.job.saveCount = Math.max(
      0,
      Number(state.job.saveCount || 0) + (wasSaved ? 1 : -1)
    );

    renderJob(state.job);
    showToast(err.message || "Could not save job.");
  }
}

window.saveJob = saveJob;

/* =========================
   APPLY
========================= */

async function applyToJob(jobId){
  if(!requireLogin("apply for jobs")) return;

  if(!state.job || String(state.job._id) !== String(jobId)){
    showToast("This job could not be found.");
    return;
  }

  if(isJobOwner(state.job)){
    showToast("You cannot apply to your own job.");
    return;
  }

  localStorage.setItem("selectedJobId", String(jobId));

  try{
    await fetchJSON(`${API}/api/jobs/${jobId}/click-apply`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });
  }catch(err){
    console.warn("APPLY CLICK TRACK FAILED:", err.message);
  }

  location.href = `job-apply.html?jobId=${encodeURIComponent(jobId)}`;
}

window.applyToJob = applyToJob;
