<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>AIFT Job Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#2557a7;
  --blue-dark:#164081;
  --blue-soft:#eef5ff;
  --green:#087f5b;
  --bg:#f3f2ef;
  --card:#ffffff;
  --ink:#111827;
  --text:#1f2937;
  --muted:#64748b;
  --line:#e5e7eb;
  --line-dark:#d1d5db;
  --soft:#f8fafc;
  --shadow-xs:0 1px 2px rgba(15,23,42,.06);
  --shadow-sm:0 8px 22px rgba(15,23,42,.06);
  --shadow-md:0 18px 48px rgba(15,23,42,.10);
  --radius:18px;
  --radius-lg:26px;
  --top:56px;
  --bottom:76px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button{
  font-family:inherit;
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.6;
}

a{
  color:inherit;
  text-decoration:none;
}

svg{
  flex:none;
}

/* =========================
   PAGE
========================= */

.detail-page{
  min-height:100vh;
  padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom,0px));
  background:var(--bg);
}

.detail-topbar{
  position:sticky;
  top:0;
  z-index:60;
  height:var(--top);
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.back-btn{
  width:39px;
  height:39px;
  border:0;
  border-radius:999px;
  background:#f3f4f6;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn:active{
  transform:scale(.97);
}

.back-btn svg{
  width:23px;
  height:23px;
  stroke-width:2.6;
}

.detail-top-title{
  min-width:0;
  flex:1;
}

.detail-top-title strong{
  display:block;
  color:#111827;
  font-size:15px;
  font-weight:900;
}

.detail-top-title span{
  display:block;
  margin-top:1px;
  color:#64748b;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-action{
  width:39px;
  height:39px;
  border:0;
  border-radius:999px;
  background:#f3f4f6;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-action svg{
  width:20px;
  height:20px;
}

/* =========================
   CONTENT CARD
========================= */

.detail-shell{
  max-width:980px;
  margin:0 auto;
  padding:12px 12px 22px;
}

.detail-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow-xs);
}

.cover{
  height:136px;
  background:
    radial-gradient(circle at 12% 18%,rgba(37,87,167,.16),transparent 30%),
    radial-gradient(circle at 90% 4%,rgba(8,127,91,.13),transparent 28%),
    linear-gradient(135deg,#dbeafe,#f8fafc);
  position:relative;
}

.logo{
  position:absolute;
  left:18px;
  bottom:-38px;
  width:78px;
  height:78px;
  border-radius:22px;
  border:4px solid #fff;
  background:#fff;
  object-fit:cover;
  box-shadow:0 12px 28px rgba(15,23,42,.16);
}

.content{
  padding:52px 18px 22px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--blue);
  font-size:11px;
  font-weight:900;
  margin-bottom:8px;
}

.eyebrow::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(8,127,91,.12);
}

.title{
  margin:0;
  color:#0f172a;
  font-size:26px;
  line-height:1.12;
  letter-spacing:-.06em;
  font-weight:900;
}

.company{
  margin-top:8px;
  color:#334155;
  font-size:15px;
  font-weight:900;
}

.company-link{
  color:var(--blue);
}

.meta{
  margin-top:13px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.meta-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  color:#475569;
  font-size:12px;
  font-weight:800;
}

.meta-pill svg{
  width:14px;
  height:14px;
}

.actions{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.btn{
  min-height:46px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:#334155;
  padding:0 14px;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn svg{
  width:17px;
  height:17px;
}

.btn.primary{
  border:0;
  background:var(--blue);
  color:#fff;
  box-shadow:0 10px 20px rgba(37,87,167,.18);
}

.btn.primary:active{
  background:var(--blue-dark);
}

.btn.saved{
  background:#eef2ff;
  color:#4338ca;
  border-color:#c7d2fe;
}

.btn.full{
  grid-column:1 / -1;
}

/* =========================
   QUICK FACTS
========================= */

.quick-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick-box{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
}

.quick-box span{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.quick-box strong{
  display:block;
  margin-top:6px;
  color:#0f172a;
  font-size:14px;
  line-height:1.25;
  font-weight:900;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid var(--line);
}

.section h2{
  margin:0 0 11px;
  color:#0f172a;
  font-size:19px;
  letter-spacing:-.035em;
  font-weight:900;
}

.description{
  color:#334155;
  font-size:14px;
  line-height:1.75;
  white-space:pre-wrap;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tag{
  padding:7px 10px;
  border-radius:999px;
  background:#eef3f8;
  border:1px solid #dbeafe;
  color:#334155;
  font-size:12px;
  font-weight:900;
}

/* =========================
   COMPANY PANEL
========================= */

.company-panel{
  margin-top:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fbfdff;
  display:flex;
  gap:12px;
  align-items:center;
}

.company-panel img{
  width:48px;
  height:48px;
  border-radius:15px;
  object-fit:cover;
  border:1px solid var(--line);
  background:#fff;
}

.company-panel strong{
  display:block;
  color:#111827;
  font-size:14px;
  font-weight:900;
}

.company-panel span{
  display:block;
  margin-top:4px;
  color:#64748b;
  font-size:12px;
  font-weight:700;
}

/* =========================
   STICKY APPLY
========================= */

.sticky-apply{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:70;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:none;
}

.sticky-apply.show{
  display:block;
}

.sticky-apply-inner{
  max-width:980px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}

.sticky-apply-title{
  min-width:0;
}

.sticky-apply-title strong{
  display:block;
  color:#111827;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sticky-apply-title span{
  display:block;
  margin-top:2px;
  color:#64748b;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sticky-apply button{
  min-width:138px;
  height:46px;
  border:0;
  border-radius:999px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:900;
}

/* =========================
   STATES
========================= */

.state-card{
  margin:14px 12px;
  padding:30px 18px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  color:#64748b;
  box-shadow:var(--shadow-xs);
}

.state-icon{
  width:48px;
  height:48px;
  border-radius:18px;
  margin:0 auto 13px;
  background:#eef5ff;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
}

.state-icon svg{
  width:25px;
  height:25px;
}

.state-card h2{
  margin:0;
  color:#111827;
  font-size:19px;
  letter-spacing:-.03em;
  font-weight:900;
}

.state-card p{
  margin:8px auto 0;
  max-width:440px;
  color:#64748b;
  font-size:13px;
  line-height:1.55;
  font-weight:600;
}

.state-card .btn{
  margin:16px auto 0;
  width:max-content;
  min-width:160px;
}

/* =========================
   GUEST MODAL / TOAST
========================= */

.guest-gate-backdrop{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(15,23,42,.48);
  backdrop-filter:blur(6px);
}

.guest-gate-backdrop.show{
  display:flex;
}

.guest-gate-card{
  width:min(460px,100%);
  background:#fff;
  border-radius:26px;
  padding:26px 20px;
  box-shadow:0 30px 80px rgba(15,23,42,.26);
  text-align:center;
  border:1px solid #e5e7eb;
}

.guest-gate-logo{
  width:145px;
  height:54px;
  object-fit:contain;
  margin:0 auto 12px;
}

.guest-gate-card h2{
  margin:0;
  font-size:24px;
  line-height:1.2;
  font-weight:900;
  color:#111827;
}

.guest-gate-card p{
  margin:12px 0 22px;
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

.guest-gate-actions{
  display:grid;
  gap:10px;
}

.gate-btn{
  height:46px;
  border-radius:999px;
  border:1px solid var(--blue);
  background:#fff;
  color:var(--blue);
  font-weight:900;
}

.gate-btn.primary{
  background:var(--blue);
  color:#fff;
}

.gate-close{
  margin-top:14px;
  border:0;
  background:transparent;
  color:#64748b;
  font-weight:900;
}

.toast{
  position:fixed;
  left:14px;
  right:14px;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  z-index:9999;
  background:#0f172a;
  color:#fff;
  padding:12px 14px;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(15,23,42,.25);
  font-size:13px;
  font-weight:900;
  text-align:center;
  transform:translateY(18px);
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =========================
   DESKTOP ENHANCEMENT
========================= */

@media(min-width:761px){

  body{
    background:#f3f6fb;
  }

  .detail-page{
    padding-bottom:100px;
  }

  .detail-topbar{
    height:64px;
  }

  .detail-shell{
    padding:22px 18px 34px;
  }

  .detail-card{
    border-radius:28px;
    box-shadow:var(--shadow-md);
  }

  .cover{
    height:168px;
  }

  .logo{
    width:92px;
    height:92px;
    border-radius:26px;
    bottom:-44px;
    left:28px;
  }

  .content{
    padding:62px 28px 28px;
  }

  .title{
    font-size:34px;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
  }

  .btn.full{
    grid-column:auto;
  }

  .quick-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .sticky-apply{
    padding:12px 18px;
  }
}
</style>
</head>

<body>

<div class="detail-page">
  <header class="detail-topbar">
    <button class="back-btn" type="button" onclick="goBackToJobs()" aria-label="Go back">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 18 9 12l6-6"></path>
      </svg>
    </button>

    <div class="detail-top-title">
      <strong>Job details</strong>
      <span id="topSubText">AIFT opportunities</span>
    </div>

    <button class="top-action" type="button" onclick="shareCurrentJob()" aria-label="Share job">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
        <path d="M16 6l-4-4-4 4"></path>
        <path d="M12 2v14"></path>
      </svg>
    </button>
  </header>

  <main class="detail-shell" id="jobMount">
    <div class="state-card">
      <div class="state-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 0 1-9 9"></path>
          <path d="M3 12a9 9 0 0 1 9-9"></path>
        </svg>
      </div>
      <h2>Loading job</h2>
      <p>Please wait while AIFT loads the job information.</p>
    </div>
  </main>
</div>

<div class="sticky-apply" id="stickyApply">
  <div class="sticky-apply-inner">
    <div class="sticky-apply-title">
      <strong id="stickyJobTitle">Apply now</strong>
      <span id="stickyCompany">AIFT job</span>
    </div>

    <button type="button" id="stickyApplyBtn">Apply</button>
  </div>
</div>

<div id="guestModal" class="guest-gate-backdrop">
  <div class="guest-gate-card">
    <img src="images/aift-logo.png" class="guest-gate-logo" alt="AIFT">

    <h2>Join AIFT</h2>

    <p id="guestModalText">Create your free account to continue.</p>

    <div class="guest-gate-actions">
      <button class="gate-btn primary" type="button" onclick="location.href='login.html'">Sign In</button>
      <button class="gate-btn" type="button" onclick="location.href='register.html'">Create Account</button>
    </div>

    <button class="gate-close" type="button" onclick="closeGuestModal()">Maybe later</button>
  </div>
</div>

<div class="toast" id="toast"></div>
