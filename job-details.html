<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIFT Job Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff;
  color:#111827;
}

button{
  font-family:inherit;
}

.page{
  min-height:100vh;
  padding-bottom:92px;
  background:#fff;
}

.backbar{
  position:sticky;
  top:0;
  z-index:50;
  height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #e5e7eb;
}

.back-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:999px;
  background:#f3f4f6;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.back-btn svg{
  width:22px;
  height:22px;
}

.backbar strong{
  font-size:16px;
  font-weight:900;
}

.cover{
  height:132px;
  background:linear-gradient(135deg,#dbeafe,#f8fafc);
  position:relative;
}

.logo{
  position:absolute;
  left:18px;
  bottom:-36px;
  width:76px;
  height:76px;
  border-radius:20px;
  border:4px solid #fff;
  background:#fff;
  object-fit:cover;
  box-shadow:0 12px 28px rgba(15,23,42,.16);
}

.content{
  padding:48px 18px 22px;
}

.title{
  margin:0;
  font-size:25px;
  line-height:1.14;
  letter-spacing:-.05em;
  font-weight:900;
}

.company{
  margin-top:7px;
  font-size:15px;
  font-weight:800;
  color:#334155;
}

.meta{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

.meta span{
  display:flex;
  align-items:center;
  gap:5px;
}

.meta svg{
  width:15px;
  height:15px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:20px;
}

.btn{
  height:46px;
  border-radius:999px;
  border:1px solid #dbe3ea;
  background:#fff;
  color:#334155;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
}

.btn.primary{
  background:#2557a7;
  color:#fff;
  border:0;
}

.btn.full{
  grid-column:1 / -1;
}

.btn.saved{
  background:#eef2ff;
  color:#4338ca;
  border-color:#c7d2fe;
}

.btn svg{
  width:17px;
  height:17px;
}

.grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:13px;
}

.box span{
  display:block;
  color:#64748b;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.box strong{
  display:block;
  margin-top:6px;
  font-size:14px;
  color:#0f172a;
}

.section{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e5e7eb;
}

.section h2{
  margin:0 0 10px;
  font-size:19px;
  letter-spacing:-.03em;
}

.description{
  color:#334155;
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tag{
  padding:7px 10px;
  border-radius:999px;
  background:#eef3f8;
  border:1px solid #dbeafe;
  color:#334155;
  font-size:12px;
  font-weight:900;
}

.sticky-apply{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid #e5e7eb;
}

.sticky-apply button{
  width:100%;
  height:48px;
  border:0;
  border-radius:999px;
  background:#2557a7;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.loading,
.error{
  margin:18px;
  padding:30px 18px;
  text-align:center;
  border:1px solid #e5e7eb;
  border-radius:18px;
  color:#64748b;
}

.loading h2,
.error h2{
  margin:0;
  color:#111827;
}
</style>
</head>

<body>

<div class="page">
  <header class="backbar">
    <button class="back-btn" onclick="history.back()" type="button">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 18 9 12l6-6"></path>
      </svg>
    </button>
    <strong>Job details</strong>
  </header>

  <main id="jobMount">
    <div class="loading">
      <h2>Loading job</h2>
      <p>Please wait...</p>
    </div>
  </main>
</div>

<div class="sticky-apply" id="stickyApply" style="display:none;">
  <button type="button" id="stickyApplyBtn">Apply now</button>
</div>

<script>
const API = "https://backend-1-9b6f.onrender.com";

const state = {
  job:null,
  savedIds:new Set(),
  me:null
};

const mount = document.getElementById("jobMount");
const stickyApply = document.getElementById("stickyApply");
const stickyApplyBtn = document.getElementById("stickyApplyBtn");

function getRole(){
  return localStorage.getItem("role") || "";
}

function getToken(){
  const role = getRole();
  return (
    localStorage.getItem(role + "Token") ||
    localStorage.getItem("talentToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("agentToken") ||
    localStorage.getItem("schoolToken") ||
    localStorage.getItem("token") ||
    ""
  );
}

function isGuest(){
  return !getToken();
}

function authHeaders(extra = {}){
  const token = getToken();
  return {
    ...extra,
    ...(token ? { Authorization:"Bearer " + token } : {})
  };
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeArray(value){
  if(Array.isArray(value)) return value.filter(Boolean);
  if(typeof value === "string" && value.trim()){
    return value.split(",").map(v => v.trim()).filter(Boolean);
  }
  return [];
}

function companyName(job){
  return job?.company || job?.employerId?.companyName || job?.employerId?.name || "Company";
}

function logoOf(job){
  const name = companyName(job);
  return job?.employerId?.profileImage || "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=e0f2fe&color=0f172a";
}

function formatDate(value){
  if(!value) return "Recently posted";
  const date = new Date(value);
  const diff = Date.now() - date.getTime();
  const days = Math.floor(diff / 86400000);
  if(days <= 0) return "Today";
  if(days === 1) return "1 day ago";
  if(days < 30) return days + " days ago";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}

function getJobId(){
  return new URLSearchParams(location.search).get("id");
}

async function fetchJSON(url, options = {}){
  const res = await fetch(url, options);
  let data = null;
  try{ data = await res.json(); }catch{}
  if(!res.ok){
    throw new Error(data?.message || "Request failed");
  }
  return data;
}

async function loadMe(){
  if(isGuest()) return;

  try{
    state.me = await fetchJSON(`${API}/api/users/me`, {
      headers:authHeaders()
    });

    if(state.me?._id) localStorage.setItem("userId", state.me._id);
    if(state.me?.role) localStorage.setItem("role", state.me.role);

    safeArray(state.me?.savedJobs).forEach(id => state.savedIds.add(String(id)));
  }catch(err){
    console.warn("ME LOAD FAILED:", err.message);
  }
}

async function loadJob(){
  const id = getJobId();

  if(!id){
    showError("Job not found", "Missing job id.");
    return;
  }

  try{
    const jobs = await fetchJSON(`${API}/api/jobs`, {
      headers:isGuest() ? {} : authHeaders()
    });

    const job = safeArray(jobs).find(j => String(j._id) === String(id));

    if(!job){
      showError("Job not found", "This job may have been removed.");
      return;
    }

    state.job = job;
    renderJob(job);
    trackView(job._id);
  }catch(err){
    showError("Could not load job", err.message || "Please try again.");
  }
}

function showError(title, message){
  stickyApply.style.display = "none";
  mount.innerHTML = `
    <div class="error">
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(message)}</p>
    </div>
  `;
}

async function trackView(jobId){
  if(isGuest()) return;

  try{
    const data = await fetchJSON(`${API}/api/jobs/${jobId}/view`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });

    if(state.job){
      state.job.viewsCount = data.viewsCount;
      renderJob(state.job);
    }
  }catch(err){
    console.warn("VIEW TRACK FAILED:", err.message);
  }
}

function renderJob(job){
  const skills = safeArray(job.skills);
  const saved = state.savedIds.has(String(job._id));

  stickyApply.style.display = "block";
  stickyApplyBtn.onclick = () => applyToJob(job._id);

  mount.innerHTML = `
    <section class="cover">
      <img class="logo" src="${escapeHTML(logoOf(job))}" alt="${escapeHTML(companyName(job))}">
    </section>

    <section class="content">
      <h1 class="title">${escapeHTML(job.title || "Untitled job")}</h1>
      <div class="company">${escapeHTML(companyName(job))}</div>

      <div class="meta">
        <span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 21s7-4.4 7-11a7 7 0 1 0-14 0c0 6.6 7 11 7 11Z"></path>
            <circle cx="12" cy="10" r="2.5"></circle>
          </svg>
          ${escapeHTML(job.location || "Location not added")}
        </span>

        <span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M4 7h16v13H4z"></path>
            <path d="M4 12h16"></path>
          </svg>
          ${escapeHTML(job.type || "Full-time")}
        </span>

        <span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
          ${escapeHTML(formatDate(job.createdAt))}
        </span>
      </div>

      <div class="actions">
        <button class="btn primary" onclick="applyToJob('${escapeHTML(job._id)}')">
          Apply now
        </button>

        <button class="btn ${saved ? "saved" : ""}" onclick="saveJob('${escapeHTML(job._id)}')">
          ${saved ? "Saved" : "Save job"}
        </button>

        <button class="btn full" onclick="openEmployer('${escapeHTML(job._id)}')">
          View company
        </button>
      </div>

      <div class="grid">
        <div class="box"><span>Salary</span><strong>${escapeHTML(job.salary || "Not specified")}</strong></div>
        <div class="box"><span>Level</span><strong>${escapeHTML(job.experienceLevel || "Not specified")}</strong></div>
        <div class="box"><span>Views</span><strong>${escapeHTML(job.viewsCount || 0)}</strong></div>
        <div class="box"><span>Saves</span><strong>${escapeHTML(job.saveCount || 0)}</strong></div>
      </div>

      <div class="section">
        <h2>Job description</h2>
        <div class="description">${escapeHTML(job.description || "No description added yet.")}</div>
      </div>

      <div class="section">
        <h2>Skills</h2>
        <div class="tags">
          ${skills.length ? skills.map(skill => `<span class="tag">${escapeHTML(skill)}</span>`).join("") : `<span class="tag">No skills listed</span>`}
        </div>
      </div>
    </section>
  `;
}

function requireLogin(action){
  if(!isGuest()) return true;
  alert("Create your free AIFT account to " + action + ".");
  location.href = "login.html";
  return false;
}

async function saveJob(jobId){
  if(!requireLogin("save jobs")) return;

  if(!["talent","agent"].includes(getRole())){
    alert("Only talents or agents can save jobs.");
    return;
  }

  try{
    const res = await fetchJSON(`${API}/api/jobs/${jobId}/save`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });

    if(res.saved){
      state.savedIds.add(String(jobId));
    }else{
      state.savedIds.delete(String(jobId));
    }

    if(state.job){
      state.job.saveCount = res.saveCount ?? state.job.saveCount;
      renderJob(state.job);
    }
  }catch(err){
    alert(err.message || "Could not save job.");
  }
}

async function applyToJob(jobId){
  if(!requireLogin("apply for jobs")) return;

  try{
    await fetchJSON(`${API}/api/jobs/${jobId}/click-apply`, {
      method:"PATCH",
      headers:authHeaders({ "Content-Type":"application/json" })
    });
  }catch(err){
    console.warn("APPLY CLICK TRACK FAILED:", err.message);
  }

  const role = getRole();

  if(role === "talent" || role === "agent" || role === "school"){
    location.href = `job-apply.html?jobId=${encodeURIComponent(jobId)}`;
    return;
  }

  alert("Only talents, agents, and students can apply.");
}

function employerProfileUrl(job){
  const id = job?.employerId?._id || job?.employerId || "";
  if(!id) return "#";
  return "employer-public-profile.html?id=" + encodeURIComponent(id);
}

function openEmployer(jobId){
  if(!requireLogin("view employer profiles")) return;

  const job = state.job;
  if(!job) return;

  const url = employerProfileUrl(job);

  if(url === "#"){
    alert("Employer profile is not available.");
    return;
  }

  location.href = url;
}

async function init(){
  await loadMe();
  await loadJob();
}

init();
</script>

</body>
</html>
