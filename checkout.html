<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secure checkout | AIFT</title>
<style>
:root{--blue:#0969da;--muted:#64748b;--line:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;background:#f5f8fc;color:#0f172a;font-family:Inter,Arial,sans-serif}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}
.wrap{width:min(520px,calc(100% - 28px));margin:auto}
.top img{width:92px;height:40px;object-fit:contain}
.card{margin:36px auto;padding:28px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px #0f294812}
.eyebrow{color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
h1{margin:10px 0 8px;font-size:30px}
.muted,.notice{color:var(--muted);line-height:1.55}
.summary{margin:22px 0;padding:18px;border-radius:14px;background:#f6f9fd}
.summary strong,.summary span{display:block}
.summary span{margin-top:7px;font-size:25px;font-weight:800}
.field{display:none;margin:18px 0}
.field.show{display:block}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}
.field input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:11px;padding:0 14px;font-size:16px}
.notice{font-size:11px;padding:13px;border-radius:11px;background:#fff8e8;border:1px solid #f1dfa6}
.privacy,.agreement{display:none;margin:16px 0;padding:13px 14px;border:1px solid #dbe3ee;border-radius:12px;background:#f8fafc}
.privacy.show,.agreement.show{display:flex;align-items:flex-start;gap:10px}
.privacy input,.agreement input{margin-top:2px;width:17px;height:17px;flex:0 0 auto}
.privacy strong,.agreement strong{display:block;font-size:12px}
.privacy span,.agreement span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45}
.agreement a{color:var(--blue);font-weight:800}
.methods{margin-top:20px}
.methods.locked{padding:16px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;color:var(--muted);font-size:11px;text-align:center}
.method-title{text-align:center;color:#64748b;font-size:11px;font-weight:800;margin:14px 0}
.error,.success{display:none;margin-top:14px;padding:13px;border-radius:11px;font-size:12px;line-height:1.5}
.error{color:#9f1239;background:#fff1f2}
.success{color:#166534;background:#f0fdf4}
.back{display:inline-block;margin-top:18px;color:var(--blue);font-weight:800;font-size:12px}
.loading{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:540px){.card{margin:18px auto;padding:21px;border-radius:17px}h1{font-size:26px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="index.html"><img src="images/aift-logo-header.png" alt="AIFT"></a></div></header>
<main class="wrap">
<section class="card">
<div class="eyebrow">AIFT secure checkout</div>
<h1 id="title">Preparing payment…</h1>
<p class="muted">Pay securely with PayPal or a supported debit or credit card.</p>
<div class="field" id="amountField"><label for="amount">Contribution amount</label><input id="amount" type="number" min="1" step="0.01" inputmode="decimal"></div>
<div class="summary" id="summary" hidden><strong id="itemName"></strong><span id="price"></span></div>
<p class="notice" id="notice" hidden></p>
<label class="privacy" id="privacyField"><input id="publicContributor" type="checkbox" checked><span><strong>Show my name publicly</strong><span>If unchecked, your contribution appears as Anonymous on the Venture page.</span></span></label>
<label class="agreement" id="agreementField"><input id="venturePolicyAccepted" type="checkbox"><span><strong>I have read and agree to the AIFT Venture Support & Payment Policy.</strong><span>I understand this contribution does not automatically create shares, ownership, repayment rights, profit rights or a guaranteed return. <a href="venture-support-policy.html" target="_blank" rel="noopener">Read the policy</a>.</span></span></label>
<div class="methods" id="methods"><div class="loading">Loading secure payment options…</div></div>
<div class="error" id="error"></div>
<div class="success" id="success"></div>
<a class="back" href="javascript:history.back()">← Go back</a>
</section>
</main>
<script>
const API="https://backend-1-9b6f.onrender.com";
const params=new URLSearchParams(location.search);
const type=params.get("type")||"";
const id=params.get("id")||"";
const token=localStorage.getItem(localStorage.getItem("role")+"Token")||localStorage.getItem("token")||"";
let quote=null;
let paypalLoaded=false;
let paymentButtonsRendered=false;
const errorBox=document.getElementById("error");

function fail(message){
  errorBox.textContent=message;
  errorBox.style.display="block";
}

function clearError(){
  errorBox.textContent="";
  errorBox.style.display="none";
}

function policyAccepted(){
  return type!=="venture_contribution" || document.getElementById("venturePolicyAccepted")?.checked===true;
}

function payload(){
  return {
    type,
    id,
    amount:document.getElementById("amount").value,
    anonymous:type==="venture_contribution"?!document.getElementById("publicContributor").checked:false,
    termsAccepted:type==="venture_contribution"?policyAccepted():undefined,
    termsVersion:type==="venture_contribution"?"venture-support-policy-2026-09-19":undefined
  };
}

async function request(path,options={}){
  const response=await fetch(API+path,{
    ...options,
    headers:{
      Accept:"application/json",
      "Content-Type":"application/json",
      Authorization:`Bearer ${token}`,
      ...options.headers
    }
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.message||"Payment request failed.");
  return data;
}

async function loadQuote(){
  if(!token){
    const next=encodeURIComponent(location.pathname.split("/").pop()+location.search);
    location.href=`login.html?next=${next}`;
    return;
  }

  if(type==="venture_contribution"){
    document.getElementById("amountField").classList.add("show");
    document.getElementById("privacyField").classList.add("show");
    document.getElementById("agreementField").classList.add("show");
    document.getElementById("amount").value=params.get("amount")||"10";
    document.getElementById("publicContributor").checked=params.get("anonymous")!=="1";
  }

  quote=await request("/api/payments/quote",{
    method:"POST",
    body:JSON.stringify(payload())
  });

  document.getElementById("title").textContent="Complete your payment";
  document.getElementById("itemName").textContent=quote.name;
  document.getElementById("price").textContent=new Intl.NumberFormat(undefined,{style:"currency",currency:quote.currency}).format(quote.amount);
  document.getElementById("summary").hidden=false;

  if(quote.notice){
    const n=document.getElementById("notice");
    n.textContent=quote.notice;
    n.hidden=false;
  }

  return quote;
}

function lockPaymentMethods(){
  const methods=document.getElementById("methods");
  methods.className="methods locked";
  methods.textContent="Read and accept the Venture Support & Payment Policy to unlock payment options.";
}

async function ensurePayPalSdk(){
  if(paypalLoaded) return;

  const config=await fetch(API+"/api/payments/config").then(r=>r.json());

  if(!config.enabled){
    document.getElementById("methods").innerHTML="";
    throw new Error("Secure payments are being configured. Please try again later.");
  }

  await new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(config.clientId)}&currency=${encodeURIComponent(quote.currency)}&components=buttons&enable-funding=card`;
    s.onload=resolve;
    s.onerror=()=>reject(new Error("PayPal could not load."));
    document.head.appendChild(s);
  });

  paypalLoaded=true;
}

async function renderPaymentButtons(){
  if(paymentButtonsRendered) return;

  if(!policyAccepted()){
    lockPaymentMethods();
    return;
  }

  clearError();
  await ensurePayPalSdk();

  const methods=document.getElementById("methods");
  methods.className="methods";
  methods.innerHTML='<div id="paypalButtons"></div><div class="method-title">OR PAY WITH CARD</div><div id="cardButtons"></div>';

  const options={
    createOrder:async()=>{
      if(type==="venture_contribution"){
        if(!policyAccepted()) throw new Error("You must agree to the Venture Support & Payment Policy before paying.");
        quote=await loadQuote();
      }
      const data=await request("/api/payments/orders",{
        method:"POST",
        body:JSON.stringify(payload())
      });
      return data.id;
    },
    onApprove:async data=>{
      const result=await request(`/api/payments/orders/${encodeURIComponent(data.orderID)}/capture`,{
        method:"POST",
        body:"{}"
      });
      const s=document.getElementById("success");
      s.textContent="Payment completed successfully. Redirecting…";
      s.style.display="block";
      setTimeout(()=>location.href=result.returnUrl||"home.html",900);
    },
    onError:error=>fail(error.message||"Payment could not be completed.")
  };

  paypal.Buttons({...options,fundingSource:paypal.FUNDING.PAYPAL,style:{layout:"vertical",shape:"rect",label:"paypal"}}).render("#paypalButtons");

  const card=paypal.Buttons({...options,fundingSource:paypal.FUNDING.CARD,style:{layout:"vertical",shape:"rect",label:"pay"}});
  if(card.isEligible()) card.render("#cardButtons");
  else document.querySelector(".method-title").textContent="Card availability depends on your country and PayPal account";

  paymentButtonsRendered=true;
}

(async()=>{
  try{
    await loadQuote();

    if(type==="venture_contribution"){
      lockPaymentMethods();
      document.getElementById("venturePolicyAccepted").addEventListener("change",async event=>{
        if(!event.target.checked){
          if(!paymentButtonsRendered) lockPaymentMethods();
          return;
        }
        try{
          await renderPaymentButtons();
        }catch(error){
          fail(error.message);
        }
      });
    }else{
      await renderPaymentButtons();
    }
  }catch(error){
    document.getElementById("title").textContent="Payment unavailable";
    fail(error.message);
  }
})();
</script>
</body>
</html>
