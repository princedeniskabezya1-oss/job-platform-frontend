<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Teachers | AIFT Learning</title>
  <link rel="icon" href="images/aift-logo.png">
  <style>
    :root{--blue:#1787e8;--violet:#7655d5;--ink:#122037;--muted:#718096;--line:#dfe7f0;--bg:#f6f8fc;--card:#fff;--soft:#f1ebff}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body.modal-open{overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.topbar-inner{max-width:1380px;height:66px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:14px}.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:#43536a;background:#fff;border:1px solid var(--line);border-radius:50%}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:70px;height:32px;object-fit:contain}.brand span{padding-left:10px;color:var(--violet);border-left:1px solid var(--line)}.theme-btn{margin-left:auto}.hero{padding:38px 22px 26px;background:radial-gradient(circle at 84% 0,#eee7ff,transparent 29%),linear-gradient(180deg,#fff,var(--bg))}.hero-inner,.content{max-width:1380px;margin:auto}.eyebrow{margin:0 0 8px;color:var(--violet);font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,5vw,54px);letter-spacing:-.055em}.hero p{max-width:670px;margin:10px 0 0;color:var(--muted);line-height:1.55}.controls{margin-top:22px;display:grid;grid-template-columns:minmax(250px,1fr) 220px;gap:10px}.search,.filter{height:48px;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}.search input,.filter select{width:100%;border:0;outline:0;color:var(--ink);background:transparent}.content{padding:24px 22px 48px}.summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.summary h2{margin:0;font-size:20px}.summary span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.teacher{min-width:0;padding:20px 14px 16px;text-align:center;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(40,65,96,.08);transition:.2s}.teacher:hover{transform:translateY(-3px);border-color:#c2b2f2}.avatar{width:82px;height:82px;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;color:var(--violet);background:var(--soft);border:4px solid #fff;border-radius:50%;box-shadow:0 7px 18px rgba(63,47,112,.16);font-size:23px;font-weight:850}.avatar img{width:100%;height:100%;object-fit:cover}.teacher h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{color:#1687e8;font-size:10px}.expertise{min-height:34px;margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.chips{margin-top:11px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.chip{max-width:100%;padding:5px 7px;color:#694bbc;background:var(--soft);border-radius:999px;font-size:9px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open-label{margin-top:13px;color:var(--violet);font-size:11px;font-weight:850}.state{grid-column:1/-1;min-height:260px;display:grid;place-items:center;align-content:center;padding:30px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px}.spinner{width:34px;height:34px;margin-bottom:12px;border:3px solid #eee8ff;border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.state h3{margin:0 0 7px}.state p{margin:0;color:var(--muted)}.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:end center;background:rgba(13,23,36,.5);backdrop-filter:blur(4px)}.overlay.hidden{display:none}.sheet{width:min(100%,620px);max-height:92vh;padding:22px;background:var(--card);border-radius:25px 25px 0 0;overflow:auto;box-shadow:0 -20px 60px rgba(11,23,40,.25)}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.close{flex:0 0 auto}.profile{display:grid;grid-template-columns:84px minmax(0,1fr);gap:15px;align-items:center}.profile .avatar{width:84px;height:84px;margin:0}.profile h2{margin:0 0 5px}.profile p{margin:0;color:var(--muted);line-height:1.45}.detail-chips{margin:18px 0;display:flex;gap:7px;flex-wrap:wrap}.detail-chips .chip{font-size:11px}.bio{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:20px}.action{min-height:46px;padding:0 14px;color:var(--violet);background:#fff;border:1px solid #cfc2f5;border-radius:13px;font-weight:850}.action.primary{color:#fff;background:var(--violet);border-color:var(--violet)}.request-form{display:grid;gap:12px;margin-top:18px}.request-form label{display:grid;gap:6px;font-size:12px;font-weight:800}.request-form input,.request-form textarea{width:100%;padding:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;outline:0}.request-form textarea{min-height:100px;resize:vertical}.request-form input:focus,.request-form textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(118,85,213,.12)}.toast{position:fixed;right:14px;bottom:14px;z-index:300;width:min(360px,calc(100vw - 28px));padding:13px 15px;color:#fff;background:#172230;border-radius:13px;box-shadow:0 15px 38px rgba(0,0,0,.25)}.toast.hidden{display:none}
    html[data-learning-theme="dark"]{color-scheme:dark;--ink:#f3f7fc;--muted:#aab7c9;--line:#304055;--bg:#101923;--card:#172230;--soft:#292443}html[data-learning-theme="dark"] .topbar{background:rgba(16,25,35,.9)}html[data-learning-theme="dark"] .icon-btn,html[data-learning-theme="dark"] .action{color:#c4d0df;background:#172230;border-color:#34445a}html[data-learning-theme="dark"] .hero{background:radial-gradient(circle at 84% 0,rgba(73,48,135,.45),transparent 30%),linear-gradient(180deg,#172230,var(--bg))}html[data-learning-theme="dark"] .avatar{border-color:#26364a}html[data-learning-theme="dark"] .request-form input,html[data-learning-theme="dark"] .request-form textarea{background:#101923}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.topbar-inner{height:58px;padding:0 11px;gap:8px}.icon-btn{width:36px;height:36px}.brand img{width:60px;height:28px}.brand span{padding-left:7px;font-size:14px}.hero{padding:12px 10px 11px;background:var(--bg)}.hero .eyebrow,.hero h1,.hero> .hero-inner>p{display:none}.controls{margin-top:0;grid-template-columns:minmax(0,1fr) 118px;gap:7px}.search,.filter{height:43px;padding:0 10px;border-radius:12px}.filter select,.search input{font-size:12px}.content{padding:14px 10px 32px}.summary h2{font-size:17px}.summary span{font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.teacher{min-height:220px;padding:15px 9px 12px;border-radius:15px;box-shadow:0 6px 16px rgba(40,65,96,.07)}.avatar{width:68px;height:68px;margin-bottom:9px;border-width:3px;font-size:19px}.teacher h3{font-size:13px}.expertise{min-height:31px;margin-top:5px;font-size:10px;line-height:1.4}.chips{margin-top:8px;gap:4px}.chip{padding:4px 6px;font-size:9px}.open-label{margin-top:9px;font-size:10px}.state{min-height:220px;padding:20px}.sheet{padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}.profile{grid-template-columns:68px minmax(0,1fr);gap:11px}.profile .avatar{width:68px;height:68px}.profile h2{font-size:19px}.profile p,.bio{font-size:12px}.actions{grid-template-columns:1fr}.action{min-height:43px}.toast{bottom:10px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><button class="icon-btn" type="button" onclick="location.href='groups.html'" aria-label="Back to Learning"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button><div class="brand"><img src="images/aift-logo.png" alt="AIFT"><span>Teachers</span></div><button class="icon-btn theme-btn" id="themeButton" type="button" onclick="toggleTheme()" aria-label="Use dark theme"><svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg></button></div></header>
  <section class="hero"><div class="hero-inner"><p class="eyebrow">Find a teacher</p><h1>Choose expertise you can trust.</h1><p>Explore AIFT educators by skill, open a teacher’s profile, and send a direct training request.</p><div class="controls"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="search" type="search" placeholder="Name or expertise" aria-label="Search teachers"></label><label class="filter"><select id="expertise" aria-label="Filter expertise"><option value="">All expertise</option></select></label></div></div></section>
  <main class="content"><div class="summary"><h2>Available teachers</h2><span id="count"></span></div><div class="grid" id="grid"><div class="state"><div class="spinner"></div><h3>Loading teachers</h3><p>Finding available AIFT educators.</p></div></div></main>
  <div class="overlay hidden" id="teacherOverlay" role="dialog" aria-modal="true" aria-labelledby="teacherName"><section class="sheet"><div class="sheet-head"><div class="profile" id="teacherProfile"></div><button class="icon-btn close" type="button" onclick="closeTeacher()" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div><div id="teacherDetails"></div></section></div>
  <div class="overlay hidden" id="requestOverlay" role="dialog" aria-modal="true" aria-labelledby="requestTitle"><form class="sheet" id="requestForm"><div class="sheet-head"><div><p class="eyebrow">Training request</p><h2 id="requestTitle" style="margin:0">Tell the teacher what you want to learn</h2></div><button class="icon-btn close" type="button" onclick="closeRequest()" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div><div class="request-form"><label>Skill or training topic<input id="requestTopic" maxlength="120" required placeholder="Example: Advanced Excel"></label><label>Your learning goal<textarea id="requestMessage" maxlength="600" placeholder="Explain what you want to achieve and your preferred training format."></textarea></label><button class="action primary" id="sendRequest" type="submit">Send request</button></div></form></div>
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    const API="https://backend-1-9b6f.onrender.com",state={items:[],query:"",expertise:"",selected:null};
    const token=()=>localStorage.getItem("schoolToken")||localStorage.getItem("teacherToken")||localStorage.getItem("studentToken")||localStorage.getItem("adminToken")||localStorage.getItem("employerToken")||localStorage.getItem("talentToken")||localStorage.getItem("agentToken")||localStorage.getItem("token");
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);const id=value=>String(value?._id||value?.id||value||"");const initials=value=>String(value||"A").trim().split(/\s+/).slice(0,2).map(part=>part[0]).join("").toUpperCase();const safeImage=value=>/^https:\/\//i.test(String(value||""))||/^data:image\//i.test(String(value||""))||/^(?:\.\/)?images\//i.test(String(value||""))?String(value):"";
    function notifyChrome(active){if(parent!==window)parent.postMessage({type:"aift:learning-chrome",active:!!active},location.origin)}function showToast(message){const node=document.getElementById("toast");node.textContent=message;node.classList.remove("hidden");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>node.classList.add("hidden"),3500)}
    function applyTheme(value){const dark=value==="dark";document.documentElement.dataset.learningTheme=dark?"dark":"light";const button=document.getElementById("themeButton");button.setAttribute("aria-label",dark?"Use light theme":"Use dark theme");button.innerHTML=dark?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>':'<svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg>'}function toggleTheme(){const next=document.documentElement.dataset.learningTheme==="dark"?"light":"dark";localStorage.setItem("aiftLearningTheme",next);applyTheme(next)}
    function teacherName(item){return String(item.name||"AIFT teacher")}function skills(item){return[...(item.skills||[]),item.subject,item.department,item.profession].map(value=>String(value||"").trim()).filter(Boolean).filter((value,index,list)=>list.indexOf(value)===index)}function searchable(item){return[teacherName(item),item.headline,item.bio,item.teacherBio,...skills(item),...(item.languages||[])].join(" ").toLowerCase()}function avatar(item,cls="avatar"){const photo=safeImage(item.profileImage||item.avatar);return`<span class="${cls}">${photo?`<img src="${esc(photo)}" alt="">`:esc(initials(teacherName(item)))}</span>`}
    function render(){const q=state.query.trim().toLowerCase(),items=state.items.filter(item=>(!q||searchable(item).includes(q))&&(!state.expertise||skills(item).includes(state.expertise))),grid=document.getElementById("grid");document.getElementById("count").textContent=`${items.length} shown`;if(!items.length){grid.innerHTML='<div class="state"><h3>No matching teachers</h3><p>Try another skill or name.</p></div>';return}grid.innerHTML=items.map(item=>{const list=skills(item);return`<button class="teacher" type="button" onclick="openTeacher('${esc(id(item))}')">${avatar(item)}<h3>${esc(teacherName(item))} ${item.aiftVerified?'<span class="verified">●</span>':""}</h3><p class="expertise">${esc(item.headline||item.subject||item.department||"AIFT educator")}</p><div class="chips">${list.slice(0,2).map(value=>`<span class="chip">${esc(value)}</span>`).join("")}</div><div class="open-label">View teacher</div></button>`}).join("")}
    function profileDestination(item){return`agent-public-profile.html?id=${encodeURIComponent(id(item))}`}
    function openTeacher(teacherId){const item=state.items.find(value=>id(value)===String(teacherId));if(!item)return;state.selected=item;const list=skills(item);document.getElementById("teacherProfile").innerHTML=`${avatar(item)}<div><h2 id="teacherName">${esc(teacherName(item))} ${item.aiftVerified?'<span class="verified">● AIFT verified</span>':""}</h2><p>${esc(item.headline||item.subject||item.department||"AIFT educator")}</p></div>`;document.getElementById("teacherDetails").innerHTML=`<div class="detail-chips">${list.length?list.map(value=>`<span class="chip">${esc(value)}</span>`).join(""):'<span class="chip">Teacher</span>'}</div><p class="bio">${esc(item.teacherBio||item.bio||"Open this teacher’s public profile for more experience and qualification details.")}</p><div class="actions"><button class="action" type="button" onclick="location.href='${profileDestination(item)}'">View full profile</button><button class="action primary" type="button" onclick="openRequest()">Request training</button></div>`;document.getElementById("teacherOverlay").classList.remove("hidden");document.body.classList.add("modal-open")}
    function closeTeacher(){document.getElementById("teacherOverlay").classList.add("hidden");document.body.classList.remove("modal-open")}function openRequest(){document.getElementById("teacherOverlay").classList.add("hidden");document.getElementById("requestOverlay").classList.remove("hidden");setTimeout(()=>document.getElementById("requestTopic").focus(),100)}function closeRequest(){document.getElementById("requestOverlay").classList.add("hidden");document.body.classList.remove("modal-open")}
    async function sendRequest(event){event.preventDefault();if(!state.selected)return;const topic=document.getElementById("requestTopic").value.trim(),message=document.getElementById("requestMessage").value.trim(),button=document.getElementById("sendRequest");if(topic.length<3){showToast("Please enter the skill you want to learn.");return}button.disabled=true;button.textContent="Sending…";try{const response=await fetch(`${API}/api/users/${encodeURIComponent(id(state.selected))}/training-request`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token()}`},body:JSON.stringify({topic,message})}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"The request could not be sent");document.getElementById("requestForm").reset();closeRequest();showToast(`Training request sent to ${teacherName(state.selected)}.`)}catch(error){showToast(error.message)}finally{button.disabled=false;button.textContent="Send request"}}
    async function load(){try{const response=await fetch(`${API}/api/users/teachers/discover`,{headers:{Accept:"application/json",Authorization:`Bearer ${token()}`}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Teachers could not be loaded");state.items=Array.isArray(data)?data:data.teachers||[];const expertise=[...new Set(state.items.flatMap(skills))].sort();document.getElementById("expertise").innerHTML='<option value="">All expertise</option>'+expertise.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("");render()}catch(error){document.getElementById("grid").innerHTML=`<div class="state"><h3>Unable to load teachers</h3><p>${esc(error.message)}</p></div>`}}
    function init(){if(!token()){location.replace("login.html");return}applyTheme(localStorage.getItem("aiftLearningTheme"));notifyChrome(true);addEventListener("pagehide",()=>notifyChrome(false),{once:true});document.getElementById("search").addEventListener("input",event=>{state.query=event.target.value;render()});document.getElementById("expertise").addEventListener("change",event=>{state.expertise=event.target.value;render()});document.getElementById("requestForm").addEventListener("submit",sendRequest);document.querySelectorAll(".overlay").forEach(node=>node.addEventListener("click",event=>{if(event.target!==node)return;node.id==="teacherOverlay"?closeTeacher():closeRequest()}));load()}
    init();
  </script>
</body>
</html>
