<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Notifications | AIFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root{--blue:#0866ff;--blue-soft:#e7f3ff;--text:#050505;--muted:#65676b;--hover:#f2f2f2;--line:#dddfe2;--surface:#fff;--danger:#e41e3f;--shadow:0 12px 32px rgba(0,0,0,.16)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f0f2f5;color:var(--text)}
    button,input{font:inherit}button{touch-action:manipulation}
    .app{width:min(100%,780px);min-height:100vh;margin:0 auto;background:var(--surface);box-shadow:0 0 24px rgba(0,0,0,.06)}
    .header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 10px}
    .header-row{display:flex;align-items:center;gap:10px;min-height:48px}
    .header h1{font-size:32px;line-height:1.15;letter-spacing:-1.1px;margin:0;flex:1;font-weight:800}
    .round-btn{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:#e4e6eb;color:#050505;cursor:pointer}
    .round-btn:hover,.round-btn:focus-visible{background:#d8dadf;outline:0}.round-btn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .header-tools{display:flex;gap:8px;margin-top:10px;align-items:center}
    .filter{border:0;border-radius:18px;padding:8px 14px;background:#e4e6eb;font-weight:700;cursor:pointer}.filter.active{color:#0056d6;background:#e7f3ff}
    .mark-all{margin-left:auto;border:0;background:transparent;color:#0866ff;padding:8px;font-weight:700;cursor:pointer;border-radius:8px}.mark-all:hover{background:#f2f2f2}
    .search-panel{display:none;margin-top:10px;position:relative}.search-panel.open{display:block}.search-panel svg{position:absolute;left:13px;top:11px;width:20px;height:20px;stroke:#65676b;fill:none;stroke-width:2}
    .search-panel input{width:100%;height:42px;border:0;border-radius:22px;background:#f0f2f5;padding:0 42px;font-size:15px;outline:0}.search-panel input:focus{box-shadow:0 0 0 2px rgba(8,102,255,.22)}
    .summary{padding:12px 16px 2px;color:#65676b;font-size:13px;display:flex;justify-content:space-between}.live{display:flex;align-items:center;gap:6px}.live-dot{width:7px;height:7px;border-radius:50%;background:#8a8d91}.live.connected{color:#188038}.live.connected .live-dot{background:#31a24c}
    .section-title{font-size:20px;font-weight:800;margin:0;padding:18px 16px 8px}
    .notification{position:relative;display:grid;grid-template-columns:68px minmax(0,1fr) 42px;gap:12px;padding:12px 12px 12px 16px;cursor:pointer;background:#fff;transition:background .15s}
    .notification:hover{background:#f2f2f2}.notification.unread{background:var(--blue-soft)}.notification.unread:hover{background:#dfefff}
    .avatar-wrap{width:68px;height:68px;position:relative}.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#e4e6eb;display:block}.event-badge{position:absolute;right:-3px;bottom:-3px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}.event-badge svg{width:17px;height:17px;fill:currentColor;stroke:currentColor;stroke-width:1.8}
    .event-badge.like,.event-badge.story_like{background:#1877f2}.event-badge.comment,.event-badge.comment_reply,.event-badge.message,.event-badge.story_reply{background:#1877f2}.event-badge.follow,.event-badge.group_invite{background:#e37400}.event-badge.missed_call{background:#e41e3f}.event-badge.assignment,.event-badge.submission,.event-badge.submission_reviewed{background:#6a3de8}.event-badge.application,.event-badge.application_status,.event-badge.job_invite{background:#08854d}
    .copy{align-self:center;min-width:0;padding:1px 0}.text{font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}.text strong{font-weight:750}.time{font-size:13px;color:var(--muted);margin-top:4px}.unread .time{color:#0866ff;font-weight:650}.detail{display:block;color:#65676b;margin-top:3px;font-size:14px}
    .actions{display:flex;gap:8px;margin-top:10px}.action-btn{height:38px;min-width:104px;border:0;border-radius:8px;background:#e4e6eb;font-weight:700;cursor:pointer;padding:0 18px}.action-btn.primary{background:#0866ff;color:#fff}.action-btn:disabled{opacity:.6;cursor:default}.action-result{margin-top:8px;color:#65676b;font-size:13px;font-weight:650;text-transform:capitalize}
    .more{align-self:start;width:40px;height:40px;background:transparent;border:0;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;letter-spacing:1px}.more:hover{background:rgba(0,0,0,.08)}.unread-dot{position:absolute;right:18px;bottom:12px;width:10px;height:10px;background:#0866ff;border-radius:50%}
    .menu{position:fixed;z-index:60;min-width:245px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px;display:none}.menu.open{display:block}.menu button{width:100%;border:0;background:#fff;border-radius:8px;text-align:left;padding:12px;font-weight:650;cursor:pointer;display:flex;gap:11px;align-items:center}.menu button:hover{background:#f2f2f2}.menu button.danger{color:#c5221f}.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
    .empty{padding:70px 24px;text-align:center;color:#65676b}.empty-icon{width:76px;height:76px;border-radius:50%;background:#e7f3ff;color:#0866ff;display:grid;place-items:center;margin:0 auto 16px}.empty-icon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2}.empty h2{color:#050505;font-size:20px;margin:0 0 7px}.skeleton{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:12px 16px}.skel{background:linear-gradient(90deg,#eee 25%,#f7f7f7 37%,#eee 63%);background-size:400% 100%;animation:shine 1.35s infinite;border-radius:8px}.skel.avatar-s{width:68px;height:68px;border-radius:50%}.skel.line{height:14px;margin:8px 0}.skel.line.short{width:45%}@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
    .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:80;background:#242526;color:#fff;padding:12px 17px;border-radius:8px;box-shadow:var(--shadow);font-size:14px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:640px){html,body{background:#fff}.app{width:100%;box-shadow:none}.header{padding-left:12px;padding-right:12px}.header h1{font-size:29px}.notification{grid-template-columns:60px minmax(0,1fr) 38px;gap:10px;padding-left:12px}.avatar-wrap,.avatar{width:60px;height:60px}.event-badge{width:27px;height:27px}.text{font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr}.action-btn{min-width:0;width:100%}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-row">
        <button class="round-btn" id="backBtn" aria-label="Go back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <h1>Notifications</h1>
        <button class="round-btn" id="searchBtn" aria-label="Search notifications"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <div class="header-tools">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="unread">Unread</button>
        <button class="mark-all" id="markAllBtn">Mark all as read</button>
      </div>
      <div class="search-panel" id="searchPanel"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" type="search" placeholder="Search notifications" autocomplete="off"></div>
    </header>
    <div class="summary"><span id="summaryText">Loading notifications…</span><span class="live" id="liveStatus"><i class="live-dot"></i><span>Connecting</span></span></div>
    <section id="notificationList" aria-live="polite"></section>
  </main>
  <div class="menu" id="notificationMenu" role="menu"></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const API="https://backend-1-9b6f.onrender.com";
    const FALLBACK="https://cdn-icons-png.flaticon.com/512/149/149071.png";
    const state={items:[],filter:"all",query:"",menuId:null,socket:null,poll:null};
    const $=id=>document.getElementById(id);
    function session(){for(const key of ["talentToken","employerToken","adminToken","agentToken","teacherToken","studentToken","schoolToken","familyToken","token"]){const token=localStorage.getItem(key);if(token)return{token};}return null}
    if(!session())location.replace("login.html");
    const headers=()=>({"Content-Type":"application/json",Authorization:`Bearer ${session()?.token||""}`});
    function esc(value=""){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
    function attr(value=""){return esc(value)}
    function actorName(item){return item.sender?.companyName||item.sender?.schoolName||item.sender?.name||item.title||"AIFT"}
    function actorImage(item){return item.image||item.sender?.profileImage||item.sender?.logo||FALLBACK}
    function bodyText(item){let text=String(item.text||item.message||"You have a new notification").trim(),name=actorName(item);if(text.toLowerCase().startsWith(name.toLowerCase()))text=text.slice(name.length).trim();return text}
    function timeAgo(value){const time=new Date(value).getTime();if(!Number.isFinite(time))return"";const seconds=Math.max(0,Math.floor((Date.now()-time)/1000));if(seconds<60)return"Just now";if(seconds<3600)return`${Math.floor(seconds/60)}m`;if(seconds<86400)return`${Math.floor(seconds/3600)}h`;if(seconds<604800)return`${Math.floor(seconds/86400)}d`;if(seconds<31536000)return new Date(time).toLocaleDateString(undefined,{month:"short",day:"numeric"});return new Date(time).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
    function icon(type){const icons={like:'<path d="M7 10v11H3V10h4Zm2 11V10l4-7c1.5 0 2.5 1.3 2 2.8L14 10h6c1.4 0 2.4 1.3 2 2.7l-2 7A2 2 0 0 1 18 21H9Z"/>',story_like:'<path d="M12 21S3 16 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 7-9 12-9 12Z"/>',follow:'<path d="M15 20a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8m9 5v6m3-3h-6" fill="none"/>',group_invite:'<path d="M15 20a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8m9 5v6m3-3h-6" fill="none"/>',comment:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',comment_reply:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',message:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',missed_call:'<path d="M6 3 3 6c0 8 7 15 15 15l3-3-5-4-2 2c-3-1-5-3-6-6l2-2-4-5Z" fill="none"/>',assignment:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',submission:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',submission_reviewed:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',application:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',application_status:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',job_invite:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',story_mention:'<path d="M5 3h14v18H5zM9 17h6" fill="none"/>',story_reply:'<path d="M5 3h14v18H5zM9 17h6" fill="none"/>'};return`<svg viewBox="0 0 24 24">${icons[type]||'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none"/>'}</svg>`}
    function hasActions(item){return item.actionState==="pending"&&Array.isArray(item.metadata?.actions)&&item.metadata.actions.length}
    function actionMarkup(item){if(!hasActions(item))return item.actionState?`<div class="action-result">${esc(item.actionState)}</div>`:"";return`<div class="actions"><button class="action-btn primary" data-action="accept" data-id="${attr(item._id)}">Accept</button><button class="action-btn" data-action="decline" data-id="${attr(item._id)}">Decline</button></div>`}
    function itemMarkup(item){const type=item.type||"system";return`<article class="notification ${item.read?"":"unread"}" data-id="${attr(item._id)}" tabindex="0" role="button"><div class="avatar-wrap"><img class="avatar" src="${attr(actorImage(item))}" alt="" onerror="this.src='${FALLBACK}'"><span class="event-badge ${attr(type)}">${icon(type)}</span></div><div class="copy"><div class="text"><strong>${esc(actorName(item))}</strong> ${esc(bodyText(item))}</div>${item.metadata?.detail?`<span class="detail">${esc(item.metadata.detail)}</span>`:""}<div class="time">${esc(timeAgo(item.createdAt))}</div>${actionMarkup(item)}</div><button class="more" data-menu="${attr(item._id)}" aria-label="Notification options">•••</button>${item.read?"":'<i class="unread-dot"></i>'}</article>`}
    function filtered(){return state.items.filter(item=>(state.filter!=="unread"||!item.read)&&(!state.query||`${actorName(item)} ${bodyText(item)} ${item.type}`.toLowerCase().includes(state.query)))}
    function render(){const list=filtered(),newItems=list.filter(item=>!item.read),earlier=list.filter(item=>item.read);$("summaryText").textContent=`${state.items.filter(item=>!item.read).length} unread · ${state.items.length} total`;if(!list.length){$("notificationList").innerHTML=`<div class="empty"><div class="empty-icon">${icon("system")}</div><h2>${state.query?"No matching notifications":state.filter==="unread"?"You're all caught up":"No notifications yet"}</h2><p>${state.query?"Try a different search.":"Your latest AIFT activity will appear here."}</p></div>`;return}let html="";if(newItems.length)html+=`<h2 class="section-title">New</h2>${newItems.map(itemMarkup).join("")}`;if(earlier.length)html+=`<h2 class="section-title">Earlier</h2>${earlier.map(itemMarkup).join("")}`;$("notificationList").innerHTML=html}
    function skeleton(){$("notificationList").innerHTML=Array.from({length:6},()=>'<div class="skeleton"><div class="skel avatar-s"></div><div><div class="skel line"></div><div class="skel line"></div><div class="skel line short"></div></div></div>').join("")}
    async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{...headers(),...(options.headers||{})}});if(response.status===401||response.status===403){location.replace("login.html");throw new Error("Session expired")}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Request failed");return data}
    async function load({quiet=false}={}){if(!quiet)skeleton();try{const query=new URLSearchParams({limit:"250"});state.items=await api(`/api/notifications?${query}`);render();api("/api/notifications/seen-all",{method:"PATCH"}).catch(()=>{})}catch(error){toast(error.message);if(!quiet)$("notificationList").innerHTML='<div class="empty"><h2>Couldn’t load notifications</h2><p>Please check your connection and try again.</p></div>'}}
    async function updateRead(id,read){const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;const previous=item.read;item.read=read;render();try{await api(`/api/notifications/${encodeURIComponent(id)}/${read?"read":"unread"}`,{method:"PATCH"})}catch(error){item.read=previous;render();toast(error.message)}}
    async function openItem(id){const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;if(!item.read)await updateRead(id,true);if(item.link)safeNavigate(item.link)}
    function safeNavigate(link){try{const url=new URL(String(link),location.origin);if(url.origin!==location.origin)return toast("This link is unavailable");location.href=url.pathname.replace(/^\//,"")+url.search+url.hash}catch{toast("This notification link is unavailable")}}
    async function markAll(){const unread=state.items.filter(item=>!item.read);if(!unread.length)return toast("No unread notifications");unread.forEach(item=>item.read=true);render();try{await api("/api/notifications/read-all",{method:"PATCH"});toast("All notifications marked as read")}catch(error){await load({quiet:true});toast(error.message)}}
    async function removeItem(id){const index=state.items.findIndex(item=>String(item._id)===String(id));if(index<0)return;const [removed]=state.items.splice(index,1);render();closeMenu();try{await api(`/api/notifications/${encodeURIComponent(id)}`,{method:"DELETE"});toast("Notification removed")}catch(error){state.items.splice(index,0,removed);render();toast(error.message)}}
    async function runAction(id,action){const buttons=document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-action]`);buttons.forEach(button=>button.disabled=true);try{const result=await api(`/api/notifications/${encodeURIComponent(id)}/action`,{method:"POST",body:JSON.stringify({action})});const item=state.items.find(entry=>String(entry._id)===String(id));if(item){item.actionState=result.actionState;item.read=true}render();toast(action==="accept"?"Accepted":"Declined");if(action==="accept"&&result.link)setTimeout(()=>safeNavigate(result.link),350)}catch(error){buttons.forEach(button=>button.disabled=false);toast(error.message)}}
    function openMenu(id,button){state.menuId=id;const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;const menu=$("notificationMenu");menu.innerHTML=`<button data-command="${item.read?"unread":"read"}">${icon("system")}Mark as ${item.read?"unread":"read"}</button><button class="danger" data-command="remove"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg>Remove this notification</button>`;const rect=button.getBoundingClientRect(),width=245;menu.style.left=`${Math.max(8,Math.min(innerWidth-width-8,rect.right-width))}px`;menu.style.top=`${Math.min(innerHeight-130,rect.bottom+4)}px`;menu.classList.add("open")}
    function closeMenu(){$("notificationMenu").classList.remove("open");state.menuId=null}
    function toast(message){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),2400)}
    function currentUserId(){try{const payload=JSON.parse(atob((session()?.token||"").split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return payload.id||payload._id||payload.userId}catch{return localStorage.getItem("userId")}}
    function realtime(){const user=currentUserId();if(!user)return;state.socket=io(API,{transports:["websocket","polling"]});state.socket.on("connect",()=>{state.socket.emit("join",user);$("liveStatus").classList.add("connected");$("liveStatus").querySelector("span").textContent="Live"});state.socket.on("disconnect",()=>{$("liveStatus").classList.remove("connected");$("liveStatus").querySelector("span").textContent="Reconnecting"});["newNotification","notification_created","notificationUpdated","notificationRemoved","notificationsRead","application_created","application_status_updated","job_invite_created","assignment:new","submission:new","submission:reviewed","callLogUpdated"].forEach(event=>state.socket.on(event,()=>load({quiet:true})));state.poll=setInterval(()=>{if(!document.hidden)load({quiet:true})},30000)}
    $("backBtn").onclick=()=>history.length>1?history.back():location.assign("home.html");
    $("searchBtn").onclick=()=>{$("searchPanel").classList.toggle("open");if($("searchPanel").classList.contains("open"))$("searchInput").focus()};
    $("searchInput").oninput=event=>{state.query=event.target.value.trim().toLowerCase();render()};
    $("markAllBtn").onclick=markAll;
    document.querySelectorAll(".filter").forEach(button=>button.onclick=()=>{state.filter=button.dataset.filter;document.querySelectorAll(".filter").forEach(item=>item.classList.toggle("active",item===button));render()});
    $("notificationList").onclick=event=>{const action=event.target.closest("[data-action]");if(action){event.stopPropagation();return runAction(action.dataset.id,action.dataset.action)}const menu=event.target.closest("[data-menu]");if(menu){event.stopPropagation();return openMenu(menu.dataset.menu,menu)}const item=event.target.closest(".notification");if(item)openItem(item.dataset.id)};
    $("notificationList").onkeydown=event=>{if((event.key==="Enter"||event.key===" ")&&!event.target.closest("button")){event.preventDefault();openItem(event.target.closest(".notification")?.dataset.id)}};
    $("notificationMenu").onclick=event=>{const command=event.target.closest("[data-command]")?.dataset.command;if(!command||!state.menuId)return;if(command==="remove")removeItem(state.menuId);else updateRead(state.menuId,command==="read").finally(closeMenu)};
    document.addEventListener("click",event=>{if(!event.target.closest("#notificationMenu")&&!event.target.closest("[data-menu]"))closeMenu()});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)load({quiet:true})});
    window.addEventListener("beforeunload",()=>{clearInterval(state.poll);state.socket?.disconnect()});
    load().then(realtime);
  </script>
</body>
</html>
