  <style>
    :root{--blue:#0866ff;--blue-soft:#e7f3ff;--text:#050505;--muted:#65676b;--hover:#f2f2f2;--line:#dddfe2;--surface:#fff;--danger:#e41e3f;--shadow:0 12px 32px rgba(0,0,0,.16)}

    .round-btn:hover,.round-btn:focus-visible{background:#d8dadf;outline:0}.round-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

    .mark-all{margin-left:auto;border:0;background:transparent;color:#0866ff;padding:7px;font-size:14px;font-weight:700;cursor:pointer;border-radius:8px}.mark-all:hover{background:#f2f2f2}
    .search-panel{display:none;margin-top:10px;position:relative}.search-panel.open{display:block}.search-panel svg{position:absolute;left:13px;top:11px;width:20px;height:20px;stroke:#65676b;fill:none;stroke-width:2}
    .search-panel input{width:100%;height:42px;border:0;border-radius:22px;background:#f0f2f5;padding:0 42px;font-size:15px;outline:0}.search-panel input:focus{box-shadow:0 0 0 2px rgba(8,102,255,.22)}

    .notification:hover{background:#f2f2f2}.notification.unread{background:var(--blue-soft)}.notification.unread:hover{background:#dfefff}
    .avatar-wrap{width:56px;height:56px;position:relative}.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e4e6eb;display:block}.event-badge{position:absolute;right:-3px;bottom:-3px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}.event-badge svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:1.8}
    .event-badge.like,.event-badge.story_like{background:#fff;color:#e41e3f;border-color:#fff}.event-badge.comment,.event-badge.comment_reply,.event-badge.message,.event-badge.story_reply{background:#1877f2}.event-badge.follow,.event-badge.group_invite{background:#e37400}.event-badge.missed_call{background:#e41e3f}.event-badge.assignment,.event-badge.submission,.event-badge.submission_reviewed{background:#6a3de8}.event-badge.application,.event-badge.application_status,.event-badge.job_invite{background:#08854d}
    .event-badge.like svg{display:none}.event-badge.like::before{content:"♥";font-size:18px;line-height:1}
    .copy{align-self:center;min-width:0;padding:1px 0}.text{font-size:14px;line-height:1.34;overflow-wrap:anywhere}.text strong{font-weight:750}.time{font-size:12px;color:var(--muted);margin-top:3px}.unread .time{color:#0866ff;font-weight:650}.detail{display:block;color:#65676b;margin-top:3px;font-size:13px}
    .actions{display:flex;gap:8px;margin-top:10px}.action-btn{height:38px;min-width:104px;border:0;border-radius:8px;background:#e4e6eb;font-weight:700;cursor:pointer;padding:0 18px}.action-btn.primary{background:#0866ff;color:#fff}.action-btn:disabled{opacity:.6;cursor:default}.action-result{margin-top:8px;color:#65676b;font-size:13px;font-weight:650;text-transform:capitalize}
    .more{align-self:start;width:34px;height:34px;background:transparent;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}.more:hover{background:rgba(0,0,0,.08)}.more svg{width:19px;height:19px;fill:currentColor}
    .sheet-backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:.2s}.sheet-backdrop.open{opacity:1;visibility:visible}
    .menu{position:fixed;z-index:60;left:50%;bottom:0;width:min(calc(100% - 16px),560px);max-height:min(78vh,620px);overflow:auto;background:#f8fafc;border:1px solid rgba(15,23,42,.08);border-radius:20px 20px 0 0;box-shadow:0 -12px 36px rgba(15,23,42,.18);padding:7px 10px max(13px,env(safe-area-inset-bottom));transform:translate(-50%,105%);visibility:hidden;transition:transform .24s ease,visibility .24s}.menu.open{transform:translate(-50%,0);visibility:visible}.sheet-handle{width:38px;height:4px;border-radius:99px;background:#94a3b8;margin:2px auto 10px}.sheet-heading{font-size:16px;font-weight:800;margin:0 4px 8px;color:#172033}.sheet-preview{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;text-align:left;padding:9px 10px;margin-bottom:7px;border:1px solid #e4eaf2;border-radius:13px;background:linear-gradient(135deg,#fff,#f2f7ff);color:#526071}.sheet-preview img{width:42px;height:42px;border-radius:12px;object-fit:cover;margin:0}.sheet-preview p{margin:0;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.sheet-actions{display:grid;gap:3px}.menu button{width:100%;border:0;background:transparent;border-radius:11px;text-align:left;padding:8px;font-weight:650;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;color:#172033}.menu button:hover{background:#edf2f7}.menu button.danger{color:#b42318}.sheet-icon{width:38px;height:38px;border-radius:11px;background:#e9eef5;color:#344054;display:grid;place-items:center}.sheet-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.sheet-copy strong{display:block;font-size:14px;line-height:1.2}.sheet-copy small{display:block;color:#667085;font-size:11.5px;line-height:1.25;margin-top:2px;font-weight:400}.report-title{font-size:18px;text-align:left;margin:2px 6px 3px}.report-help{text-align:left;color:#667085;font-size:12px;margin:0 6px 10px}.report-reasons{display:grid;gap:3px}.report-reasons label{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;font-size:13px;cursor:pointer}.report-reasons label:hover{background:#edf2f7}.report-reasons input{accent-color:#0a66c2;width:16px;height:16px}.report-details{width:100%;min-height:72px;margin-top:8px;border:1px solid #d0d5dd;border-radius:10px;padding:9px;font-size:13px;resize:vertical}.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.report-actions button{display:block;text-align:center;padding:9px;background:#e4e7ec}.report-actions .primary{background:#0a66c2;color:#fff}
    .empty{padding:70px 24px;text-align:center;color:#65676b}.empty-icon{width:76px;height:76px;border-radius:50%;background:#e7f3ff;color:#0866ff;display:grid;place-items:center;margin:0 auto 16px}.empty-icon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2}.empty h2{color:#050505;font-size:20px;margin:0 0 7px}.skeleton{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:12px 16px}.skel{background:linear-gradient(90deg,#eee 25%,#f7f7f7 37%,#eee 63%);background-size:400% 100%;animation:shine 1.35s infinite;border-radius:8px}.skel.avatar-s{width:68px;height:68px;border-radius:50%}.skel.line{height:14px;margin:8px 0}.skel.line.short{width:45%}@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
    .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:80;background:#242526;color:#fff;padding:12px 17px;border-radius:8px;box-shadow:var(--shadow);font-size:14px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:640px){html,body{background:#fff}.app{width:100%;box-shadow:none}.header{padding-left:12px;padding-right:12px}.header h1{font-size:25px}.notification{grid-template-columns:52px minmax(0,1fr) 34px;gap:9px;padding:9px 8px 9px 12px}.avatar-wrap,.avatar{width:52px;height:52px}.event-badge{width:24px;height:24px}.text{font-size:13.5px}.actions{display:grid;grid-template-columns:1fr 1fr}.action-btn{min-width:0;width:100%}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-row">
        <button class="round-btn" id="backBtn" aria-label="Go back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <h1>Notifications</h1>
        <button class="round-btn" id="searchBtn" aria-label="Search notifications"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <div class="header-tools">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="unread">Unread</button>
        <button class="mark-all" id="markAllBtn">Mark all as read</button>
      </div>
      <div class="search-panel" id="searchPanel"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" type="search" placeholder="Search notifications" autocomplete="off"></div>
    </header>
    <div class="summary"><span id="summaryText">Loading notifications…</span></div>
    <section id="notificationList" aria-live="polite"></section>
  </main>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="menu" id="notificationMenu" role="dialog" aria-modal="true" aria-label="Notification options"></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const API="https://backend-1-9b6f.onrender.com";
    const FALLBACK="https://cdn-icons-png.flaticon.com/512/149/149071.png";
    const state={items:[],filter:"all",query:"",menuId:null,socket:null,poll:null,locallyRead:new Set()};
    const $=id=>document.getElementById(id);
    try{state.locallyRead=new Set(JSON.parse(localStorage.getItem("aiftReadNotificationIds")||"[]").map(String))}catch{state.locallyRead=new Set()}
    function rememberRead(id,read=true){id=String(id||"");if(!id)return;if(read)state.locallyRead.add(id);else state.locallyRead.delete(id);const recent=Array.from(state.locallyRead).slice(-500);state.locallyRead=new Set(recent);localStorage.setItem("aiftReadNotificationIds",JSON.stringify(recent))}
    function session(){for(const key of ["talentToken","employerToken","adminToken","agentToken","teacherToken","studentToken","schoolToken","familyToken","token"]){const token=localStorage.getItem(key);if(token)return{token};}return null}
    if(!session())location.replace("login.html");
    const headers=()=>({"Content-Type":"application/json",Authorization:`Bearer ${session()?.token||""}`});
    function esc(value=""){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
    function attr(value=""){return esc(value)}
    function actorName(item){return item.sender?.companyName||item.sender?.schoolName||item.sender?.name||item.title||"AIFT"}
    function actorImage(item){return item.image||item.sender?.profileImage||item.sender?.logo||FALLBACK}
    function accountRole(){return String(localStorage.getItem("role")||"").toLowerCase()}
    function notificationId(item,...keys){for(const key of keys){const value=item?.metadata?.[key]??(key==="entityId"?item?.entityId:null);if(value)return String(value?._id||value)}return""}
    function profileDestination(user={}){const id=String(user?._id||user?.id||"");if(!id)return"notifications.html";const role=String(user.role||"").toLowerCase(),page=role==="student"?"student-public-profile.html":role==="teacher"?"teacher-public-profile.html":role==="school"?"school-public-profile.html":role==="employer"?"employer-public-profile.html":"agent-public-profile.html";return`${page}?id=${encodeURIComponent(id)}`}
    function notificationDestination(item){const type=String(item?.type||""),metadata=item?.metadata||{},entity=notificationId(item,"entityId"),conversation=notificationId(item,"conversationId"),post=notificationId(item,"postId")||(String(item?.entityType||"").toLowerCase()==="post"?entity:""),story=notificationId(item,"storyId"),group=notificationId(item,"groupId")||(String(item?.entityType||"").toLowerCase()==="group"?entity:""),job=notificationId(item,"jobId","opportunityId"),assignment=notificationId(item,"assignmentId"),submission=notificationId(item,"submissionId"),meeting=notificationId(item,"meetingId"),venture=notificationId(item,"ventureId")||(String(item?.entityType||"").toLowerCase()==="venture"?entity:""),review=notificationId(item,"reviewId","reviewCaseId"),role=accountRole();const supplied=String(item?.link||"").trim();if(supplied&&!/^\/?(?:home|index)\.html(?:[?#]|$)/i.test(supplied)&&!/^\/?job\.html(?:[?#]|$)/i.test(supplied))return supplied;if(["message","message_reaction","missed_call"].includes(type))return`messages.html${conversation?`?conversation=${encodeURIComponent(conversation)}`:""}`;if(["group_invite","group_update"].includes(type))return group?`group.html?id=${encodeURIComponent(group)}`:"groups.html";if(type==="follow")return profileDestination(item.sender);if(["like","comment","comment_reply","post_share","post_mention"].includes(type))return post?`feed.html?post=${encodeURIComponent(post)}`:"feed.html";if(["story_mention","story_like","story_reply"].includes(type))return`messages.html${story?`?story=${encodeURIComponent(story)}`:""}`;if(type==="application")return`employer.html?tab=pipeline${entity?`&applicationId=${encodeURIComponent(entity)}`:""}`;if(["application_status","application_follow_up","interview","offer"].includes(type))return`my-applications.html${entity?`?applicationId=${encodeURIComponent(entity)}`:""}`;if(["job_invite","job_update"].includes(type))return job?`job-details.html?id=${encodeURIComponent(job)}`:"jobs.html";if(["assignment","assignment_updated"].includes(type))return`student.html?section=assignments${assignment?`&assignmentId=${encodeURIComponent(assignment)}`:""}`;if(type==="submission")return`teacher.html?section=submissions${submission?`&submissionId=${encodeURIComponent(submission)}`:""}`;if(type==="submission_reviewed")return`student.html?section=assignments${assignment?`&assignmentId=${encodeURIComponent(assignment)}`:""}`;if(type==="attendance")return"student.html?section=attendance";if(["class_update","announcement"].includes(type))return metadata.classId?`class-view.html?classId=${encodeURIComponent(metadata.classId)}`:(role==="teacher"?"teacher.html?section=classes":"student.html?section=classes");if(type==="meeting")return meeting?`meeting.html?id=${encodeURIComponent(meeting)}`:"messages.html";if(type==="task")return"agent.html?tab=tasks";if(type==="team_update")return"employer.html?tab=team";if(type==="family_link_request")return`student.html?section=notifications${metadata.requestId?`&familyLinkRequest=${encodeURIComponent(metadata.requestId)}`:""}`;if(["family_link_accepted","family_link_declined","family_link_revoked"].includes(type))return"family.html";if(type==="student_identity")return"student.html?section=portfolio";if(type==="venture")return venture?`venture.html?id=${encodeURIComponent(venture)}`:(role==="family"?"family.html":"student.html?section=career&focus=ventures");if(type==="scholarship")return role==="school"?"school.html?section=career":"student.html?section=career&focus=scholarships";if(type==="opportunity")return job?`job-details.html?id=${encodeURIComponent(job)}`:(role==="employer"?"employer.html?tab=career":"student.html?section=career");if(type==="review_case"){if(venture)return`venture.html?id=${encodeURIComponent(venture)}`;if(metadata.dealRoomId)return`deal-room.html?id=${encodeURIComponent(metadata.dealRoomId)}`;return role==="admin"?`admin.html?section=review-center${review?`&reviewId=${encodeURIComponent(review)}`:""}`:role==="family"?"family.html":role==="school"?"school.html?section=career":role==="employer"?"employer.html?tab=career":"student.html?section=career"}return"notifications.html"}
    function bodyText(item){let text=String(item.text||item.message||"You have a new notification").trim(),name=actorName(item);if(text.toLowerCase().startsWith(name.toLowerCase()))text=text.slice(name.length).trim();return text.replace(/\ba investment\b/gi,"an investment").replace(/\bis now negotiation\b/gi,"is now under negotiation").replace(/\bis now under_review\b/gi,"is now under review").replaceAll("_"," ")}
    function timeAgo(value){const time=new Date(value).getTime();if(!Number.isFinite(time))return"";const seconds=Math.max(0,Math.floor((Date.now()-time)/1000));if(seconds<60)return"Just now";if(seconds<3600)return`${Math.floor(seconds/60)}m`;if(seconds<86400)return`${Math.floor(seconds/3600)}h`;if(seconds<604800)return`${Math.floor(seconds/86400)}d`;if(seconds<31536000)return new Date(time).toLocaleDateString(undefined,{month:"short",day:"numeric"});return new Date(time).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
    function icon(type){const icons={like:'<path d="M7 10v11H3V10h4Zm2 11V10l4-7c1.5 0 2.5 1.3 2 2.8L14 10h6c1.4 0 2.4 1.3 2 2.7l-2 7A2 2 0 0 1 18 21H9Z"/>',story_like:'<path d="M12 21S3 16 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 7-9 12-9 12Z"/>',follow:'<path d="M15 20a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8m9 5v6m3-3h-6" fill="none"/>',group_invite:'<path d="M15 20a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8m9 5v6m3-3h-6" fill="none"/>',comment:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',comment_reply:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',message:'<path d="M21 14a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v7Z"/>',missed_call:'<path d="M6 3 3 6c0 8 7 15 15 15l3-3-5-4-2 2c-3-1-5-3-6-6l2-2-4-5Z" fill="none"/>',assignment:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',submission:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',submission_reviewed:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4" fill="none"/>',application:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',application_status:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',job_invite:'<path d="M4 7h16v13H4zM8 7V4h8v3" fill="none"/>',story_mention:'<path d="M5 3h14v18H5zM9 17h6" fill="none"/>',story_reply:'<path d="M5 3h14v18H5zM9 17h6" fill="none"/>'};return`<svg viewBox="0 0 24 24">${icons[type]||'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none"/>'}</svg>`}
    function hasActions(item){return item.actionState==="pending"&&Array.isArray(item.metadata?.actions)&&item.metadata.actions.length}
    function actionMarkup(item){if(!hasActions(item))return item.actionState?`<div class="action-result">${esc(item.actionState)}</div>`:"";return`<div class="actions"><button class="action-btn primary" data-action="accept" data-id="${attr(item._id)}">Accept</button><button class="action-btn" data-action="decline" data-id="${attr(item._id)}">Decline</button></div>`}
    function itemMarkup(item){const type=item.type||"system";return`<article class="notification ${item.read?"":"unread"}" data-id="${attr(item._id)}" tabindex="0" role="button"><div class="avatar-wrap"><img class="avatar" src="${attr(actorImage(item))}" alt="" onerror="this.src='${FALLBACK}'"><span class="event-badge ${attr(type)}">${icon(type)}</span></div><div class="copy"><div class="text"><strong>${esc(actorName(item))}</strong> ${esc(bodyText(item))}</div>${item.metadata?.detail?`<span class="detail">${esc(item.metadata.detail)}</span>`:""}<div class="time">${esc(timeAgo(item.createdAt))}</div>${actionMarkup(item)}</div><button class="more" data-menu="${attr(item._id)}" aria-label="Notification options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></article>`}
    function filtered(){return state.items.filter(item=>(state.filter!=="unread"||!item.read)&&(!state.query||`${actorName(item)} ${bodyText(item)} ${item.type}`.toLowerCase().includes(state.query)))}
    function render(){const list=filtered(),unreadCount=state.items.filter(item=>!item.read).length;$("summaryText").textContent=`${unreadCount} unread · ${state.items.length} total`;if(!list.length){$("notificationList").innerHTML=`<div class="empty"><div class="empty-icon">${icon("system")}</div><h2>${state.query?"No matching notifications":state.filter==="unread"?"You're all caught up":"No notifications yet"}</h2><p>${state.query?"Try a different search.":"Your latest AIFT activity will appear here."}</p></div>`;return}const heading=state.filter==="unread"||list.some(item=>!item.read)?"New":"Earlier";$("notificationList").innerHTML=`<h2 class="section-title">${heading}</h2>${list.map(itemMarkup).join("")}`}
    function skeleton(){$("notificationList").innerHTML=Array.from({length:6},()=>'<div class="skeleton"><div class="skel avatar-s"></div><div><div class="skel line"></div><div class="skel line"></div><div class="skel line short"></div></div></div>').join("")}
    async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{...headers(),...(options.headers||{})}});if(response.status===401||response.status===403){location.replace("login.html");throw new Error("Session expired")}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Request failed");return data}
    async function load({quiet=false}={}){if(!quiet)skeleton();try{const query=new URLSearchParams({limit:"250"});state.items=await api(`/api/notifications?${query}`);state.items.forEach(item=>{if(state.locallyRead.has(String(item._id)))item.read=true});render();const savedScroll=Number(sessionStorage.getItem("aiftNotificationScrollY"));if(Number.isFinite(savedScroll)&&savedScroll>=0){requestAnimationFrame(()=>scrollTo(0,savedScroll));sessionStorage.removeItem("aiftNotificationScrollY")}api("/api/notifications/seen-all",{method:"PATCH"}).catch(()=>{})}catch(error){toast(error.message);if(!quiet)$("notificationList").innerHTML='<div class="empty"><h2>Couldn’t load notifications</h2><p>Please check your connection and try again.</p></div>'}}
    async function updateRead(id,read){const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;const previous=item.read;item.read=read;rememberRead(id,read);render();try{await api(`/api/notifications/${encodeURIComponent(id)}/${read?"read":"unread"}`,{method:"PATCH"})}catch(error){item.read=previous;rememberRead(id,previous);render();toast(error.message)}}
    async function openItem(id){const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;if(!item.read)await updateRead(id,true);const destination=notificationDestination(item);if(destination&&destination!=="notifications.html")safeNavigate(destination);else toast("This notification has no additional page to open")}
    function safeNavigate(link){try{const url=new URL(String(link),location.origin);if(url.origin!==location.origin)return toast("This link is unavailable");sessionStorage.setItem("aiftNotificationScrollY",String(scrollY));location.href=url.pathname.replace(/^\//,"")+url.search+url.hash}catch{toast("This notification link is unavailable")}}
    async function markAll(){const unread=state.items.filter(item=>!item.read);if(!unread.length)return toast("No unread notifications");unread.forEach(item=>item.read=true);render();try{await api("/api/notifications/read-all",{method:"PATCH"});toast("All notifications marked as read")}catch(error){await load({quiet:true});toast(error.message)}}
    async function removeItem(id){const index=state.items.findIndex(item=>String(item._id)===String(id));if(index<0)return;const [removed]=state.items.splice(index,1);render();closeMenu();try{await api(`/api/notifications/${encodeURIComponent(id)}`,{method:"DELETE"});toast("Notification removed")}catch(error){state.items.splice(index,0,removed);render();toast(error.message)}}
    async function runAction(id,action){const buttons=document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-action]`);buttons.forEach(button=>button.disabled=true);try{const result=await api(`/api/notifications/${encodeURIComponent(id)}/action`,{method:"POST",body:JSON.stringify({action})});const item=state.items.find(entry=>String(entry._id)===String(id));if(item){item.actionState=result.actionState;item.read=true}render();toast(action==="accept"?"Accepted":"Declined");if(action==="accept"&&result.link)setTimeout(()=>safeNavigate(result.link),350)}catch(error){buttons.forEach(button=>button.disabled=false);toast(error.message)}}
    function topicLabel(type){return({story_like:"story likes",story_reply:"story replies",story_mention:"story mentions",like:"post likes",comment:"post comments",comment_reply:"comment replies",message:"messages",missed_call:"missed calls",group_invite:"group invitations",group_update:"group updates",application:"job applications",application_status:"application updates",job_invite:"job invitations",assignment:"assignments",submission:"student submissions",submission_reviewed:"submission reviews",review_case:"AIFT reviews",venture:"ventures",scholarship:"scholarships",opportunity:"opportunities"})[type]||String(type||"this activity").replaceAll("_"," ")}
    function sheetIcon(kind){const icons={more:'<path d="M12 20V4m-6 6 6-6 6 6"/>',less:'<path d="M12 4v16m6-6-6 6-6-6"/>',delete:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="m9 9 6 6m0-6-6 6"/>',mute:'<path d="M5 8h14v12H5zM8 8V5h8v3m-4 4v4m-2-2h4"/>',report:'<path d="M5 4h14v13H9l-4 3V4Zm7 4v4m0 2h.01"/>',back:'<path d="m15 18-6-6 6-6"/>'};return`<span class="sheet-icon"><svg viewBox="0 0 24 24">${icons[kind]||icons.report}</svg></span>`}
    function openMenu(id){state.menuId=id;const item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;const menu=$("notificationMenu"),preview=`${actorName(item)} ${bodyText(item)}`;menu.innerHTML=`<div class="sheet-handle"></div><h2 class="sheet-heading">Notification controls</h2><div class="sheet-preview"><img src="${attr(actorImage(item))}" alt=""><p>${esc(preview)}</p></div><div class="sheet-actions"><button data-command="more">${sheetIcon("more")}<span class="sheet-copy"><strong>Prioritize similar updates</strong><small>Place more ${esc(topicLabel(item.type))} in your notification feed.</small></span></button><button data-command="less">${sheetIcon("less")}<span class="sheet-copy"><strong>Reduce similar updates</strong><small>Show fewer notifications like this one.</small></span></button><button class="danger" data-command="remove">${sheetIcon("delete")}<span class="sheet-copy"><strong>Remove notification</strong></span></button><button data-command="mute">${sheetIcon("mute")}<span class="sheet-copy"><strong>Mute ${esc(topicLabel(item.type))}</strong><small>Stop this category until you enable it again.</small></span></button><button data-command="report">${sheetIcon("report")}<span class="sheet-copy"><strong>Send feedback to AIFT</strong><small>Report incorrect, unwanted or broken notifications.</small></span></button></div>`;$("sheetBackdrop").classList.add("open");menu.classList.add("open");document.body.style.overflow="hidden"}
    function closeMenu(){$("notificationMenu").classList.remove("open");$("sheetBackdrop").classList.remove("open");document.body.style.overflow="";state.menuId=null}
    async function saveFeedback(direction){const id=state.menuId;try{await api(`/api/notifications/${encodeURIComponent(id)}/feedback`,{method:"POST",body:JSON.stringify({direction})});closeMenu();toast(direction==="more"?"We'll show you more notifications like this":"We'll show you fewer notifications like this")}catch(error){toast(error.message)}}
    async function muteType(){const id=state.menuId,item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;try{await api(`/api/notifications/${encodeURIComponent(id)}/mute-type`,{method:"POST"});state.items=state.items.filter(entry=>entry.type!==item.type);closeMenu();render();toast(`Notifications about ${topicLabel(item.type)} are turned off`)}catch(error){toast(error.message)}}
    function openReport(){const id=state.menuId,item=state.items.find(entry=>String(entry._id)===String(id));if(!item)return;const menu=$("notificationMenu");menu.innerHTML=`<div class="sheet-handle"></div><h2 class="report-title">Report notification issue</h2><p class="report-help">Tell the AIFT Notifications Team what is wrong with this notification.</p><div class="report-reasons">${[["not_relevant","Not relevant"],["misleading","Misleading"],["spam","Spam"],["offensive","Offensive"],["technical_issue","Technical issue"],["other","Something else"]].map(([value,label])=>`<label><input type="radio" name="reportReason" value="${value}" ${value==="technical_issue"?"checked":""}>${label}</label>`).join("")}</div><textarea class="report-details" id="reportDetails" maxlength="1000" placeholder="Add details (optional)"></textarea><div class="report-actions"><button data-command="cancel-report">Cancel</button><button class="primary" data-command="submit-report">Submit report</button></div>`}
    async function submitReport(){const id=state.menuId,reason=document.querySelector('input[name="reportReason"]:checked')?.value||"technical_issue",details=$("reportDetails")?.value||"";try{await api(`/api/notifications/${encodeURIComponent(id)}/report`,{method:"POST",body:JSON.stringify({reason,details})});closeMenu();toast("Report sent to the Notifications Team")}catch(error){toast(error.message)}}
    function toast(message){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),2400)}
    function currentUserId(){try{const payload=JSON.parse(atob((session()?.token||"").split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return payload.id||payload._id||payload.userId}catch{return localStorage.getItem("userId")}}
    function realtime(){const user=currentUserId(),authToken=session()?.token;if(!user||!authToken)return;state.socket=io(API,{auth:{token:authToken},transports:["websocket","polling"]});state.socket.on("connect",()=>state.socket.emit("join",{userId:user,token:authToken}));["newNotification","notification_created","notificationUpdated","notificationRemoved","notificationsRead","application_created","application_status_updated","job_invite_created","assignment:new","submission:new","submission:reviewed","callLogUpdated"].forEach(event=>state.socket.on(event,()=>load({quiet:true})));state.poll=setInterval(()=>{if(!document.hidden)load({quiet:true})},30000)}
    $("backBtn").onclick=()=>history.length>1?history.back():location.assign("home.html");
    $("searchBtn").onclick=()=>{$("searchPanel").classList.toggle("open");if($("searchPanel").classList.contains("open"))$("searchInput").focus()};
    $("searchInput").oninput=event=>{state.query=event.target.value.trim().toLowerCase();render()};
    $("markAllBtn").onclick=markAll;
    document.querySelectorAll(".filter").forEach(button=>button.onclick=()=>{state.filter=button.dataset.filter;document.querySelectorAll(".filter").forEach(item=>item.classList.toggle("active",item===button));render()});
    $("notificationList").onclick=event=>{const action=event.target.closest("[data-action]");if(action){event.stopPropagation();return runAction(action.dataset.id,action.dataset.action)}const menu=event.target.closest("[data-menu]");if(menu){event.stopPropagation();return openMenu(menu.dataset.menu,menu)}const item=event.target.closest(".notification");if(item)openItem(item.dataset.id)};
    $("notificationList").onkeydown=event=>{if((event.key==="Enter"||event.key===" ")&&!event.target.closest("button")){event.preventDefault();openItem(event.target.closest(".notification")?.dataset.id)}};
    $("notificationMenu").onclick=event=>{const command=event.target.closest("[data-command]")?.dataset.command;if(!command||!state.menuId)return;if(command==="more")saveFeedback("more");else if(command==="less")saveFeedback("less");else if(command==="remove")removeItem(state.menuId);else if(command==="mute")muteType();else if(command==="report")openReport();else if(command==="cancel-report")closeMenu();else if(command==="submit-report")submitReport()};
    $("sheetBackdrop").onclick=closeMenu;
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&state.menuId)closeMenu()});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)load({quiet:true})});
    window.addEventListener("pageshow",event=>{if(event.persisted)load({quiet:true})});
    window.addEventListener("beforeunload",()=>{clearInterval(state.poll);state.socket?.disconnect()});
    load().then(realtime);
  </script>
