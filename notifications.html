<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | AIFT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f3f2ef;
}

.header{
  background:white;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.logo{
  font-weight:800;
  font-size:20px;
}

.container{
  max-width:800px;
  margin:40px auto;
}

.card{
  background:white;
  border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  overflow:hidden;
  padding:0;
}
  .header button{
  background:#0a66c2;
  color:white;
  border:none;
  border-radius:20px;
  padding:6px 14px;
  cursor:pointer;
  font-size:13px;
  transition:0.2s;
}

.header button:hover{
  background:#004182;
}

.notification{
  padding:14px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
  transition:0.2s;
  border-radius:10px;
  margin-bottom:6px;
}

.notification:hover{
  background:#f3f6f8;
  transform:scale(1.01);
}

.notification.unread{
  background:#e8f0fe;
  border-left:4px solid #0a66c2;
}


.notification-content{
  flex:1;
}

.notification-name{
  font-weight:600;
  font-size:14px;
}

.notification-message{
  font-size:13px;
  color:#555;
  margin-top:2px;
}

.notification-time{
  font-size:11px;
  color:#888;
  margin-top:4px;
}

.notification-dot{
  width:8px;
  height:8px;
  background:#0a66c2;
  border-radius:50%;
  margin-top:6px;
}

.notification img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.empty{
  text-align:center;
  padding:40px;
  color:#6f6f6f;
}
  .notification{
  animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(0.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
</style>
</head>

<body>

<div class="header">

  <div style="display:flex;align-items:center;gap:10px;">
    <div style="font-size:20px;">🔔</div>
    <div class="logo">Notifications</div>
  </div>

  <div style="display:flex;gap:10px;">
    <button onclick="markAllRead()">Mark all as read</button>
    <button onclick="window.location.href='talent.html'">⬅ Back</button>
  </div>

</div>

<div class="container">
  <div class="card">
    <div style="
padding:16px;
font-weight:600;
border-bottom:1px solid #eee;
">
All Notifications
</div>
    <div id="notificationList"></div>
  </div>
</div>

<script>
const API="https://backend-1-9b6f.onrender.com";
const token=localStorage.getItem("token");

if(!token){
  window.location.href="login.html";
}

/* LOAD NOTIFICATIONS */
async function loadNotifications(){

  const res = await fetch(API+"/api/notifications",{
    headers:{ Authorization:"Bearer "+token }
  });

  const notifications = res.ok ? await res.json() : [];

  const container = document.getElementById("notificationList");
  container.innerHTML="";

  if(notifications.length === 0){
    container.innerHTML = `
  <div class="empty">
    <div style="font-size:40px;">🔔</div>
    <div style="margin-top:10px;">You're all caught up</div>
    <div style="font-size:13px;margin-top:5px;">
      No new notifications right now
    </div>
  </div>
`;
    return;
  }

notifications.forEach(n => {

  container.innerHTML += `
    <div class="notification ${n.read ? '' : 'unread'}"
         onclick="handleNotification('${n._id}','${n.link || ''}')">

      <img src="${n.sender?.profileImage || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">

      <div class="notification-content">

        <div class="notification-name">
          ${n.sender?.name || 'AIFT'}
        </div>

        <div class="notification-message">
          ${n.message}
        </div>

        <div class="notification-time">
          ${formatTime(n.createdAt)}
        </div>

      </div>

      ${!n.read ? `<div class="notification-dot"></div>` : ""}

    </div>
  `;
});
}

/* MARK AS READ + REDIRECT */
async function handleNotification(id, link){

  await fetch(API+"/api/notifications/"+id+"/read",{
    method:"PATCH",
    headers:{ Authorization:"Bearer "+token }
  });

  if(link){
    window.location.href = link;
  } else {
    loadNotifications();
  }
}
  function formatTime(date){

  const diff = Math.floor((Date.now() - new Date(date)) / 1000);

  if(diff < 60) return "Just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";

  return new Date(date).toLocaleDateString();
}
  async function markAllRead(){

  await fetch(API+"/api/notifications/read-all",{
    method:"PATCH",
    headers:{ Authorization:"Bearer "+token }
  });

  loadNotifications();

}

document.addEventListener("DOMContentLoaded", loadNotifications);
</script>

</body>
</html>
