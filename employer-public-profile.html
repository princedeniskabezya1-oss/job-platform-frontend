<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIFT | Company Profile</title>
  <meta name="description" content="Public employer company profile on AIFT with jobs, posts, people, and company details." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root{--primary:#2557a7;--linkedin:#0a66c2;--bg:#f3f2ef;--card:#fff;--text:#191919;--muted:#666;--line:#d9d9d9;--soft:#f7f9fb;--green:#057642;--danger:#b91c1c;--max:1180px;--shadow:0 1px 2px rgba(0,0,0,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);font-size:14px;line-height:1.45}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}img{display:block;max-width:100%}.container{width:min(var(--max),calc(100% - 24px));margin:auto}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #ddd}.top-inner{height:64px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.brand-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#4f8df9);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.top-search{position:relative;flex:1;max-width:360px}.top-search input{width:100%;height:38px;border-radius:8px;border:1px solid #ccd6e0;background:#eef3f8;padding:0 14px 0 38px;outline:none}.top-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#666}.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}.top-link,.icon-btn{border:0;background:#fff;color:#555;cursor:pointer;border-radius:8px;min-width:70px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;position:relative}.top-link svg,.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}.top-link:hover,.icon-btn:hover{background:#f3f6f8;color:#111}.top-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid #ddd}.badge{position:absolute;top:4px;right:16px;min-width:17px;height:17px;padding:0 5px;border-radius:20px;background:#cc1016;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}.signin-btn{border:0;background:var(--primary);color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;cursor:pointer}.copy-btn{border:1px solid #c9daf8;background:#eef4ff;color:#174ea6;border-radius:22px;padding:10px 16px;font-weight:700;cursor:pointer}
    .page{padding:16px 0 36px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.profile-card,.side-card,.content-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.cover{height:190px;background:#e8edf3;border-bottom:1px solid var(--line)}.cover.has-cover{background-size:cover;background-position:center}.profile-main{position:relative;padding:0 24px 20px}.avatar-wrap{width:112px;height:112px;border-radius:12px;background:#fff;border:4px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);margin-top:-56px;overflow:hidden}.avatar-wrap img{width:100%;height:100%;object-fit:cover}.name-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.company-name{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0;color:#111}.verified{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:12px;font-weight:700}.verified svg{width:15px;height:15px;fill:currentColor}.headline{margin:4px 0 0;color:#333;font-size:14px;max-width:760px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#666;font-size:13px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border-radius:22px;padding:9px 18px;font-weight:700;cursor:pointer;border:1px solid var(--linkedin);background:#fff;color:var(--linkedin)}.btn.primary{background:var(--linkedin);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.gray{border-color:#bbb;color:#333}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #eee}.stat{padding:14px 18px;border-right:1px solid #eee}.stat:last-child{border-right:0}.stat b{display:block;font-size:20px;color:#111}.stat span{font-size:12px;color:#666;font-weight:600}.tabs{display:flex;gap:0;border-top:1px solid #eee;overflow:auto}.tab{border:0;background:#fff;padding:14px 18px;font-weight:700;color:#555;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--green);border-bottom-color:var(--green)}
    .main-content{margin-top:12px}.section{display:none}.section.active{display:block}.section-title{font-size:20px;margin:0 0 14px;font-weight:700}.content-card{padding:20px;margin-bottom:12px}.story{font-size:14px;color:#333;white-space:pre-wrap;line-height:1.65}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.detail{border:1px solid #eee;border-radius:8px;padding:12px;background:#fff}.detail .k{font-size:12px;color:#666;font-weight:700;margin-bottom:4px}.detail .v{font-weight:600;color:#222;word-break:break-word}.job-list,.people-list{display:grid;gap:12px}.job{border:1px solid #ddd;border-radius:10px;background:#fff;padding:16px}.job h3{font-size:16px;margin:0 0 5px}.job .jmeta{color:#666;font-size:13px;margin-bottom:10px}.job p{color:#444;font-size:14px;margin:0 0 12px;line-height:1.55}.people-list{grid-template-columns:repeat(2,minmax(0,1fr))}.person{border:1px solid #ddd;border-radius:10px;background:#fff;padding:14px;display:flex;gap:12px;align-items:flex-start}.person img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid #ddd}.person h3{font-size:14px;margin:0 0 3px}.person p{font-size:12px;color:#666;margin:0;line-height:1.4}.post-stream{background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible;padding:0}.post-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}.post-head{display:flex;gap:10px;padding:14px 16px 8px}.post-head img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid #ddd}.post-author{font-weight:700;font-size:14px}.post-meta{font-size:12px;color:#666}.post-body{padding:4px 16px 12px;white-space:pre-wrap;color:#222;line-height:1.55}.post-media img,.post-media video{width:100%;max-height:620px;object-fit:cover;background:#000}.post-stats{display:flex;justify-content:space-between;padding:9px 16px;color:#666;font-size:12px;border-bottom:1px solid #eee}.post-actions{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px}.post-action{border:0;background:#fff;border-radius:6px;color:#555;font-weight:700;cursor:pointer;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:6px}.post-action:hover{background:#f3f2ef}.post-action.liked{color:var(--linkedin)}.comments{border-top:1px solid #eee;padding:12px 16px;display:none}.comments.show{display:block}.comment-row{display:flex;gap:8px;margin-bottom:10px}.comment-row img{width:32px;height:32px;border-radius:50%;object-fit:cover}.comment-bubble{background:#f2f2f2;border-radius:14px;padding:8px 11px;flex:1}.comment-name{font-size:12px;font-weight:700}.comment-text{font-size:13px;white-space:pre-wrap}.comment-box{display:flex;gap:8px;margin-top:10px}.comment-box input{flex:1;border:1px solid #ddd;border-radius:22px;padding:10px 12px;outline:none}.comment-box button{border:0;background:var(--linkedin);color:#fff;border-radius:20px;padding:9px 14px;font-weight:700;cursor:pointer}
    .side-card{padding:16px;margin-bottom:12px}.side-title{font-size:16px;font-weight:700;margin:0 0 12px}.follow-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.follow-item:last-child{border-bottom:0}.follow-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid #ddd}.follow-item h4{font-size:13px;margin:0 0 2px}.follow-item p{font-size:12px;color:#666;margin:0}.small-btn{margin-top:8px;border:1px solid #777;background:#fff;border-radius:18px;padding:6px 12px;font-weight:700;cursor:pointer}.empty,.loading{padding:20px;text-align:center;color:#666;background:#fff;border:1px dashed #ddd;border-radius:10px}.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:2000;display:grid;gap:10px}.toast{background:#111;color:#fff;padding:12px 14px;border-radius:10px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast b{display:block;margin-bottom:3px}.toast.error{background:#7f1d1d}.toast.success{background:#14532d}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.right-col{display:none}.top-link span{display:none}.top-link,.icon-btn{min-width:42px;height:42px}.top-search{max-width:none}.stats{grid-template-columns:repeat(2,1fr)}.people-list{grid-template-columns:1fr}}
    @media(max-width:640px){.container{width:100%}.page{padding-top:0}.profile-card,.content-card,.post-card{border-radius:0;border-left:0;border-right:0}.side-card{border-radius:0}.cover{height:128px}.profile-main{padding:0 14px 16px}.avatar-wrap{width:82px;height:82px;margin-top:-41px;border-width:3px}.company-name{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:12px}.tab{padding:13px 15px}.top-inner{height:58px;padding:0 8px}.brand-logo{width:36px;height:36px}.copy-btn{display:none}.signin-btn{padding:8px 12px}.post-actions{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container top-inner">
      <a class="brand" href="employer.html"><div class="brand-logo">A</div></a>
      <div class="top-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="globalSearch" type="search" placeholder="Search company, jobs, posts..." /></div>
      <nav class="top-actions">
        <button class="top-link" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span>Home</span></button>
        <button class="top-link" onclick="goMessages()"><span class="badge" id="msgBadge">0</span><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>Messaging</span></button>
        <button class="top-link" onclick="goNotifications()"><span class="badge" id="notifBadge">0</span><svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg><span>Notifications</span></button>
        <button class="copy-btn" onclick="copyProfileLink()">Copy Link</button>
        <button class="signin-btn" id="signinBtn" onclick="goLogin()">Sign in</button>
        <img class="top-avatar hidden" id="viewerAvatar" alt="Me" />
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container layout">
      <section class="left-col">
        <article class="profile-card">
          <div id="cover" class="cover"></div>
          <div class="profile-main">
            <div class="avatar-wrap"><img id="companyAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Company logo" /></div>
            <div class="name-row"><h1 id="companyName" class="company-name">Company</h1><span class="verified"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 2.1 3.1-.3.9 3 2.8 1.5-1.5 2.8.3 3-3 .9L14.9 18 12 20l-2.9-2-3 .9-.3-3L3 13.9 3.9 11 2.4 8.2 5.2 6.7l.9-3 3.1.3L12 2zm-1.1 12.8l6-6-1.4-1.4-4.6 4.6-2.3-2.3-1.4 1.4 3.7 3.7z"/></svg>Verified</span></div>
            <p id="headline" class="headline">Company profile</p>
            <div class="meta"><span id="industryLine"></span><span id="locationLine"></span><span id="followersLine"></span></div>
            <div class="actions"><button id="followBtn" class="btn primary" onclick="followCompany()">+ Follow</button><button class="btn gray" onclick="messageCompany()">Message</button><button class="btn" onclick="openTab('jobs')">View jobs</button><button class="btn gray" onclick="visitWebsite()">Visit website</button></div>
          </div>
          <div class="stats"><div class="stat"><b id="statJobs">0</b><span>Open jobs</span></div><div class="stat"><b id="statPosts">0</b><span>Posts</span></div><div class="stat"><b id="statFollowers">0</b><span>Followers</span></div><div class="stat"><b id="statPeople">0</b><span>People</span></div></div>
          <div class="tabs"><button class="tab active" data-tab="overview" onclick="openTab('overview')">Overview</button><button class="tab" data-tab="jobs" onclick="openTab('jobs')">Jobs</button><button class="tab" data-tab="posts" onclick="openTab('posts')">Posts</button><button class="tab" data-tab="people" onclick="openTab('people')">People</button><button class="tab" data-tab="about" onclick="openTab('about')">About</button></div>
        </article>

        <div class="main-content">
          <section id="section-overview" class="section active">
            <article class="content-card"><h2 class="section-title">Company story</h2><div id="companyStory" class="story">Loading company details...</div><div class="detail-grid" id="overviewDetails"></div></article>
          </section>
          <section id="section-jobs" class="section"><article class="content-card"><h2 class="section-title">Open jobs</h2><div class="job-list" id="jobsList"><div class="loading">Loading jobs...</div></div></article></section>
          <section id="section-posts" class="section"><div class="post-stream" id="postsList"><div class="loading">Loading posts...</div></div></section>
          <section id="section-people" class="section"><article class="content-card"><h2 class="section-title">Associated people</h2><div class="people-list" id="peopleList"><div class="loading">Loading people...</div></div></article></section>
          <section id="section-about" class="section"><article class="content-card"><h2 class="section-title">Company details</h2><div class="detail-grid" id="aboutDetails"></div></article></section>
        </div>
      </section>

      <aside class="right-col">
        <section class="side-card"><h3 class="side-title">People also follow</h3><div id="alsoFollowList"><div class="loading">Loading suggestions...</div></div></section>
        <section class="side-card"><h3 class="side-title">Company information</h3><div id="sideInfo"></div></section>
      </aside>
    </div>
  </main>
  <div class="toast-wrap" id="toastWrap"></div>

<script>
const API="https://backend-1-9b6f.onrender.com";
const FALLBACK_AVATAR="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
const USER_AVATAR="https://cdn-icons-png.flaticon.com/512/149/149071.png";
const state={viewer:null,company:null,jobs:[],posts:[],people:[],suggestions:[],companyId:new URLSearchParams(location.search).get('id')||localStorage.getItem('userId')||'',website:'',following:false};
function token(){return localStorage.getItem('employerToken')||localStorage.getItem('talentToken')||localStorage.getItem('adminToken')||localStorage.getItem('agentToken')||localStorage.getItem('token')||''}
function headers(extra={}){const t=token();return t?{Authorization:`Bearer ${t}`,...extra}:{...extra}}
async function api(path,opts={}){const res=await fetch(`${API}${path}`,opts);let data=null;try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.message||data?.error||`Request failed ${res.status}`);return data}
function arr(x){return Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.users)?x.users:Array.isArray(x?.items)?x.items:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.jobs)?x.jobs:Array.isArray(x?.team)?x.team:[]}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function showToast(t,m,type=''){const box=document.createElement('div');box.className=`toast ${type}`;box.innerHTML=`<b>${esc(t)}</b><span>${esc(m||'')}</span>`;toastWrap.appendChild(box);setTimeout(()=>box.remove(),3500)}
function nameOf(u=state.company||{}){return u.companyName||u.name||u.fullName||u.businessName||'Company'}
function logoOf(u=state.company||{}){return u.profileImage||u.logo||u.companyLogo||u.avatar||FALLBACK_AVATAR}
function coverOf(u=state.company||{}){return u.coverImage||u.bannerImage||u.companyBanner||u.banner||''}
function storyOf(){const c=state.company||{};return c.companyStory||c.services||c.bio||c.about||c.description||'This company has not added a full story or services description yet.'}
function countFollowers(){const c=state.company||{};return Array.isArray(c.followers)?c.followers.length:Number(c.followersCount||c.followCount||0)||0}
function activeJobs(){return state.jobs.filter(j=>String(j.status||'active').toLowerCase()!=='closed')}
function set(id,v){const el=document.getElementById(id);if(el)el.textContent=v}
async function initViewer(){const signed=!!token();signinBtn.classList.toggle('hidden',signed);viewerAvatar.classList.toggle('hidden',!signed);if(!signed)return;try{const me=await api('/api/users/me',{headers:headers()});state.viewer=me?.user||me;viewerAvatar.src=state.viewer.profileImage||USER_AVATAR;loadUnread();}catch{}}
async function loadUnread(){try{const n=await api('/api/notifications/unread',{headers:headers()});const count=Number(n.count||n.unread||arr(n).length||0);if(count){notifBadge.style.display='flex';notifBadge.textContent=count>99?'99+':count}}catch{} }
async function loadCompany(){let data=null;if(state.companyId){try{data=await api(`/api/users/${state.companyId}/public`,{headers:headers()})}catch{}}if(!data&&token()){try{data=await api('/api/users/me',{headers:headers()})}catch{}}state.company=data?.user||data?.company||data||{};state.companyId=state.company._id||state.company.id||state.companyId;}
async function loadJobs(){try{let data=await api(state.companyId?`/api/jobs?employer=${state.companyId}`:'/api/jobs/my',{headers:headers()});state.jobs=arr(data).filter(j=>!state.companyId||String(j.employerId?._id||j.employerId||j.companyId||j.userId||'')===String(state.companyId)||String(j.company||'').toLowerCase()===nameOf().toLowerCase());if(!state.jobs.length&&token()){try{state.jobs=arr(await api('/api/jobs/my',{headers:headers()}))}catch{}}}catch{state.jobs=[]}}
async function loadPosts(){try{const data=await api('/api/posts',{headers:headers()});state.posts=arr(data).filter(p=>{const a=p.user||p.author||p.createdBy||{};const aid=a._id||a.id||p.userId||p.authorId||p.employerId;return !state.companyId||String(aid)===String(state.companyId)||String(a.name||'').toLowerCase()===nameOf().toLowerCase()})}catch{state.posts=[]}}
async function loadPeople(){try{const data=await api('/api/users/network',{headers:headers()});const users=arr(data);state.people=users.filter(u=>String(u.companyId?._id||u.companyId||u.employerId||'')===String(state.companyId)||String(u.company||'').toLowerCase()===nameOf().toLowerCase()).slice(0,24);state.suggestions=users.filter(u=>String(u._id||u.id)!==String(state.companyId)).slice(0,6)}catch{state.people=[];state.suggestions=[]}}
function renderHeader(){const c=state.company||{};document.title=`${nameOf()} | AIFT`;companyAvatar.src=logoOf();companyName.textContent=nameOf();headline.textContent=c.headline||c.tagline||c.industry||'Company profile';industryLine.textContent=c.industry||c.companyIndustry||'Industry not added';locationLine.textContent=c.location||c.address||'Location not added';followersLine.textContent=`${countFollowers()} followers`;const cover=coverOf();if(cover){document.getElementById('cover').classList.add('has-cover');document.getElementById('cover').style.backgroundImage=`url('${esc(cover)}')`}else{document.getElementById('cover').classList.remove('has-cover');document.getElementById('cover').style.backgroundImage='none'}state.website=safeUrl(c.website||c.companyWebsite||c.url||'');statJobs.textContent=activeJobs().length;statPosts.textContent=state.posts.length;statFollowers.textContent=countFollowers();statPeople.textContent=state.people.length||Number(c.teamCount||0)||0;const isFollowing=Array.isArray(c.followers)&&state.viewer&&c.followers.map(String).includes(String(state.viewer._id||state.viewer.id));state.following=!!isFollowing;followBtn.textContent=state.following?'Following':'+ Follow';followBtn.classList.toggle('gray',state.following);followBtn.classList.toggle('primary',!state.following);}
function safeUrl(u){if(!u)return'';u=String(u).trim();return /^https?:\/\//i.test(u)?u:`https://${u}`}
function renderOverview(){companyStory.textContent=storyOf();const c=state.company||{};overviewDetails.innerHTML=details([['Services',c.services||c.specialties||'Not added'],['Industry',c.industry||c.companyIndustry||'Not added'],['Company size',c.companySize||c.size||'Not added'],['Location',c.location||c.address||'Not added']]);sideInfo.innerHTML=details([['Website',state.website?`<a style="color:#0a66c2" href="${esc(state.website)}" target="_blank">Open website</a>`:'Not added'],['Open jobs',activeJobs().length],['Posts',state.posts.length],['Followers',countFollowers()]],true)}
function details(items,html=false){return items.map(([k,v])=>`<div class="detail"><div class="k">${esc(k)}</div><div class="v">${html?v:esc(v)}</div></div>`).join('')}
function renderJobs(){jobsList.innerHTML=activeJobs().length?activeJobs().map(j=>`<article class="job"><h3>${esc(j.title||'Untitled job')}</h3><div class="jmeta">${esc(j.location||'Location not added')} ${j.salary||j.salaryRange?'• '+esc(j.salary||j.salaryRange):''}</div><p>${esc(j.description||'No job description added yet.').slice(0,500)}</p><button class="btn primary" onclick="goLogin()">View / Apply</button></article>`).join(''):'<div class="empty">No open jobs yet.</div>'}
function renderPeople(){peopleList.innerHTML=state.people.length?state.people.map(u=>`<article class="person"><img src="${esc(u.profileImage||USER_AVATAR)}" alt=""><div><h3>${esc(u.name||u.fullName||'Member')}</h3><p>${esc(u.headline||u.role||u.teamRole||'Associated member')}</p></div></article>`).join(''):'<div class="empty">No associated people are public yet.</div>'}
function renderSuggestions(){alsoFollowList.innerHTML=state.suggestions.length?state.suggestions.map(u=>`<div class="follow-item"><img src="${esc(u.profileImage||USER_AVATAR)}" alt=""><div><h4>${esc(u.companyName||u.name||'Profile')}</h4><p>${esc(u.industry||u.headline||u.role||'AIFT profile')}</p><button class="small-btn" onclick="openOtherProfile('${esc(u._id||u.id||'')}')">+ Follow</button></div></div>`).join(''):'<div class="empty">No suggestions yet.</div>'}
function renderPosts(){postsList.innerHTML=state.posts.length?state.posts.map(p=>{const a=p.user||p.author||p.createdBy||state.company||{};const likes=Array.isArray(p.likes)?p.likes.length:Number(p.likesCount||0)||0;const comments=Array.isArray(p.comments)?p.comments.length:Number(p.commentsCount||0)||0;const pid=p._id||p.id;const liked=state.viewer&&Array.isArray(p.likes)&&p.likes.map(x=>String(x._id||x)).includes(String(state.viewer._id||state.viewer.id));const media=p.mediaUrl||p.image||p.video||'';const video=/video|\.mp4|\.webm|\.ogg/i.test(String(p.mediaType||media));return `<article class="post-card" ondblclick="likePost('${esc(pid)}')"><div class="post-head"><img src="${esc(a.profileImage||logoOf())}" alt=""><div><div class="post-author">${esc(a.name||nameOf())}</div><div class="post-meta">${esc(a.headline||'Company update')} · ${date(p.createdAt||p.date)}</div></div></div><div class="post-body">${esc(p.content||p.text||p.body||'')}</div>${media?`<div class="post-media">${video?`<video src="${esc(media)}" controls></video>`:`<img src="${esc(media)}" alt="Post media">`}</div>`:''}<div class="post-stats"><span id="likes-${esc(pid)}">${likes} likes</span><span>${comments} comments</span></div><div class="post-actions"><button class="post-action ${liked?'liked':''}" id="likebtn-${esc(pid)}" onclick="likePost('${esc(pid)}')">👍 Like</button><button class="post-action" onclick="toggleComments('${esc(pid)}')">💬 Comment</button><button class="post-action" onclick="sharePost('${esc(pid)}')">↗ Share</button><button class="post-action" onclick="messageCompany()">✉ Send</button></div><div class="comments" id="comments-${esc(pid)}"><div>${renderComments(p)}</div><div class="comment-box"><input id="commentInput-${esc(pid)}" placeholder="Add a comment..."><button onclick="addComment('${esc(pid)}')">Post</button></div></div></article>`}).join(''):'<div class="empty">No company posts yet.</div>'}
function renderComments(p){const list=Array.isArray(p.comments)?p.comments:[];return list.slice(-5).map(c=>{const u=c.user||c.author||{};return `<div class="comment-row"><img src="${esc(u.profileImage||USER_AVATAR)}" alt=""><div class="comment-bubble"><div class="comment-name">${esc(u.name||'Member')}</div><div class="comment-text">${esc(c.text||c.content||'')}</div></div></div>`}).join('')}
function renderAbout(){const c=state.company||{};aboutDetails.innerHTML=details([['Company',nameOf()],['Industry',c.industry||c.companyIndustry||'Not added'],['Location',c.location||c.address||'Not added'],['Website',state.website?`<a style="color:#0a66c2" href="${esc(state.website)}" target="_blank">${esc(state.website)}</a>`:'Not added'],['Email',c.email||c.contactEmail||'Hidden'],['Services',c.services||c.specialties||'Not added']],true)}
function renderAll(){renderHeader();renderOverview();renderJobs();renderPosts();renderPeople();renderSuggestions();renderAbout()}
function openTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('section-'+tab)?.classList.add('active');history.replaceState(null,'','#'+tab)}
async function followCompany(){if(!token())return goLogin();try{let data;try{data=await api(`/api/users/${state.companyId}/follow`,{method:'POST',headers:headers({'Content-Type':'application/json'})})}catch{data=await api(`/api/users/follow/${state.companyId}`,{method:'POST',headers:headers({'Content-Type':'application/json'})})}state.following=!state.following;followBtn.textContent=state.following?'Following':'+ Follow';followBtn.classList.toggle('gray',state.following);followBtn.classList.toggle('primary',!state.following);showToast(state.following?'Following':'Updated','Company follow status updated.','success')}catch(e){showToast('Follow failed',e.message,'error')}}
async function likePost(id){if(!token())return goLogin();try{await api(`/api/posts/${id}/like`,{method:'POST',headers:headers({'Content-Type':'application/json'})});const btn=document.getElementById('likebtn-'+id);btn?.classList.add('liked');await loadPosts();renderPosts()}catch(e){showToast('Like failed',e.message,'error')}}
function toggleComments(id){document.getElementById('comments-'+id)?.classList.toggle('show')}
async function addComment(id){if(!token())return goLogin();const input=document.getElementById('commentInput-'+id);const text=input?.value.trim();if(!text)return;try{await api(`/api/posts/${id}/comments`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({text,content:text})});input.value='';await loadPosts();renderPosts();document.getElementById('comments-'+id)?.classList.add('show')}catch(e){showToast('Comment failed',e.message,'error')}}
async function sharePost(id){const url=`${location.origin}${location.pathname}?id=${encodeURIComponent(state.companyId)}#posts`;try{if(navigator.share)await navigator.share({title:nameOf(),url});else await navigator.clipboard.writeText(url);showToast('Shared','Link copied or shared.','success')}catch{}}
function messageCompany(){if(!token())return goLogin();window.location.href=`messages.html?user=${encodeURIComponent(state.companyId)}`}
function visitWebsite(){if(state.website)window.open(state.website,'_blank','noopener');else showToast('Website not added','This company has not added a website yet.')}
async function copyProfileLink(){try{await navigator.clipboard.writeText(location.href);showToast('Copied','Profile link copied.','success')}catch{showToast('Copy failed','Please copy the browser URL.','error')}}
function goHome(){const r=localStorage.getItem('role');window.location.href=r==='employer'?'employer.html':r==='admin'?'index.html':r==='agent'?'agent.html':'talent.html'}
function goMessages(){if(!token())return goLogin();window.location.href='messages.html'}
function goNotifications(){if(!token())return goLogin();window.location.href='notifications.html'}
function goLogin(){window.location.href='login.html'}
function openOtherProfile(id){if(id)location.href=`public-profile.html?id=${encodeURIComponent(id)}`}
function date(v){try{return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Public'}catch{return'Public'}}
function setupSearch(){globalSearch.addEventListener('input',()=>{const q=globalSearch.value.toLowerCase().trim();if(!q)return renderAll();const posts=state.posts.filter(p=>[p.content,p.text,p.body].join(' ').toLowerCase().includes(q));const jobs=state.jobs.filter(j=>[j.title,j.description,j.location].join(' ').toLowerCase().includes(q));state._allPosts=state._allPosts||state.posts;state._allJobs=state._allJobs||state.jobs;state.posts=posts;state.jobs=jobs;renderJobs();renderPosts();})}
async function init(){setupSearch();await initViewer();await loadCompany();await Promise.allSettled([loadJobs(),loadPosts(),loadPeople()]);renderAll();const hash=(location.hash||'').replace('#','');if(['overview','jobs','posts','people','about'].includes(hash))openTab(hash)}
let socket=null;try{socket=io(API,{transports:['websocket','polling'],withCredentials:false});socket.on('postCreated',async()=>{await loadPosts();renderPosts();renderHeader()});socket.on('postUpdated',async()=>{await loadPosts();renderPosts()});socket.on('notification',loadUnread)}catch{}
init();
</script>
</body>
</html>
