<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIFT | Employer Public Profile</title>
  <meta name="description" content="AIFT public employer profile with company overview, jobs, posts, people, and hiring details." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root{--blue:#0a66c2;--aift:#2557a7;--green:#057642;--bg:#f3f2ef;--card:#fff;--text:#191919;--muted:#666;--line:#d6d6d6;--soft:#eef3f8;--danger:#b91c1c;--max:1128px;--shadow:0 1px 2px rgba(0,0,0,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);font-size:14px;line-height:1.45}a{text-decoration:none;color:inherit}button,input{font:inherit}img{display:block;max-width:100%}.hidden{display:none!important}.container{width:min(var(--max),calc(100% - 24px));margin:auto}
    .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #ddd}.top-inner{height:58px;display:flex;align-items:center;gap:10px}.brand-logo{width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,var(--aift),#4f8df9);color:#fff;font-weight:800;display:grid;place-items:center;flex:0 0 auto}.search{position:relative;width:280px;max-width:38vw}.search input{width:100%;height:34px;border:1px solid #c9d3df;background:var(--soft);border-radius:6px;padding:0 10px 0 34px;outline:none}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#555;fill:none;stroke-width:2}.top-actions{margin-left:auto;display:flex;align-items:center;gap:3px}.top-link{min-width:68px;height:52px;border:0;background:#fff;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:11px;border-radius:6px;position:relative}.top-link svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}.top-link:hover{background:#f3f6f8;color:#111}.top-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #ddd}.badge{position:absolute;top:5px;right:15px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#cc1016;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}.signin{border:0;background:var(--blue);color:#fff;border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer}.copy{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:20px;padding:8px 13px;font-weight:700;cursor:pointer}
    .page{padding:12px 0 36px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.profile-card,.card,.side-card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.cover{height:154px;background:#fff;border-bottom:1px solid #eee}.cover.has-cover{background-size:cover;background-position:center}.profile-main{position:relative;padding:0 20px 16px}.avatar{width:96px;height:96px;border-radius:10px;border:4px solid #fff;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden;margin-top:-48px}.avatar img{width:100%;height:100%;object-fit:cover}.name-row{display:flex;gap:8px;align-items:center;margin-top:10px}.name{font-size:20px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}.verified{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-weight:700;font-size:12px}.verified svg{width:14px;height:14px;fill:currentColor}.headline{margin:3px 0 0;font-size:14px;color:#333}.meta{display:flex;gap:6px;flex-wrap:wrap;color:#666;font-size:13px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border-radius:20px;padding:7px 16px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.gray{border-color:#777;color:#333}.btn:hover{background:#eef6ff}.btn.primary:hover{background:#004182}.tabs{display:flex;border-top:1px solid #eee;overflow:auto}.tab{border:0;background:#fff;padding:13px 18px;color:#666;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--green);border-bottom-color:var(--green)}.main-content{margin-top:12px}.section{display:none}.section.active{display:block}
    .card{padding:18px 20px;margin-bottom:12px}.title{font-size:18px;font-weight:700;margin:0 0 14px}.overview-card{padding:0}.overview-inner{padding:18px 20px}.overview-line{font-size:14px;line-height:1.55;color:#222;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.show-details{border-top:1px solid #eee;text-align:center;padding:13px}.show-details button{border:0;background:#fff;color:#555;font-weight:700;cursor:pointer}.details{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px 18px}.details.show{display:grid}.detail{border-top:1px solid #eee;padding-top:10px}.detail .k{font-size:12px;color:#666;font-weight:700}.detail .v{font-size:13px;color:#222;font-weight:600;margin-top:3px;word-break:break-word}
    .job-list{display:grid;gap:10px}.job{border:1px solid #ddd;border-radius:8px;background:#fff;padding:14px}.job h3{margin:0 0 5px;font-size:16px}.job .jmeta{font-size:13px;color:#666;margin-bottom:9px}.job p{font-size:14px;color:#333;margin:0 0 12px;line-height:1.55}.filter{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.filter input{height:34px;border:1px solid #777;border-radius:3px;padding:0 10px;min-width:260px;max-width:100%}
    .post-stream{background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible;padding:0}.post{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}.post-head{display:flex;gap:10px;padding:13px 15px 8px}.post-head img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid #ddd}.post-author{font-size:14px;font-weight:700}.post-meta{font-size:12px;color:#666}.post-body{padding:3px 15px 12px;white-space:pre-wrap;color:#222;line-height:1.55}.post-media img,.post-media video{width:100%;max-height:620px;object-fit:cover;background:#000}.post-stats{display:flex;justify-content:space-between;padding:9px 15px;color:#666;font-size:12px;border-bottom:1px solid #eee}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 8px}.post-action{border:0;background:#fff;border-radius:5px;color:#555;font-weight:700;cursor:pointer;padding:10px 6px}.post-action:hover{background:#f3f2ef}.post-action.liked{color:var(--blue)}.comments{display:none;border-top:1px solid #eee;padding:12px 15px}.comments.show{display:block}.comment-row{display:flex;gap:8px;margin-bottom:10px}.comment-row img{width:32px;height:32px;border-radius:50%;object-fit:cover}.bubble{background:#f2f2f2;border-radius:14px;padding:8px 11px;flex:1}.comment-name{font-weight:700;font-size:12px}.comment-text{font-size:13px;white-space:pre-wrap}.comment-box{display:flex;gap:8px;margin-top:10px}.comment-box input{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 12px;outline:none}.comment-box button{border:0;background:var(--blue);color:#fff;border-radius:18px;padding:8px 13px;font-weight:700;cursor:pointer}
    .people-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.person{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff;text-align:center;display:flex;flex-direction:column;min-height:252px}.person-cover{height:56px;background:#bfd0d2}.person img{width:86px;height:86px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin:-43px auto 8px;background:#fff}.person-body{padding:0 12px 12px;display:flex;flex-direction:column;flex:1}.person h3{margin:0 0 3px;font-size:15px;font-weight:700;line-height:1.25}.person p{margin:0;font-size:12px;color:#666;line-height:1.35}.person-mutual{font-size:12px;color:#777;margin:12px 0 10px;min-height:32px}.connect-btn{margin-top:auto;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer}.connect-btn:hover{background:#eef6ff}.side-card{padding:14px;margin-bottom:12px}.side-title{font-size:16px;font-weight:700;margin:0 0 10px}.follow-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.follow-item:last-child{border-bottom:0}.follow-item img{width:42px;height:42px;border-radius:5px;object-fit:cover;border:1px solid #ddd}.follow-item h4{margin:0 0 2px;font-size:13px}.follow-item p{margin:0;color:#666;font-size:12px}.small-btn{margin-top:8px;border:1px solid #777;border-radius:17px;background:#fff;padding:6px 12px;font-weight:700;cursor:pointer}.empty,.loading{padding:18px;text-align:center;color:#666;border:1px dashed #ddd;border-radius:8px;background:#fff}.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:100;display:grid;gap:10px}.toast{background:#111;color:#fff;padding:12px 14px;border-radius:10px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast b{display:block;margin-bottom:3px}.toast.error{background:#7f1d1d}.toast.success{background:#14532d}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.right-col{display:none}.top-link span{display:none}.top-link{min-width:40px;height:42px}.search{width:auto;flex:1;max-width:none}.people-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.details{grid-template-columns:1fr}}
    @media(max-width:640px){.container{width:100%}.page{padding-top:0}.profile-card,.card,.post{border-radius:0;border-left:0;border-right:0}.cover{height:116px}.profile-main{padding:0 14px 14px}.avatar{width:78px;height:78px;margin-top:-39px;border-width:3px}.name{font-size:18px}.tabs .tab{padding:12px 14px}.people-grid{grid-template-columns:1fr}.copy{display:none}.signin{padding:8px 12px}.post-actions{grid-template-columns:repeat(3,1fr)}.top-inner{padding:0 8px}.brand-logo{width:32px;height:32px}.filter input{min-width:100%;width:100%}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="container top-inner">
    <a class="brand-logo" href="employer.html" aria-label="AIFT">A</a>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="globalSearch" type="search" placeholder="Search" /></div>
    <nav class="top-actions">
      <button class="top-link" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span>Home</span></button>
      <button class="top-link" onclick="goMessages()"><span class="badge" id="msgBadge">0</span><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>Messaging</span></button>
      <button class="top-link" onclick="goNotifications()"><span class="badge" id="notifBadge">0</span><svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg><span>Notifications</span></button>
      <button class="copy" onclick="copyProfileLink()">Copy Link</button>
      <button class="signin" id="signinBtn" onclick="goLogin()">Sign in</button>
      <img class="top-avatar hidden" id="viewerAvatar" alt="Me" />
    </nav>
  </div>
</header>

<main class="page">
  <div class="container layout">
    <section class="left-col">
      <article class="profile-card">
        <div id="cover" class="cover"></div>
        <div class="profile-main">
          <div class="avatar"><img id="companyAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Company logo"></div>
          <div class="name-row"><h1 id="companyName" class="name">Company</h1><span class="verified"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 2.1 3.1-.3.9 3 2.8 1.5-1.5 2.8.3 3-3 .9L14.9 18 12 20l-2.9-2-3 .9-.3-3L3 13.9 3.9 11 2.4 8.2 5.2 6.7l.9-3 3.1.3L12 2zm-1.1 12.8l6-6-1.4-1.4-4.6 4.6-2.3-2.3-1.4 1.4 3.7 3.7z"/></svg>Verified</span></div>
          <p id="headline" class="headline"></p>
          <div class="meta"><span id="industryLine"></span><span id="followersLine"></span></div>
          <div class="actions"><button id="followBtn" class="btn primary" onclick="followCompany()">+ Follow</button><button class="btn gray" onclick="messageCompany()">Message</button><button class="btn gray" onclick="visitWebsite()">Visit website</button></div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="overview" onclick="openTab('overview')">Home</button>
          <button class="tab" data-tab="about" onclick="openTab('about')">About</button>
          <button class="tab" data-tab="posts" onclick="openTab('posts')">Posts</button>
          <button class="tab" data-tab="jobs" onclick="openTab('jobs')">Jobs</button>
          <button class="tab" data-tab="people" onclick="openTab('people')">People</button>
        </div>
      </article>

      <div class="main-content">
        <section id="section-overview" class="section active">
          <article class="card overview-card">
            <div class="overview-inner"><h2 class="title">Overview</h2><div id="companyStory" class="overview-line">Loading company details...</div></div>
            <div class="show-details"><button type="button" onclick="toggleOverviewDetails()">Show all details →</button></div>
            <div class="details" id="overviewDetails"></div>
          </article>
        </section>

        <section id="section-about" class="section"><article class="card"><h2 class="title">Company details</h2><div class="details show" id="aboutDetails"></div></article></section>
        <section id="section-posts" class="section"><div class="post-stream" id="postsList"><div class="loading">Loading posts...</div></div></section>
        <section id="section-jobs" class="section"><article class="card"><h2 class="title">Open jobs</h2><div class="filter"><input id="jobSearch" type="search" oninput="renderJobs()" placeholder="Search open roles"></div><div class="job-list" id="jobsList"><div class="loading">Loading jobs...</div></div></article></section>
        <section id="section-people" class="section"><article class="card"><h2 class="title" id="peopleCountTitle">Associated people</h2><div class="filter"><input id="peopleSearch" type="search" oninput="renderPeople()" placeholder="Search employees by title, keyword, or school"></div><div class="people-grid" id="peopleList"><div class="loading">Loading people...</div></div></article></section>
      </div>
    </section>

    <aside class="right-col">
      <section class="side-card"><h3 class="side-title">People also follow</h3><div id="alsoFollowList"><div class="loading">Loading suggestions...</div></div></section>
      <section class="side-card"><h3 class="side-title">Company information</h3><div id="sideInfo"></div></section>
    </aside>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API="https://backend-1-9b6f.onrender.com";
const FALLBACK_COMPANY="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
const FALLBACK_USER="https://cdn-icons-png.flaticon.com/512/149/149071.png";
const state={viewer:null,company:{},jobs:[],posts:[],people:[],suggestions:[],companyId:new URLSearchParams(location.search).get("id")||localStorage.getItem("userId")||"",website:"",following:false};

function token(){return localStorage.getItem("employerToken")||localStorage.getItem("talentToken")||localStorage.getItem("adminToken")||localStorage.getItem("agentToken")||localStorage.getItem("token")||""}
function headers(extra={}){const t=token();return t?{Authorization:`Bearer ${t}`,...extra}:{...extra}}
async function api(path,opts={}){const res=await fetch(`${API}${path}`,opts);let data=null;try{data=await res.json()}catch{}if(!res.ok)throw new Error(data?.message||data?.error||`Request failed ${res.status}`);return data}
function arr(x){return Array.isArray(x)?x:Array.isArray(x?.data)?x.data:Array.isArray(x?.users)?x.users:Array.isArray(x?.items)?x.items:Array.isArray(x?.posts)?x.posts:Array.isArray(x?.jobs)?x.jobs:Array.isArray(x?.team)?x.team:[]}
function esc(v){return String(v??"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]))}
function toast(t,m,type=""){const el=document.createElement("div");el.className=`toast ${type}`;el.innerHTML=`<b>${esc(t)}</b><span>${esc(m||"")}</span>`;toastWrap.appendChild(el);setTimeout(()=>el.remove(),3500)}
function nameOf(u=state.company){return u.companyName||u.name||u.fullName||u.businessName||"Company"}
function logoOf(u=state.company){return u.profileImage||u.logo||u.companyLogo||u.avatar||FALLBACK_COMPANY}
function coverOf(u=state.company){return u.coverImage||u.bannerImage||u.companyBanner||u.banner||""}
function storyOf(){const c=state.company;return c.companyStory||c.services||c.specialties||c.bio||c.about||c.description||"This company has not added a full overview yet."}
function safeUrl(u){if(!u)return"";u=String(u).trim();return /^https?:\/\//i.test(u)?u:`https://${u}`}
function activeJobs(){return state.jobs.filter(j=>String(j.status||"active").toLowerCase()!=="closed")}
function countFollowers(){const c=state.company;return Array.isArray(c.followers)?c.followers.length:Number(c.followersCount||c.followCount||0)||0}
function currentUserId(){return String(state.viewer?._id||state.viewer?.id||localStorage.getItem("userId")||"")}

async function initViewer(){const signed=!!token();signinBtn.classList.toggle("hidden",signed);viewerAvatar.classList.toggle("hidden",!signed);if(!signed)return;try{const me=await api("/api/users/me",{headers:headers()});state.viewer=me?.user||me;viewerAvatar.src=state.viewer.profileImage||FALLBACK_USER;loadUnread()}catch{}}
async function loadUnread(){try{const n=await api("/api/notifications/unread",{headers:headers()});const count=Number(n.count||n.unread||arr(n).length||0);if(count){notifBadge.style.display="flex";notifBadge.textContent=count>99?"99+":count}}catch{}}
async function loadCompany(){let data=null;if(state.companyId){try{data=await api(`/api/users/${state.companyId}/public`,{headers:headers()})}catch{}}if(!data&&token()){try{data=await api("/api/users/me",{headers:headers()})}catch{}}state.company=data?.user||data?.company||data||{};state.companyId=state.company._id||state.company.id||state.companyId}
async function loadJobs(){try{let data=await api(state.companyId?`/api/jobs?employer=${encodeURIComponent(state.companyId)}`:"/api/jobs/my",{headers:headers()});let jobs=arr(data);state.jobs=jobs.filter(j=>!state.companyId||String(j.employerId?._id||j.employerId||j.companyId||j.userId||"")===String(state.companyId)||String(j.company||"").toLowerCase()===nameOf().toLowerCase());if(!state.jobs.length&&token()){try{state.jobs=arr(await api("/api/jobs/my",{headers:headers()}))}catch{}}}catch{state.jobs=[]}}
async function loadPosts(){try{const data=await api("/api/posts",{headers:headers()});state.posts=arr(data).filter(p=>{const a=p.user||p.author||p.createdBy||{};const aid=a._id||a.id||p.userId||p.authorId||p.employerId;return !state.companyId||String(aid)===String(state.companyId)||String(a.name||"").toLowerCase()===nameOf().toLowerCase()})}catch{state.posts=[]}}
async function loadPeople(){try{const data=await api("/api/users/network",{headers:headers()});const users=arr(data);state.people=users.filter(u=>String(u.companyId?._id||u.companyId||u.employerId||"")===String(state.companyId)||String(u.company||"").toLowerCase()===nameOf().toLowerCase()).slice(0,42);state.suggestions=users.filter(u=>String(u._id||u.id)!==String(state.companyId)).slice(0,8)}catch{state.people=[];state.suggestions=[]}}

function renderHeader(){const c=state.company;document.title=`${nameOf()} | AIFT`;companyAvatar.src=logoOf();companyName.textContent=nameOf();headline.textContent=c.headline||c.tagline||c.industry||"Company profile";industryLine.textContent=c.industry||c.companyIndustry||"Company";followersLine.textContent=`${countFollowers().toLocaleString()} followers`;const cover=coverOf();cover && cover.length>5 ? (document.getElementById("cover").classList.add("has-cover"),document.getElementById("cover").style.backgroundImage=`url('${esc(cover)}')`) : (document.getElementById("cover").classList.remove("has-cover"),document.getElementById("cover").style.backgroundImage="none");state.website=safeUrl(c.website||c.companyWebsite||c.url||"");const isFollowing=Array.isArray(c.followers)&&currentUserId()&&c.followers.map(x=>String(x._id||x)).includes(currentUserId());state.following=!!isFollowing;followBtn.textContent=state.following?"✓ Following":"+ Follow";followBtn.classList.toggle("primary",!state.following);followBtn.classList.toggle("gray",state.following)}
function detailRows(items){return items.map(([k,v,html])=>`<div class="detail"><div class="k">${esc(k)}</div><div class="v">${html?v:esc(v)}</div></div>`).join("")}
function renderOverview(){companyStory.textContent=storyOf();const c=state.company;overviewDetails.innerHTML=detailRows([["Services",c.services||c.specialties||"Not added"],["Industry",c.industry||c.companyIndustry||"Not added"],["Company size",c.companySize||c.size||"Not added"],["Location",c.location||c.address||"Not added"],["Website",state.website?`<a style="color:#0a66c2" href="${esc(state.website)}" target="_blank" rel="noopener">Open website</a>`:"Not added",true],["Open jobs",activeJobs().length]]);sideInfo.innerHTML=detailRows([["Website",state.website?`<a style="color:#0a66c2" href="${esc(state.website)}" target="_blank" rel="noopener">Open website</a>`:"Not added",true],["Open jobs",activeJobs().length],["Posts",state.posts.length],["People",state.people.length],["Followers",countFollowers().toLocaleString()]])}
function toggleOverviewDetails(){overviewDetails.classList.toggle("show")}
function renderAbout(){const c=state.company;aboutDetails.innerHTML=detailRows([["Company",nameOf()],["Industry",c.industry||c.companyIndustry||"Not added"],["Location",c.location||c.address||"Not added"],["Company size",c.companySize||c.size||"Not added"],["Website",state.website?`<a style="color:#0a66c2" href="${esc(state.website)}" target="_blank" rel="noopener">${esc(state.website)}</a>`:"Not added",true],["Contact",c.email||c.contactEmail||"Hidden"],["Services",c.services||c.specialties||"Not added"]])}
function renderJobs(){const q=(jobSearch?.value||"").toLowerCase().trim();const jobs=activeJobs().filter(j=>[j.title,j.description,j.location,j.salary,j.salaryRange].join(" ").toLowerCase().includes(q));jobsList.innerHTML=jobs.length?jobs.map(j=>`<article class="job"><h3>${esc(j.title||"Untitled role")}</h3><div class="jmeta">${esc(j.location||"Location not added")} ${j.salary||j.salaryRange?"• "+esc(j.salary||j.salaryRange):""}</div><p>${esc(j.description||"No description added yet.").slice(0,520)}${String(j.description||"").length>520?"...":""}</p><button class="btn primary" onclick="goLogin()">View / Apply</button></article>`).join(""):`<div class="empty">No open jobs found yet.</div>`}
function renderPeople(){const q=(peopleSearch?.value||"").toLowerCase().trim();let people=state.people;if(q)people=people.filter(u=>[u.name,u.fullName,u.headline,u.role,u.teamRole,u.department,u.skills,u.education,u.location].join(" ").toLowerCase().includes(q));peopleCountTitle.textContent=`${people.length||state.people.length} associated people`;peopleList.innerHTML=people.length?people.map(u=>`<article class="person"><div class="person-cover"></div><img src="${esc(u.profileImage||FALLBACK_USER)}" alt="${esc(u.name||u.fullName||"Member")}"><div class="person-body"><h3>${esc(u.name||u.fullName||"Member")} <span style="font-weight:500;color:#777;font-size:12px">· 2nd</span></h3><p>${esc(u.headline||u.role||u.teamRole||u.department||"Associated member")}</p><div class="person-mutual">${esc(u.location||u.company||nameOf())}</div><button class="connect-btn" onclick="messagePerson('${esc(u._id||u.id||"")}')">Connect</button></div></article>`).join(""):`<div class="empty">No associated people are public yet.</div>`}
function renderSuggestions(){alsoFollowList.innerHTML=state.suggestions.length?state.suggestions.map(u=>`<div class="follow-item"><img src="${esc(u.profileImage||u.logo||FALLBACK_COMPANY)}" alt=""><div><h4>${esc(u.companyName||u.name||"Profile")}</h4><p>${esc(u.industry||u.headline||u.role||"AIFT profile")}</p><button class="small-btn" onclick="openOtherProfile('${esc(u._id||u.id||"")}')">+ Follow</button></div></div>`).join(""):`<div class="empty">No suggestions yet.</div>`}
function renderComments(p){const list=Array.isArray(p.comments)?p.comments:[];return list.slice(-6).map(c=>{const u=c.user||c.author||{};return `<div class="comment-row"><img src="${esc(u.profileImage||FALLBACK_USER)}" alt=""><div class="bubble"><div class="comment-name">${esc(u.name||"Member")}</div><div class="comment-text">${esc(c.text||c.content||"")}</div></div></div>`}).join("")}
function renderPosts(){postsList.innerHTML=state.posts.length?state.posts.map(p=>{const a=p.user||p.author||p.createdBy||state.company;const pid=p._id||p.id;const likes=Array.isArray(p.likes)?p.likes.length:Number(p.likesCount||0)||0;const comments=Array.isArray(p.comments)?p.comments.length:Number(p.commentsCount||0)||0;const liked=Array.isArray(p.likes)&&currentUserId()&&p.likes.map(x=>String(x._id||x)).includes(currentUserId());const media=p.mediaUrl||p.image||p.video||"";const video=/video|\.mp4|\.webm|\.ogg/i.test(String(p.mediaType||media));return `<article class="post" ondblclick="likePost('${esc(pid)}')"><div class="post-head"><img src="${esc(a.profileImage||logoOf())}" alt=""><div><div class="post-author">${esc(a.name||nameOf())}</div><div class="post-meta">${esc(a.headline||"Company update")} · ${date(p.createdAt||p.date)}</div></div></div><div class="post-body">${esc(p.content||p.text||p.body||"")}</div>${media?`<div class="post-media">${video?`<video src="${esc(media)}" controls playsinline></video>`:`<img src="${esc(media)}" alt="Post media">`}</div>`:""}<div class="post-stats"><span id="likes-${esc(pid)}">${likes} likes</span><span>${comments} comments</span></div><div class="post-actions"><button class="post-action ${liked?"liked":""}" id="likebtn-${esc(pid)}" onclick="likePost('${esc(pid)}')">Like</button><button class="post-action" onclick="toggleComments('${esc(pid)}')">Comment</button><button class="post-action" onclick="sharePost('${esc(pid)}')">Share</button></div><div class="comments" id="comments-${esc(pid)}"><div>${renderComments(p)}</div><div class="comment-box"><input id="commentInput-${esc(pid)}" placeholder="Add a comment..."><button onclick="addComment('${esc(pid)}')">Post</button></div></div></article>`}).join(""):`<div class="empty">No company posts yet.</div>`}

function renderAll(){renderHeader();renderOverview();renderAbout();renderJobs();renderPeople();renderSuggestions();renderPosts()}
function openTab(tab){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.getElementById("section-"+tab)?.classList.add("active");history.replaceState(null,"","#"+tab)}
async function tryEndpoints(endpoints,body){let last="";for(const [url,method] of endpoints){try{await api(url,{method,headers:headers({"Content-Type":"application/json"}),body:body?JSON.stringify(body):undefined});return true}catch(e){last=e.message}}throw new Error(last||"Backend route was not accepted")}
async function followCompany(){if(!token())return goLogin();try{await tryEndpoints([[`/api/users/${state.companyId}/follow`,"POST"],[`/api/users/${state.companyId}/follow`,"PATCH"],[`/api/users/follow/${state.companyId}`,"POST"],[`/api/users/follow/${state.companyId}`,"PATCH"]]);state.following=!state.following;followBtn.textContent=state.following?"✓ Following":"+ Follow";followBtn.classList.toggle("primary",!state.following);followBtn.classList.toggle("gray",state.following);toast("Updated","Follow status updated.","success")}catch(e){toast("Follow failed",e.message,"error")}}
async function likePost(id){if(!token())return goLogin();try{await tryEndpoints([[`/api/posts/${id}/like`,"PATCH"],[`/api/posts/${id}/like`,"POST"],[`/api/posts/${id}/likes`,"PATCH"],[`/api/posts/${id}/likes`,"POST"],[`/api/posts/${id}/react`,"POST"]],{type:"like",reaction:"like"});document.getElementById("likebtn-"+id)?.classList.add("liked");await loadPosts();renderPosts()}catch(e){toast("Like failed",e.message,"error")}}
function toggleComments(id){document.getElementById("comments-"+id)?.classList.toggle("show")}
async function addComment(id){if(!token())return goLogin();const input=document.getElementById("commentInput-"+id);const text=input?.value.trim();if(!text)return;try{await tryEndpoints([[`/api/posts/${id}/comment`,"POST"],[`/api/posts/${id}/comments`,"POST"]],{text,content:text});input.value="";await loadPosts();renderPosts();document.getElementById("comments-"+id)?.classList.add("show")}catch(e){toast("Comment failed",e.message,"error")}}
async function sharePost(id){const url=`${location.origin}${location.pathname}?id=${encodeURIComponent(state.companyId)}#posts`;try{if(navigator.share)await navigator.share({title:nameOf(),url});else await navigator.clipboard.writeText(url);toast("Shared","Link copied or shared.","success")}catch{}}
function messageCompany(){if(!token())return goLogin();window.location.href=`messages.html?user=${encodeURIComponent(state.companyId)}`}
function messagePerson(id){if(!token())return goLogin();if(id)window.location.href=`messages.html?user=${encodeURIComponent(id)}`}
function visitWebsite(){if(state.website)window.open(state.website,"_blank","noopener");else toast("Website not added","This company has not added a website yet.")}
async function copyProfileLink(){try{await navigator.clipboard.writeText(location.href);toast("Copied","Profile link copied.","success")}catch{toast("Copy failed","Please copy the browser URL.","error")}}
function goHome(){const r=localStorage.getItem("role");window.location.href=r==="employer"?"employer.html":r==="admin"?"index.html":r==="agent"?"agent.html":"talent.html"}
function goMessages(){if(!token())return goLogin();window.location.href="messages.html"}
function goNotifications(){if(!token())return goLogin();window.location.href="notifications.html"}
function goLogin(){window.location.href="login.html"}
function openOtherProfile(id){if(id)location.href=`public-profile.html?id=${encodeURIComponent(id)}`}
function date(v){try{return v?new Date(v).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"Public"}catch{return"Public"}}
function setupSearch(){globalSearch.addEventListener("input",()=>{const q=globalSearch.value.toLowerCase().trim();if(!q){renderAll();return}const oldPosts=state._posts||state.posts, oldJobs=state._jobs||state.jobs;state._posts=oldPosts;state._jobs=oldJobs;state.posts=oldPosts.filter(p=>[p.content,p.text,p.body].join(" ").toLowerCase().includes(q));state.jobs=oldJobs.filter(j=>[j.title,j.description,j.location].join(" ").toLowerCase().includes(q));renderPosts();renderJobs()})}
async function init(){setupSearch();await initViewer();await loadCompany();await Promise.allSettled([loadJobs(),loadPosts(),loadPeople()]);renderAll();const hash=(location.hash||"").replace("#","");if(["overview","about","posts","jobs","people"].includes(hash))openTab(hash)}
try{const socket=io(API,{transports:["websocket","polling"],withCredentials:false});socket.on("postCreated",async()=>{await loadPosts();renderPosts()});socket.on("postUpdated",async()=>{await loadPosts();renderPosts()});socket.on("notification",loadUnread)}catch{}
init();
</script>
</body>
</html>
