name: Finish Career Hub public profile wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-career-hub.yml'

permissions:
  contents: write

jobs:
  wire-public-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified partnership loader
        shell: python
        run: |
          from pathlib import Path

          script = '<script src="aift-verified-partnerships-public.js" defer></script>'
          for filename in ['school-public-profile.html', 'employer-public-profile.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if script not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'{filename} has no closing body tag')
                  text = text.replace('</body>', f'{script}\n</body>', 1)
                  path.write_text(text, encoding='utf-8')
      - name: Commit wiring
        run: |
          git config user.name "AIFT Career Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add school-public-profile.html employer-public-profile.html
          if git diff --cached --quiet; then
            echo "Public profiles already wired."
            exit 0
          fi
          git commit -m "Wire verified partnerships into public profiles"
          git push
