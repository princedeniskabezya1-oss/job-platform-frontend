name: Install Family Student ID UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-family-student-id-ui.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/install-family-student-id-ui.js
      - run: node --check family-production.js
      - name: Commit Family UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html family-production.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Connect Family members through verified AIFT Student IDs [skip ci]" && git push; fi
