name: Family production frontend

on:
  push:
    branches: [main]
    paths:
      - "family.html"
      - "family-production.js"
      - "family-production.css"
      - ".github/workflows/family-production.yml"
  pull_request:
    paths:
      - "family.html"
      - "family-production.js"
      - "family-production.css"
      - ".github/workflows/family-production.yml"

permissions:
  contents: write

jobs:
  validate-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add standalone Family Advantage card to home
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("home.html")
          text = path.read_text(encoding="utf-8")

          css_marker = ".left-menu svg{\n  width:18px;\n  height:18px;\n  stroke:#64748b;\n  fill:none;\n  stroke-width:2;\n}\n"

          css = '''

/* =========================================================
   FAMILY ADVANTAGE — HOME PROMOTION
========================================================= */
.family-advantage-card{
  position:relative;
  isolation:isolate;
  margin-top:12px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:
    radial-gradient(circle at 100% 0%,rgba(99,102,241,.48),transparent 34%),
    radial-gradient(circle at 0% 100%,rgba(236,72,153,.28),transparent 42%),
    linear-gradient(150deg,#092967 0%,#143fc4 48%,#7b2cbf 100%);
  color:#fff;
  box-shadow:0 12px 30px rgba(15,23,42,.16);
}
.family-advantage-card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom right,#000,transparent 76%);
}
.family-advantage-inner{padding:18px 17px 17px;}
.family-advantage-eyebrow{
  display:flex;align-items:center;gap:7px;margin-bottom:12px;
  color:rgba(255,255,255,.86);font-size:10px;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;
}
.family-advantage-crown{
  width:24px;height:24px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.18);border-radius:8px;
  background:rgba(255,255,255,.11);
}
.family-advantage-card h3{
  margin:0;max-width:185px;color:#fff;font-size:22px;line-height:1.08;
  letter-spacing:-.035em;font-weight:900;
}
.family-advantage-lead{
  margin:10px 0 14px;color:rgba(255,255,255,.82);
  font-size:11px;line-height:1.48;
}
.family-advantage-list{display:grid;gap:10px;margin:0 0 16px;}
.family-advantage-feature{
  display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:start;
}
.family-advantage-icon{
  width:30px;height:30px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.13);border-radius:9px;
  background:rgba(255,255,255,.12);color:#fff;
}
.family-advantage-icon svg{
  width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.family-advantage-feature strong{
  display:block;margin-bottom:2px;color:#fff;font-size:11px;line-height:1.25;font-weight:850;
}
.family-advantage-feature span{
  display:block;color:rgba(255,255,255,.72);font-size:9.5px;line-height:1.35;
}
.family-advantage-cta{
  width:100%;min-height:40px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 13px;border:0;border-radius:999px;background:#fff;color:#15378f;
  font-size:11px;font-weight:900;box-shadow:0 8px 18px rgba(15,23,42,.15);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.family-advantage-cta:hover{
  transform:translateY(-1px);background:#f8fbff;box-shadow:0 10px 22px rgba(15,23,42,.2);
}
.family-advantage-cta:focus-visible{
  outline:3px solid rgba(255,255,255,.55);outline-offset:3px;
}
.family-advantage-free{
  margin-top:9px;text-align:center;color:rgba(255,255,255,.72);font-size:9.5px;font-weight:700;
}
@media(max-width:760px){.family-advantage-card{display:none;}}
'''

          if "family-advantage-card" not in text:
              if css_marker not in text:
                  raise SystemExit("Family Advantage CSS marker not found")
              text = text.replace(css_marker, css_marker + css, 1)

          marker = '  </section>\n\n</aside>\n\n<section class="feed-col">'
          card = '''

  <section class="family-advantage-card" aria-labelledby="familyAdvantageTitle">
    <div class="family-advantage-inner">
      <div class="family-advantage-eyebrow">
        <span class="family-advantage-crown" aria-hidden="true">✦</span>
        <span>Family Advantage</span>
      </div>
      <h3 id="familyAdvantageTitle">Empower your family’s future.</h3>
      <p class="family-advantage-lead">Discover schools, scholarships, opportunities, funding, and family tools in one place.</p>

      <div class="family-advantage-list">
        <div class="family-advantage-feature">
          <span class="family-advantage-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"></path><path d="M6 10.5V15c0 2 2.7 4 6 4s6-2 6-4v-4.5"></path></svg>
          </span>
          <span><strong>Priority opportunities</strong><span>Explore live scholarships, schools, and programs for your family.</span></span>
        </div>

        <div class="family-advantage-feature">
          <span class="family-advantage-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19V9"></path><path d="M10 19V5"></path><path d="M16 19v-7"></path><path d="M22 19V3"></path></svg>
          </span>
          <span><strong>Smart family dashboard</strong><span>Manage children, requests, saved programs, and progress from one workspace.</span></span>
        </div>

        <div class="family-advantage-feature">
          <span class="family-advantage-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v18"></path><path d="M17 8a5 5 0 0 0-5-3c-2.8 0-5 1.6-5 3.7S9.2 12 12 12s5 1.2 5 3.3S14.8 19 12 19a5.9 5.9 0 0 1-5-2.5"></path></svg>
          </span>
          <span><strong>Funding & investor access</strong><span>Publish real project funding requests and discover AIFT Ventures.</span></span>
        </div>
      </div>

      <a class="family-advantage-cta" href="family.html" aria-label="Open Family Advantage">
        <span>Explore Family Advantage</span><span aria-hidden="true">→</span>
      </a>
      <div class="family-advantage-free">Free access with your AIFT account</div>
    </div>
  </section>
'''

          if 'id="familyAdvantageTitle"' not in text:
              if marker not in text:
                  raise SystemExit("Family Advantage HTML marker not found")
              text = text.replace(marker, '  </section>' + card + '\n</aside>\n\n<section class="feed-col">', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Family Advantage home integration
        run: |
          grep -q 'class="family-advantage-card"' home.html
          grep -q 'href="family.html"' home.html
          grep -q 'Free access with your AIFT account' home.html
          ! grep -q '₱299' home.html
          ! grep -qi 'cancel anytime' home.html

      - name: Commit home integration and restore workflow
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git show HEAD^:.github/workflows/family-production.yml > .github/workflows/family-production.yml
          rm -f .github/workflows/add-family-advantage-home.yml
          git add home.html .github/workflows/family-production.yml .github/workflows/add-family-advantage-home.yml
          git commit -m "Add Family Advantage standalone home card"
          git push origin main

      - name: Check JavaScript syntax
        run: node --check family-production.js
      - name: Check production assets exist
        run: |
          test -s family.html
          test -s family-production.css
          test -s family-production.js
          grep -q 'family-production.css' family.html
          grep -q 'family-production.js' family.html
      - name: Reject known demo fixtures
        run: |
          ! grep -Eqi 'Welcome back, Maria|Lucas Santos|Mia Santos|10,000\+ Families|2,000\+ Partner Schools|500\+ Scholarship Programs|300\+ Venture Projects' family.html family-production.js
      - name: Verify production API integration markers
        run: |
          grep -q '/api/family/profile' family-production.js
          grep -q '/api/family/overview' family-production.js
          grep -q '/api/family/children' family-production.js
          grep -q '/api/scholarship-applications' family-production.js
          grep -q '/api/ventures/mine' family-production.js
          grep -q '/api/conversations' family-production.js
          grep -q '/api/notifications' family-production.js
