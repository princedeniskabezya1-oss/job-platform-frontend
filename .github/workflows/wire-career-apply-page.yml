name: Wire Career Hub apply page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-career-apply-page.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire apply route before Career Hub V2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('student-passport.js')
          text=path.read_text(encoding='utf-8')
          old='''  async function loadCareerHub(){\n    await addScript("student-career-hub-v2.js","data-aift-student-career-v2");\n    await addScript("student-career-hub-markets-v2.js","data-aift-student-career-markets-v2");\n  }'''
          new='''  async function loadCareerHub(){\n    // Install the application-page route before Career Hub V2 binds its\n    // capture listener. All Student Career Hub Apply buttons therefore\n    // open the full job-apply.html application experience.\n    await addScript("student-career-apply-route.js","data-aift-student-career-apply-route");\n    await addScript("student-career-hub-v2.js","data-aift-student-career-v2");\n    await addScript("student-career-hub-markets-v2.js","data-aift-student-career-markets-v2");\n  }'''
          if old not in text:
              raise SystemExit('student-passport loadCareerHub block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check student-passport.js
          node --check student-career-apply-route.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('job-apply.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',text)
          if not scripts: raise SystemExit('No inline script found in job-apply.html')
          p=Path('/tmp/job-apply-inline.js');p.write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit wiring
        run: |
          git config user.name "AIFT Career Hub"
          git config user.email "actions@users.noreply.github.com"
          git add student-passport.js
          git commit -m "Route Student Career Hub applications through job apply page"
          git push
