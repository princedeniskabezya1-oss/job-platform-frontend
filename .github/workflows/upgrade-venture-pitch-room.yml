name: Upgrade Venture Pitch Room

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-venture-pitch-room.yml'
      - 'scripts/upgrade_venture_pitch_room.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Upgrade venture.html
        run: python3 scripts/upgrade_venture_pitch_room.py

      - name: Validate Venture Pitch Room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('venture.html').read_text(encoding='utf-8')
          assert 'src="images/aift-logo.png"' in s
          assert 'class="venture-topbar-inner"' in s
          assert 'function initializeVentureGlobalSearch()' in s
          assert 'return "family.html";' in s
          assert 'return "career-hub.html";' not in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/venture-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/venture-inline.js

      - name: Commit Venture Pitch Room upgrade
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add venture.html
          git commit -m "Upgrade Venture Pitch Room production shell"
          git push origin main
