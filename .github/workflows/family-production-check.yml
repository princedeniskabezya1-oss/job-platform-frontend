name: Family Production Validation

on:
  push:
    branches:
      - family-production-data

permissions:
  contents: read

jobs:
  validate-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Family JavaScript syntax
        run: node --check family-production.js
      - name: Verify production files exist
        run: |
          test -s family.html
          test -s family-production.css
          test -s family-production.js
      - name: Ensure Family HTML has no legacy demo names
        run: |
          ! grep -Eqi 'Lucas|Mia|Maria Santos|demo request|sample request' family.html
      - name: Verify Family HTML IDs are unique
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('family.html','utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = [...new Set(ids.filter((id,index) => ids.indexOf(id) !== index))];
          if(duplicates.length){
            console.error('Duplicate IDs:',duplicates.join(', '));
            process.exit(1);
          }
          console.log(`Validated ${ids.length} unique HTML IDs`);
          NODE
      - name: Verify JavaScript literal ID selectors exist
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('family.html','utf8');
          const js = fs.readFileSync('family-production.js','utf8');
          const htmlIds = new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]));
          const selectorIds = new Set([...js.matchAll(/\$\(["']#([A-Za-z0-9_-]+)["']\)/g)].map(match => match[1]));
          const missing = [...selectorIds].filter(id => !htmlIds.has(id));
          if(missing.length){
            console.error('Missing HTML IDs referenced by JS:',missing.join(', '));
            process.exit(1);
          }
          console.log(`Validated ${selectorIds.size} literal JS ID selectors`);
          NODE
