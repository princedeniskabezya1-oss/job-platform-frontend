name: Fix Student Career Hub tabs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-student-career-tabs.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Career Hub behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('student-career-production.js')
          s=p.read_text()
          needle='  const careerState = { active:null, items:[], filtered:[], loading:false };'
          inject='''  const careerState = { active:null, items:[], filtered:[], loading:false };

  function ensureCareerStyles(){
    if(document.querySelector('link[data-student-career-production]')) return;
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href='student-career-production.css?v=20260831-2';
    link.dataset.studentCareerProduction='true';
    document.head.appendChild(link);
  }'''
          if needle not in s: raise SystemExit('careerState marker missing')
          s=s.replace(needle,inject,1)

          old='''    const layout = section.querySelector(".student-career-layout");
    const main = layout?.querySelector(":scope > .student-career-main") || section.querySelector(".student-career-main");
    if(main) main.prepend(workspace); else (categoryGrid(section)?.parentElement || section).appendChild(workspace);'''
          new='''    const grid=categoryGrid(section);
    const categoryPanel=grid?.closest("section") || grid?.parentElement;
    if(categoryPanel) categoryPanel.insertAdjacentElement("afterend",workspace);
    else {
      const layout=section.querySelector(".student-career-layout");
      const main=layout?.querySelector(":scope > .student-career-main") || section.querySelector(".student-career-main");
      if(main) main.prepend(workspace); else section.appendChild(workspace);
    }'''
          if old not in s: raise SystemExit('workspace placement marker missing')
          s=s.replace(old,new,1)

          old2='''  function hideNativeMain(section,workspace){
    const main = section.querySelector(".student-career-layout > .student-career-main") || section.querySelector(".student-career-main");
    if(!main) return;
    [...main.children].forEach(child=>{
      if(child !== workspace) child.classList.add("career-native-hidden");
    });
  }'''
          new2='''  function hideNativeMain(section,workspace){
    const parent=workspace?.parentElement;
    if(!parent) return;
    let afterWorkspace=false;
    [...parent.children].forEach(child=>{
      if(child===workspace){ afterWorkspace=true; return; }
      if(afterWorkspace) child.classList.add("career-native-hidden");
    });
  }'''
          if old2 not in s: raise SystemExit('hideNativeMain marker missing')
          s=s.replace(old2,new2,1)

          old3='''  function bindCareer(){
    const section=document.querySelector("#section-career"); if(!section) return;'''
          new3='''  function bindCareer(){
    ensureCareerStyles();
    const section=document.querySelector("#section-career"); if(!section) return;'''
          if old3 not in s: raise SystemExit('bindCareer marker missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check student-career-production.js
      - name: Commit fix
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student-career-production.js
          git commit -m "Fix Career Hub focused tab placement and styling"
          git push origin main
