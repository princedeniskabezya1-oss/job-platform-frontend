name: Add Student Career Venture tools

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-career-venture-tools.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch student.js
        run: python3 scripts/add_student_venture_tools.py

      - name: Validate student.js
        run: |
          node --check student.js
          grep -q 'Build, fund, connect and pitch' student.js
          grep -q 'Create new venture' student.js
          grep -q 'data-career-venture-tool="build"' student.js
          grep -q '/api/ventures/mine' student.js

      - name: Commit production Venture tools
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.js
          git commit -m "Upgrade Student Career Hub Venture workspace"
          git push origin main
