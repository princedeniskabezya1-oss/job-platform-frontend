name: Connect Share Panel and Opportunity Passport

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/connect-share-passport.yml'
      - 'scripts/connect_share_passport.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch student and venture pages
        run: python3 scripts/connect_share_passport.py

      - name: Validate integration
        run: |
          node --check aift-share-panel.js
          node --check student-passport.js
          grep -q 'aift-share-panel.js' student.html
          grep -q 'student-passport.js' student.html
          grep -q 'aift-share-panel.js' venture.html
          ! grep -q 'student-career-production.js' student.html

      - name: Commit production integration
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.html venture.html
          git commit -m "Connect share panels and AIFT Opportunity Passport"
          git push origin main
