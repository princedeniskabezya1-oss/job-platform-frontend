name: Install AIFT Requester Review Status

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-aift-review-status.yml"
      - "scripts/install-aift-review-status.js"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install requester review status center
        run: node scripts/install-aift-review-status.js
      - name: Validate JavaScript
        run: |
          node --check aift-review-status.js
          node --check scripts/install-aift-review-status.js
      - name: Commit page integrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html family.html school.html employer.html venture.html create-venture.html
          if git diff --cached --quiet; then
            echo "No page changes required"
          else
            git commit -m "Show AIFT review status across requester workspaces [skip ci]"
            git push
          fi
