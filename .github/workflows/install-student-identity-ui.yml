name: Install AIFT Student Identity UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-student-identity-ui.yml"
      - "scripts/install-student-identity-ui.js"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install shared identity UI
        run: node scripts/install-student-identity-ui.js
      - name: Validate JavaScript
        run: node --check aift-student-identity-ui.js
      - name: Commit page integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html school.html employer.html
          if git diff --cached --quiet; then
            echo "No page changes required"
          else
            git commit -m "Expose verified AIFT Student IDs across Student School and Employer [skip ci]"
            git push
          fi
