name: Family Advantage home patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-family-advantage-home.yml"

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch home
        run: python3 .github/scripts/add_family_advantage.py
      - name: Validate
        run: |
          grep -q 'class="family-advantage-card"' home.html
          grep -q 'href="family.html"' home.html
          grep -q 'Free access with your AIFT account' home.html
      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home.html
          git commit -m "Add Family Advantage standalone home card"
          git push origin main
