name: Fix Student Career Hub crash

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-student-career-hub-crash.yml

permissions:
  contents: write

jobs:
  fix-career-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path=Path('student-career-hub-v2.js')
          text=path.read_text(encoding='utf-8')
          pattern=r'''  async function init\(\)\{\n    ensureStyles\(\);\n    bind\(\);\n    const install=\(\)=>\{injectCategoryCards\(\);injectPassportQuick\(\);renderApplicationsPanel\(\);\};\n    await loadApplications\(\);\n    install\(\);\n    const observer=new MutationObserver\(\(\)=>install\(\)\);\n    const career=document\.getElementById\("section-career"\)\|\|document\.body;\n    observer\.observe\(career,\{childList:true,subtree:true\}\);\n    window\.addEventListener\("aift:activity-updated",event=>\{\n      const source=String\(event\?\.detail\?\.source\|\|""\);\n      if\(source==="student-career-application" \|\| source==="review-status"\) refresh\(\)\.catch\(\(\)=>\{\}\);\n    \}\);\n    window\.AIFTStudentCareerHub=\{refresh,openMarketplace,openApplication,openPassport\};\n  \}'''
          replacement='''  let installFrame=0;

  function installCareerEnhancements(){
    injectCategoryCards();
    renderApplicationsPanel();
    injectPassportQuick().catch(()=>{});
  }

  function scheduleCareerEnhancements(){
    if(installFrame) cancelAnimationFrame(installFrame);
    installFrame=requestAnimationFrame(()=>{
      installFrame=0;
      installCareerEnhancements();
    });
  }

  async function init(){
    ensureStyles();
    bind();
    await loadApplications().catch(()=>{});
    scheduleCareerEnhancements();

    document.addEventListener("studentstudio:pagechange",event=>{
      if(String(event?.detail?.page||"") === "career") scheduleCareerEnhancements();
    });

    window.addEventListener("aift:activity-updated",event=>{
      const source=String(event?.detail?.source||"");
      if(source==="student-career-application" || source==="review-status") refresh().catch(()=>{});
    });
    window.AIFTStudentCareerHub={refresh,openMarketplace,openApplication,openPassport};
  }'''
          text,count=re.subn(pattern,replacement,text,count=1)
          if count!=1: raise SystemExit(f'Career observer patch count={count}')
          path.write_text(text,encoding='utf-8')

          path=Path('student.js')
          text=path.read_text(encoding='utf-8')

          pattern=r'''  /\* =======================================================\n     LIVE BACKEND DATA\n  ======================================================== \*/\n\nawait loadStudentCareerHubData\(\);\n\n\nrenderStudentCareerOpportunities\(\);\n\n\nrenderStudentCareerVentures\(\);\n\n\nrenderStudentCareerApplications\(\);\n\n\nupdateStudentCareerSavedCount\(\);\n\n\}'''
          replacement='''  /* =======================================================
     LIVE BACKEND DATA
     Render first. Network hydration happens after first paint.
  ======================================================== */

  renderStudentCareerOpportunities();
  renderStudentCareerVentures();
  renderStudentCareerApplications();
  updateStudentCareerSavedCount();

  const hydrateCareerHub = async () => {
    try{
      await loadStudentCareerHubData();
      if(document.body.dataset.studentSection !== "career") return;
      renderStudentCareerOpportunities();
      renderStudentCareerVentures();
      renderStudentCareerApplications();
      updateStudentCareerSavedCount();
    }catch(error){
      console.error("Career Hub background hydration failed:",error);
    }
  };

  requestAnimationFrame(()=>setTimeout(hydrateCareerHub,0));

}'''
          text,count=re.subn(pattern,replacement,text,count=1)
          if count!=1: raise SystemExit(f'Career hydration patch count={count}')

          pattern=r'''function openStudentStudioPage\(\n  requestedPage,\n  options = \{\}\n\)\{\n  const page =\n    normalizeStudentStudioPage\(\n      requestedPage\n    \);\n\n  activeStudentStudioPage = page;'''
          replacement='''function openStudentStudioPage(
  requestedPage,
  options = {}
){
  const page =
    normalizeStudentStudioPage(
      requestedPage
    );

  if(
    page === "career" &&
    activeStudentStudioPage === "career" &&
    document.body.dataset.studentSection === "career" &&
    document.getElementById("studentCareerWorkspace")?.children?.length
  ){
    setStudentStudioActiveNavigation(page);
    setStudentStudioActiveMobileNavigation(page);
    return;
  }

  activeStudentStudioPage = page;'''
          text,count=re.subn(pattern,replacement,text,count=1)
          if count!=1: raise SystemExit(f'Career reclick patch count={count}')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check student-career-hub-v2.js
          node --check student-career-hub-markets-v2.js
          node --check student-passport.js
          node --check student.js

      - name: Commit fixes
        run: |
          git config user.name "AIFT Runtime Fix"
          git config user.email "actions@users.noreply.github.com"
          git add student-career-hub-v2.js student.js
          git commit -m "Fix Student Career Hub crash and slow loading"
          git push
