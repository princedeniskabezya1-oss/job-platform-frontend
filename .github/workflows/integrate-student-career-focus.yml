name: Integrate Student Career Hub focus

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-student-career-focus.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch student portal files
        run: python3 scripts/integrate_student_career_focus.py

      - name: Validate student portal
        run: |
          node --check student.js
          grep -q 'studentCareerFocusState' student.js
          grep -q 'id="studentCareerFocusPanel"' student.js
          grep -q 'openStudentCareerFocus(normalizedAction)' student.js
          grep -q 'studentCareerFocusNativeStyles' student.html

      - name: Commit native Student Career Hub
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.js student.html
          git commit -m "Integrate focused Career Hub directly into student portal"
          git push origin main
