name: Family UI production polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/family-ui-production-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Family production polish
        run: python3 .github/scripts/family_polish.py
      - name: Validate
        run: |
          node --check family-production.js
          grep -q 'images/aift-logo.png' family.html
          grep -q 'New Scholarship' family-production.js
          grep -q 'New Venture' family-production.js
          grep -q 'data-family-mode="family"' family-production.css
      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add family.html family-production.css family-production.js
          git commit -m "Polish Family navigation header and scoped notifications"
          git push origin main
