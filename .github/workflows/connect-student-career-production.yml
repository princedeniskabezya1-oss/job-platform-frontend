name: Connect Student Career Hub production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-student-career-production.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Attach focused production Career Hub assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="student-career-production.css">'
          js='<script src="student-career-production.js"></script>'
          if css not in s:
              s=s.replace('</head>',f'{css}\n</head>',1)
          if js not in s:
              s=s.replace('</body>',f'{js}\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'student-career-production.css' student.html
          grep -q 'student-career-production.js' student.html
          node --check student-career-production.js
          grep -q '/api/scholarships' student-career-production.js
          grep -q '/api/ventures/mine' student-career-production.js
          grep -q '/api/career-events' student-career-production.js
      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.html
          git commit -m "Connect Student Career Hub focused live results"
          git push origin main
