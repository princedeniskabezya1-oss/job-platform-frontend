name: Apply AIFT Investment Workflow UX
"on":
  push:
    branches: [main]
    paths: [".github/workflows/install-aift-investment-workflow.yml","scripts/install-aift-investment-workflow.js"]
permissions: { contents: write }
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/install-aift-investment-workflow.js
      - run: node --check family-production.js && node --check aift-review-center-admin.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-production.js aift-review-center-admin.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Make AIFT investment reviews sequential [skip ci]" && git push; fi
