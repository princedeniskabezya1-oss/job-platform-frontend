name: Compact Family Advantage card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-family-advantage.yml"
      - ".github/scripts/compact_family_advantage.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply compact Family Advantage card
        run: python3 .github/scripts/compact_family_advantage.py
      - name: Validate compact card
        run: |
          grep -q 'Build a stronger future for your family.' home.html
          grep -q 'Included with your AIFT account' home.html
          ! grep -q 'Priority opportunities' home.html
          ! grep -q 'Smart family dashboard' home.html
      - name: Commit home update
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home.html
          git commit -m "Compact Family Advantage home card"
          git push origin main
