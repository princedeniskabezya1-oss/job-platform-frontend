name: Integrate AIFT Student Identity UI
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-aift-identity-ui-links.yml"
      - "scripts/install-aift-identity-ui-links.js"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/install-aift-identity-ui-links.js
      - run: node --check aift-student-identity-ui.js && node --check student-passport.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html school.html employer.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Connect AIFT Student ID UI across portals [skip ci]" && git push; fi
