name: Fix Student Career Venture create button

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-venture-create-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make create venture button white
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('student.js')
          s=p.read_text(encoding='utf-8')
          old='#section-career .student-career-venture-create{min-height:36px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;border:1px solid #7c3aed;border-radius:9px;background:#7c3aed;color:#fff;font-size:8px;font-weight:750;box-shadow:0 6px 16px rgba(124,58,237,.16)}\n    #section-career .student-career-venture-create:hover{background:#6d28d9;border-color:#6d28d9}'
          new='#section-career .student-career-venture-create{min-height:36px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;border:1px solid #d9ddea;border-radius:9px;background:#fff;color:#6d28d9;font-size:8px;font-weight:800;box-shadow:0 6px 16px rgba(15,23,42,.08)}\n    #section-career .student-career-venture-create:hover{background:#f8f7ff;border-color:#c9b8ff;color:#5b21b6}'
          if old not in s:
              raise SystemExit('Create Venture style block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate student.js
        run: |
          node --check student.js
          grep -q 'student-career-venture-create{min-height:36px' student.js
          grep -q 'background:#fff;color:#6d28d9' student.js

      - name: Commit change
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.js
          git commit -m "Make Venture create button visible"
          git push origin main
