name: Fix Career Hub runtime binding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-career-runtime-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make Career Hub binding resilient to student.js rerenders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('student-career-production.js')
          s = p.read_text(encoding='utf-8')

          marker = '  const API_BASE ='
          if marker not in s:
              raise SystemExit('API marker not found')

          inject = '''  function ensureCareerProductionStyles(){
    const id = "studentCareerProductionStyles";
    if(document.getElementById(id)) return;

    const link = document.createElement("link");
    link.id = id;
    link.rel = "stylesheet";
    link.href = "student-career-production.css";
    document.head.appendChild(link);
  }

'''

          if 'function ensureCareerProductionStyles()' not in s:
              s = s.replace(marker, inject + marker, 1)

          start = s.rfind('  function bindCareer(){')
          end = s.rfind('})();')
          if start < 0 or end < start:
              raise SystemExit('bindCareer/footer not found')

          replacement = '''  let delegatedCareerBindingReady = false;

  function bindDelegatedCareerClicks(){
    if(delegatedCareerBindingReady) return;
    delegatedCareerBindingReady = true;

    document.addEventListener(
      "click",
      event => {
        const card = event.target.closest(
          "#section-career .student-career-category-card"
        );

        if(!card) return;

        const section = document.querySelector(
          "#section-career"
        );

        if(!section) return;

        const category = normalizeCategory(card);
        if(!category) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        openCategory(section,category,true);
      },
      true
    );
  }

  function bindCareer(){
    ensureCareerProductionStyles();
    bindDelegatedCareerClicks();

    const section = document.querySelector(
      "#section-career"
    );

    if(!section) return;

    buildWorkspace(section);
    hydrateCounts(section);
  }

  window.AIFTStudentCareerFocus = {
    open(category){
      const section = document.querySelector("#section-career");
      if(section && CATEGORY_CONFIG[category]){
        openCategory(section,category,true);
      }
    },
    refresh(){
      bindCareer();
    }
  };

  ensureCareerProductionStyles();
  bindDelegatedCareerClicks();

  if(document.readyState === "loading"){
    document.addEventListener(
      "DOMContentLoaded",
      bindCareer,
      {once:true}
    );
  }else{
    bindCareer();
  }
})();'''

          s = s[:start] + replacement + s[end+5:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check student-career-production.js
          grep -q 'bindDelegatedCareerClicks' student-career-production.js
          grep -q 'studentCareerProductionStyles' student-career-production.js
          grep -q 'student-career-production.css' student-career-production.js

      - name: Commit runtime fix
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student-career-production.js
          git commit -m "Fix Career Hub category navigation after student rerenders"
          git push origin main
