name: Hide Family Advantage for students

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hide-family-card-for-students.yml
      - .github/scripts/hide_family_card_students.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply student Family Advantage visibility rule
        run: python3 .github/scripts/hide_family_card_students.py
      - name: Validate
        run: |
          grep -q 'id="familyAdvantageCard"' home.html
          grep -q 'function syncFamilyAdvantageVisibility' home.html
          grep -q 'currentRole === "student"' home.html
      - name: Commit
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add home.html
          git commit -m "Hide Family Advantage home card from students"
          git push origin main
