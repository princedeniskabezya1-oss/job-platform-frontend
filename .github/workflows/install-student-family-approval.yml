name: Install Student Family Approval

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-student-family-approval.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node scripts/install-student-family-approval.js
      - run: node --check student.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add Student approval for Family ID connections [skip ci]" && git push; fi
