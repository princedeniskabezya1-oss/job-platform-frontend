name: Fix Student Venture tool interactions

"on":
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-student-venture-tool-interactions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Venture tool interaction repair
        run: python3 scripts/fix_student_venture_tool_interactions.py

      - name: Validate student.js
        run: |
          node --check student.js
          grep -q 'function applyStudentCareerVentureMode(mode)' student.js
          grep -q 'student-career-venture-mode-summary' student.js
          grep -q 'data-career-venture-tool="pitch"' student.js

      - name: Commit change
        run: |
          git config user.name "AIFT Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.js
          git commit -m "Fix Student Venture action interactions"
          git push origin main
