name: Install AIFT Admin Review Center

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-admin-review-center.yml"
      - "scripts/install-admin-review-center.js"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/install-admin-review-center.js
      - run: node --check aift-review-center-admin.js
      - name: Commit Admin Review Center integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No admin page changes required"
          else
            git commit -m "Add AIFT Review Center to Admin Control Center [skip ci]"
            git push
          fi
