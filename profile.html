<body>

<header class="topbar">

<div class="logo">AIFT</div>

<!-- 🔍 CENTER SEARCH -->

style="
width:420px;
padding:10px 16px;

border:1px solid #ddd;
outline:none;
">
</div>


</header>

<div class="layout">
<aside class="left-panel" style="position:sticky;top:80px;height:fit-content;">

<div class="card profile-card">

<div class="banner-wrapper">

<label class="edit-icon banner-edit">

  <aside class="right-panel">

<!-- EXPERIENCE MODAL -->

<h3>Add Experience</h3>

<input id="expCompany" placeholder="Company">
<input id="expStart" placeholder="Start Date">
<input id="expEnd" placeholder="End Date">

</div>

<input id="skillInput">

</div>
</div>
    <!-- ABOUT MODAL -->

<div id="aboutModal" class="modal">
<div class="modal-content">

<h3>Edit About</h3>

<textarea id="aboutInput" style="padding:10px;border:1px solid #ccc;border-radius:6px;height:100px"></textarea>

<button onclick="saveAbout()">Save</button>

</div>
</div>

<script>

const API="https://backend-1-9b6f.onrender.com"
const token=localStorage.getItem("token")
  const socket = io(API);

let currentUser=null

const avatar=document.getElementById("avatar")
const nameEl=document.getElementById("name")
const headline=document.getElementById("headline")
const locationEl=document.getElementById("location")
const bio=document.getElementById("bio")

const experienceList=document.getElementById("experienceList")
const educationList=document.getElementById("educationList")
const skillsList=document.getElementById("skillsList")

async function loadProfile(){

const res=await fetch(API+"/api/users/me",{
headers:{Authorization:"Bearer "+token}
})

currentUser=await res.json()

renderProfile()

}
function goFeed(){
window.location.href="talent.html"
}
function renderProfile(){

avatar.src=currentUser.profileImage||"https://cdn-icons-png.flaticon.com/512/149/149071.png"
  document.getElementById("bannerPreview").src =
currentUser.bannerImage || "https://via.placeholder.com/600x200"

nameEl.innerText=currentUser.name
headline.innerText=currentUser.headline||""
locationEl.innerText=currentUser.location||""
bio.innerText=currentUser.bio||""

const bar=document.getElementById("strengthBar")
if(bar){
bar.style.width=(currentUser.completeness||0)+"%"
}
  document.getElementById("followersCount").innerText =
currentUser.followers?.length || 0

document.getElementById("followingCount").innerText =
currentUser.following?.length || 0
  document.getElementById("createPostAvatar").src =
currentUser.profileImage || "https://cdn-icons-png.flaticon.com/512/149/149071.png"

renderExperience()
renderEducation()
renderSkills()
loadMyPosts()
}

function renderExperience(){

experienceList.innerHTML=""

if(!Array.isArray(currentUser.experience)) return

currentUser.experience.forEach((e,i)=>{

experienceList.innerHTML += `

<div class="experience-card">

<h4>${e.title || ""}</h4>
<p class="company">${e.company || ""}</p>
<p class="date">${e.startDate || ""} - ${e.endDate || "Present"}</p>

<button onclick="editExperience(${i})">Edit</button>
<button onclick="deleteExperience(${i})">Delete</button>

</div>

`

})

}
function openAbout(){

aboutInput.value = currentUser.bio || ""

aboutModal.style.display="flex"

}

async function saveAbout(){

await updateProfile({
bio: aboutInput.value
})

aboutModal.style.display="none"

}
function renderEducation(){

educationList.innerHTML=""

if(!Array.isArray(currentUser.education)) return

currentUser.education.forEach((e,i)=>{

educationList.innerHTML += `

<div>

<h4>${e.school || ""}</h4>
<p>${e.degree || ""}</p>

<button onclick="editEducation(${i})">Edit</button>
<button onclick="deleteEducation(${i})">Delete</button>

</div>

`

})

}

function renderSkills(){

skillsList.innerHTML=""

if(!Array.isArray(currentUser.skills)) return

currentUser.skills.forEach((s,i)=>{

const span=document.createElement("span")

span.className="skill-tag"
span.innerHTML = `
${s}
<span style="margin-left:6px;cursor:pointer;color:#666" onclick="deleteSkill(${i})">✕</span>
`

span.draggable=true

span.ondragstart=(e)=>{
e.dataTransfer.setData("index",i)
}

span.ondrop=(e)=>{

const from=e.dataTransfer.getData("index")

const list=currentUser.skills

const item=list.splice(from,1)[0]

list.splice(i,0,item)

updateProfile({skills:list})

}

span.ondragover=(e)=>e.preventDefault()

skillsList.appendChild(span)

})

}

function openExp(){
expModal.style.display="flex"
}

function editExperience(index){

const exp=currentUser.experience[index]

expTitle.value=exp.title
expCompany.value=exp.company
expStart.value=exp.startDate
expEnd.value=exp.endDate

expModal.dataset.edit=index

expModal.style.display="flex"

}

function openEdu(){
eduModal.style.display="flex"
}

function editEducation(index){

const edu=currentUser.education[index]

eduSchool.value=edu.school
eduDegree.value=edu.degree

eduModal.dataset.edit=index

eduModal.style.display="flex"

}

function openSkill(){
skillModal.style.display="flex"
}

async function saveExperience(){

const exp={
title:expTitle.value,
company:expCompany.value,
startDate:expStart.value,
endDate:expEnd.value
}

const list=currentUser.experience||[]

if(expModal.dataset.edit){

list[expModal.dataset.edit]=exp
delete expModal.dataset.edit

}else{

list.push(exp)

}

await updateProfile({experience:list})

expModal.style.display="none"

}

async function deleteExperience(index){

const list=currentUser.experience
list.splice(index,1)

await updateProfile({experience:list})

}

async function saveEducation(){

const edu={
school:eduSchool.value,
degree:eduDegree.value
}

const list=currentUser.education||[]

if(eduModal.dataset.edit){

list[eduModal.dataset.edit]=edu
delete eduModal.dataset.edit

}else{

list.push(edu)

}

await updateProfile({education:list})

eduModal.style.display="none"

}

async function deleteEducation(index){

const list=currentUser.education
list.splice(index,1)

await updateProfile({education:list})

}

async function saveSkill(){

const skill=skillInput.value

const list=currentUser.skills||[]

list.push(skill)

await updateProfile({skills:list})

skillModal.style.display="none"

}
function toggleCommentBox(postId){

const wrapper = document.getElementById("comments-wrapper-"+postId)

if(wrapper.style.display==="none"){
wrapper.style.display="block"

const input = document.getElementById("comment-input-"+postId)
if(input) input.focus()

loadComments(postId)

}else{
wrapper.style.display="none"
}

}
  async function submitComment(postId){

const input=document.getElementById("comment-input-"+postId)
const text=input.value.trim()

if(!text) return

input.value=""

await fetch(API+"/api/posts/"+postId+"/comment",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({text})
})

loadComments(postId)
}
 async function loadComments(postId){

const res=await fetch(API+"/api/posts/"+postId,{
headers:{Authorization:"Bearer "+token}
})

const post=await res.json()
const container=document.getElementById("comments-"+postId)

container.innerHTML=""

post.comments.forEach(c=>{

container.innerHTML+=`
<div style="margin-top:10px">

<div class="comment-bubble">
<strong>${c.user.name}</strong><br>
${c.text}
</div>

<div style="margin-top:5px;">
<button onclick="showReplyInput('${postId}','${c._id}')"
style="background:none;border:none;color:#0a66c2;cursor:pointer;">
Reply
</button>
</div>

<div id="reply-${c._id}"></div>

</div>
`

})

}
  function showReplyInput(postId, commentId){

const container = document.getElementById("reply-"+commentId)

container.innerHTML = `
<div style="display:flex;gap:8px;margin-top:6px;">
<input id="replyInput-${commentId}" placeholder="Write a reply..."
style="flex:1;padding:6px 10px;border-radius:20px;border:1px solid #ddd;">
<button onclick="submitReply('${postId}','${commentId}')">Send</button>
</div>
`

}
  async function submitReply(postId, commentId){

const input = document.getElementById("replyInput-"+commentId)
const text = input.value.trim()

if(!text) return

await fetch(API+"/api/posts/"+postId+"/comment/"+commentId+"/reply",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({text})
})

loadComments(postId)

}
async function toggleLike(id, element){

const icon = element.querySelector("svg")

// 👉 target the reactions text
const stat = document.querySelector("#post-"+id+" .post-stats div")

try{

const res = await fetch(API+"/api/posts/"+id+"/like",{
method:"PATCH",
headers:{Authorization:"Bearer "+token}
})

const data = await res.json()

// ✅ update button UI
if(data.liked){
element.classList.add("liked")
icon.setAttribute("fill","#0a66c2")
}else{
element.classList.remove("liked")
icon.setAttribute("fill","none")
}

// ✅ update count instantly (NO reload)
if(stat){
stat.innerText = data.likes + " reactions"
}

}catch(err){
console.error("Like failed:", err)
}

}
  function openShareModal(id){

document.getElementById("shareModal").style.display="flex"

document.getElementById("copyLinkBtn").onclick=function(){

const link=window.location.origin+"/profile.html#post-"+id
navigator.clipboard.writeText(link)

alert("Link copied")

}

}
async function deleteSkill(index){

const list=currentUser.skills
list.splice(index,1)

await updateProfile({skills:list})

}

async function updateProfile(data){

const formData=new FormData()

Object.keys(data).forEach(key=>{

if(Array.isArray(data[key])){

formData.append(key,JSON.stringify(data[key]))

}else{

formData.append(key,data[key])

}

})

const res=await fetch(API+"/api/users/profile",{

method:"PATCH",

headers:{Authorization:"Bearer "+token},

body:formData

})

currentUser=await res.json()

renderProfile()

}

document.getElementById("photoUpload").onchange=async function(){

const file=this.files[0]

const formData=new FormData()

formData.append("profileImage",file)

const res=await fetch(API+"/api/users/profile",{

method:"PATCH",

headers:{Authorization:"Bearer "+token},

body:formData

})

currentUser=await res.json()

renderProfile()

}
document.getElementById("bannerUpload").onchange = async function(){

const file=this.files[0]

const formData=new FormData()

formData.append("bannerImage",file)

const res=await fetch(API+"/api/users/profile",{

method:"PATCH",

headers:{Authorization:"Bearer "+token},

body:formData

})

currentUser=await res.json()

renderProfile()

}
function openPublicProfile(){

window.location.href="public-profile.html?id="+currentUser._id

}
  async function deletePost(postId){

await fetch(API+"/api/posts/"+postId,{
method:"DELETE",
headers:{Authorization:"Bearer "+token}
})

loadMyPosts()

}
  function editPost(postId,content){

const newText = prompt("Edit your post:", content)

if(!newText) return

updatePost(postId,newText)

}

async function updatePost(postId,text){

await fetch(API+"/api/posts/"+postId,{
method:"PATCH",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({content:text})
})

loadMyPosts()

}
window.onclick=function(e){

document.querySelectorAll(".modal").forEach(modal=>{
if(e.target===modal){
modal.style.display="none"
}
})

}
async function loadMyPosts(){

try{

if(!currentUser || !currentUser._id){
console.warn("User not ready yet")
return
}

const res = await fetch(API+"/api/posts/user/"+currentUser._id,{
headers:{
Authorization:"Bearer "+token
}
})

if(!res.ok){

const errorText = await res.text()
console.error("Posts failed:", errorText)

return

}

const posts = await res.json()

console.log("Loaded posts:", posts)

const container = document.getElementById("myPosts")

container.innerHTML=""

document.getElementById("postCount").innerText = posts.length

if(posts.length === 0){

container.innerHTML="<p style='color:#666'>No posts yet</p>"
return

}

posts.forEach(post=>{

const liked = post.likes?.some(
id => id.toString() === currentUser._id
);

container.innerHTML += `
<div class="card post-card-clean" id="post-${post._id}">

loadProfile()
  // 🔥 REALTIME POST UPDATE
socket.on("new_post", post => {

if(post.author?._id !== currentUser._id) return

prependPost(post)

})

// 🔥 REALTIME DELETE
socket.on("post_deleted", data => {

const post = document.getElementById("post-"+data.postId)

if(post) post.remove()

})

// 🔥 REALTIME LIKE
socket.on("post_like", data => {

const stat = document.querySelector("#post-"+data.postId+" .post-stats div")

if(stat){
stat.innerText = data.likes + " reactions"
}

})
  // 🔥 REALTIME COMMENT
socket.on("new_comment", data => {

const container = document.getElementById("comments-"+data.postId)
if(!container) return

container.innerHTML += `
<div style="margin-top:10px">
<strong>${data.comment.user.name}</strong><br>
${data.comment.text}
</div>
`

// update count
const stat = document.querySelector("#post-"+data.postId+" .post-stats div:nth-child(2)")
if(stat){
stat.innerText = data.totalComments + " comments"
}

})
  let activeMenu = null

function togglePostMenu(id, event){

event.stopPropagation()

const menu = document.getElementById("menu-"+id)

if(activeMenu && activeMenu !== menu){
activeMenu.style.display = "none"
}

const open = menu.style.display === "block"
menu.style.display = open ? "none" : "block"

activeMenu = open ? null : menu
}

document.addEventListener("click", ()=>{
if(activeMenu){
activeMenu.style.display = "none"
activeMenu = null
}
})
  function prependPost(post){

container.innerHTML = `

  ${post.content ? `<div class="post-content">${post.content}</div>` : ""}

    <div>${post.comments?.length || 0} comments</div>
  </div>

}
