<!DOCTYPE html>
<html lang="en">

  <link rel="icon" href="images/aift-logo.png">
  <style>
    :root{--blue:#1485ea;--blue-dark:#0870cf;--green:#169a73;--ink:#132139;--muted:#6d7b8f;--line:#dfe7f0;--bg:#f4f8fc;--card:#fff;--soft:#e9f4ff;--danger:#bb2832;--gold:#b67a14}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{color-scheme:light}body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.topbar-inner{width:min(100%,1320px);height:66px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:13px}.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:#44536a;background:var(--card);border:1px solid var(--line);border-radius:50%}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:72px;height:32px;object-fit:contain}.brand span{padding-left:10px;color:var(--blue);border-left:1px solid var(--line)}.theme-btn{margin-left:auto}.page{width:min(100%,1320px);margin:auto;padding:30px 22px 60px}.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{margin:0 0 7px;color:var(--green);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.welcome h1{margin:0;font-size:clamp(32px,4vw,48px);letter-spacing:-.05em}.welcome p{margin:7px 0 0;color:var(--muted)}.browse{min-height:43px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;background:var(--blue);border-radius:11px;font-size:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(31,54,86,.05)}.stat span,.stat strong,.stat small{display:block}.stat span{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.stat strong{margin-top:7px;font-size:27px}.stat small{margin-top:4px;color:var(--muted);font-size:10px}.main-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.75fr);gap:16px}.panel{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px rgba(31,54,86,.06)}.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h2{margin:0;font-size:19px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.continue{min-height:245px;padding:26px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 88% 18%,rgba(72,219,174,.28),transparent 28%),linear-gradient(135deg,#10243e,#075b8d);border:0}.continue:after{content:"";position:absolute;width:220px;height:220px;right:-90px;bottom:-135px;border:34px solid rgba(255,255,255,.07);border-radius:50%}.continue-content{position:relative;z-index:1;max-width:620px}.continue .eyebrow{color:#8ee5c8}.continue h2{margin:0;font-size:clamp(27px,4vw,42px);letter-spacing:-.045em}.continue p{max-width:580px;margin:9px 0 18px;color:rgba(255,255,255,.74);line-height:1.55}.continue-actions{display:flex;align-items:center;gap:14px}.continue-actions a{min-height:42px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;color:#0c4770;text-decoration:none;background:#fff;border-radius:11px;font-size:12px;font-weight:900}.progress-label{font-size:12px;font-weight:800}.progress-track{height:8px;margin-top:18px;overflow:hidden;background:rgba(255,255,255,.18);border-radius:999px}.progress-fill{height:100%;background:#55d4ad;border-radius:inherit}.side-stack{display:grid;gap:16px}.level-card{background:linear-gradient(145deg,#fff,#edf7ff)}.level-top{display:flex;align-items:center;gap:13px}.level-icon{width:48px;height:48px;display:grid;place-items:center;color:var(--gold);background:#fff4d9;border-radius:14px}.level-icon svg{width:25px;height:25px}.level-card h2{margin:0;font-size:18px}.level-card p{margin:4px 0 0;color:var(--muted);font-size:11px}.level-bar{height:7px;margin:17px 0 8px;overflow:hidden;background:#e5ebf2;border-radius:999px}.level-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#40c99b)}.level-note{color:var(--muted);font-size:10px}.updates h2{margin:0 0 10px;font-size:17px}.update{padding:11px 0;border-top:1px solid #edf1f5}.update:first-of-type{border-top:0}.update strong,.update span,.update small{display:block}.update strong{font-size:12px}.update span{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45}.update small{margin-top:5px;color:#9aa5b4;font-size:9px}.section{margin-top:16px}.course-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.course{min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px}.cover{height:130px;display:grid;place-items:center;color:var(--blue);background:linear-gradient(145deg,#dff0ff,#dcf7eb);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover svg{width:38px;height:38px}.course-body{padding:14px}.course-body h3{margin:0;font-size:15px}.course-body p{margin:5px 0 12px;color:var(--muted);font-size:10px}.course-progress{height:6px;overflow:hidden;background:#e8edf3;border-radius:999px}.course-progress span{display:block;height:100%;background:var(--blue)}.course-foot{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.course-foot span{color:var(--muted);font-size:9px}.course-foot a{padding:7px 9px;color:var(--blue);text-decoration:none;background:var(--soft);border-radius:8px;font-size:9px;font-weight:900}.request-list{display:grid;gap:9px}.request{padding:13px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:13px}.request-avatar{width:42px;height:42px;display:grid;place-items:center;overflow:hidden;color:var(--blue);background:var(--soft);border-radius:50%;font-size:11px;font-weight:900}.request-avatar img{width:100%;height:100%;object-fit:cover}.request strong,.request span{display:block}.request strong{font-size:12px}.request span{margin-top:3px;color:var(--muted);font-size:10px}.request-state{padding:5px 7px;color:#986300;background:#fff1c9;border-radius:999px;font-size:8px;font-weight:900;text-transform:capitalize}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.loading{min-height:55vh;display:grid;place-items:center;text-align:center}.spinner{width:36px;height:36px;margin:auto;border:3px solid #dcecff;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    html[data-theme="dark"]{color-scheme:dark;--ink:#f3f7fc;--muted:#aab7c9;--line:#304055;--bg:#101923;--card:#172230;--soft:#1e3852}html[data-theme="dark"] .topbar{background:rgba(16,25,35,.88)}html[data-theme="dark"] .icon-btn{color:#c5d0df}html[data-theme="dark"] .level-card{background:linear-gradient(145deg,#172230,#192c3c)}html[data-theme="dark"] .level-bar,html[data-theme="dark"] .course-progress{background:#2a394b}html[data-theme="dark"] .update{border-color:#2b394b}
    @media(max-width:920px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.main-grid{grid-template-columns:1fr}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){.topbar-inner{height:58px;padding:0 11px}.icon-btn{width:36px;height:36px}.brand img{width:60px;height:28px}.brand span{padding-left:7px;font-size:13px}.page{padding:16px 10px 35px}.welcome{align-items:center;margin-bottom:13px}.welcome .eyebrow,.welcome p{display:none}.welcome h1{font-size:23px;letter-spacing:-.035em}.browse{min-height:37px;padding:0 10px;font-size:9px}.stats{gap:7px}.stat{padding:12px;border-radius:13px}.stat strong{font-size:21px}.main-grid,.side-stack{gap:10px}.panel{padding:15px;border-radius:17px}.continue{min-height:220px;padding:20px}.continue h2{font-size:26px}.continue p{font-size:11px}.course-grid{grid-template-columns:1fr}.cover{height:150px}.request{grid-template-columns:38px minmax(0,1fr)}.request-avatar{width:38px;height:38px}.request-state{grid-column:2;justify-self:start}}
    .topbar-inner{position:relative}.brand{position:absolute;left:50%;transform:translateX(-50%)}.learning-menu-wrap{position:relative;margin-left:auto}.learning-menu{position:absolute;top:calc(100% + 10px);right:0;width:260px;padding:8px;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(20,35,59,.18);backdrop-filter:blur(18px)}.learning-menu.hidden{display:none}.learning-menu a,.learning-menu button{width:100%;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:11px;color:var(--ink);text-align:left;text-decoration:none;background:transparent;border:0;border-radius:10px;font-size:13px;font-weight:750}.learning-menu a:hover,.learning-menu button:hover{color:var(--blue);background:var(--soft)}.learning-menu svg{flex:0 0 auto;width:18px;height:18px}.learning-menu-divider{height:1px;margin:6px 4px;background:var(--line)}html[data-learning-theme="dark"] .learning-menu,html[data-theme="dark"] .learning-menu{background:rgba(23,34,48,.98);border-color:#34445a}html[data-learning-theme="dark"] .learning-menu a,html[data-learning-theme="dark"] .learning-menu button,html[data-theme="dark"] .learning-menu a,html[data-theme="dark"] .learning-menu button{color:#f4f7fb}html[data-learning-theme="dark"] .learning-menu a:hover,html[data-learning-theme="dark"] .learning-menu button:hover,html[data-theme="dark"] .learning-menu a:hover,html[data-theme="dark"] .learning-menu button:hover{background:#203249}html[data-learning-theme="dark"] .learning-menu-divider,html[data-theme="dark"] .learning-menu-divider{background:#34445a}@media(max-width:760px){.learning-menu{position:fixed;top:64px;right:10px;width:min(270px,calc(100vw - 20px))}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><button class="icon-btn" type="button" onclick="location.href='groups.html'" aria-label="Back to Learning"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button><a class="brand" href="groups.html" aria-label="AIFT Learning home"><img src="images/aift-logo.png" alt="AIFT"></a><div class="learning-menu-wrap"><button class="icon-btn" id="learningMenuButton" type="button" onclick="toggleLearningMenu(event)" aria-label="Open Learning menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><nav class="learning-menu hidden" id="learningMenu" aria-label="Learning menu"><a href="learning-courses.html"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>Learn a Skill</a><a href="learning-teachers.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-2a7 7 0 0 1 14 0v2M18 8h4M20 6v4"></path></svg>Find a Teacher</a><a href="learning-certificates.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"></circle><path d="M8.2 13.9 7 23l5-3 5 3-1.2-9.1"></path></svg>Certificates</a><a href="learning-dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Dashboard</a><div class="learning-menu-divider"></div><button type="button" onclick="toggleTheme();closeLearningMenu()"><svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg><span id="menuThemeLabel">Use dark theme</span></button></nav></div></div></header>
  <main class="page"><div class="loading" id="loading"><div><div class="spinner"></div><h2>Opening your dashboard</h2><p>Loading your real Learning activity.</p></div></div><div class="hidden" id="dashboard"></div></main>
  <script>
    const API="https://backend-1-9b6f.onrender.com",token=()=>["token","authToken","jwt","aiftToken"].map(key=>localStorage.getItem(key)).find(Boolean)||"",esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]),id=value=>String(value?._id||value?.id||value||""),name=(value,fallback="AIFT")=>String(value?.name||value?.schoolName||fallback),image=value=>/^https:\/\//i.test(String(value||""))||/^data:image\//i.test(String(value||""))||/^(?:\.\/)?images\//i.test(String(value||""))?String(value):"",date=value=>{const d=value?new Date(value):null;return !d||Number.isNaN(d.getTime())?"":d.toLocaleDateString([],{month:"short",day:"numeric"})};
    const icons={book:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>',award:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"></circle><path d="m9 12-1 10 4-3 4 3-1-10"></path></svg>'};
    async function api(path){const response=await fetch(API+path,{headers:{Accept:"application/json",Authorization:`Bearer ${token()}`}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Request failed");return data}
    function notifyChrome(active){if(parent!==window)parent.postMessage({type:"aift:learning-chrome",active:!!active},location.origin)}
    function applyTheme(value){const dark=value==="dark",label=document.getElementById("menuThemeLabel");document.documentElement.dataset.theme=dark?"dark":"light";if(label)label.textContent=dark?"Use light theme":"Use dark theme"}
    function toggleTheme(){const next=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("aiftLearningTheme",next);applyTheme(next)}
    function updates(items=[]){return items.length?items.map(item=>`<div class="update"><strong>${esc(item.title||"Learning update")}</strong><span>${esc(item.text||"Your Learning activity changed.")}</span><small>${esc(date(item.createdAt))}</small></div>`).join(""):'<div class="empty">No recent Learning updates.</div>'}
    function courseCards(items=[],teacher=false){return items.length?`<div class="course-grid">${items.map(course=>{const cover=image(course.coverImage||course.bannerImage),progress=Number(course.progress||0),lesson=id(course.nextLesson?.id),href=teacher?`class-builder.html?id=${encodeURIComponent(id(course))}`:`class-view.html?classId=${encodeURIComponent(id(course))}${lesson?`&lessonId=${encodeURIComponent(lesson)}`:""}`;return`<article class="course"><div class="cover">${cover?`<img src="${esc(cover)}" alt="">`:icons.book}</div><div class="course-body"><h3>${esc(course.title||"Untitled course")}</h3><p>${esc(course.subject||course.category||name(course.schoolId,"AIFT Learning"))}</p>${teacher?"":`<div class="course-progress"><span style="width:${Math.max(0,Math.min(100,progress))}%"></span></div>`}<div class="course-foot"><span>${teacher?`${course.studentCount||0} learners · ${course.published?"Published":course.publicationRequestStatus||"Draft"}`:`${progress}% complete`}</span><a href="${esc(href)}">${teacher?"Manage":"Continue"}</a></div></div></article>`}).join("")}</div>`:'<div class="empty">No courses are connected to this dashboard yet.</div>'}
    function renderLearner(data){const m=data.metrics||{},course=data.continueCourse,progress=Number(course?.progress||0),lesson=id(course?.nextLesson?.id),href=course?`class-view.html?classId=${encodeURIComponent(id(course))}${lesson?`&lessonId=${encodeURIComponent(lesson)}`:""}`:"learning-courses.html",level=data.level||{};return`<header class="welcome"><div><p class="eyebrow">Your Learning</p><h1>Welcome back, ${esc((data.viewer?.name||"Learner").split(" ")[0])}</h1><p>Continue learning and build skills you can prove.</p></div><a class="browse" href="learning-courses.html">Browse courses ${icons.arrow}</a></header><section class="stats"><article class="stat"><span>Courses</span><strong>${m.enrolledCourses||0}</strong><small>Currently enrolled</small></article><article class="stat"><span>Average progress</span><strong>${m.averageProgress||0}%</strong><small>Across your courses</small></article><article class="stat"><span>This week</span><strong>${m.completedThisWeek||0}</strong><small>Lessons completed</small></article><article class="stat"><span>Certificates</span><strong>${m.certificates||0}</strong><small>Verified achievements</small></article></section><section class="main-grid"><article class="panel continue"><div class="continue-content"><p class="eyebrow">${course?"Continue learning":"Start learning"}</p><h2>${esc(course?.title||"Choose your first AIFT course")}</h2><p>${course?`${course.completedLessons||0} of ${course.totalLessons||0} lessons completed${course.nextLesson?.title?` · Next: ${course.nextLesson.title}`:""}`:"Explore published courses and your progress will be saved here."}</p><div class="continue-actions"><a href="${esc(href)}">${course?"Continue course":"Browse courses"} ${icons.arrow}</a><span class="progress-label">${progress}% complete</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,progress))}%"></div></div></div></article><aside class="side-stack"><article class="panel level-card"><div class="level-top"><span class="level-icon">${icons.award}</span><div><p class="eyebrow">Learning level</p><h2>${esc(level.name||"Beginner")}</h2><p>${level.nextLevelAt?`${level.remaining} more completed lessons to level up.`:"Keep strengthening your verified skills."}</p></div></div><div class="level-bar"><span style="width:${level.nextLevelAt?Math.min(100,Math.round((level.completedLessons/level.nextLevelAt)*100)):100}%"></span></div><div class="level-note">${level.completedLessons||0} lessons completed</div></article><article class="panel updates"><h2>Recent updates</h2>${updates(data.updates||[])}</article></aside></section><section class="panel section"><div class="panel-head"><div><h2>My courses</h2><p>Continue any enrolled course from your saved position.</p></div></div>${courseCards(data.courses||[])}</section>`}
    function requestRows(items=[]){return items.length?`<div class="request-list">${items.map(item=>{const sender=item.sender||{},photo=image(sender.profileImage||sender.avatar),initials=String(sender.name||"A").split(/\s+/).slice(0,2).map(part=>part[0]).join("").toUpperCase();return`<article class="request"><span class="request-avatar">${photo?`<img src="${esc(photo)}" alt="">`:esc(initials)}</span><div><strong>${esc(sender.name||item.title||"Training request")}</strong><span>${esc(item.metadata?.topic||item.text||"Requested training")}</span></div><span class="request-state">${esc(item.actionState||"pending")}</span></article>`}).join("")}</div>`:'<div class="empty">No training requests are waiting.</div>'}
    function renderTeacher(data){const m=data.metrics||{},course=data.courses?.[0];return`<header class="welcome"><div><p class="eyebrow">Teacher workspace</p><h1>Welcome back, ${esc((data.viewer?.name||"Teacher").split(" ")[0])}</h1><p>Manage courses, learners and new training requests.</p></div><a class="browse" href="learning-courses.html">Submit a course ${icons.arrow}</a></header><section class="stats"><article class="stat"><span>Active learners</span><strong>${m.activeLearners||0}</strong><small>Across your courses</small></article><article class="stat"><span>Courses</span><strong>${m.totalCourses||0}</strong><small>${m.publishedCourses||0} published</small></article><article class="stat"><span>Training requests</span><strong>${m.trainingRequests||0}</strong><small>Waiting for response</small></article><article class="stat"><span>Admin review</span><strong>${m.pendingCourses||0}</strong><small>Course submissions</small></article></section><section class="main-grid"><article class="panel continue"><div class="continue-content"><p class="eyebrow">Teaching focus</p><h2>${esc(course?.title||"Create your next learning experience")}</h2><p>${course?`${course.studentCount||0} learners · ${course.published?"Published on AIFT Learning":course.publicationRequestStatus||"Not published"}`:"Submit a course proposal and follow its Admin review from this dashboard."}</p><div class="continue-actions"><a href="${course?`class-builder.html?id=${encodeURIComponent(id(course))}`:"learning-courses.html"}">${course?"Open course builder":"Submit a course"} ${icons.arrow}</a></div></div></article><aside class="panel updates"><h2>Recent updates</h2>${updates(data.updates||[])}</aside></section><section class="panel section"><div class="panel-head"><div><h2>Training requests</h2><p>Learners requesting guidance in your areas of expertise.</p></div></div>${requestRows(data.trainingRequests||[])}</section><section class="panel section"><div class="panel-head"><div><h2>My courses</h2><p>Published, pending and draft course activity.</p></div></div>${courseCards(data.courses||[],true)}</section>`}
    async function init(){if(!token()){location.replace("login.html");return}applyTheme(localStorage.getItem("aiftLearningTheme"));notifyChrome(true);addEventListener("pagehide",()=>notifyChrome(false),{once:true});try{const data=await api("/api/classes/learning/dashboard");document.getElementById("loading").classList.add("hidden");const box=document.getElementById("dashboard");box.classList.remove("hidden");box.innerHTML=data.mode==="teacher"?renderTeacher(data):renderLearner(data)}catch(error){document.getElementById("loading").innerHTML=`<div><h2>Dashboard unavailable</h2><p>${esc(error.message)}</p><button class="icon-btn" type="button" onclick="location.reload()" aria-label="Retry">↻</button></div>`}}
    function closeLearningMenu(){const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton");menu?.classList.add("hidden");button?.setAttribute("aria-expanded","false")}function toggleLearningMenu(event){event?.stopPropagation();const menu=document.getElementById("learningMenu"),button=document.getElementById("learningMenuButton"),opening=menu?.classList.contains("hidden");if(!menu)return;menu.classList.toggle("hidden",!opening);button?.setAttribute("aria-expanded",String(opening))}document.addEventListener("click",event=>{if(!event.target.closest(".learning-menu-wrap"))closeLearningMenu()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeLearningMenu()});
    init();
  </script>
</body>
</html>
