/* =========================================================
   INITIALIZE
========================================================= */

async function initializeEmployerKabezya(){

  const elements =
    getEmployerKabezyaElements();


  /*
   * Render immediately.
   * Conversation-history failure must never prevent a
   * completely new Employer conversation.
   */
  renderEmployerKabezyaConversation();

  renderEmployerKabezyaRecentConversations();

  syncEmployerKabezyaComposer();


  if (
    !employerKabezyaState
      .listenersBound
  ) {

    employerKabezyaState
      .listenersBound =
      true;


    if (elements.input) {

      elements.input.addEventListener(
        "input",
        () => {

          resizeEmployerKabezyaInput();

          syncEmployerKabezyaComposer();

        }
      );


      elements.input.addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
              "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendEmployerKabezyaMessage();

          }

        }
      );

    }


    if (elements.attach) {

      elements.attach.addEventListener(
        "click",
        openEmployerKabezyaFilePicker
      );

    }

  }


  const alreadyInitialized =
    employerKabezyaState
      .initialized;


  employerKabezyaState
    .initialized =
    true;


  try {

    await loadEmployerKabezyaRecentConversations();

  } catch (error) {

    console.error(
      "Employer Kabezya history initialization failed:",
      error
    );


    if (!alreadyInitialized) {

      renderEmployerKabezyaRecentConversations();

    }

  }


  return true;

}

function syncEmployerKabezyaComposer(){

  const {

  const hasPrompt =

/* =========================================================
   RECENT CONVERSATIONS — LOAD
========================================================= */

async function loadEmployerKabezyaRecentConversations(){

  if (
    employerKabezyaState
      .historyLoading
  ) {

    return (
      employerKabezyaState
        .conversations
    );

  }


  employerKabezyaState
    .historyLoading =
    true;


  renderEmployerKabezyaRecentConversations();


  try {

    const data =
      await employerKabezyaApi(
        `${getEmployerKabezyaConversationsEndpoint()}?limit=40`
      );


    employerKabezyaState
      .conversations =
      (
        Array.isArray(
          data?.conversations
        )
          ? data.conversations
          : []
      )
        .map(
          normalizeEmployerKabezyaConversation
        )
        .filter(Boolean);


    renderEmployerKabezyaRecentConversations();


    return (
      employerKabezyaState
        .conversations
    );

  } finally {

    employerKabezyaState
      .historyLoading =
      false;


    renderEmployerKabezyaRecentConversations();

  }

}


/* =========================================================
   RECENT CONVERSATIONS — RENDER
========================================================= */

function renderEmployerKabezyaRecentConversations(){

  const {
    recent
  } =
    getEmployerKabezyaElements();


  /*
   * The first Employer Kabezya HTML version did not contain
   * the Recent Conversations host yet.
   *
   * Keeping this renderer null-safe allows us to upgrade the
   * right panel separately without breaking chat.
   */
  if (!recent) {
    return;
  }


  if (
    employerKabezyaState
      .historyLoading &&
    employerKabezyaState
      .conversations.length ===
      0
  ) {

    recent.innerHTML = `
      <div class="emp-kabezya-recent-empty">
        Loading conversations...
      </div>
    `;

    return;
  }


  if (
    employerKabezyaState
      .conversations.length ===
      0
  ) {

    recent.innerHTML = `
      <div class="emp-kabezya-recent-empty">
        No conversations yet.
      </div>
    `;

    return;
  }


  recent.innerHTML =
    employerKabezyaState
      .conversations
      .map(
        conversation => {

          const active =
            conversation.id ===
            employerKabezyaState
              .conversationId;


          return `
            <button
              class="emp-kabezya-recent-item${
                active
                  ? " active"
                  : ""
              }"
              type="button"
              onclick="openEmployerKabezyaConversation('${
                escapeHtml(
                  conversation.id
                )
              }')"
            >

              <span class="emp-kabezya-recent-item-copy">

                <strong>
                  ${
                    escapeHtml(
                      conversation.title ||
                      "Conversation"
                    )
                  }
                </strong>

                <small>
                  ${
                    escapeHtml(
                      formatEmployerKabezyaConversationDate(
                        conversation.lastMessageAt
                      )
                    )
                  }
                </small>

              </span>

            </button>
          `;

        }
      )
      .join("");

}


/* =========================================================
   CONVERSATION DATE
========================================================= */

function formatEmployerKabezyaConversationDate(
  value
){

  if (!value) {
    return "";
  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  const now =
    new Date();


  const sameDay =
    (
      now.getFullYear() ===
        date.getFullYear() &&
      now.getMonth() ===
        date.getMonth() &&
      now.getDate() ===
        date.getDate()
    );


  if (sameDay) {

    return date
      .toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }


  return date
    .toLocaleDateString(
      [],
      {
        month:"short",
        day:"numeric"
      }
    );

}


/* =========================================================
   OPEN SAVED CONVERSATION
========================================================= */

async function openEmployerKabezyaConversation(
  conversationId
){

  const id =
    String(
      conversationId ||
      ""
    ).trim();


  if (
    !id ||
    employerKabezyaState
      .conversationLoading ||
    employerKabezyaState
      .sending
  ) {

    return false;

  }


  employerKabezyaState
    .conversationLoading =
    true;


  try {

    const data =
      await employerKabezyaApi(
        `${
          getEmployerKabezyaConversationsEndpoint()
        }/${encodeURIComponent(id)}`
      );


    const conversation =
      normalizeEmployerKabezyaConversation(
        data?.conversation ||
        data
      );


    if (!conversation) {

      throw new Error(
        "The Kabezya conversation could not be loaded."
      );

    }


    setEmployerKabezyaConversation(
      conversation
    );


    renderEmployerKabezyaConversation();

    renderEmployerKabezyaRecentConversations();

    syncEmployerKabezyaComposer();

    scrollEmployerKabezyaToBottom();


    return true;

  } catch (error) {

    console.error(
      "Open Employer Kabezya conversation failed:",
      error
    );


    if (
      typeof showToast ===
      "function"
    ) {

      showToast(
        error.message ||
        "Could not load this conversation.",
        "error"
      );

    }


    return false;

  } finally {

    employerKabezyaState
      .conversationLoading =
      false;

  }

}


/* =========================================================
   SET CONVERSATION
========================================================= */

function setEmployerKabezyaConversation(
  conversation
){

  const normalized =
    normalizeEmployerKabezyaConversation(
      conversation
    );


  if (!normalized) {
    return false;
  }


  employerKabezyaState
    .conversationId =
    normalized.id;


  employerKabezyaState
    .conversationTitle =
    normalized.title ||
    "Conversation";


  employerKabezyaState
    .messages =
    normalized.messages;


  employerKabezyaState
    .editingMessageId =
    null;


  employerKabezyaState
    .lastPrompt =
    "";


  clearEmployerKabezyaAttachments();


  return true;

}


/* =========================================================
   CREATE SERVER CONVERSATION
========================================================= */

async function createEmployerKabezyaConversation(){

  const endpoint =
    getEmployerKabezyaConversationsEndpoint();


  const payload = {

    title:"",

    mode:"assistant",

    context:
      buildEmployerKabezyaContext()

  };


  const response =
    await employerKabezyaApi(
      endpoint,
      {
        method:"POST",

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const rawConversation =
    response?.conversation ||
    response?.data ||
    response;


  const conversation =
    normalizeEmployerKabezyaConversation(
      rawConversation
    );


  if (
    !conversation ||
    !conversation.id
  ) {

    throw new Error(
      "Kabezya could not create a new conversation."
    );

  }


  employerKabezyaState.conversationId =
    conversation.id;


  employerKabezyaState.conversationTitle =
    conversation.title ||
    "New conversation";


  employerKabezyaState.messages =
    Array.isArray(
      conversation.messages
    )
      ? conversation.messages
          .map(
            normalizeEmployerKabezyaMessage
          )
          .filter(Boolean)
      : [];


  return conversation;

}


/* =========================================================
   SAVE ONE MESSAGE
========================================================= */

async function persistEmployerKabezyaMessage(
  role,
  content,
  responseSnapshot = null
){

  if (
    !employerKabezyaState
      .conversationId
  ) {

    throw new Error(
      "Kabezya conversation is not ready."
    );

  }


  const data =
    await employerKabezyaApi(
      `${
        getEmployerKabezyaConversationsEndpoint()
      }/${
        encodeURIComponent(
          employerKabezyaState
            .conversationId
        )
      }/messages`,
      {

        method:
          "POST",

        body:
          JSON.stringify({

            role,

            content,

            responseSnapshot

          })

      }
    );


  const message =
    normalizeEmployerKabezyaMessage(
      data?.message
    );


  if (data?.conversation) {

    const normalizedConversation =
      normalizeEmployerKabezyaConversation(
        data.conversation
      );


    if (normalizedConversation) {

      employerKabezyaState
        .conversationTitle =
        normalizedConversation
          .title ||
        employerKabezyaState
          .conversationTitle;

    }

  }


  return message;

}

/* =========================================================
   KABEZYA CONVERSATION RENDERER
========================================================= */

function renderEmployerKabezyaConversation(){

  const {
    welcome,
    messages
  } =
    getEmployerKabezyaElements();


  if (
    !welcome ||
    !messages
  ) {

    return;

  }


  const conversation =
    Array.isArray(
      employerKabezyaState.messages
    )
      ? employerKabezyaState.messages
      : [];


  const hasMessages =
    conversation.length >
    0;


  welcome.hidden =
    hasMessages;


  messages.hidden =
    !hasMessages;


  if (!hasMessages) {

    messages.innerHTML =
      "";

    return;

  }


  messages.innerHTML =
    conversation
      .map(
        renderEmployerKabezyaMessage
      )
      .join("");

}


/* =========================================================
   ONE KABEZYA MESSAGE
========================================================= */

function renderEmployerKabezyaMessage(
  message
){

  if (!message) {
    return "";
  }


  const user =
    message.role ===
    "user";


  const systemNotice =
    Boolean(
      message.systemNotice
    );


  const messageId =
    escapeHtml(
      String(
        message.id ||
        ""
      )
    );


  /* =====================================================
     SYSTEM / RATE-LIMIT NOTICE
  ====================================================== */

  if (systemNotice) {

    const noticeType =
      escapeHtml(
        String(
          message.systemNotice ||
          "notice"
        )
      );


    const noticeTitle =
      escapeHtml(
        String(
          message.noticeTitle ||
          (
            message.systemNotice ===
            "usage-limit"
              ? "Kabezya usage limit reached"
              : "Kabezya notice"
          )
        )
      );


    return `
      <article
        class="emp-kabezya-message is-system"
        data-message-id="${messageId}"
      >

        <div class="emp-kabezya-message-main">

          <div
            class="emp-kabezya-system-notice is-${noticeType}"
          >

            <div class="emp-kabezya-system-notice-title">
              ${noticeTitle}
            </div>

            <div class="emp-kabezya-system-notice-body">
              ${
                formatEmployerKabezyaMessageContent(
                  message.content
                )
              }
            </div>

            ${
              message.systemNotice ===
              "usage-limit"
                ? `
                  <button
                    type="button"
                    class="emp-kabezya-system-notice-action"
                    onclick="retryEmployerKabezyaMessage()"
                  >
                    Try again
                  </button>
                `
                : ""
            }

          </div>

        </div>

      </article>
    `;

  }


  /* =====================================================
     NORMAL USER / ASSISTANT MESSAGE
  ====================================================== */

  return `
    <article
      class="emp-kabezya-message ${
        user
          ? "is-user"
          : "is-assistant"
      }"
      data-message-id="${messageId}"
    >

      <div class="emp-kabezya-message-main">

        <div class="emp-kabezya-message-content">
          ${
            user
              ? formatEmployerKabezyaUserMessage(
                  message.content
                )
              : formatEmployerKabezyaMessageContent(
                  message.content
                )
          }
        </div>


        <div class="emp-kabezya-message-actions">

          <button
            type="button"
            onclick="copyEmployerKabezyaMessage('${messageId}')"
            aria-label="Copy message"
            title="Copy"
          >
            Copy
          </button>


          ${
            user
              ? `
                <button
                  type="button"
                  onclick="editEmployerKabezyaMessage('${messageId}')"
                  aria-label="Edit message"
                  title="Edit"
                >
                  Edit
                </button>
              `
              : ""
          }

        </div>

      </div>

    </article>
  `;

}

   USER MESSAGE FORMATTER
========================================================= */

function formatEmployerKabezyaUserMessage(
  content
){

  const text =
    escapeHtml(

      )
    }</p>`
  );

}


/* =========================================================
   SAFE INLINE MARKDOWN
========================================================= */

function formatEmployerKabezyaInline(
  value
){

  let text =
    String(
      value ||
      ""
    );


  /* INLINE CODE */

  text =
    text.replace(
      /`([^`\n]+)`/g,
      "<code>$1</code>"
    );


  /* BOLD */

  text =
    text.replace(
      /\*\*([^*\n]+?)\*\*/g,
      "<strong>$1</strong>"
    );


  text =
    text.replace(
      /__([^_\n]+?)__/g,
      "<strong>$1</strong>"
    );


  /* ITALIC */

  text =
    text.replace(
      /(^|[\s(])\*([^*\n]+?)\*(?=$|[\s).,!?:;])/g,
      "$1<em>$2</em>"
    );


  text =
    text.replace(
      /(^|[\s(])_([^_\n]+?)_(?=$|[\s).,!?:;])/g,
      "$1<em>$2</em>"
    );


  return text;

}


/* =========================================================
   SAFE KABEZYA RICH-TEXT FORMATTER

   Supported:
   - paragraphs
   - headings
   - bold
   - italic
   - unordered lists
   - numbered lists
   - horizontal rules
   - quotes
   - inline code
   - fenced code blocks

   Security:
   Raw AI output is escaped BEFORE formatting, therefore the
   model cannot inject arbitrary HTML or executable scripts.
========================================================= */

function formatEmployerKabezyaMessageContent(
  content
){

  const source =
    escapeHtml(
      String(
        content ||
        ""
      )
        .replace(
          /\r\n?/g,
          "\n"
        )
    );


  if (!source.trim()) {
    return "";
  }


  const lines =
    source.split(
      "\n"
    );


  const html =
    [];


  let paragraph =
    [];


  let listType =
    null;


  let listItems =
    [];


  let inCodeBlock =
    false;


  let codeLines =
    [];


  /* =====================================================
     FLUSH PARAGRAPH
  ====================================================== */

  const flushParagraph =
    () => {

      if (
        !paragraph.length
      ) {
        return;
      }


      const text =
        paragraph
          .join(
            " "
          )
          .trim();


      if (text) {

        html.push(
          `<p>${
            formatEmployerKabezyaInline(
              text
            )
          }</p>`
        );

      }


      paragraph =
        [];

    };


  /* =====================================================
     FLUSH LIST
  ====================================================== */

  const flushList =
    () => {

      if (
        !listType ||
        !listItems.length
      ) {

        listType =
          null;

        listItems =
          [];

        return;

      }


      const tag =
        listType ===
        "ordered"
          ? "ol"
          : "ul";


      html.push(
        `<${tag}>${
          listItems
            .map(
              item =>
                `<li>${
                  formatEmployerKabezyaInline(
                    item
                  )
                }</li>`
            )
            .join("")
        }</${tag}>`
      );


      listType =
        null;


      listItems =
        [];

    };


  /* =====================================================
     FLUSH CODE BLOCK
  ====================================================== */

  const flushCodeBlock =
    () => {

      html.push(
        `<pre><code>${
          codeLines.join(
            "\n"
          )
        }</code></pre>`
      );


      codeLines =
        [];

    };


  /* =====================================================
     PROCESS LINES
  ====================================================== */

  lines.forEach(
    rawLine => {

      const line =
        rawLine.trimEnd();


      const trimmed =
        line.trim();


      /* CODE FENCE */

      if (
        /^```/.test(
          trimmed
        )
      ) {

        flushParagraph();

        flushList();


        if (
          inCodeBlock
        ) {

          flushCodeBlock();

          inCodeBlock =
            false;

        } else {

          inCodeBlock =
            true;

          codeLines =
            [];

        }


        return;

      }


      if (
        inCodeBlock
      ) {

        codeLines.push(
          line
        );

        return;

      }


      /* EMPTY LINE */

      if (!trimmed) {

        flushParagraph();

        flushList();

        return;

      }


      /* HORIZONTAL RULE */

      if (
        /^(---+|\*\*\*+|___+)$/.test(
          trimmed
        )
      ) {

        flushParagraph();

        flushList();

        html.push(
          "<hr>"
        );

        return;

      }


      /* HEADINGS */

      const heading =
        trimmed.match(
          /^(#{1,4})\s+(.+)$/
        );


      if (heading) {

        flushParagraph();

        flushList();


        const level =
          Math.min(
            heading[1].length,
            4
          );


        html.push(
          `<h${level}>${
            formatEmployerKabezyaInline(
              heading[2]
            )
          }</h${level}>`
        );


        return;

      }


      /* BLOCKQUOTE */

      const quote =
        trimmed.match(
          /^>\s?(.+)$/
        );


      if (quote) {

        flushParagraph();

        flushList();


        html.push(
          `<blockquote>${
            formatEmployerKabezyaInline(
              quote[1]
            )
          }</blockquote>`
        );


        return;

      }


      /* UNORDERED LIST */

      const unordered =
        trimmed.match(
          /^[-*•]\s+(.+)$/
        );


      if (unordered) {

        flushParagraph();


        if (
          listType !==
          "unordered"
        ) {

          flushList();

          listType =
            "unordered";

        }


        listItems.push(
          unordered[1]
        );


        return;

      }


      /* ORDERED LIST */

      const ordered =
        trimmed.match(
          /^\d+[.)]\s+(.+)$/
        );


      if (ordered) {

        flushParagraph();


        if (
          listType !==
          "ordered"
        ) {

          flushList();

          listType =
            "ordered";

        }


        listItems.push(
          ordered[1]
        );


        return;

      }


      /* NORMAL PARAGRAPH */

      if (listType) {

        flushList();

      }


      paragraph.push(
        trimmed
      );

    }
  );


  /* =====================================================
     FINAL FLUSH
  ====================================================== */

  if (
    inCodeBlock
  ) {

    flushCodeBlock();

  }


  flushParagraph();

  flushList();


  return html.join("");

}

/* =========================================================
   COPY
========================================================= */

async function copyEmployerKabezyaMessage(
  messageId
){

  const message =
    employerKabezyaState
      .messages
      .find(
        item =>
          String(
            item.id
          ) ===
          String(
            messageId
          )
      );


  if (!message) {
    return false;
  }


  try {

    await navigator.clipboard
      .writeText(
        message.content
      );


    if (
      typeof showToast ===
      "function"
    ) {

      showToast(
        "Kabezya message copied.",
        "success"
      );

    }


    return true;

  } catch (error) {

    console.error(
      "Copy Kabezya message failed:",
      error
    );


    return false;

  }

}


/* =========================================================
   EDIT PREVIOUS USER MESSAGE
========================================================= */

function editEmployerKabezyaMessage(
  messageId
){

  if (
    employerKabezyaState.sending
  ) {

    return false;

  }


  const message =
    employerKabezyaState
      .messages
      .find(
        item =>
          String(
            item?.id ||
            ""
          ) ===
          String(
            messageId ||
            ""
          )
      );


  if (
    !message ||
    message.role !==
      "user"
  ) {

    return false;

  }


  const {
    input
  } =
    getEmployerKabezyaElements();


  if (!input) {

    return false;

  }


  /* =====================================================
     ENTER EDIT MODE
  ====================================================== */

  employerKabezyaState
    .editingMessageId =
    message.id;


  input.value =
    String(
      message.content ||
      ""
    );


  resizeEmployerKabezyaInput();

  syncEmployerKabezyaComposer();


  input.focus();


  /*
    Put cursor at the end of the existing message.
  */

  try {

    const length =
      input.value.length;


    input.setSelectionRange(
      length,
      length
    );

  } catch (error) {

    /* Safe fallback */

  }


  return true;

}


/* =========================================================
   UPDATE SAVED USER MESSAGE

   IMPORTANT:
   Employer backend truncates later conversation turns after
   editing a previous user message.

   Therefore the returned conversation should end at the
   edited user turn.
========================================================= */

async function persistEmployerKabezyaMessageEdit(
  messageId,
  content
){

  const conversationId =
    String(
      employerKabezyaState
        .conversationId ||
      ""
    ).trim();


  const id =
    String(
      messageId ||
      ""
    ).trim();


  const text =
    String(
      content ||
      ""
    ).trim();


  if (!conversationId) {

    throw new Error(
      "This conversation has not been saved yet."
    );

  }


  if (!id) {

    throw new Error(
      "The message could not be identified."
    );

  }


  if (!text) {

    throw new Error(
      "The edited message cannot be empty."
    );

  }


  const data =
    await employerKabezyaApi(
      `${
        getEmployerKabezyaConversationsEndpoint()
      }/${
        encodeURIComponent(
          conversationId
        )
      }/messages/${
        encodeURIComponent(
          id
        )
      }`,
      {

        method:
          "PATCH",

        body:
          JSON.stringify({
            content:
              text
          })

      }
    );


  const conversation =
    normalizeEmployerKabezyaConversation(
      data?.conversation ||
      data
    );


  if (
    !conversation ||
    !conversation.id
  ) {

    throw new Error(
      "Kabezya could not update the message."
    );

  }


  /* =====================================================
     LOAD TRUNCATED SERVER CONVERSATION
  ====================================================== */

  setEmployerKabezyaConversation(
    conversation
  );


  return conversation;

}


/* =========================================================
   REGENERATE AFTER EDIT

   The edited user message is already saved.

   DO NOT save the same user message again.

   Flow:
   ---------------------------------------------------------
   1. Edited message has been PATCHed.
   2. Conversation now ends at edited user message.
   3. Previous messages become AI history.
   4. Edited message becomes current prompt.
   5. Kabezya generates a replacement answer.
   6. Only the new assistant answer is persisted.
========================================================= */

async function regenerateEmployerKabezyaAfterEdit({
  conversationId,
  prompt
} = {}){

  const activeConversationId =
    String(
      conversationId ||
      employerKabezyaState
        .conversationId ||
      ""
    ).trim();


  const editedPrompt =
    String(
      prompt ||
      ""
    ).trim();


  if (
    !activeConversationId ||
    !editedPrompt
  ) {

    return false;

  }


  /* =====================================================
     BUILD HISTORY

     The final message is the edited user message.
     It is excluded because we send it separately as prompt.
  ====================================================== */

  const storedMessages =
    Array.isArray(
      employerKabezyaState.messages
    )
      ? employerKabezyaState.messages
      : [];


  const history =
    (
      storedMessages.length
        ? storedMessages.slice(
            0,
            -1
          )
        : []
    )
      .filter(
        message =>
          (
            message?.role ===
              "user" ||
            message?.role ===
              "assistant"
          ) &&
          !message?.systemNotice &&
          !message?.error
      )
      .slice(
        -20
      )
      .map(
        message => ({
          role:
            message.role,

          content:
            String(
              message.content ||
              ""
            )
        })
      )
      .filter(
        message =>
          Boolean(
            message.content.trim()
          )
      );


  employerKabezyaState
    .sending =
    true;


  setEmployerKabezyaThinking(
    true
  );


  syncEmployerKabezyaComposer();

  renderEmployerKabezyaConversation();


  try {

    /* ===================================================
       GENERATE NEW KABEZYA ANSWER
    ==================================================== */

    const assistantResponse =
      await employerKabezyaApi(
        getEmployerKabezyaEndpoint(),
        {

          method:
            "POST",

          body:
            JSON.stringify({

              message:
                editedPrompt,

              prompt:
                editedPrompt,

              mode:
                "assistant",

              conversationId:
                activeConversationId,

              history,

              context:
                buildEmployerKabezyaContext()

            })

        }
      );


    const reply =
      String(

        assistantResponse?.reply ||

        assistantResponse?.answer ||

        assistantResponse?.response ||

        assistantResponse?.content ||

        assistantResponse?.message ||

        ""

      ).trim();


    if (!reply) {

      const error =
        new Error(
          "Kabezya returned an empty response."
        );


      error.status =
        502;


      throw error;

    }


    /* ===================================================
       SAVE ONLY NEW ASSISTANT RESPONSE
    ==================================================== */

    const savedAssistantMessage =
      await persistEmployerKabezyaMessage(
        "assistant",
        reply,
        assistantResponse
      );


    const assistantMessage =
      savedAssistantMessage
        ? normalizeEmployerKabezyaMessage(
            savedAssistantMessage
          )
        : createEmployerKabezyaMessage(
            "assistant",
            reply,
            {
              responseSnapshot:
                assistantResponse
            }
          );


    if (assistantMessage) {

      employerKabezyaState
        .messages
        .push(
          assistantMessage
        );

    }


    renderEmployerKabezyaConversation();


    scrollEmployerKabezyaToBottom();


    /* ===================================================
       REFRESH RECENT CONVERSATIONS
    ==================================================== */

    try {

      await loadEmployerKabezyaRecentConversations();

    } catch (historyError) {

      console.warn(
        "Employer Kabezya history refresh after edit failed:",
        historyError
      );

    }


    return true;


  } catch (error) {

    console.error(
      "Employer Kabezya regeneration after edit failed:",
      error
    );


    const status =
      Number(
        error?.status ||
        0
      );


    /* ===================================================
       RATE LIMIT
    ==================================================== */

    if (
      status ===
        429 &&
      typeof addEmployerKabezyaUsageLimitNotice ===
        "function"
    ) {

      addEmployerKabezyaUsageLimitNotice(
        error
      );


      return false;

    }


    /* ===================================================
       OTHER FAILURE
    ==================================================== */

    if (
      typeof addEmployerKabezyaSystemNotice ===
      "function"
    ) {

      addEmployerKabezyaSystemNotice({

        type:
          "service-error",

        title:
          "Kabezya could not regenerate the response",

        message:
          `${
            error?.message ||
            "Kabezya is temporarily unavailable."
          }\n\nYour edited message is saved. You can retry from this conversation.`

      });

    } else if (
      typeof showToast ===
      "function"
    ) {

      showToast(
        error?.message ||
        "Kabezya could not regenerate the response.",
        "error"
      );

    }


    return false;


  } finally {

    employerKabezyaState
      .sending =
      false;


    setEmployerKabezyaThinking(
      false
    );


    syncEmployerKabezyaComposer();

  }

}


/* =========================================================
   FILE PICKER
========================================================= */

function openEmployerKabezyaFilePicker(){

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.multiple =
    true;


  input.accept =
    "image/*,.pdf,.doc,.docx,.txt,.csv,.xls,.xlsx";


  input.addEventListener(
    "change",
    () => {

      handleEmployerKabezyaFiles(
        {
          target:input
        }
      );

    }
  );


  input.click();

}


/* =========================================================
   FILE SELECTION
========================================================= */

function handleEmployerKabezyaFiles(
  event
){

  const files =
    Array.from(
      event?.target?.files ||
      []
    )
      .filter(
        file =>
          file.size <=
          10 *
          1024 *
          1024
      )
      .slice(
        0,
        5
      );


  employerKabezyaState
    .attachedFiles =
    files;


  if (
    files.length &&
    typeof showToast ===
      "function"
  ) {

    showToast(
      "Files selected. Kabezya file analysis will be connected to the AIFT upload service.",
      "info"
    );

  }

}

/* =========================================================
   EMPLOYER KABEZYA — CHAT NOTICE
========================================================= */

function addEmployerKabezyaSystemNotice({
  type = "notice",
  title = "Kabezya",
  message = ""
} = {}){

  const notices =
    Array.isArray(
      employerKabezyaState.messages
    )
      ? employerKabezyaState.messages
      : [];


  const latest =
    notices[
      notices.length - 1
    ];


  /* Do not stack the same limit notice repeatedly. */

  if (
    latest?.systemNotice ===
    type
  ) {

    return false;

  }


  notices.push({

    id:
      `kabezya-notice-${
        Date.now()
      }`,

    role:
      "assistant",

    content:
      String(
        message ||
        ""
      ),

    noticeTitle:
      String(
        title ||
        "Kabezya"
      ),

    systemNotice:
      type,

    temporary:
      true,

    createdAt:
      new Date()
        .toISOString()

  });


  employerKabezyaState.messages =
    notices;


  renderEmployerKabezyaConversation();


  scrollEmployerKabezyaToBottom();


  return true;

}


/* =========================================================
   EMPLOYER KABEZYA — USAGE LIMIT
========================================================= */

function addEmployerKabezyaUsageLimitNotice(
  error
){

  const seconds =
    Math.max(
      0,
      Number(
        error?.retryAfterSeconds ||
        0
      ) ||
      0
    );


  let waitText =
    "";


  if (
    seconds > 0
  ) {

    if (
      seconds >= 60
    ) {

      const minutes =
        Math.max(
          1,
          Math.ceil(
            seconds /
            60
          )
        );


      waitText =
        ` You can try again in approximately ${minutes} minute${
          minutes === 1
            ? ""
            : "s"
        }.`;

    } else {

      waitText =
        ` You can try again in approximately ${Math.ceil(seconds)} seconds.`;

    }

  }


  const content =
    [
      `Kabezya has reached the temporary usage limit.${waitText}`,
      "",
      "Your conversation is still saved. You can continue from this same chat when Kabezya becomes available again.",
      "",
      "Starting another conversation will not bypass the current limit."
    ]
      .join(
        "\n"
      );


  return addEmployerKabezyaSystemNotice({

    type:
      "usage-limit",

    title:
      "Kabezya usage limit reached",

    message:
      content

  });

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendEmployerKabezyaMessage(){

  await initializeEmployerKabezya();


  if (
    employerKabezyaState.sending
  ) {

    return false;

  }


  const elements =
    getEmployerKabezyaElements();


  if (
    !elements.input
  ) {

    return false;

  }


  /* =====================================================
     READ PROMPT
  ====================================================== */

  const prompt =
    String(
      elements.input.value ||
      ""
    ).trim();


  if (!prompt) {

    syncEmployerKabezyaComposer();

    return false;

  }


  if (
    prompt.length >
    8000
  ) {

    if (
      typeof showToast ===
      "function"
    ) {

      showToast(
        "Your message is too long. Keep it under 8,000 characters.",
        "info"
      );

    }


    return false;

  }


  /* =====================================================
     EDIT EXISTING USER MESSAGE

     Production edit flow:
     -----------------------------------------------------
     1. Capture the edited message before state refresh.
     2. Save the edited message to MongoDB.
     3. Backend truncates all later conversation turns.
     4. Reload the returned truncated conversation.
     5. Leave edit mode.
     6. Generate a replacement Kabezya response.
  ====================================================== */

  if (
    employerKabezyaState
      .editingMessageId
  ) {

    const editedMessageId =
      String(
        employerKabezyaState
          .editingMessageId ||
        ""
      ).trim();


    const editedContent =
      String(
        prompt ||
        ""
      ).trim();


    if (
      !editedMessageId ||
      !editedContent
    ) {

      return false;

    }


    try {

      /* ===================================================
         SAVE EDIT
      ==================================================== */

      employerKabezyaState
        .sending =
        true;


      syncEmployerKabezyaComposer();


      const updatedConversation =
        await persistEmployerKabezyaMessageEdit(
          editedMessageId,
          editedContent
        );


      if (
        !updatedConversation ||
        !updatedConversation.id
      ) {

        throw new Error(
          "The edited conversation could not be loaded."
        );

      }


      /* ===================================================
         LEAVE EDIT MODE

         persistEmployerKabezyaMessageEdit() has already
         loaded the server's truncated conversation into
         Employer Kabezya state.
      ==================================================== */

      employerKabezyaState
        .editingMessageId =
        null;


      employerKabezyaState
        .lastPrompt =
        editedContent;


      elements.input.value =
        "";


      resizeEmployerKabezyaInput();


      /*
        Release the save lock before regeneration.

        regenerateEmployerKabezyaAfterEdit() owns its own
        sending/thinking lifecycle.
      */

      employerKabezyaState
        .sending =
        false;


      syncEmployerKabezyaComposer();

      renderEmployerKabezyaConversation();

      scrollEmployerKabezyaToBottom();


      /* ===================================================
         GENERATE REPLACEMENT ANSWER
      ==================================================== */

      const regenerated =
        await regenerateEmployerKabezyaAfterEdit({

          conversationId:
            updatedConversation.id,

          prompt:
            editedContent

        });


      return Boolean(
        regenerated
      );


    } catch (error) {

      console.error(
        "Employer Kabezya message edit failed:",
        error
      );


      /*
        Restore the edited text so the Employer does not
        lose what they typed if the request fails.
      */

      elements.input.value =
        editedContent;


      resizeEmployerKabezyaInput();


      if (
        typeof addEmployerKabezyaSystemNotice ===
        "function"
      ) {

        addEmployerKabezyaSystemNotice({

          type:
            "service-error",

          title:
            "Message could not be updated",

          message:
            error?.message ||
            "Kabezya could not update this message. Please try again."

        });

      } else if (
        typeof showToast ===
        "function"
      ) {

        showToast(
          error?.message ||
          "Kabezya could not update this message.",
          "error"
        );

      }


      return false;


    } finally {

      employerKabezyaState
        .sending =
        false;


      setEmployerKabezyaThinking(
        false
      );


      syncEmployerKabezyaComposer();

    }

  }




  /* =====================================================
     PREPARE REQUEST
  ====================================================== */

  const previousHistory =
    buildEmployerKabezyaHistory();


  employerKabezyaState
    .lastPrompt =
    prompt;


  employerKabezyaState
    .sending =
    true;


  elements.input.value =
    "";


  resizeEmployerKabezyaInput();

  syncEmployerKabezyaComposer();


  let userMessageSaved =
    false;


  try {

    /* ===================================================
       CREATE CONVERSATION
    ==================================================== */

    if (
      !employerKabezyaState
        .conversationId
    ) {

      await createEmployerKabezyaConversation();

    }


    /* ===================================================
       PERSIST USER MESSAGE ONCE
    ==================================================== */

    const savedUserMessage =
      await persistEmployerKabezyaMessage(
        "user",
        prompt
      );


    userMessageSaved =
      true;


    const normalizedUser =
      savedUserMessage
        ? normalizeEmployerKabezyaMessage(
            savedUserMessage
          )
        : createEmployerKabezyaMessage(
            "user",
            prompt
          );


    if (normalizedUser) {

      employerKabezyaState
        .messages
        .push(
          normalizedUser
        );

    }


    renderEmployerKabezyaConversation();


    /* Do not force the user bubble to the very top.
       Scroll only enough to keep the newest turn visible. */

    requestAnimationFrame(
      () => {

        const body =
          getEmployerKabezyaElements()
            .body;


        const latestUser =
          body?.querySelector(
            ".emp-kabezya-message.is-user:last-of-type"
          );


        if (
          latestUser &&
          typeof latestUser.scrollIntoView ===
          "function"
        ) {

          latestUser.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        }

      }
    );


    /* ===================================================
       THINKING
    ==================================================== */

    setEmployerKabezyaThinking(
      true
    );


    /* ===================================================
       AI REQUEST
    ==================================================== */

    const assistantResponse =
      await employerKabezyaApi(
        getEmployerKabezyaEndpoint(),
        {

          method:
            "POST",

          body:
            JSON.stringify({

              message:
                prompt,

              prompt:
                prompt,

              mode:
                "assistant",

              conversationId:
                employerKabezyaState
                  .conversationId,

              history:
                previousHistory,

              context:
                buildEmployerKabezyaContext()

            })

        }
      );


    /* ===================================================
       NORMALIZE RESPONSE
    ==================================================== */

    const reply =
      String(

        assistantResponse?.reply ||

        assistantResponse?.answer ||

        assistantResponse?.response ||

        assistantResponse?.content ||

        assistantResponse?.message ||

        ""

      ).trim();


    if (!reply) {

      const error =
        new Error(
          "Kabezya returned an empty response."
        );


      error.status =
        502;


      throw error;

    }


    /* ===================================================
       SAVE ASSISTANT RESPONSE
    ==================================================== */

    const savedAssistantMessage =
      await persistEmployerKabezyaMessage(
        "assistant",
        reply,
        assistantResponse
      );


    const normalizedAssistant =
      savedAssistantMessage
        ? normalizeEmployerKabezyaMessage(
            savedAssistantMessage
          )
        : createEmployerKabezyaMessage(
            "assistant",
            reply,
            {
              responseSnapshot:
                assistantResponse
            }
          );


    if (
      normalizedAssistant
    ) {

      employerKabezyaState
        .messages
        .push(
          normalizedAssistant
        );

    }


    setEmployerKabezyaThinking(
      false
    );


    renderEmployerKabezyaConversation();


    scrollEmployerKabezyaToBottom();


    /* ===================================================
       REFRESH HISTORY
    ==================================================== */

    try {

      await loadEmployerKabezyaRecentConversations();

    } catch (historyError) {

      console.warn(
        "Employer Kabezya recent conversations refresh failed:",
        historyError
      );

    }


    clearEmployerKabezyaAttachments();


    return true;


  } catch (error) {

    console.error(
      "Employer Kabezya request failed:",
      error
    );


    setEmployerKabezyaThinking(
      false
    );


    const status =
      Number(
        error?.status ||
        0
      );


    /* ===================================================
       429 — USAGE LIMIT

       Professional message inside conversation.
       No browser alert.
    ==================================================== */

    if (
      status ===
      429
    ) {

      addEmployerKabezyaUsageLimitNotice(
        error
      );


      /*
        The user's message has already been persisted in most
        429 cases, so do not duplicate it by adding it again.
        Restore the text only so the user can retry later.
      */

      elements.input.value =
        prompt;


      resizeEmployerKabezyaInput();


      return false;

    }


    /* ===================================================
       OTHER SERVICE FAILURE
    ==================================================== */

    addEmployerKabezyaSystemNotice({

      type:
        "service-error",

      title:
        "Kabezya could not complete the response",

      message:
        userMessageSaved
          ? (
              `${
                error?.message ||
                "Kabezya is temporarily unavailable."
              }\n\nYour message is saved. You can retry from this conversation.`
            )
          : (
              `${
                error?.message ||
                "Kabezya is temporarily unavailable."
              }\n\nYour message could not be saved. Please try again.`
            )

    });


    elements.input.value =
      prompt;


    resizeEmployerKabezyaInput();


    return false;


  } finally {

    employerKabezyaState
      .sending =
      false;


    setEmployerKabezyaThinking(
      false
    );


    syncEmployerKabezyaComposer();

  }

}

    


/* =========================================================
   RETRY
========================================================= */

function retryEmployerKabezyaMessage(){

  const {
    input
  } =
    getEmployerKabezyaElements();


  if (
    !input ||
    !employerKabezyaState
      .lastPrompt
  ) {

    return false;

  }


  input.value =
    employerKabezyaState
      .lastPrompt;


  resizeEmployerKabezyaInput();

  syncEmployerKabezyaComposer();

  input.focus();


  return true;

}

function openTab(tab){

  const requestedTab =
    String(
      tab || "overview"
    ).trim();


  /* =====================================================
     FIND REQUESTED WORKSPACE
  ====================================================== */

  const targetSection =
    document.getElementById(
      `section-${requestedTab}`
    );


  if (!targetSection) {

    console.warn(
      `Employer section "${requestedTab}" does not exist.`
    );


    if (
      requestedTab !== "overview"
    ) {

      openTab(
        "overview"
      );

    }


    return;

  }


  /* =====================================================
     SAVE CURRENT WORKSPACE
  ====================================================== */

  state.activeTab =
    requestedTab;


  try {

    localStorage.setItem(
      "employerOpenTab",
      requestedTab
    );

  } catch (error) {

    console.warn(
      "Could not save Employer workspace:",
      error
    );

  }


  /* =====================================================
     WORKSPACE LAYOUT MODE
  ====================================================== */

  const compactMode =
    ![
      "overview",
      "feed"
    ].includes(
      requestedTab
    );


  document.body.classList.toggle(
    "compact-workspace",
    compactMode
  );


  /* =====================================================
     SIDEBAR ACTIVE STATE
  ====================================================== */

  document
    .querySelectorAll(
      ".tab-btn"
    )
    .forEach(btn => {

      const active =
        btn.dataset.tab ===
        requestedTab;


      btn.classList.toggle(
        "active",
        active
      );


      btn.setAttribute(
        "aria-selected",
        active
          ? "true"
          : "false"
      );

    });


  /* =====================================================
     WORKSPACE VISIBILITY
  ====================================================== */

  document
    .querySelectorAll(
      ".section"
    )
    .forEach(section => {

      const active =
        section ===
        targetSection;


      section.classList.toggle(
        "active",
        active
      );


      section.setAttribute(
        "aria-hidden",
        active
          ? "false"
          : "true"
      );

    });


  /* =====================================================
     ANALYTICS
  ====================================================== */

  if (
    requestedTab ===
    "analytics"
  ) {

    buildAnalytics();

  }


  /* =====================================================
     NETWORK
  ====================================================== */

  if (
    requestedTab ===
    "network"
  ) {

    buildNetwork();

  }


  /* =====================================================
     JOB SEEKERS / CANDIDATES
  ====================================================== */

  if (
    requestedTab ===
    "jobseekers"
  ) {

    buildJobSeekers();

  }


  /* =====================================================
     OPERATIONS
  ====================================================== */

  if (
    requestedTab ===
    "ops"
  ) {

    buildOps();

  }


  /* =====================================================
     CAREER HUB
  ====================================================== */

  if (
    requestedTab ===
    "career"
  ) {

    buildEmployerCareerHub();

  }


  /* =====================================================
     FEED
  ====================================================== */

  if (
    requestedTab ===
      "feed" &&
    !window
      .AIFTFeedMountedOnEmployer
  ) {

    buildFeed();

  }


  /* =====================================================
     COMPANY PROFILE
  ====================================================== */

  if (
    requestedTab ===
    "profile"
  ) {

    buildProfileSection();

  }


  /* =====================================================
     SETTINGS
  ====================================================== */

  if (
    requestedTab ===
    "settings"
  ) {

    buildEmployerSettings();

  }


  /* =====================================================
     KABEZYA AI
  ====================================================== */

  if (
    requestedTab ===
    "kabezya"
  ) {

    Promise
      .resolve(
        initializeEmployerKabezya()
      )
      .catch(error => {

        console.error(
          "Employer Kabezya initialization failed:",
          error
        );

      });

  }


  /* =====================================================
     CLOSE MOBILE SIDEBAR
  ====================================================== */

  document.body.classList.remove(
    "mobile-menu-open"
  );


  /* =====================================================
     RETURN WORKSPACE TO TOP
  ====================================================== */

  const mainPage =
    document.querySelector(
      ".page"
    );


  if (mainPage) {

    mainPage.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

}

   FINAL LIVE FEED + AGENT LOGIN/LOGOUT SYSTEM PATCH
   Keeps existing code. Overrides only missing/fragile parts.
========================================================= */
function normalizeArrayPayload(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data?.posts)) return data.posts;
  if(Array.isArray(data?.items)) return data.items;
  if(Array.isArray(data?.data)) return data.data;
  if(Array.isArray(data?.results)) return data.results;
  if(Array.isArray(data?.feed)) return data.feed;
  return [];
}

async function tryFetchJSONEndpoints(endpoints, options = {}){
  let lastError = null;
  for(const endpoint of endpoints){
    try{
      const url = endpoint.startsWith('http') ? endpoint : API + endpoint;
      return await fetchJSON(url, options);
    }catch(err){
      lastError = err;
    }
  }
  if(lastError) throw lastError;
  return null;
}

async function loadPosts(){
  try{
    const data = await tryFetchJSONEndpoints([
      '/api/posts',
      '/api/posts/feed',
      '/api/feed/posts',
      '/api/company/posts'
    ], { headers: authHeaders() });
    state.posts = normalizeArrayPayload(data);
  }catch(err){
    console.error('LOAD POSTS ERROR:', err);
    state.posts = [];
    const feed = document.getElementById('feedList');
    if(feed){
      feed.innerHTML = '<div class="empty">Company feed could not load from the backend. Check the browser console for the exact backend response.</div>';
    }
  }
}

function getPostId(post){ return String(post?._id || post?.id || post?.postId || ''); }
function getPostAuthor(post){ return post?.author || post?.user || post?.createdBy || post?.owner || {}; }
function getPostAuthorId(post){ const a=getPostAuthor(post); return String(a?._id || a?.id || post?.author || post?.user || ''); }
function getPostText(post){ return post?.text || post?.content || post?.body || post?.caption || post?.description || ''; }
function getPostMedia(post){ return post?.mediaUrl || post?.media || post?.image || post?.imageUrl || post?.photo || post?.video || post?.videoUrl || ''; }
function getPostComments(post){ return Array.isArray(post?.comments) ? post.comments : Array.isArray(post?.commentList) ? post.commentList : []; }
function getPostLikes(post){ return Array.isArray(post?.likes) ? post.likes : Array.isArray(post?.likedBy) ? post.likedBy : []; }
function isPostLikedByMe(post){ const myId=String(state.me?._id || localStorage.getItem('userId') || ''); return getPostLikes(post).some(v=>String(v?._id || v?.id || v)===myId) || post?.liked===true || post?.isLiked===true; }
function postLikeCount(post){ return Number(post?.likesCount ?? post?.likeCount ?? post?.totalLikes ?? getPostLikes(post).length ?? 0); }
function postCommentCount(post){ return Number(post?.commentsCount ?? post?.commentCount ?? post?.totalComments ?? getPostComments(post).length ?? 0); }
function postShareCount(post){ return Number(post?.sharesCount ?? post?.shareCount ?? post?.totalShares ?? 0); }
function mediaHtml(url){
  if(!url) return '';
  const clean = escapeHtml(url);
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return '<div class="post-media"><video src="'+clean+'" controls playsinline></video></div>';
  return '<div class="post-media"><img src="'+clean+'" alt="Post media"></div>';
}

function getLoginValue(log){ return log?.loginTime || log?.loginAt || log?.clockIn || log?.clockInAt || log?.startTime || log?.startedAt || log?.in || null; }
function getLogoutValue(log){ return log?.logoutTime || log?.logoutAt || log?.clockOut || log?.clockOutAt || log?.endTime || log?.endedAt || log?.out || null; }
function formatDateTime(value){ if(!value) return '-'; const d=new Date(value); if(!isNaN(d.getTime())) return d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); return escapeHtml(value); }
function durationBetween(start,end){ if(!start) return '-'; const a=new Date(start); const b=end?new Date(end):new Date(); if(isNaN(a.getTime())||isNaN(b.getTime())) return '-'; const mins=Math.max(0,Math.floor((b-a)/60000)); const h=Math.floor(mins/60); const m=mins%60; return h ? h+'h '+m+'m' : m+'m'; }

function buildAgentActivityRows(){
  const rows=[];
  const scheduleByAgent=new Map();
  (state.schedules||[]).forEach(s=>{
    const agent=s.agentId||s.agent||s.user||{};
    const id=getAgentIdFrom(agent);
    if(id && !scheduleByAgent.has(id)) scheduleByAgent.set(id,s);
  });
  (state.agentLogs||[]).forEach(log=>{
    const agent=log.agentId||log.agent||log.user||log.userId||{};
    const id=getAgentIdFrom(agent);
    const linkedSchedule=log.schedule||log.scheduleId||scheduleByAgent.get(id)||{};
    const login=getLoginValue(log), logout=getLogoutValue(log);
    rows.push({agentId:id,agentName:agent.name||log.agentName||log.name||'Agent',schedule:linkedSchedule.title||log.scheduleTitle||log.title||linkedSchedule.shiftType||log.shiftType||'Attendance log',login,logout,status:logout?'offline':login?'online':(log.status||'offline')});
  });
  (state.schedules||[]).forEach(s=>{
    const agent=s.agentId||s.agent||s.user||{};
    const id=getAgentIdFrom(agent);
    const login=s.loginAt||s.clockIn||s.clockInAt||s.actualStart||s.startTimeActual||null;
    const logout=s.logoutAt||s.clockOut||s.clockOutAt||s.actualEnd||s.endTimeActual||null;
    if(!login&&!logout&&!s.status) return;
    if(rows.some(r=>r.agentId===id && String(r.login||'')===String(login||''))) return;
    rows.push({agentId:id,agentName:agent.name||s.agentName||'Unknown Agent',schedule:s.title||s.shiftType||'Assigned schedule',login,logout,status:logout?'offline':login?'online':(s.status||'scheduled')});
  });
  if(!rows.length){
    const agents=new Map();
    [...(state.schedules||[]),...(state.tasks||[])].forEach(item=>{
      const agent=item.agentId||item.assigneeId||item.agent||item.user||{};
      const id=getAgentIdFrom(agent); if(!id)return;
      if(!agents.has(id)) agents.set(id,{agentId:id,agentName:agent.name||item.agentName||item.assigneeName||'Agent',schedule:item.title||item.shiftType||'Assigned work',login:null,logout:null,status:item.status||'scheduled'});
    });
    rows.push(...agents.values());
  }
  return rows.slice(0,50);
}

function buildAgentActivityPanel(){
  const tbody=document.getElementById('agentActivityBody'); if(!tbody)return;
  const rows=buildAgentActivityRows();
  if(!rows.length){ tbody.innerHTML='<tr><td colspan="7"><div class="empty">No live agent login/logout data found yet. When your backend returns clock-in/clock-out fields, they will appear here automatically.</div></td></tr>'; return; }
  tbody.innerHTML=rows.map(row=>{
    const perf=agentPerformancePercent(row.agentId);
    const raw=safeStatus(row.status);
    const st=raw.includes('online')||raw.includes('active')?'online':raw.includes('away')||raw.includes('scheduled')?'away':'offline';
    return '<tr class="agent-live-row is-'+st+'"><td><b>'+escapeHtml(row.agentName)+'</b></td><td>'+escapeHtml(row.schedule||'-')+'</td><td>'+formatDateTime(row.login)+'</td><td>'+formatDateTime(row.logout)+'</td><td>'+durationBetween(row.login,row.logout)+'</td><td><span class="agent-status-dot '+st+'"></span>'+escapeHtml(st)+'</td><td><div style="display:flex;align-items:center;gap:10px;"><div class="agent-perf-bar"><div class="agent-perf-fill" style="width:'+perf+'%"></div></div><b>'+perf+'%</b></div></td></tr>';
  }).join('');
}

async function init(){

  try {

    applyEmployerStudioDeviceSettings();


    const results =
      await Promise.allSettled([
        loadProfile(),
        loadEmployerPrivacySettings(),
        loadJobs(),
        loadApplications(),
        loadPeople(),
        loadPosts(),
        loadTeamMembers(),
        loadSchedules(),
        loadTasks(),
        loadAgentLogs(),
        loadInvites(),
        loadEmployerStats(),
        loadPostAnalytics(),
        loadJobSeekers(),
        loadCounters()
      ]);


    results.forEach(
      (result, index) => {

        if (result.status === "rejected") {

          console.warn(
            "AIFT Employer loader failed:",
            index,
            result.reason
          );

        }

      }
    );


    wireSearch();

    wireButtons();

    setupSocket();

    applyRolePreset("viewer");


    const photoInput =
      document.getElementById(
        "editTeamPhoto"
      );


    photoInput?.addEventListener(
      "change",
      function(){

        const file =
          this.files?.[0];

        if (!file) {
          return;
        }


        const preview =
          document.getElementById(
            "editTeamPreview"
          );

        if (!preview) {
          return;
        }


        const oldUrl =
          preview.dataset.objectUrl;

        if (oldUrl) {
          URL.revokeObjectURL(oldUrl);
        }


        const newUrl =
          URL.createObjectURL(file);

        preview.dataset.objectUrl =
          newUrl;

        preview.src =
          newUrl;

      }
    );


    refreshAllUI();


    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedTab =
      params.get("tab") ||
      localStorage.getItem(
        "employerOpenTab"
      ) ||
      "overview";


    openTab(requestedTab);


    if (
      typeof handleEmployerJobDeepLink ===
      "function"
    ) {

      handleEmployerJobDeepLink();

    }


    if (
      typeof loadEmployerCareerHub ===
      "function"
    ) {

      loadEmployerCareerHub()
        .then(() => {

          if (
            state.activeTab ===
            "career"
          ) {

            buildEmployerCareerHub();

          }

        })
        .catch(error => {

          console.error(
            "Employer Career Hub load failed:",
            error
          );

        });

    }

  } catch (error) {

    console.error(
      "EMPLOYER INITIALIZATION ERROR:",
      error
    );


    showToast(
      "Unable to load employer page",
      error?.message ||
        "Please refresh and try again.",
      "error"
    );

  }

}

</div>


<!-- =========================================================
     AIFT EMPLOYER CONFIRMATION MODAL
     Reusable for destructive / sensitive actions
========================================================= -->

<div
  class="employer-security-modal"
  id="employerConfirmModal"
  hidden
>

  <div
    class="employer-security-modal-backdrop"
    onclick="closeEmployerConfirmModal()"
  ></div>


  <div
    class="employer-security-modal-dialog employer-confirm-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="employerConfirmTitle"
    aria-describedby="employerConfirmMessage"
  >

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="employer-security-modal-head">

      <div>

        <div
          id="employerConfirmIcon"
          class="employer-confirm-icon danger"
          aria-hidden="true"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M12 8v4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M12 16h.01"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />

            <path
              d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        </div>


        <h2 id="employerConfirmTitle">
          Confirm action
        </h2>

        <p id="employerConfirmMessage">
          Please confirm that you want to continue.
        </p>

      </div>


      <button
        type="button"
        class="employer-security-modal-close"
        onclick="closeEmployerConfirmModal()"
        aria-label="Close"
      >
        ×
      </button>

    </div>


    <!-- =====================================================
         BODY
    ====================================================== -->

    <div class="employer-confirm-body">

      <!-- OPTIONAL WARNING -->

      <div
        id="employerConfirmWarning"
        class="employer-confirm-warning"
        hidden
      ></div>


      <!-- OPTIONAL PASSWORD CONFIRMATION -->

      <label
        id="employerConfirmPasswordWrap"
        class="employer-security-field employer-confirm-password-wrap"
        hidden
      >

        <span>
          Current password
        </span>

        <input
          id="employerConfirmPasswordInput"
          type="password"
          autocomplete="current-password"
          oninput="syncEmployerConfirmButtonState()"
        >

        <small>
          Enter your current password to confirm this action.
        </small>

      </label>


      <!-- OPTIONAL TYPED CONFIRMATION -->

      <label
        id="employerConfirmTextWrap"
        class="employer-security-field employer-confirm-text-wrap"
        hidden
      >

        <span id="employerConfirmTextLabel">
          Type the confirmation text
        </span>

        <input
          id="employerConfirmTextInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          oninput="syncEmployerConfirmButtonState()"
        >

        <small id="employerConfirmTextHelp"></small>

      </label>


      <!-- INLINE MESSAGE -->

      <div
        id="employerConfirmInlineMessage"
        class="employer-settings-inline-message"
        role="status"
        aria-live="polite"
        hidden
      ></div>


      <!-- ===================================================
           ACTIONS
      ==================================================== -->

      <div class="employer-security-modal-actions">

        <button
          id="employerConfirmCancelButton"
          type="button"
          onclick="closeEmployerConfirmModal()"
        >
          Cancel
        </button>


        <button
          id="employerConfirmActionButton"
          type="button"
          class="employer-confirm-action danger"
          onclick="submitEmployerConfirmation()"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>

</div>


  <script src="aift-student-identity-ui.js" defer></script>
  <script src="aift-review-status.js" defer></script>
</body>
</html>
