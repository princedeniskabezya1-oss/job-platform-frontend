<!DOCTYPE html>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script>
  /*
    =========================================================
    AIFT EMPLOYER â€” EARLY APPEARANCE BOOT

    Runs before CSS paints so returning dark-mode users
    do not receive a bright light-theme flash.
    =========================================================
  */

  (() => {

    const SETTINGS_KEY =
      "aiftEmployerStudioDeviceSettings";


    try{

      const stored =
        JSON.parse(
          localStorage.getItem(
            SETTINGS_KEY
          ) ||
          "{}"
        );


      const preference =
        ["light","dark","system"]
          .includes(
            String(
              stored.theme ||
              ""
            )
          )
            ? String(
                stored.theme
              )
            : "system";


      let resolved =
        preference;


      if(
        preference ===
        "system"
      ){

        resolved =
          window
            .matchMedia(
              "(prefers-color-scheme: dark)"
            )
            .matches
              ? "dark"
              : "light";

      }


      document
        .documentElement
        .setAttribute(
          "data-employer-theme",
          resolved
        );


      document
        .documentElement
        .setAttribute(
          "data-employer-theme-preference",
          preference
        );


      document
        .documentElement
        .style
        .colorScheme =
          resolved;

    }catch(error){

      /*
        Safe fallback.
      */

      document
        .documentElement
        .setAttribute(
          "data-employer-theme",
          "light"
        );

    }

  })();
</script>

/* NETWORK */
.directory-grid,
#networkList{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  align-items:stretch;
}

.linkedin-profile-card{
  min-height:315px;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--border);
}

.linkedin-profile-cover{
  height:78px;
  background:#e6eef5;
  background-size:cover;
  background-position:center;
  flex-shrink:0;
}

.linkedin-profile-cover.empty{
  background:#eef3f8;
}

.linkedin-profile-body{
  flex:1;
  min-height:235px;
  padding:0 14px 16px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.linkedin-profile-avatar{
  width:74px!important;
  height:74px!important;
  margin-top:-37px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #fff;
  background:#fff;
  box-shadow:0 8px 20px rgba(15,23,42,.12);
}

.linkedin-profile-body h3{
  margin:9px 0 4px;
  max-width:100%;
  color:#172033;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.linkedin-profile-headline,
.linkedin-profile-mutual{
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.linkedin-profile-headline{
  min-height:34px;
}

.linkedin-profile-mutual{
  min-height:34px;
}

.linkedin-profile-badge,
.linkedin-profile-muted{
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:25px;
  padding:5px 9px;
  border-radius:999px;
  background:#ecfdf3;
  color:#047857;
  font-size:11px;
  font-weight:900;
}

.linkedin-profile-muted{
  background:#f8fafc;
  color:#667085;
}

.linkedin-profile-actions{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:auto;
  padding-top:14px;
}

.linkedin-profile-actions button{
  min-height:38px;
  width:100%;
  border-radius:999px;
  font-size:12px;
  font-weight:850;
  border:1px solid transparent;
}

.linkedin-profile-actions button:first-child{
  background:#0a66c2;
  color:#fff;
  border-color:#0a66c2;
}

.linkedin-profile-actions button:first-child.active{
  background:#eef2f7;
  color:#172033;
  border-color:#d8dee8;
}

.linkedin-profile-actions button:last-child{
  background:#fff;
  color:#0a66c2;
  border-color:#b9d7f4;
}

/* JOB SEEKERS */
.jobseeker-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto auto;
  gap:12px;
  align-items:end;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.jobseeker-dashboard,
.jobseeker-dashboard-stacked{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:16px;
}

.talent-grid-card{
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
  padding:18px;
}

.talent-table-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:16px;
}

.talent-table-title h3{
  margin:0;
  font-size:17px;
  font-weight:900;
}

.talent-table-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

#jobseekersList.jobseeker-grid,
.jobseeker-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  align-items:stretch;
}

.upwork-network-card{
  min-height:390px;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
}

.jobseeker-cover{
  width:100%;
  height:96px;
  flex-shrink:0;
  display:block;
  background-color:#e6eef5;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.jobseeker-cover.empty{
  background:linear-gradient(135deg,#eef6ff,#f8fafc);
}

.upwork-network-card::before{
  display:none!important;
}

.upwork-card-top{
  margin-top:-42px;
  padding:0 15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.upwork-profile-main{
  display:flex;
  align-items:flex-start;
  gap:11px;
  min-width:0;
}

.upwork-avatar{
  width:74px!important;
  height:74px!important;
  border-radius:50%!important;
  object-fit:cover!important;
  border:4px solid #fff!important;
  background:#fff;
  box-shadow:0 8px 20px rgba(15,23,42,.12);
  flex-shrink:0;
}

.upwork-identity{
  min-width:0;
  padding-top:43px;
}

.upwork-name-row h3{
  margin:0;
  color:#172033;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.upwork-identity p{
  margin:4px 0 0;
  color:#667085;
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.upwork-location{
  margin-top:6px;
  color:#475467;
  font-size:12px;
  font-weight:800;
}

.upwork-role-pill{
  display:inline-flex;
  margin-top:6px;
  padding:4px 8px;
  border-radius:999px;
  background:#ecfdf3;
  color:#047857;
  font-size:10px;
  font-weight:900;
}

.upwork-match{
  margin-top:48px;
  width:58px;
  height:58px;
  border-radius:18px;
  background:#0a66c2;
  color:#fff;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.upwork-match strong{
  font-size:18px;
  line-height:1;
}

.upwork-match span{
  margin-top:-12px;
  font-size:10px;
  font-weight:800;
}

.jobseeker-match-reasons,
.upwork-skills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:12px 15px 0;
}

.jobseeker-match-reasons span,
.upwork-skills span{
  padding:5px 8px;
  border-radius:999px;
  background:#f1f5f9;
  color:#475467;
  font-size:11px;
  font-weight:800;
}

.upwork-bio{
  padding:0 15px;
  color:#667085;
  font-size:12px;
  line-height:1.5;
  min-height:54px;
}

.upwork-stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:0 15px;
}

.upwork-stats-row div{
  background:#f8fafc;
  border:1px solid var(--soft-border);
  border-radius:13px;
  padding:9px;
  text-align:center;
}

.upwork-stats-row strong{
  display:block;
  color:#111827;
  font-size:16px;
  font-weight:950;
}

.upwork-stats-row span{
  color:#667085;
  font-size:10px;
  font-weight:800;
}

.upwork-card-actions{
  margin-top:auto;
  padding:0 15px 15px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.upwork-card-actions .upwork-btn-primary{
  grid-column:1/-1;
}

.jobseeker-view-more-wrap{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:8px 0;
}
  /* TEAM */
.table-wrap,
.agent-live-table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
}

table{
  width:100%;
  min-width:980px;
  border-collapse:collapse;
}

th,td{
  padding:14px 15px;
  border-bottom:1px solid var(--soft-border);
  text-align:left;
  vertical-align:middle;
  font-size:13px;
}

th{
  background:#f8fafc;
  color:#667085;
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

tbody tr:hover{
  background:#f8fbff;
}

.table-user,
.mini-person{
  display:flex;
  align-items:center;
  gap:11px;
}

.table-user img,
.mini-person img{
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  border-radius:13px!important;
  object-fit:cover!important;
  border:1px solid var(--border);
}

.mini-person{
  padding:10px 0;
  border-bottom:1px solid var(--soft-border);
}

.mini-person:last-child{border-bottom:0}

.mini-person h4{
  margin:0 0 4px;
  font-size:13px;
  font-weight:900;
}

.mini-person p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.status-active{
  background:#ecfdf3;
  color:#047857;
}

.status-blocked{
  background:#fff1f2;
  color:#be123c;
}

/* SCHEDULES & TASKS */
.ops-grid-expanded{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

#section-ops .panel-card{
  background:#fff;
}

.agent-live-card{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.agent-live-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
  padding:18px 20px;
  background:#fff;
  color:#172033;
  border-bottom:1px solid var(--border);
}

.agent-live-head h3{
  margin:0;
  font-size:0;
}

.agent-live-head h3::before{
  content:"ACTIVITY";
  font-size:18px;
  font-weight:900;
}

.agent-live-head p{
  display:none;
}

.agent-status-dot{
  width:9px;
  height:9px;
  display:inline-block;
  border-radius:50%;
  margin-right:7px;
  background:#94a3b8;
}

.agent-status-dot.online{background:#22c55e}
.agent-status-dot.away{background:#f59e0b}
.agent-status-dot.offline{background:#94a3b8}

.agent-perf-bar{
  width:90px;
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
}

.agent-perf-fill{
  height:100%;
  border-radius:999px;
  background:#0a66c2;
}

/* ANALYTICS */
.analytics-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  align-items:stretch;
}

.analytics-card{
  position:relative;
  overflow:hidden;
  min-height:285px;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.analytics-card::before{
  display:none!important;
}

.analytics-card h3{
  min-height:38px;
}

.analytics-card p{
  min-height:42px;
}

.metric-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--soft-border);
}

.metric-line:last-child{
  border-bottom:0;
}

.metric-line span{
  color:#667085;
  font-size:13px;
}

.metric-line b{
  color:#111827;
  font-size:14px;
  font-weight:950;
  text-align:right;
}

.metric-good{color:#047857!important}
.metric-bad{color:#be123c!important}

.sparkline,
.growth-bars,
.trend-bars{
  display:flex;
  align-items:flex-end;
  gap:5px;
  height:58px;
  margin-top:auto;
}

.sparkline span,
.growth-bars span,
.trend-bars span{
  flex:1;
  min-width:6px;
  border-radius:999px 999px 4px 4px;
  background:#dbeafe;
}

/* PROFILE */
#profileInfoGrid{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:16px;
}

#section-profile .analytics-card,
#section-profile .analytics-card:first-child{
  min-height:260px;
  background:#fff;
}

#section-profile .analytics-card::before{
  display:none!important;
}

/* RIGHT SIDE */
.side-list,
.quick-list,
.info-list,
.progress-wrap{
  display:grid;
  gap:10px;
}

.info-row,
.progress-item{
  padding:12px;
  border:1px solid var(--soft-border);
  border-radius:14px;
  background:#f8fafc;
}

.info-label,
.progress-head{
  color:#667085;
  font-size:12px;
  font-weight:800;
}

.info-value{
  margin-top:6px;
  color:#111827;
  font-size:20px;
  font-weight:950;
}

.progress-head{
  display:flex;
  justify-content:space-between;
}

.progress-bar{
  height:9px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
  margin-top:9px;
}

.progress-fill{
  height:100%;
  border-radius:999px;
  background:#0a66c2;
}

.cta-box{
  padding:18px;
  border-radius:16px;
  background:#f8fbff;
  border:1px solid var(--soft-border);
}

.cta-box h3{
  margin:0 0 8px;
  font-size:17px;
}

.cta-box p{
  margin:0 0 14px;
  color:#667085;
  line-height:1.55;
}

/* FORMS / MODALS */
.field{
  display:grid;
  gap:8px;
}

.field label{
  font-size:13px;
  font-weight:800;
  color:#344054;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#9cc8f5;
  box-shadow:0 0 0 4px rgba(10,102,194,.08);
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.input-grid,
.permissions-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:24px;
  background:rgba(15,23,42,.50);
}

.modal.show{display:flex}

.modal-box{
  width:min(780px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 30px 80px rgba(15,23,42,.28);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-title{
  font-size:18px;
  font-weight:900;
}

.modal-body{
  padding:20px;
  display:grid;
  gap:14px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:0 20px 20px;
}

.toast-wrap{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:2500;
  display:grid;
  gap:10px;
}

.toast{
  min-width:280px;
  max-width:360px;
  padding:14px 16px;
  border-radius:14px;
  background:#101828;
  color:#fff;
  box-shadow:0 18px 45px rgba(16,24,40,.25);
}

.toast.success{background:#047857}
.toast.error{background:#9f1239}
  .toast.info{
  background:#0a66c2;
}

.loading,
.empty{
  padding:22px;
  border:1px dashed var(--border);
  border-radius:16px;
  background:#fff;
  color:var(--muted);
  text-align:center;
}

.footer{display:none}

body.compact-workspace .main-grid{
  grid-template-columns:minmax(0,1fr)!important;
}

body.compact-workspace .right-col{
  display:none!important;
}

@media(max-width:1440px){
  .panel-grid,
  .analytics-grid,
  #networkList,
  #jobseekersList.jobseeker-grid,
  .jobseeker-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  #jobsList.panel-grid,
  #jobsList,
  .jobs-grid-fixed{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:1280px){
  .main-grid{
    grid-template-columns:minmax(0,1fr);
  }

  .right-col{
    display:none;
  }

  .panel-grid,
  .analytics-grid,
  #networkList,
  #jobseekersList.jobseeker-grid,
  .jobseeker-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
  /* NETWORK VIEW MORE - CLEAN DESIGN */

.network-view-more-wrap{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:18px 0 6px;
}

.network-view-more-btn{
  min-width:210px;
  height:42px;
  border:1px solid #cfe1f5;
  border-radius:999px;
  background:#fff;
  color:#0a66c2;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(15,23,42,.06);
}

.network-view-more-btn:hover{
  background:#eef6ff;
  border-color:#9cc8f5;
}

.network-view-more-wrap span{
  color:#667085;
  font-size:12px;
  font-weight:800;
}

/* =========================================================
   TALENT DISCOVERY â€” BEST MATCHES
   Legacy Top Candidates replacement

   IMPORTANT:
   #topCandidatesList used to be a multi-column card grid.
   Talent Discovery now uses a vertical recruiter ranking list.
========================================================= */


/* =========================================================
   REMOVE LEGACY TOP-CANDIDATE GRID BEHAVIOR
========================================================= */

#section-jobseekers #topCandidatesList{
  width:100%;

  display:block;

  grid-template-columns:none;
  grid-auto-columns:auto;
  grid-auto-flow:row;

  gap:0;

  overflow:hidden;

  margin:0;
  padding:0;

  border:1px solid #eaecf0;
  border-radius:10px;

  background:#fff;
}


/* =========================================================
   BEST MATCH ROW
========================================================= */

#section-jobseekers
#topCandidatesList
.emp-best-candidate{
  width:100%;
  min-width:0;

  min-height:72px;

  display:grid;

  grid-template-columns:
    24px
    44px
    minmax(0,1fr)
    46px;

  align-items:center;

  column-gap:9px;

  padding:
    10px 10px;

  margin:0;

  border:0;
  border-bottom:
    1px solid
    #f2f4f7;

  border-radius:0;

  background:#fff;

  box-shadow:none;

  cursor:pointer;

  transition:
    background .15s ease;
}


#section-jobseekers
#topCandidatesList
.emp-best-candidate:last-child{
  border-bottom:0;
}


#section-jobseekers
#topCandidatesList
.emp-best-candidate:hover{
  background:#f9fafb;
}


/* =========================================================
   RANK NUMBER
========================================================= */

#section-jobseekers
#topCandidatesList
.emp-best-rank{
  width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:0;
  border-radius:6px;

  background:#f2f4f7;

  color:#475467;

  font-size:8px;
  line-height:1;

  font-weight:850;
}


#section-jobseekers
#topCandidatesList
.emp-best-candidate:first-child
.emp-best-rank{
  background:#fef0c7;

  color:#b54708;
}


/* second place */

#section-jobseekers
#topCandidatesList
.emp-best-candidate:nth-child(2)
.emp-best-rank{
  background:#f2f4f7;

  color:#475467;
}


/* third place */

#section-jobseekers
#topCandidatesList
.emp-best-candidate:nth-child(3)
.emp-best-rank{
  background:#fff4e5;

  color:#b54708;
}


/* =========================================================
   AVATAR
========================================================= */

#section-jobseekers
#topCandidatesList
.emp-best-avatar{
  display:block;

  width:44px !important;
  height:44px !important;

  min-width:44px !important;
  max-width:44px !important;

  margin:0;

  border:1px solid #eaecf0;
  border-radius:50% !important;

  background:#f2f4f7;

  object-fit:cover;
}


/* =========================================================
   CANDIDATE INFORMATION
========================================================= */

#section-jobseekers
#topCandidatesList
.emp-best-info{
  min-width:0;
  width:100%;

  overflow:hidden;
}


/* candidate name */

#section-jobseekers
#topCandidatesList
.emp-best-info > strong{
  display:block;

  width:100%;

  overflow:hidden;

  margin:0;

  color:#101828;

  font-size:9px;
  line-height:1.3;

  font-weight:850;

  white-space:nowrap;
  text-overflow:ellipsis;

/* =========================================================
   AIFT EMPLOYER â€” CAREER HUB
   Production Workspace
========================================================= */

#section-career{
  --career-blue:#0a66c2;
  --career-blue-dark:#084f96;
  --career-blue-soft:#eef6ff;
  --career-blue-border:#cfe3f8;

  --career-text:#172033;
  --career-heading:#101828;
  --career-muted:#667085;
  --career-subtle:#98a2b3;

  --career-border:#e4eaf2;
  --career-border-light:#edf1f5;

  --career-bg:#f7f9fc;
  --career-card:#ffffff;

  --career-success:#067647;
  --career-success-bg:#ecfdf3;

  --career-warning:#b54708;
  --career-warning-bg:#fffaeb;

  --career-danger:#b42318;
  --career-danger-bg:#fef3f2;

  --career-radius:16px;
  --career-radius-sm:12px;

  --career-shadow:
    0 1px 2px rgba(16,24,40,.04),
    0 4px 14px rgba(16,24,40,.04);

  width:100%;
  min-width:0;
  color:var(--career-text);
}


/* =========================================================
   RESET INSIDE CAREER HUB
========================================================= */

#section-career *,
#section-career *::before,
#section-career *::after{
  box-sizing:border-box;
}

#section-career button,
#section-career input,
#section-career select,
#section-career textarea{
  font:inherit;
}

#section-career button{
  -webkit-tap-highlight-color:transparent;
}

#section-career img{
  max-width:100%;
}


/* =========================================================
   MAIN WORKSPACE
========================================================= */

#employerCareerWorkspace{
  width:100%;
  min-width:0;
}

.employer-career-shell{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:18px;
}


/* =========================================================
   BUTTONS
========================================================= */

#section-career .primary-btn,
#section-career .ghost-btn,
#section-career .soft-btn,
#section-career .light-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  min-height:38px;

  padding:9px 14px;

  border-radius:10px;

  cursor:pointer;

  font-size:13px;
  font-weight:750;
  line-height:1;

  text-decoration:none;

  transition:
    background .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .16s ease,
    box-shadow .16s ease;
}

#section-career .primary-btn{
  color:#fff;

  background:var(--career-blue);
  border:1px solid var(--career-blue);
}

#section-career .primary-btn:hover{
  background:var(--career-blue-dark);
  border-color:var(--career-blue-dark);

  box-shadow:
    0 4px 12px rgba(10,102,194,.18);
}

#section-career .ghost-btn{
  color:#344054;

  background:#fff;
  border:1px solid #d8e0e9;
}

#section-career .ghost-btn:hover{
  color:var(--career-blue);

  background:#f8fbff;
  border-color:#b9d6f3;
}

#section-career .soft-btn{
  color:var(--career-blue);

  background:var(--career-blue-soft);
  border:1px solid #d5e8fa;
}

#section-career .soft-btn:hover{
  background:#e1f0ff;
}

#section-career button:active{
  transform:translateY(1px);
}

#section-career button:focus-visible,
#section-career input:focus-visible,
#section-career select:focus-visible{
  outline:3px solid rgba(10,102,194,.16);
  outline-offset:2px;
}


/* =========================================================
   CAREER VIEWS
========================================================= */

.employer-career-view{
  display:none;

  width:100%;
  min-width:0;
}

.employer-career-view.active{
  display:block;

  animation:
    employerCareerFadeIn .18s ease;
}

@keyframes employerCareerFadeIn{
  from{
    opacity:0;
    transform:translateY(3px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================================================
   VIEW HEADER
========================================================= */

.employer-career-view-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:18px;

  margin-bottom:16px;
}

.employer-career-view-title{
  min-width:0;
}

.employer-career-view-title h3{
  margin:0;

  color:var(--career-heading);

  font-size:21px;
  line-height:1.25;
  font-weight:850;
  letter-spacing:-.015em;
}

.employer-career-view-title p{
  max-width:720px;

  margin:6px 0 0;

  color:var(--career-muted);

  font-size:13px;
  line-height:1.6;
}

.employer-career-view-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;

  gap:8px;
}

========================================================= */

.employer-career-card{
  min-width:0;

  background:var(--career-card);

  border:1px solid var(--career-border);
  border-radius:var(--career-radius);

  box-shadow:
    0 1px 3px rgba(16,24,40,.025);
}

.employer-career-card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:16px;

  padding:17px 18px;

  border-bottom:

.employer-career-card-head > div{
  min-width:0;
}

.employer-career-card-head h3,
.employer-career-card-head h4{
  margin:0;

  color:var(--career-heading);

  font-size:15px;
  line-height:1.35;
  font-weight:820;
}

  margin:4px 0 0;

  color:var(--career-muted);

  font-size:11.5px;
  line-height:1.5;
}

.employer-career-card-body{
  padding:18px;
}


/* =========================================================
   ATTENTION
========================================================= */

.employer-career-attention-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:25px;
  height:25px;

  padding:0 7px;

  border-radius:999px;

  color:var(--career-blue);

  background:var(--career-blue-soft);

  font-size:11px;
  font-weight:850;
}

#employerCareerAttentionList{
  display:flex;
  flex-direction:column;

  gap:8px;
}

.employer-career-activity-item{
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  width:100%;

  padding:13px 42px 13px 14px;

  text-align:left;

  background:#fff;

  border:1px solid var(--career-border-light);
  border-radius:11px;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease;

.employer-career-activity-item::after{
  content:"â€º";

  right:15px;
  top:50%;

.employer-career-activity-item:hover{
  background:#f9fbfd;
  border-color:#d7e2ed;
}

.employer-career-activity-item strong{
  color:#344054;

  font-size:12.5px;
  line-height:1.4;
  font-weight:800;
}

.employer-career-activity-item span{
  margin-top:3px;

  color:var(--career-muted);

  font-size:11px;
  line-height:1.5;
}


/* =========================================================

========================================================= */

#employerCareerPipeline{

  gap:9px;

.employer-career-pipeline-stat{

/* =========================================================
   LIST CONTAINERS
========================================================= */

#employerCareerProgramList,
#employerCareerApplicationList,
#employerCareerPartnershipList,
#employerCareerCampusList,
#employerCareerEventList,
#employerCareerTalentList,
#employerCareerVentureList{
  display:flex;
  flex-direction:column;

  gap:10px;
}


/* =========================================================
   STANDARD LIST CARD
========================================================= */

.employer-career-list-card{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  min-width:0;

  padding:16px 17px;

  background:#fff;

  border:1px solid var(--career-border);
  border-radius:13px;

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    transform .15s ease;
}

.employer-career-list-card:hover{
  transform:translateY(-1px);

  border-color:#d2dce7;

  box-shadow:
    0 4px 14px rgba(16,24,40,.045);
}

.employer-career-list-card > div:first-child{
  flex:1;
  min-width:0;
}

.employer-career-list-card h4{
  margin:7px 0 0;

  color:var(--career-heading);

  font-size:14px;
  line-height:1.35;
  font-weight:820;
}

.employer-career-list-card p{
  max-width:720px;

  margin:5px 0 0;

  color:var(--career-muted);

  font-size:11.5px;
  line-height:1.55;
}

.employer-career-list-meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;

  gap:8px 14px;

  flex:0 0 auto;

  color:var(--career-muted);

  font-size:10.5px;
}


/* =========================================================
   STATUS PILLS
========================================================= */

#section-career .status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:23px;

  padding:4px 8px;

  border-radius:999px;

  color:#475467;

  background:#f2f4f7;

  border:1px solid #eaecf0;

  font-size:9.5px;
  line-height:1;
  font-weight:800;

  text-transform:capitalize;
}


/* =========================================================
   APPLICATION PERSON
========================================================= */

.employer-career-person-row{
  display:flex;
  align-items:center;

  gap:11px;

  min-width:0;
}

.employer-career-person-row img{
  flex:0 0 auto;

  width:43px;
  height:43px;

  object-fit:cover;

  border-radius:50%;

  background:#edf1f5;

  border:1px solid #e3e8ef;
}

.employer-career-person-row > div{
  min-width:0;
}

.employer-career-person-row h4{
  margin:0;
}

.employer-career-person-row p{
  margin-top:3px;
}


/* =========================================================
   FULL TALENT CARD
========================================================= */

.employer-career-talent-card{
  display:grid;

  grid-template-columns:
    54px minmax(0,1fr) auto;

  align-items:center;

  gap:14px;

  min-width:0;

  padding:15px 16px;

  background:#fff;

  border:1px solid var(--career-border);
  border-radius:13px;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

.employer-career-talent-card:hover{
  border-color:#d2dce7;

  box-shadow:
    0 4px 14px rgba(16,24,40,.04);
}

.employer-career-talent-card > img{
  width:54px;
  height:54px;

  object-fit:cover;

  border-radius:50%;

  background:#edf1f5;
}

.employer-career-talent-card > div{
  min-width:0;
}

.employer-career-talent-card h4{
  margin:0;

  color:var(--career-heading);

  font-size:13.5px;
  font-weight:820;
}

.employer-career-talent-card p{
  margin:4px 0 0;

  color:var(--career-muted);

  font-size:11px;
  line-height:1.5;
}

.employer-career-skill-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:5px;

  margin-top:8px;
}

.employer-career-skill-row span{
  display:inline-flex;
  align-items:center;

  min-height:21px;

  padding:3px 7px;

  color:#475467;

  background:#f8fafc;

  border:1px solid #e7ebf0;
  border-radius:999px;

  font-size:9.5px;
  font-weight:650;
}


/* =========================================================
   VENTURES
========================================================= */

#employerCareerVentureList{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}

.employer-career-venture-card{
  min-width:0;
  min-height:180px;

  padding:17px;

  background:#fff;

  border:1px solid var(--career-border);
  border-radius:14px;

  cursor:pointer;

  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.employer-career-venture-card:hover{
  transform:translateY(-2px);

  border-color:#cdd9e5;

  box-shadow:
    0 7px 20px rgba(16,24,40,.055);
}

.employer-career-venture-card h4{
  margin:12px 0 0;

  color:var(--career-heading);

  font-size:15px;
  line-height:1.35;
  font-weight:820;
}

.employer-career-venture-card p{
  margin:7px 0 15px;

  color:var(--career-muted);

  font-size:11px;
  line-height:1.6;
}


/* =========================================================
   ANALYTICS
========================================================= */

#employerCareerAnalyticsGrid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}

.employer-career-analytics-card{
  min-width:0;
  min-height:140px;

  padding:18px;

  background:#fff;

  border:1px solid var(--career-border);
  border-radius:14px;

  box-shadow:
    0 1px 3px rgba(16,24,40,.025);
}

.employer-career-analytics-card span{
  display:block;

  color:var(--career-muted);

  font-size:11px;
  font-weight:750;
}

.employer-career-analytics-card strong{
  display:block;

  margin-top:13px;

  color:var(--career-heading);

  font-size:30px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.035em;
}

.employer-career-analytics-card small{
  display:block;

  margin-top:10px;

  color:var(--career-subtle);

  font-size:10.5px;
  line-height:1.45;
}


/* =========================================================
   EMPTY STATE
========================================================= */

#section-career .empty{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;
  min-height:105px;

  padding:22px;

  color:#7a8699;

  background:#fafbfc;

  border:1px dashed #d8e0e9;
  border-radius:11px;

  text-align:center;

  font-size:11.5px;
  line-height:1.55;
}

}

    0 1px 2px rgba(16,24,40,.04),
    0 8px 28px rgba(16,24,40,.07);
}

.employer-career-campus-manager[hidden]{
  display:none!important;
}

.employer-career-campus-manager-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  padding:20px 22px;
  background:
    linear-gradient(
      135deg,
      #fff,
      #f7fbff
    );
  border-bottom:1px solid #e7ecf2;
}

.employer-career-campus-manager-head h3{
  margin:5px 0 0;
  color:var(--career-heading);
  font-size:19px;
  font-weight:850;
}

.employer-career-campus-manager-head p{
  margin:4px 0 0;
  color:var(--career-muted);
  font-size:11px;
}

.employer-career-campus-form{
  display:flex;
  flex-direction:column;
}

.employer-career-campus-opportunities{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:9px;
}

.employer-career-campus-opportunity-option{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
  padding:12px 13px;
  border:1px solid var(--career-border);
  border-radius:11px;
  background:#fafbfc;
  cursor:pointer;
}

.employer-career-campus-opportunity-option:hover{
  border-color:#bfd8f1;
  background:#f7fbff;
}

.employer-career-campus-opportunity-option input{
  width:17px;
  height:17px;
  margin-top:2px;
  flex:0 0 auto;
  accent-color:var(--career-blue);
}

.employer-career-campus-opportunity-option > div{
  min-width:0;
}

.employer-career-campus-opportunity-option strong{
  display:block;
  overflow:hidden;
  color:var(--career-heading);
  font-size:10.5px;
  font-weight:800;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.employer-career-campus-opportunity-option span{
  display:block;
  margin-top:3px;
  color:var(--career-muted);
  font-size:9px;
  line-height:1.45;
  text-transform:capitalize;
}

.employer-career-campus-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.employer-career-campus-card{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    auto;
  gap:18px;
  padding:16px 17px;
  background:#fff;
  border:1px solid var(--career-border);
  border-radius:13px;
  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.employer-career-campus-card:hover{
  transform:translateY(-1px);
  border-color:#ccd9e6;
  box-shadow:0 5px 18px rgba(16,24,40,.05);
}

.employer-career-campus-card-main{
  min-width:0;
}

.employer-career-campus-card-top{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

.employer-career-campus-card h4{
  margin:9px 0 0;
  color:var(--career-heading);
  font-size:14px;
  line-height:1.35;
  font-weight:820;
}

.employer-career-campus-card p{
  margin:5px 0 0;
  max-width:760px;
  color:var(--career-muted);
  font-size:10.5px;
  line-height:1.55;
}

.employer-career-campus-card-school{
  margin-top:8px;
  color:#344054;
  font-size:10px;
  font-weight:750;
}

.employer-career-campus-card-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px 14px;
  margin-top:11px;
  color:var(--career-subtle);
  font-size:9.5px;
}

.employer-career-campus-card-actions{
  display:flex;
  align-items:flex-start;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:7px;
}

.employer-career-campus-operation-metrics{
  display:grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap:9px;
  padding:18px 20px 0;
}

.employer-career-campus-detail-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:9px;
}

.employer-career-campus-detail-grid > div{
  min-width:0;
  padding:12px;
  background:#fafbfc;
  border:1px solid var(--career-border-light);
  border-radius:10px;
}

.employer-career-campus-detail-grid span{
  display:block;
  color:var(--career-subtle);
  font-size:9px;
  font-weight:750;
}

.employer-career-campus-detail-grid strong{
  display:block;
  margin-top:5px;
  color:#344054;
  font-size:10.5px;
  line-height:1.5;
  font-weight:750;
}

.employer-career-campus-connected{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.employer-career-campus-connected-item{
  padding:11px 12px;
  background:#fafbfc;
  border:1px solid var(--career-border-light);
  border-radius:10px;
}

.employer-career-campus-connected-item strong{
  display:block;
  color:var(--career-heading);
  font-size:10.5px;
  font-weight:800;
}

.employer-career-campus-connected-item span{
  display:block;
  margin-top:3px;
  color:var(--career-muted);
  font-size:9px;
  text-transform:capitalize;
}

@media(max-width:900px){

  .employer-career-campus-metrics{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .employer-career-campus-operation-metrics{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

@media(max-width:700px){

  .employer-career-campus-opportunities{
    grid-template-columns:1fr;
  }

  .employer-career-campus-card{
    grid-template-columns:1fr;
  }

  .employer-career-campus-card-actions{
    justify-content:flex-start;
  }

  .employer-career-campus-detail-grid{
    grid-template-columns:1fr;
  }

  .employer-career-campus-metrics,
  .employer-career-campus-operation-metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

/* =========================================================
   AIFT EMPLOYER WORKSPACE
   CORRECTED PRODUCTION FOUNDATION
   =========================================================
   IMPORTANT:
   This version uses the ACTUAL employer.html structure:

   .topbar
   .topbar-inner
   .brand-wrap
   .top-actions
   .tabs
   .tab-btn
   .page
   .main-grid
   .center-col
   .right-col

   It does not introduce a second layout system.
========================================================= */

:root{
  --sidebar-w:232px;
  --topbar-h:64px;

  --emp-primary:#0a66c2;
  --emp-primary-dark:#0756a6;
  --emp-primary-soft:#edf6ff;

  --emp-bg:#f6f8fb;
  --emp-card:#ffffff;

  --emp-text:#101828;
  --emp-secondary:#344054;
  --emp-muted:#667085;
  --emp-faint:#98a2b3;

  --emp-border:#e4e7ec;
  --emp-border-soft:#edf1f5;

  --emp-radius:12px;

  --emp-shadow:
    0 1px 2px rgba(16,24,40,.035);

  --emp-shadow-hover:
    0 8px 24px rgba(16,24,40,.07);
}


/* =========================================================
   DOCUMENT
========================================================= */

html,
body{
  background:var(--emp-bg);
}

body{
  color:var(--emp-text);
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  position:sticky;
  top:0;

  z-index:1000;

  width:100%;
  height:var(--topbar-h);

  background:#fff;

  border-bottom:
    1px solid var(--emp-border);

  box-shadow:
    0 1px 2px rgba(16,24,40,.025);
}


.topbar-inner{
  width:100%;
  height:var(--topbar-h);

  display:grid;

  grid-template-columns:
    var(--sidebar-w)
    minmax(0,1fr);

  align-items:center;

  gap:0;

  padding:0;
}


/* =========================================================
   AIFT + KABEZYA BRAND AREA
========================================================= */

.brand-wrap{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  height:var(--topbar-h);

  display:flex;

  align-items:center;

  gap:10px;

  padding:0 20px;

  background:#fff;

  border-right:
    1px solid var(--emp-border);

  text-decoration:none;

  overflow:hidden;
}


.brand-logo-img{
  display:block;

  width:auto;
  max-width:78px;

  height:34px;

  flex:0 0 auto;

  object-fit:contain;

  background:transparent;

  border-radius:0;
}


.employer-brand-divider{
  display:block;

  width:1px;
  height:25px;

  flex:0 0 1px;

  background:
    #d0d5dd;
}


.employer-brand-product{
  min-width:0;

  display:flex;

  flex-direction:column;

  gap:2px;
}


.employer-brand-product strong{
  display:block;

  color:
    var(--emp-primary);

  font-size:10px;
  line-height:1;

  font-weight:800;

  letter-spacing:.02em;

  white-space:nowrap;
}


.employer-brand-product span{
  display:block;

  color:
    var(--emp-muted);

  font-size:8px;
  line-height:1;

  font-weight:600;

  white-space:nowrap;
}


/* =========================================================
   TOP ACTION AREA
========================================================= */

.top-actions{
  min-width:0;

  width:100%;

  display:grid;

  grid-template-columns:
    minmax(260px,1fr)
    40px
    40px
    auto
    auto
    42px;

  align-items:center;

  gap:8px;

  padding:
    0 20px;
}


/* =========================================================
   COMMAND SEARCH
========================================================= */

.search.employer-command-search{
  position:relative;

  width:100%;
  max-width:none;

  height:40px;
}


.search.employer-command-search svg{
  position:absolute;

  left:13px;
  top:50%;

  width:16px;
  height:16px;

  transform:
    translateY(-50%);

  color:#667085;

  z-index:2;

  pointer-events:none;
}


.search.employer-command-search input{
  width:100%;
  height:40px;

  padding:
    0 58px
    0 39px;

  border:
    1px solid #dce3ec;

  border-radius:
    9px;

  background:
    #f8fafc;

  color:
    #172033;

  font-size:12px;

  outline:none;

  transition:
    background .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}


.search.employer-command-search input:focus{
  background:#fff;

  border-color:
    #9cc8f5;

  box-shadow:
    0 0 0 3px
    rgba(10,102,194,.08);
}


.search.employer-command-search input::placeholder{
  color:#98a2b3;
}


.employer-search-shortcut{
  position:absolute;

  right:8px;
  top:50%;

  transform:
    translateY(-50%);

  min-width:34px;
  height:23px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    0 6px;

  border:
    1px solid #dfe4ea;

  border-radius:
    6px;

  background:#fff;

  color:
    #667085;

  font-size:9px;
  font-weight:700;

  pointer-events:none;
}


/* =========================================================
   TOPBAR BUTTONS
========================================================= */

.top-actions .icon-btn{
  width:40px;
  height:40px;

  border:
    1px solid var(--emp-border);

  border-radius:
    9px;

  background:#fff;

  box-shadow:none;
}


.top-actions .pill-btn,
.top-actions .primary-btn{
  min-height:40px;

  height:40px;

  padding:
    0 14px;

  border-radius:
    9px;

  font-size:11px;

  font-weight:750;

  white-space:nowrap;
}


.top-actions .avatar{
  width:40px;
  height:40px;

  min-width:40px;

  border-radius:50%;
}


/* =========================================================
   ACTUAL EMPLOYER SIDEBAR
========================================================= */

.tabs{
  position:fixed;

  left:0;
  top:var(--topbar-h);
  bottom:0;

  z-index:900;

  width:var(--sidebar-w);

  padding:
    16px 12px 24px;

  display:flex;

  flex-direction:column;

  gap:3px;

  overflow-y:auto;

  background:#fff;

  border-right:
    1px solid var(--emp-border);
}


.tabs::before{
  content:"EMPLOYER WORKSPACE";

  margin:
    3px 9px 9px;

  color:
    #8a98ad;

  font-size:9px;

  line-height:1.2;

  font-weight:800;

  letter-spacing:.075em;

  text-transform:uppercase;
}


.tabs .tab-btn{
  position:relative;

  width:100%;

  min-height:39px;

  display:flex;

  align-items:center;

  margin:0;

  padding:
    0 11px;

  border:0;

  border-radius:
    8px;

  background:
    transparent;

  color:
    #344054;

  font-size:12px;

  line-height:1;

  font-weight:650;

  text-align:left;

  box-shadow:none;

  transition:
    background .15s ease,
    color .15s ease;
}


.tabs .tab-btn:hover{
  background:
    #f5f7fa;

  color:
    #172033;
}


.tabs .tab-btn.active{
  background:
    #eaf3ff;

  color:
    var(--emp-primary);

  font-weight:750;

  box-shadow:
    inset 3px 0 0
    var(--emp-primary);
}


/* =========================================================
   MAIN PAGE â€” CRITICAL FIX

   This keeps the whole workspace OUTSIDE the fixed sidebar.
========================================================= */

.page{
  width:
    calc(
      100% -
      var(--sidebar-w)
    );

  min-height:
    calc(
      100vh -
      var(--topbar-h)
    );

  margin-left:
    var(--sidebar-w);

  padding:
    18px 20px 40px;

  background:
    var(--emp-bg);
}


/* =========================================================
   EXISTING PAGE GRID
========================================================= */

.main-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    280px;

  gap:16px;

  align-items:start;
}


.left-col{
  display:none !important;
}


.center-col{
  width:100%;

  min-width:0;
}


.right-col{
  width:100%;

  position:sticky;

  top:
    calc(
      var(--topbar-h) +
      18px
    );

  align-self:start;
}


/* =========================================================
   COMPACT WORKSPACE

   Jobs, Pipeline, Network, Career Hub, etc.
========================================================= */

body.compact-workspace .main-grid{
  grid-template-columns:
    minmax(0,1fr) !important;
}


body.compact-workspace .right-col{
  display:none !important;
}


/* =========================================================
   CARD FOUNDATION
========================================================= */

.card,
.panel-card,
.analytics-card,
.trend-card,
.filter-panel,
.talent-grid-card,
.agent-live-card,
.table-wrap,
.agent-live-table-wrap{
  border:
    1px solid var(--emp-border);

  border-radius:
    12px;

  background:
    #fff;

  box-shadow:
    var(--emp-shadow);
}


.card{
  overflow:hidden;
}


.card-pad{
  padding:16px;
}


/* =========================================================
   OVERVIEW GRID
========================================================= */

#section-overview .panel-grid{
  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap:12px;
}


#section-overview .panel-card{
  min-height:210px;

  padding:16px;

  border-radius:12px;
}


#section-overview .panel-card h3{
  font-size:13px;

  line-height:1.3;
}


#section-overview .panel-card p{
  min-height:0;

  color:
    var(--emp-muted);

  font-size:11px;

  line-height:1.55;
}


/* =========================================================
   RIGHT INSIGHTS COLUMN
========================================================= */

.right-col .card{
  margin-bottom:14px;

  border-radius:12px;
}


.right-col .card-pad{
  padding:14px;
}


.right-col .card-title{
  margin-bottom:12px;

  font-size:14px;
}


.info-row,
.progress-item{
  padding:10px;

  border-radius:9px;

  background:#f8fafc;
}


.info-label,
.progress-head{
  font-size:10px;
}


.info-value{
  margin-top:4px;

  font-size:16px;
}


/* =========================================================
   GENERIC SECTION TITLES
========================================================= */

.card-title{
  color:
    var(--emp-text);

  font-size:15px;

  font-weight:800;
}


/* =========================================================
   BUTTON REFINEMENT
========================================================= */

.primary-btn,
.ghost-btn,
.light-btn,
.soft-btn,
.success-btn,
.danger-btn,
.pill-btn{
  border-radius:8px;

  font-size:11px;

  font-weight:700;
}


/* =========================================================
   RESPONSIVE DESKTOP / TABLET
========================================================= */

@media(max-width:1280px) and (min-width:761px){

  :root{
    --sidebar-w:214px;
  }


  .main-grid{
    grid-template-columns:
      minmax(0,1fr);
  }


  .right-col{
    display:none;
  }


  #section-overview .panel-grid{
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }


  .top-actions{
    grid-template-columns:
      minmax(220px,1fr)
      40px
      40px
      auto
      42px;
  }


  #shareCompanyBtn{
    display:none;
  }

}


/* =========================================================
   MOBILE SAFETY

   employer-dashboard-mobile.css remains the mobile authority.
========================================================= */
/* =========================================================
   EMPLOYER HOME / COMMAND CENTER
   Production desktop design
========================================================= */

.emp-home{
  width:100%;
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:16px;
}


/* =========================================================
   HEADER
========================================================= */

.emp-home-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:24px;

  padding:
    4px 2px 2px;
}


.emp-home-head > div{
  min-width:0;
}


.emp-home-kicker{
  display:block;

  margin-bottom:6px;

  color:
    var(--emp-primary);

  font-size:9px;
  line-height:1;

  font-weight:800;

  letter-spacing:.09em;

  text-transform:uppercase;
}


.emp-home-head h1{
  margin:0;

  color:
    var(--emp-text);

  font-size:
    clamp(22px,2vw,29px);

  line-height:1.15;

  font-weight:800;

  letter-spacing:-.035em;
}


.emp-home-head p{
  max-width:700px;

  margin:
    7px 0 0;

  color:
    var(--emp-muted);

  font-size:12px;
  line-height:1.55;
}


.emp-home-post-job{
  flex:0 0 auto;

  min-height:39px;

  padding:
    0 16px;
}


/* =========================================================
   KPI STRIP
========================================================= */

.emp-home-kpis{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:10px;
}


.emp-home-kpi{

  min-width:0;

  padding:

  border:
    1px solid var(--emp-border);

  border-radius:
    12px;

  background:#fff;

  box-shadow:
    var(--emp-shadow);

  overflow:hidden;

  transition:
    transform .16s ease,
    box-shadow .16s ease,
    border-color .16s ease;

.emp-home-kpi:hover{

  border-color:
    #d5dce6;

  box-shadow:
    var(--emp-shadow-hover);
}


.emp-home-kpi-icon{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:12px;

  border-radius:8px;

  font-size:13px;

  font-weight:800;
}


.emp-home-kpi-icon.emp-blue{
  color:#0a66c2;
  background:#edf6ff;
}


.emp-home-kpi-icon.emp-green{
  color:#15803d;
  background:#ecfdf3;
}


.emp-home-kpi-icon.emp-purple{
  color:#7c3aed;
  background:#f5f3ff;
}


.emp-home-kpi-icon.emp-orange{
  color:#d97706;
  background:#fff7ed;
}


.emp-home-kpi-icon.emp-cyan{
  color:#087f8c;
  background:#ecfeff;
}


.emp-home-kpi > span{
  display:block;

  margin-bottom:5px;

  color:
    var(--emp-muted);

  font-size:10px;

  font-weight:650;
}


.emp-home-kpi > strong{
  display:block;

  color:
    var(--emp-text);

  font-size:23px;
  line-height:1;

  font-weight:800;

  letter-spacing:-.03em;
}


.emp-home-kpi > small{
  display:block;

  margin-top:8px;

  color:
    var(--emp-faint);

  font-size:9px;

  font-weight:600;
}


/* =========================================================
   GENERIC HOME CARDS
========================================================= */

.emp-home-card{
  min-width:0;

  border:
    1px solid var(--emp-border);

  border-radius:
    12px;

  background:#fff;

  box-shadow:
    var(--emp-shadow);

  overflow:hidden;
}


.emp-home-card-head{
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:
    0 15px;

  border-bottom:
    1px solid var(--emp-border-soft);
}


.emp-home-card-head h3{
  margin:0;

  color:
    var(--emp-text);

  font-size:13px;

  font-weight:800;

  letter-spacing:-.01em;
}


.emp-home-link{
  flex:0 0 auto;

  padding:4px;

  border:0;

  background:transparent;

  color:
    var(--emp-primary);

  font-size:10px;

  font-weight:750;

  cursor:pointer;
}


.emp-home-link:hover{
  color:
    var(--emp-primary-dark);

  text-decoration:underline;
}


/* =========================================================
   MAIN INTELLIGENCE ROW
========================================================= */

.emp-home-main-row{
  display:grid;

  grid-template-columns:
    minmax(220px,.85fr)
    minmax(280px,1.15fr)
    minmax(250px,1fr);

  gap:12px;

  align-items:stretch;
}


.emp-home-main-row > .emp-home-card{
  min-height:260px;
}


/* =========================================================
   PIPELINE
========================================================= */

.emp-pipeline{
  display:flex;
  flex-direction:column;

  padding:
    10px 15px 8px;
}


.emp-pipeline-row{
  position:relative;

  min-height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:
    0 12px 0 16px;

  margin-bottom:6px;

  border:
    1px solid var(--emp-border-soft);

  border-radius:
    8px;

  background:
    #f8fafc;

  overflow:hidden;
}


.emp-pipeline-row::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;
}


.emp-pipeline-row.applied::before{
  background:#3b82f6;
}


.emp-pipeline-row.review::before{
  background:#8b5cf6;
}


.emp-pipeline-row.interview::before{
  background:#f59e0b;
}


.emp-pipeline-row.offer::before{
  background:#22c55e;
}


.emp-pipeline-row span{
  color:
    var(--emp-secondary);

  font-size:10px;

  font-weight:650;
}


.emp-pipeline-row strong{
  color:
    var(--emp-text);

  font-size:15px;

  font-weight:800;
}


.emp-pipeline-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin:
    0 15px 14px;

  padding-top:10px;

  border-top:
    1px solid var(--emp-border-soft);
}


.emp-pipeline-footer span{
  color:
    var(--emp-muted);

  font-size:9px;

  font-weight:600;
}


.emp-pipeline-footer strong{
  color:#15803d;

  font-size:11px;

  font-weight:800;
}


/* =========================================================
   RECOMMENDED TALENT
========================================================= */

.emp-home-talent-list{
  padding:
    4px 15px 10px;
}


.emp-home-talent{
  display:grid;

  grid-template-columns:
    38px minmax(0,1fr) auto;

  align-items:center;

  gap:10px;

  min-height:61px;

  border-bottom:
    1px solid var(--emp-border-soft);
}


.emp-home-talent:last-child{
  border-bottom:0;
}


.emp-home-talent-avatar{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    #edf6ff;

  color:
    var(--emp-primary);

  font-size:11px;

  font-weight:800;

  overflow:hidden;
}


.emp-home-talent-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}


.emp-home-talent-copy{
  min-width:0;
}


.emp-home-talent-copy strong{
  display:block;

  overflow:hidden;

  color:
    var(--emp-text);

  font-size:10px;

  font-weight:750;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.emp-home-talent-copy span{
  display:block;

  margin-top:3px;

  overflow:hidden;

  color:
    var(--emp-muted);

  font-size:9px;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.emp-home-talent-score{
  min-width:38px;

  padding:
    5px 7px;

  border-radius:
    999px;

  background:
    #ecfdf3;

  color:
    #15803d;

  font-size:9px;

  font-weight:800;

  text-align:center;
}


/* =========================================================
   ACTIVITY
========================================================= */

.emp-home-activity{
  padding:
    5px 15px 10px;
}


.emp-home-activity-item{
  position:relative;

  min-height:55px;

  padding:
    10px 0 10px 22px;

  border-bottom:
    1px solid var(--emp-border-soft);
}


.emp-home-activity-item:last-child{
  border-bottom:0;
}


.emp-home-activity-item::before{
  content:"";

  position:absolute;

  left:2px;
  top:16px;

  width:8px;
  height:8px;

  border-radius:50%;

  background:
    var(--emp-primary);

  box-shadow:
    0 0 0 4px #edf6ff;
}


.emp-home-activity-item strong{
  display:block;

  color:
    var(--emp-secondary);

  font-size:10px;

  font-weight:700;

  line-height:1.4;
}


.emp-home-activity-item span{
  display:block;

  margin-top:4px;

  color:
    var(--emp-faint);

  font-size:8px;

  font-weight:600;
}


/* =========================================================
   SECTIONS
========================================================= */

.emp-home-section{
  display:flex;

  flex-direction:column;

  gap:10px;
}


.emp-home-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  padding:
    0 2px;
}


.emp-home-section-head h2{
  margin:0;

  color:
    var(--emp-text);

  font-size:14px;

  font-weight:800;

  letter-spacing:-.015em;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.emp-home-actions{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:10px;
}


.emp-home-actions > button{
  min-width:0;

  min-height:74px;

  display:flex;
  align-items:center;

  gap:11px;

  padding:
    12px;

  border:
    1px solid var(--emp-border);

  border-radius:
    11px;

  background:#fff;

  color:
    var(--emp-text);

  text-align:left;

  cursor:pointer;

  box-shadow:
    var(--emp-shadow);

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}


.emp-home-actions > button:hover{
  transform:
    translateY(-2px);

  border-color:
    #cbd5e1;

  box-shadow:
    var(--emp-shadow-hover);
}


.emp-home-actions > button > span{
  width:34px;
  height:34px;

  flex:0 0 34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:
    9px;

  background:
    var(--emp-primary-soft);

  color:
    var(--emp-primary);

  font-size:13px;

  font-weight:800;
}


.emp-home-actions > button:nth-child(2) > span{
  color:#15803d;
  background:#ecfdf3;
}


.emp-home-actions > button:nth-child(3) > span{
  color:#7c3aed;
  background:#f5f3ff;
}


.emp-home-actions > button:nth-child(4) > span{
  color:#d97706;
  background:#fff7ed;
}


.emp-home-actions > button:nth-child(5) > span{
  color:#087f8c;
  background:#ecfeff;
}


.emp-home-actions strong{
  display:block;

  overflow:hidden;

  font-size:10px;

  font-weight:750;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.emp-home-actions small{
  display:block;

  margin-top:4px;

  overflow:hidden;

  color:
    var(--emp-muted);

  font-size:8px;

  font-weight:550;

  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================================================
   CAREER & EDUCATION
========================================================= */

.emp-home-career-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:10px;
}


.emp-home-career-grid > button{
  position:relative;

  min-width:0;
  min-height:112px;

  display:flex;
  flex-direction:column;

  align-items:flex-start;

  padding:
    14px 15px;

  border:
    1px solid var(--emp-border);

  border-radius:
    11px;

  background:#fff;

  color:
    var(--emp-text);

  text-align:left;

  cursor:pointer;

  box-shadow:
    var(--emp-shadow);

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}


.emp-home-career-grid > button:hover{
  transform:
    translateY(-2px);

  border-color:
    #bfd8f1;

  box-shadow:
    var(--emp-shadow-hover);
}


.emp-home-career-grid span{
  color:
    var(--emp-muted);

  font-size:9px;

  font-weight:700;
}


.emp-home-career-grid strong{
  display:block;

  margin-top:12px;

  color:
    var(--emp-text);

  font-size:22px;

  line-height:1;

  font-weight:800;
}


.emp-home-career-grid small{
  margin-top:auto;

  color:
    var(--emp-faint);

  font-size:8px;

  font-weight:600;
}


/* =========================================================
   LOWER ROW
========================================================= */

.emp-home-lower{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}


.emp-home-lower > .emp-home-card{
  min-height:220px;
}


/* =========================================================
   UPCOMING
========================================================= */

.emp-home-upcoming,
.emp-home-top-jobs{
  padding:
    5px 15px 10px;
}


.emp-home-upcoming-item,
.emp-home-job-item{
  display:grid;

  grid-template-columns:
    minmax(0,1fr) auto;

  gap:12px;

  align-items:center;

  min-height:54px;

  border-bottom:
    1px solid var(--emp-border-soft);
}


.emp-home-upcoming-item:last-child,
.emp-home-job-item:last-child{
  border-bottom:0;
}


.emp-home-upcoming-item strong,
.emp-home-job-item strong{
  display:block;

  overflow:hidden;

  color:
    var(--emp-secondary);

  font-size:10px;

  font-weight:700;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.emp-home-upcoming-item span,
.emp-home-job-item span{
  display:block;

  margin-top:3px;

  color:
    var(--emp-muted);

  font-size:8px;
}


.emp-home-upcoming-item time{
  color:
    var(--emp-primary);

  font-size:9px;

  font-weight:750;

  white-space:nowrap;
}


.emp-home-job-metric{
  min-width:55px;

  text-align:right;
}


.emp-home-job-metric strong{
  color:
    var(--emp-primary);

  font-size:12px;
}


.emp-home-job-metric span{
  font-size:8px;
}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.emp-home .loading,
.emp-home-empty{
  min-height:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  color:
    var(--emp-faint);

  font-size:9px;

  text-align:center;
}


/* =========================================================
   KABEZYA AI
========================================================= */

.emp-kabezya{
  position:relative;

  min-height:106px;

  display:grid;

  grid-template-columns:
    46px minmax(0,1fr) auto;

  align-items:center;

  gap:14px;

  padding:
    17px 18px;

  border:
    1px solid #ddd6fe;

  border-radius:
    13px;

  background:
    linear-gradient(
      110deg,
      #faf8ff 0%,
      #f5f3ff 48%,
      #eef6ff 100%
    );

  overflow:hidden;
}


.emp-kabezya::after{
  content:"";

  position:absolute;

  right:-40px;
  top:-90px;

  width:220px;
  height:220px;

  border-radius:50%;

  border:
    1px solid rgba(124,58,237,.12);

  pointer-events:none;
}


.emp-kabezya-icon{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:
    12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color:#fff;

  font-size:21px;

  box-shadow:
    0 8px 20px
    rgba(124,58,237,.18);
}


.emp-kabezya-copy{
  min-width:0;
}


.emp-kabezya-copy > span{
  display:block;

  margin-bottom:4px;

  color:#7c3aed;

  font-size:8px;

  font-weight:850;

  letter-spacing:.09em;
}


.emp-kabezya-copy h3{
  display:flex;

  align-items:center;

  gap:7px;

  margin:0;

  color:
    var(--emp-text);

  font-size:14px;

  font-weight:800;
}


.emp-kabezya-copy h3 small{
  padding:
    3px 6px;

  border-radius:
    999px;

  background:
    #ede9fe;

  color:
    #6d28d9;

  font-size:7px;

  font-weight:800;

  text-transform:uppercase;
}


.emp-kabezya-copy p{
  max-width:720px;

  margin:
    5px 0 0;

  color:
    var(--emp-muted);

  font-size:9px;

  line-height:1.5;
}


.emp-kabezya-button{
  position:relative;

  z-index:2;

  min-height:36px;

  padding:
    0 14px;

  border:0;

  border-radius:
    8px;

  background:
    #6d28d9;

  color:#fff;

  font-size:9px;

  font-weight:750;

  cursor:pointer;

  white-space:nowrap;

  transition:
    background .16s ease,
    transform .16s ease;
}


.emp-kabezya-button:hover{
  background:#5b21b6;

  transform:
    translateY(-1px);
}


/* =========================================================
   OVERVIEW-SPECIFIC CLEANUP

   The old generic Overview panel styling must not control
   the new command center.
========================================================= */

#section-overview{
  width:100%;
}


#section-overview > .emp-home{
  width:100%;
}


#section-overview .emp-home button{
  font-family:inherit;
}


/* =========================================================
   LARGE TABLET / SMALL DESKTOP
========================================================= */

@media(min-width:761px) and (max-width:1250px){

  .emp-home-kpis{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }


  .emp-home-main-row{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-home-main-row >
  .emp-home-card:last-child{
    grid-column:
      1 / -1;
  }


  .emp-home-actions{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }


  .emp-home-career-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

  
@media(max-width:760px){

  .employer-brand-divider,
  .employer-brand-product,
  .employer-search-shortcut{
    display:none;
  }

}

/* =========================================================
   AIFT EMPLOYER â€” RECRUITMENT WORKSPACE
   JOBS + APPLICANT PIPELINE

   Production desktop/tablet system.

   Scope:
   .emp-workspace
   #section-jobs
   #section-pipeline

   Existing Jobs and Pipeline renderer IDs remain:
   #jobsList
   #pipelineBoard
========================================================= */


/* =========================================================
   WORKSPACE SHELL
========================================================= */

.emp-workspace{
  width:100%;
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:16px;
}


/* =========================================================
   WORKSPACE HEADER
========================================================= */

.emp-workspace-header{
  width:100%;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:24px;

  padding:
    4px 2px 2px;
}


.emp-workspace-heading{
  min-width:0;
}


.emp-workspace-eyebrow{
  display:block;

  margin-bottom:6px;

  color:
    var(--emp-primary);

  font-size:9px;
  line-height:1;

  font-weight:850;

  letter-spacing:.09em;

  text-transform:uppercase;
}


.emp-workspace-heading h1{
  margin:0;

  color:
    var(--emp-text);

  font-size:
    clamp(22px,2vw,29px);

  line-height:1.12;

  font-weight:820;

  letter-spacing:-.035em;
}


.emp-workspace-heading p{
  max-width:720px;

  margin:
    7px 0 0;

  color:
    var(--emp-muted);

  font-size:12px;

  line-height:1.55;
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.emp-workspace-actions{
  flex:0 0 auto;

  display:flex;
  align-items:center;

  gap:8px;
}


.emp-primary-action,
.emp-secondary-action,
.emp-tool-button{
  min-height:39px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  padding:
    0 14px;

  border-radius:
    9px;

  font-family:inherit;

  font-size:10px;

  line-height:1;

  font-weight:750;

  white-space:nowrap;

  cursor:pointer;

  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease,
    box-shadow .16s ease,
    transform .16s ease;
}


.emp-primary-action{
  border:
    1px solid var(--emp-primary);

  background:
    var(--emp-primary);

  color:#fff;

  box-shadow:
    0 1px 2px
    rgba(10,102,194,.18);
}


.emp-primary-action:hover{
  background:
    var(--emp-primary-dark);

  border-color:
    var(--emp-primary-dark);

  transform:
    translateY(-1px);
}


.emp-secondary-action,
.emp-tool-button{
  border:
    1px solid var(--emp-border);

  background:#fff;

  color:
    var(--emp-secondary);
}


.emp-secondary-action:hover,
.emp-tool-button:hover{
  border-color:
    #c9d3df;

  background:
    #f8fafc;

  color:
    var(--emp-text);
}


.emp-primary-action svg,
.emp-secondary-action svg,
.emp-tool-button svg{
  width:15px;
  height:15px;

  flex:0 0 15px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   WORKSPACE METRICS
========================================================= */

.emp-workspace-metrics{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:10px;
}


.emp-workspace-metric{
  min-width:0;

  min-height:96px;

  display:grid;

  grid-template-columns:
    38px minmax(0,1fr);

  align-items:center;

  gap:11px;

  padding:
    14px;

  border:
    1px solid var(--emp-border);

  border-radius:
    12px;

  background:#fff;

  box-shadow:
    var(--emp-shadow);

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}


.emp-workspace-metric:hover{
  transform:
    translateY(-2px);

  border-color:
    #d2dae5;

  box-shadow:
    var(--emp-shadow-hover);
}


.emp-workspace-metric-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:
    10px;
}


.emp-workspace-metric-icon svg{
  width:18px;
  height:18px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-workspace-metric-icon.blue{
  color:#0a66c2;

  background:#edf6ff;
}


.emp-workspace-metric-icon.green{
  color:#15803d;

  background:#ecfdf3;
}


.emp-workspace-metric-icon.purple{
  color:#7c3aed;

  background:#f5f3ff;
}


.emp-workspace-metric-icon.orange{
  color:#d97706;

  background:#fff7ed;
}


.emp-workspace-metric > div:last-child{
  min-width:0;
}


.emp-workspace-metric span{
  display:block;

  color:
    var(--emp-muted);

  font-size:9px;

  font-weight:650;
}


.emp-workspace-metric strong{
  display:block;

  margin-top:4px;

  color:
    var(--emp-text);

  font-size:22px;

  line-height:1;

  font-weight:820;

  letter-spacing:-.025em;
}


.emp-workspace-metric small{
  display:block;

  margin-top:6px;

  color:
    var(--emp-faint);

  font-size:8px;

  font-weight:600;
}


/* =========================================================
   MAIN PANEL
========================================================= */

.emp-workspace-panel{
  width:100%;

  min-width:0;

  border:
    1px solid var(--emp-border);

  border-radius:
    13px;

  background:#fff;

  box-shadow:
    var(--emp-shadow);

  overflow:hidden;
}


.emp-workspace-panel-head{
  min-height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  padding:
    12px 15px;

  border-bottom:
    1px solid var(--emp-border-soft);

  background:#fff;
}


.emp-workspace-panel-head > div:first-child{
  min-width:0;
}


.emp-workspace-panel-head h2{
  margin:0;

  color:
    var(--emp-text);

  font-size:13px;

  line-height:1.2;

  font-weight:800;

  letter-spacing:-.01em;
}


.emp-workspace-panel-head p{
  margin:
    4px 0 0;

  color:
    var(--emp-muted);

  font-size:9px;

  line-height:1.45;
}


/* =========================================================
   WORKSPACE TOOLS
========================================================= */

.emp-workspace-tools{
  flex:0 0 auto;

  display:flex;
  align-items:center;

  gap:7px;
}


.emp-workspace-search{
  position:relative;

  display:block;

  width:
    min(290px,32vw);

  height:36px;
}


.emp-workspace-search svg{
  position:absolute;

  left:11px;

/* =========================================================
   FOLLOW LOADING / SUCCESS SUPPORT

   We will activate these from the real backend follow
   controller once its route is confirmed.
========================================================= */

#section-network
.emp-network-follow-btn.is-loading{
  pointer-events:none;
}

#section-network
.emp-network-follow-btn.is-loading svg{
  display:none;
}

#section-network
.emp-network-follow-btn.is-loading::before{
  content:"";

  width:10px;
  height:10px;

  border:
    1.5px solid
    rgba(255,255,255,.45);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    empNetworkFollowSpin
    .65s linear infinite;
}

#section-network
.emp-network-follow-btn.is-following.is-loading::before{
  border-color:
    rgba(52,64,84,.25);

  border-top-color:#344054;
}

#section-network
.emp-network-follow-btn.is-success{
  animation:
    empNetworkFollowSuccess
    .34s ease;
}

@keyframes empNetworkFollowSpin{

  to{
    transform:rotate(360deg);
  }

}

@keyframes empNetworkFollowSuccess{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }

  100%{
    transform:scale(1);
  }

}
/* =========================================================
   INSTAGRAM-LIKE FOLLOW INTERACTION
========================================================= */

#section-network .emp-network-follow-btn{
  position:relative;

  overflow:hidden;

  transform:translateZ(0);

  transition:
    transform .16s cubic-bezier(.2,.8,.2,1),
    background .18s ease,
    border-color .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}


/* =========================================================
   NORMAL FOLLOW
========================================================= */

#section-network
.emp-network-follow-btn:not(.is-following){
  border-color:#1570ef;

  background:#1570ef;
  color:#fff;

  box-shadow:
    0 1px 2px
    rgba(21,112,239,.18);
}

#section-network
.emp-network-follow-btn:not(.is-following):hover{
  border-color:#175cd3;

  background:#175cd3;

  box-shadow:
    0 3px 9px
    rgba(21,112,239,.18);
}


/* =========================================================
   FOLLOWING
========================================================= */

#section-network
.emp-network-follow-btn.is-following{
  border-color:#d0d5dd;

  background:#fff;
  color:#344054;

  box-shadow:none;
}

#section-network
.emp-network-follow-btn.is-following:hover{
  border-color:#b8c1cc;

  background:#f9fafb;
}


/* =========================================================
   ICONS
========================================================= */

#section-network
.emp-network-follow-btn
.emp-follow-check,

#section-network
.emp-network-follow-btn
.emp-follow-plus{
  width:14px;
  height:14px;

  flex:0 0 14px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

#section-network
.emp-network-follow-btn
.emp-follow-check svg,

#section-network
.emp-network-follow-btn
.emp-follow-plus svg{
  width:12px;
  height:12px;

  fill:none;
  stroke:currentColor;

  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#section-network
.emp-network-follow-btn
.emp-follow-label{
  display:inline-block;

  transform:translateZ(0);
}


/* =========================================================
   FOLLOW SUCCESS ANIMATION
========================================================= */

#section-network
.emp-network-follow-btn.is-follow-success{
  animation:
    empInstagramFollowButton
    .38s
    cubic-bezier(.2,.85,.32,1.25);
}

#section-network
.emp-network-follow-btn.is-follow-success
.emp-follow-check{
  animation:
    empInstagramCheckPop
    .4s
    cubic-bezier(.2,.9,.3,1.35);
}

#section-network
.emp-network-follow-btn.is-follow-success
.emp-follow-label{
  animation:
    empInstagramLabelIn
    .3s ease;
}


/* =========================================================
   UNFOLLOW ANIMATION
========================================================= */

#section-network
.emp-network-follow-btn.is-unfollow-success{
  animation:
    empInstagramUnfollowButton
    .3s ease;
}

#section-network
.emp-network-follow-btn.is-unfollow-success
.emp-follow-plus{
  animation:
    empInstagramPlusPop
    .32s
    cubic-bezier(.2,.9,.3,1.25);
}

#section-network
.emp-network-follow-btn.is-unfollow-success
.emp-follow-label{
  animation:
    empInstagramLabelIn
    .28s ease;
}


/* =========================================================
   ACTIVE TAP FEEDBACK
========================================================= */

#section-network
.emp-network-follow-btn:active{
  transform:scale(.965);
}


/* =========================================================
   FOLLOW LOADING
========================================================= */

#section-network
.emp-network-follow-btn.is-loading{
  pointer-events:none;

  transform:scale(.985);

  opacity:.85;
}

#section-network
.emp-network-follow-btn.is-loading::before{
  content:"";

  width:11px;
  height:11px;

  flex:0 0 11px;

  border:
    1.5px solid
    rgba(255,255,255,.45);

  border-top-color:
    #fff;

  border-radius:50%;

  animation:
    empInstagramFollowSpinner
    .62s linear infinite;
}

#section-network
.emp-network-follow-btn.is-following.is-loading::before{
  border-color:
    rgba(52,64,84,.2);

  border-top-color:
    #344054;
}


/* =========================================================
   KEYFRAMES
========================================================= */

@keyframes empInstagramFollowButton{

  0%{
    transform:scale(1);
  }

  42%{
    transform:scale(.96);
  }

  72%{
    transform:scale(1.035);
  }

  100%{
    transform:scale(1);
  }

}


@keyframes empInstagramCheckPop{

  0%{
    opacity:0;

    transform:
      scale(.25)
      rotate(-25deg);
  }

  65%{
    opacity:1;

    transform:
      scale(1.2)
      rotate(4deg);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);
  }

}


@keyframes empInstagramUnfollowButton{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(.96);
  }

  100%{
    transform:scale(1);
  }

}


@keyframes empInstagramPlusPop{

  0%{
    opacity:0;

    transform:
      scale(.4)
      rotate(-45deg);
  }

  70%{
    opacity:1;

    transform:
      scale(1.15)
      rotate(5deg);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);
  }

}


@keyframes empInstagramLabelIn{

  0%{
    opacity:.2;

    transform:
      translateY(2px);
  }

  100%{
    opacity:1;

    transform:
      translateY(0);
  }

}


@keyframes empInstagramFollowSpinner{

  to{
    transform:rotate(360deg);
  }

}
