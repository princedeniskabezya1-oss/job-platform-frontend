/* =========================================================
   FOLLOW LOADING / SUCCESS SUPPORT

   We will activate these from the real backend follow
   controller once its route is confirmed.
========================================================= */

#section-network
.emp-network-follow-btn.is-loading{
  pointer-events:none;
}

#section-network
.emp-network-follow-btn.is-loading svg{
  display:none;
}

#section-network
.emp-network-follow-btn.is-loading::before{
  content:"";

  width:10px;
  height:10px;

  border:
    1.5px solid
    rgba(255,255,255,.45);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    empNetworkFollowSpin
    .65s linear infinite;
}

#section-network
.emp-network-follow-btn.is-following.is-loading::before{
  border-color:
    rgba(52,64,84,.25);

  border-top-color:#344054;
}

#section-network
.emp-network-follow-btn.is-success{
  animation:
    empNetworkFollowSuccess
    .34s ease;
}

@keyframes empNetworkFollowSpin{

  to{
    transform:rotate(360deg);
  }

}

@keyframes empNetworkFollowSuccess{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }

  100%{
    transform:scale(1);
  }

}
/* =========================================================
   INSTAGRAM-LIKE FOLLOW INTERACTION
========================================================= */

#section-network .emp-network-follow-btn{
  position:relative;

  overflow:hidden;

  transform:translateZ(0);

  transition:
    transform .16s cubic-bezier(.2,.8,.2,1),
    background .18s ease,
    border-color .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}


/* =========================================================
   NORMAL FOLLOW
========================================================= */

#section-network
.emp-network-follow-btn:not(.is-following){
  border-color:#1570ef;

  background:#1570ef;
  color:#fff;

  box-shadow:
    0 1px 2px
    rgba(21,112,239,.18);
}

#section-network
.emp-network-follow-btn:not(.is-following):hover{
  border-color:#175cd3;

  background:#175cd3;

  box-shadow:
    0 3px 9px
    rgba(21,112,239,.18);
}


/* =========================================================
   FOLLOWING
========================================================= */

#section-network
.emp-network-follow-btn.is-following{
  border-color:#d0d5dd;

  background:#fff;
  color:#344054;

  box-shadow:none;
}

#section-network
.emp-network-follow-btn.is-following:hover{
  border-color:#b8c1cc;

  background:#f9fafb;
}


/* =========================================================
   ICONS
========================================================= */

#section-network
.emp-network-follow-btn
.emp-follow-check,

#section-network
.emp-network-follow-btn
.emp-follow-plus{
  width:14px;
  height:14px;

  flex:0 0 14px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

#section-network
.emp-network-follow-btn
.emp-follow-check svg,

#section-network
.emp-network-follow-btn
.emp-follow-plus svg{
  width:12px;
  height:12px;

  fill:none;
  stroke:currentColor;

  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#section-network
.emp-network-follow-btn
.emp-follow-label{
  display:inline-block;

  transform:translateZ(0);
}


/* =========================================================
   FOLLOW SUCCESS ANIMATION
========================================================= */

#section-network
.emp-network-follow-btn.is-follow-success{
  animation:
    empInstagramFollowButton
    .38s
    cubic-bezier(.2,.85,.32,1.25);
}

#section-network
.emp-network-follow-btn.is-follow-success
.emp-follow-check{
  animation:
    empInstagramCheckPop
    .4s
    cubic-bezier(.2,.9,.3,1.35);
}

#section-network
.emp-network-follow-btn.is-follow-success
.emp-follow-label{
  animation:
    empInstagramLabelIn
    .3s ease;
}


/* =========================================================
   UNFOLLOW ANIMATION
========================================================= */

#section-network
.emp-network-follow-btn.is-unfollow-success{
  animation:
    empInstagramUnfollowButton
    .3s ease;
}

#section-network
.emp-network-follow-btn.is-unfollow-success
.emp-follow-plus{
  animation:
    empInstagramPlusPop
    .32s
    cubic-bezier(.2,.9,.3,1.25);
}

#section-network
.emp-network-follow-btn.is-unfollow-success
.emp-follow-label{
  animation:
    empInstagramLabelIn
    .28s ease;
}


/* =========================================================
   ACTIVE TAP FEEDBACK
========================================================= */

#section-network
.emp-network-follow-btn:active{
  transform:scale(.965);
}


/* =========================================================
   FOLLOW LOADING
========================================================= */

#section-network
.emp-network-follow-btn.is-loading{
  pointer-events:none;

  transform:scale(.985);

  opacity:.85;
}

#section-network
.emp-network-follow-btn.is-loading::before{
  content:"";

  width:11px;
  height:11px;

  flex:0 0 11px;

  border:
    1.5px solid
    rgba(255,255,255,.45);

  border-top-color:
    #fff;

  border-radius:50%;

  animation:
    empInstagramFollowSpinner
    .62s linear infinite;
}

#section-network
.emp-network-follow-btn.is-following.is-loading::before{
  border-color:
    rgba(52,64,84,.2);

  border-top-color:
    #344054;
}


/* =========================================================
   KEYFRAMES
========================================================= */

@keyframes empInstagramFollowButton{

  0%{
    transform:scale(1);
  }

  42%{
    transform:scale(.96);
  }

  72%{
    transform:scale(1.035);
  }

  100%{
    transform:scale(1);
  }

}


@keyframes empInstagramCheckPop{

  0%{
    opacity:0;

    transform:
      scale(.25)
      rotate(-25deg);
  }

  65%{
    opacity:1;

    transform:
      scale(1.2)
      rotate(4deg);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);
  }

}


@keyframes empInstagramUnfollowButton{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(.96);
  }

  100%{
    transform:scale(1);
  }

}


@keyframes empInstagramPlusPop{

  0%{
    opacity:0;

    transform:
      scale(.4)
      rotate(-45deg);
  }

  70%{
    opacity:1;

    transform:
      scale(1.15)
      rotate(5deg);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);
  }

}


@keyframes empInstagramLabelIn{

  0%{
    opacity:.2;

    transform:
      translateY(2px);
  }

  100%{
    opacity:1;

    transform:
      translateY(0);
  }

}


@keyframes empInstagramFollowSpinner{

  to{
    transform:rotate(360deg);
  }

}

  #section-analytics .card-pad,
  #section-feed .card-pad{
    min-width:0;
  }

  .emp-workspace *,
  .employer-career-hub *{
    box-sizing:border-box;
  }

}

/* =========================================================
   AIFT EMPLOYER — OPERATIONS WORKSPACE
========================================================= */

#section-ops{
  width:100%;
  min-width:0;
}


#section-ops .emp-ops-workspace{
  display:flex;
  flex-direction:column;

  gap:14px;
}


/* =========================================================
   HEADER ICON BUTTON SUPPORT
========================================================= */

#section-ops .emp-workspace-actions
svg{
  width:15px;
  height:15px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   METRICS
========================================================= */

.emp-ops-metrics{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:9px;
}


.emp-ops-metric{
  min-height:92px;

  display:grid;

  grid-template-columns:
    38px minmax(0,1fr);

  align-items:center;

  gap:11px;

  padding:13px 14px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-ops-metric-icon,
.emp-ops-panel-icon{
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;
}


.emp-ops-metric-icon{
  width:38px;
  height:38px;
}


.emp-ops-panel-icon{
  width:34px;
  height:34px;
}


.emp-ops-metric-icon svg,
.emp-ops-panel-icon svg{
  width:18px;
  height:18px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-metric-icon.blue,
.emp-ops-panel-icon.blue{
  background:#edf6ff;

  color:#0a66c2;
}


.emp-ops-metric-icon.green,
.emp-ops-panel-icon.green{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-metric-icon.purple,
.emp-ops-panel-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-ops-metric-icon.orange{
  background:#fff7ed;

  color:#d97706;
}


.emp-ops-metric span{
  display:block;

  color:#667085;

  font-size:8px;

  font-weight:650;
}


.emp-ops-metric strong{
  display:block;

  margin-top:4px;

  color:#101828;

  font-size:20px;

  line-height:1;

  font-weight:820;
}


.emp-ops-metric small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:7px;
}


/* =========================================================
   PRIMARY GRID
========================================================= */

.emp-ops-primary-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:11px;

  align-items:start;
}


/* =========================================================
   PANELS
========================================================= */

.emp-ops-panel{
  min-width:0;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);

  overflow:hidden;
}


.emp-ops-panel-head{
  min-height:61px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;

  padding:11px 13px;

  border-bottom:
    1px solid
    #eaecf0;
}


.emp-ops-panel-title{
  min-width:0;

  display:flex;
  align-items:center;

  gap:9px;
}


.emp-ops-panel-title h2{
  margin:0;

  color:#101828;

  font-size:11px;

  font-weight:800;
}


.emp-ops-panel-title p{
  margin:3px 0 0;

  color:#667085;

  font-size:7px;
}


.emp-ops-add-btn,
.emp-ops-refresh-btn{
  min-height:31px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:0 9px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  background:#fff;

  color:#344054;

  font-family:inherit;

  font-size:7px;

  font-weight:750;

  cursor:pointer;
}


.emp-ops-add-btn:hover,
.emp-ops-refresh-btn:hover{
  border-color:#b8d6f5;

  background:#f5faff;

  color:#0a66c2;
}


/* =========================================================
   OPERATIONS LIST
========================================================= */

.emp-ops-list{
  min-height:190px;

  display:grid;

  gap:8px;

  padding:9px;

  align-content:start;
}


/* =========================================================
   EMPTY STATES
========================================================= */

.emp-ops-empty{
  min-height:175px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:24px;

  text-align:center;
}


.emp-ops-empty-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:10px;

  border-radius:11px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-ops-empty-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-ops-empty-icon svg{
  width:20px;
  height:20px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.7;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-empty strong{
  color:#101828;

  font-size:10px;

  font-weight:800;
}


.emp-ops-empty span{
  max-width:300px;

  margin-top:5px;

  color:#667085;

  font-size:8px;

  line-height:1.5;
}


.emp-ops-empty button{
  min-height:31px;

  margin-top:12px;

  padding:0 10px;

  border:1px solid #b8d6f5;

  border-radius:7px;

  background:#fff;

  color:#0a66c2;

  font-size:7px;

  font-weight:750;
}


/* =========================================================
   SCHEDULE / TASK CARDS
========================================================= */

.emp-ops-item{
  min-width:0;

  padding:11px;

  border:1px solid #e8ecf1;

  border-radius:9px;

  background:#fff;

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    transform .15s ease;
}


.emp-ops-item:hover{
  transform:translateY(-1px);

  border-color:#d2dbe5;

  box-shadow:
    0 5px 16px
    rgba(16,24,40,.045);
}


.emp-ops-item-top{
  display:flex;
  align-items:center;

  gap:9px;
}


.emp-ops-avatar{
  width:38px !important;
  height:38px !important;

  flex:0 0 38px;

  border:1px solid #e4e7ec;

  border-radius:9px;

  object-fit:cover;
}


.emp-ops-item-copy{
  flex:1;

  min-width:0;
}


.emp-ops-item-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-ops-item-title-row strong{
  overflow:hidden;

  color:#101828;

  font-size:9px;

  font-weight:800;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.emp-ops-item-copy > span{
  display:block;

  margin-top:3px;

  overflow:hidden;

  color:#667085;

  font-size:7px;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================================================
   ITEM DETAILS
========================================================= */

.emp-ops-item-details{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}


.emp-ops-item-details > div{
  min-width:0;

  padding:7px 8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-ops-item-details span{
  display:block;

  color:#98a2b3;

  font-size:6px;

  font-weight:700;

  text-transform:uppercase;
}


.emp-ops-item-details strong{
  display:block;

  margin-top:3px;

  overflow:hidden;

  color:#344054;

  font-size:7px;

  font-weight:750;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================================================
   TASK META
========================================================= */

.emp-ops-task-meta{
  display:flex;
  flex-wrap:wrap;

  gap:5px;

  margin-top:9px;
}


.emp-ops-task-meta span,
.emp-ops-recurrence{
  min-height:21px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:700;
}


.emp-ops-task-control{
  margin-top:9px;
}


.emp-ops-task-control label{
  display:block;

  margin-bottom:4px;

  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-ops-task-control select{
  width:100%;

  height:31px;

  padding:0 8px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  outline:none;

  background:#f8fafc;

  color:#344054;

  font-size:7px;

  font-weight:700;
}


/* =========================================================
   STATUS + PRIORITY
========================================================= */

.emp-ops-status,
.emp-ops-priority{
  flex:0 0 auto;

  min-height:21px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  font-size:6px;

  font-weight:750;

  text-transform:capitalize;
}


.emp-ops-status.scheduled{
  background:#eef4fb;

  color:#42658a;
}


.emp-ops-status.active{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-status.done{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-priority.low{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-priority.medium{
  background:#fff7ed;

  color:#c56a00;
}


.emp-ops-priority.high,
.emp-ops-priority.urgent{
  background:#fff1f2;

  color:#be123c;
}


/* =========================================================
   CARD FOOTER
========================================================= */

.emp-ops-item-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  margin-top:9px;

  padding-top:8px;

  border-top:1px solid #f0f2f5;
}


.emp-ops-delete-btn{
  min-height:27px;

  padding:0 8px;

  border:1px solid #fecaca;

  border-radius:6px;

  background:#fff;

  color:#b42318;

  font-family:inherit;

  font-size:6px;

  font-weight:750;

  cursor:pointer;
}


.emp-ops-delete-btn:hover{
  background:#fff5f5;
}


/* =========================================================
   LIVE AGENT ACTIVITY
========================================================= */

.emp-ops-agent-panel{
  width:100%;
}


.emp-ops-live-actions{
  display:flex;
  align-items:center;

  gap:7px;
}


.emp-ops-live-badge{
  min-height:26px;

  display:inline-flex;
  align-items:center;

  gap:5px;

  padding:0 8px;

  border-radius:999px;

  background:#ecfdf3;

  color:#15803d;

  font-size:7px;

  font-weight:750;
}


.emp-ops-live-badge span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 4px
    rgba(34,197,94,.11);
}


.emp-ops-refresh-btn svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-table-wrap{
  width:100%;

  overflow-x:auto;
}


#section-ops .emp-data-table{
  width:100%;

  min-width:820px;

  border-collapse:collapse;
}


#section-ops .emp-data-table th{
  padding:9px 11px;

  background:#f8fafc;

  color:#667085;

  font-size:6px;

  font-weight:800;

  letter-spacing:.04em;

  text-transform:uppercase;
}


#section-ops .emp-data-table td{
  padding:10px 11px;

  border-bottom:1px solid #eef1f4;

  color:#344054;

  font-size:7px;
}


#section-ops .emp-data-table tbody tr:hover{
  background:#fbfcfe;
}


/* =========================================================
   AGENT STATUS + PERFORMANCE
========================================================= */

#section-ops .agent-status-dot{
  width:7px;
  height:7px;

  margin-right:6px;

  border-radius:50%;
}


#section-ops .agent-perf-bar{
  width:72px;

  height:6px;

  border-radius:999px;

  background:#eaecf0;
}


#section-ops .agent-perf-fill{
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #22c55e
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

  .emp-ops-metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-ops-primary-grid{
    grid-template-columns:1fr;
  }

}


@media(max-width:760px){

  .emp-ops-metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-ops-primary-grid{
    grid-template-columns:1fr;
  }


  .emp-ops-panel-head{
    align-items:flex-start;
  }


  .emp-ops-item-details{
    grid-template-columns:1fr 1fr;
  }


  .emp-ops-live-actions{
    align-items:flex-end;

    flex-direction:column;
  }

}

/* =========================================================
   AIFT EMPLOYER — LIVE ANALYTICS
========================================================= */

#section-analytics{
  width:100%;
  min-width:0;
}


.emp-analytics-workspace{
  gap:14px;
}


/* =========================================================
   CONTROLS
========================================================= */

.emp-analytics-controls{
  display:flex;
  align-items:flex-end;

  gap:7px;
}


.emp-analytics-range-control{
  display:flex;
  flex-direction:column;

  gap:4px;
}


.emp-analytics-range-control > span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-analytics-range-control select{
  height:36px;

  padding:0 30px 0 10px;

  border:1px solid #dfe3e8;

  border-radius:8px;

  outline:none;

  background:#fff;

  color:#344054;

  font-family:inherit;

  font-size:8px;

  font-weight:700;
}


.emp-analytics-refresh{
  height:36px;

  display:inline-flex;
  align-items:center;

  gap:6px;

  padding:0 10px;

  border:1px solid #dfe3e8;

  border-radius:8px;

  background:#fff;

  color:#344054;

  font-size:8px;

  font-weight:750;

  cursor:pointer;
}


.emp-analytics-refresh:hover{
  border-color:#b8d6f5;

  background:#f5faff;

  color:#0a66c2;
}


.emp-analytics-refresh svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   CUSTOM DATE RANGE
========================================================= */

#section-analytics .emp-custom-dates{
  display:flex;
  align-items:flex-end;

  gap:8px;

  width:max-content;

  max-width:100%;

  padding:10px;

  border:1px solid #e4e7ec;

  border-radius:9px;

  background:#fff;
}


#section-analytics .emp-custom-dates.hidden{
  display:none;
}


#section-analytics .emp-custom-dates > div{
  display:flex;
  flex-direction:column;

  gap:4px;
}


#section-analytics .emp-custom-dates > div > span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


#section-analytics .emp-custom-dates input{
  height:35px;

  padding:0 9px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  outline:none;

  font-size:8px;
}


.emp-analytics-date-arrow{
  padding-bottom:9px;

  color:#98a2b3;

  font-size:8px;
}


/* =========================================================
   KPI SUMMARY
========================================================= */

.emp-analytics-summary{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:9px;
}


.emp-analytics-kpi{
  position:relative;

  min-width:0;

  min-height:155px;

  display:flex;
  flex-direction:column;

  padding:13px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  overflow:hidden;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-analytics-kpi::after{
  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:3px;

  background:#0a66c2;
}


.emp-analytics-kpi.purple::after{
  background:#7c3aed;
}


.emp-analytics-kpi.green::after{
  background:#16a34a;
}


.emp-analytics-kpi.orange::after{
  background:#f59e0b;
}


.emp-analytics-kpi-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-analytics-kpi-icon{
  width:32px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-analytics-kpi.purple
.emp-analytics-kpi-icon{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-analytics-kpi.green
.emp-analytics-kpi-icon{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-kpi.orange
.emp-analytics-kpi-icon{
  background:#fff7ed;

  color:#d97706;
}


.emp-analytics-kpi-icon svg{
  width:16px;
  height:16px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-analytics-kpi-trend{
  min-height:23px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:750;
}


.emp-analytics-kpi-trend.up{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-kpi-trend.down{
  background:#fff1f2;

  color:#be123c;
}


.emp-analytics-kpi-label{
  margin-top:11px;

  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-analytics-kpi > strong{
  display:block;

  margin-top:4px;

  color:#101828;

  font-size:23px;

  line-height:1;

  font-weight:830;
}


.emp-analytics-kpi > small{
  margin-top:5px;

  color:#98a2b3;

  font-size:6px;

  line-height:1.4;
}


/* =========================================================
   MINI CHART
========================================================= */

.emp-analytics-mini-chart{
  height:38px;

  margin-top:auto;

  padding-top:9px;

  overflow:hidden;
}


.emp-analytics-mini-chart
.crypto-line-chart{
  width:100%;
  height:100%;
}


.emp-analytics-mini-chart
.crypto-chart-grid{
  display:none;
}


/* =========================================================
   KPI PROGRESS
========================================================= */

.emp-analytics-progress{
  width:100%;

  height:6px;

  margin-top:auto;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-analytics-progress > div{
  width:0;

  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #4da1f2
    );

  transition:
    width .45s ease;
}


.emp-analytics-kpi.green
.emp-analytics-progress > div{
  background:
    linear-gradient(
      90deg,
      #16a34a,
      #4ade80
    );
}


.emp-analytics-kpi.orange
.emp-analytics-progress > div{
  background:
    linear-gradient(
      90deg,
      #d97706,
      #fbbf24
    );
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.emp-analytics-dashboard{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;

  align-items:stretch;
}


.emp-analytics-wide{
  grid-column:
    span 2;
}


/* =========================================================
   ANALYTICS PANEL
========================================================= */

.emp-analytics-panel{
  min-width:0;

  min-height:280px;

  display:flex;
  flex-direction:column;

  padding:13px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}


.emp-analytics-panel:hover{
  transform:translateY(-1px);

  border-color:#d4dce5;

  box-shadow:
    0 7px 20px
    rgba(16,24,40,.045);
}


.emp-analytics-panel-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;
}


.emp-analytics-panel-kicker{
  display:block;

  color:#0a66c2;

  font-size:6px;

  font-weight:850;

  letter-spacing:.08em;

  text-transform:uppercase;
}


.emp-analytics-panel-head h2{
  margin:4px 0 0;

  color:#101828;

  font-size:11px;

  font-weight:820;
}


.emp-analytics-panel-head p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;

  line-height:1.45;
}


/* =========================================================
   HEALTH BADGE
========================================================= */

.emp-analytics-health{
  min-height:23px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:750;
}


.emp-analytics-health.up{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-health.down{
  background:#fff1f2;

  color:#be123c;
}


/* =========================================================
   LARGE CHARTS
========================================================= */

.emp-analytics-large-chart{
  flex:1;

  min-height:145px;

  margin-top:13px;
}


.emp-analytics-large-chart
.crypto-line-chart,
.emp-analytics-job-chart
.crypto-line-chart,
.emp-analytics-operations-chart
.crypto-line-chart{
  width:100%;
  height:100%;
}


.emp-analytics-large-chart
.crypto-chart-area{
  fill:
    rgba(10,102,194,.10);
}


.emp-analytics-large-chart
.crypto-chart-line{
  stroke:#0a66c2;

  stroke-width:2.4;
}


.emp-analytics-job-chart,
.emp-analytics-operations-chart{
  height:110px;

  margin-top:18px;
}


/* =========================================================
   CHART FOOTER
========================================================= */

.emp-analytics-chart-footer{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}


.emp-analytics-chart-footer > div,
.emp-analytics-single-total > div{
  padding:8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-analytics-chart-footer span,
.emp-analytics-single-total span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-chart-footer strong,
.emp-analytics-single-total strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;

  font-weight:800;
}


.positive{
  color:#15803d !important;
}


/* =========================================================
   FUNNEL
========================================================= */

.emp-funnel{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-top:18px;
}


.emp-funnel-label{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  margin-bottom:5px;
}


.emp-funnel-label span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-funnel-label strong{
  color:#101828;

  font-size:8px;
}


.emp-funnel-track{
  width:100%;

  height:9px;

  border-radius:999px;

  background:#f2f4f7;

  overflow:hidden;
}


.emp-funnel-track > div{
  height:100%;

  border-radius:inherit;

  background:#0a66c2;

  transition:
    width .45s ease;
}


.emp-funnel-row.purple
.emp-funnel-track > div{
  background:#7c3aed;
}


.emp-funnel-row.orange
.emp-funnel-track > div{
  background:#f59e0b;
}


.emp-funnel-row.teal
.emp-funnel-track > div{
  background:#0891b2;
}


.emp-funnel-row.green
.emp-funnel-track > div{
  background:#16a34a;
}


/* =========================================================
   FUNNEL RATES
========================================================= */

.emp-analytics-rate-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:5px;

  margin-top:auto;

  padding-top:14px;
}


.emp-analytics-rate-grid > div{
  padding:7px;

  border-radius:7px;

  background:#f8fafc;

  text-align:center;
}


.emp-analytics-rate-grid span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-rate-grid strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;
}


/* =========================================================
   EMPLOYER BRAND PERFORMANCE
========================================================= */

.emp-brand-performance{
  flex:1;

  display:flex;
  flex-direction:column;

  justify-content:center;

  margin-top:14px;
}


.emp-brand-big-number{
  padding:12px;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      #eef6ff,
      #f8fbff
    );
}


.emp-brand-big-number span{
  display:block;

  color:#667085;

  font-size:7px;
}


.emp-brand-big-number strong{
  display:block;

  margin-top:4px;

  color:#0a66c2;

  font-size:25px;

  line-height:1;

  font-weight:830;
}


.emp-brand-big-number small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:6px;
}


.emp-brand-stats{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:8px;
}


.emp-brand-stats > div{
  padding:8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-brand-stats span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-brand-stats strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:10px;
}


/* =========================================================
   OPERATIONS SUMMARY
========================================================= */

.emp-analytics-operations-summary{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:5px;

  margin-top:8px;
}


.emp-analytics-operations-summary > div{
  padding:7px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-analytics-operations-summary span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-operations-summary strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;
}


.emp-analytics-completion{
  margin-top:auto;

  padding-top:12px;
}


.emp-analytics-completion > div:first-child{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-analytics-completion span{
  color:#667085;

  font-size:7px;
}


.emp-analytics-completion strong{
  color:#344054;

  font-size:8px;
}


.emp-analytics-completion-track{
  height:6px;

  margin-top:6px;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-analytics-completion-track > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #22c55e
    );
}


/* =========================================================
   JOB TOTAL
========================================================= */

.emp-analytics-single-total{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:auto;
}


/* =========================================================
   EMPLOYER HEALTH
========================================================= */

.emp-health-score-list{
  display:flex;
  flex-direction:column;

  gap:14px;

  margin-top:18px;
}


.emp-health-score-list
> div
> div:first-child{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-health-score-list span{
  color:#667085;

  font-size:7px;
}


.emp-health-score-list strong{
  color:#344054;

  font-size:8px;
}


.emp-health-track{
  width:100%;

  height:7px;

  margin-top:6px;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-health-track > div{
  height:100%;

  border-radius:inherit;
}


.emp-health-track.green > div{
  background:#16a34a;
}


.emp-health-track.blue > div{
  background:#0a66c2;
}


.emp-health-track.purple > div{
  background:#7c3aed;
}


.emp-health-track.orange > div{
  background:#f59e0b;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

  .emp-analytics-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-dashboard{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-wide{
    grid-column:
      span 2;
  }

}


@media(max-width:760px){

  .emp-analytics-controls{
    align-items:stretch;

    flex-direction:column;

    width:100%;
  }


  .emp-analytics-range-control,
  .emp-analytics-range-control select,
  .emp-analytics-refresh{
    width:100%;
  }


  #section-analytics
  .emp-custom-dates{
    width:100%;

    align-items:stretch;

    flex-direction:column;
  }


  .emp-analytics-date-arrow{
    padding:0;

    text-align:center;
  }


  .emp-analytics-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-dashboard{
    grid-template-columns:1fr;
  }


  .emp-analytics-wide{
    grid-column:auto;
  }


  .emp-analytics-chart-footer,
  .emp-analytics-operations-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

/* =========================================================
   AIFT EMPLOYER
   PROFILE + SETTINGS
========================================================= */

#section-profile,
#section-settings{
  width:100%;
  min-width:0;
}


/* =========================================================
   SHARED ACTIONS
========================================================= */

.emp-profile-header-actions,
.emp-profile-public-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}


.emp-primary-action,
.emp-secondary-action{
  min-height:36px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:0 11px;

  border-radius:8px;

  font-family:inherit;
  font-size:8px;
  font-weight:750;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}


.emp-primary-action{
  border:1px solid #0a66c2;

  background:#0a66c2;

  color:#fff;
}


.emp-primary-action:hover{
  background:#0756a6;

  border-color:#0756a6;
}


.emp-secondary-action{
  border:1px solid #d8e0e9;

  background:#fff;

  color:#344054;
}


.emp-secondary-action:hover{
  border-color:#a9cbed;

  background:#f7fbff;

  color:#0a66c2;
}


.emp-primary-action svg,
.emp-secondary-action svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   PROFILE DASHBOARD
========================================================= */

.emp-profile-dashboard{
  display:grid;

  grid-template-columns:
    minmax(0,1.35fr)
    minmax(260px,.65fr);

  gap:10px;
}


/* =========================================================
   PROFILE IDENTITY
========================================================= */

.emp-profile-identity-card{
  min-width:0;

  overflow:hidden;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-profile-cover{
  width:100%;
  height:145px;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  background-color:#e8eef5;
}


.emp-profile-cover.empty{
  background:
    linear-gradient(
      135deg,
      #dcecff 0%,
      #eef6ff 48%,
      #f8fafc 100%
    );
}


.emp-profile-identity-body{
  display:flex;
  align-items:flex-start;

  gap:15px;

  padding:0 16px 17px;
}


.emp-profile-company-logo{
  width:86px !important;
  height:86px !important;

  min-width:86px;

  margin-top:-43px;

  border:4px solid #fff;

  border-radius:16px;

  object-fit:cover;

  background:#fff;

  box-shadow:
    0 8px 22px
    rgba(16,24,40,.12);
}


.emp-profile-company-main{
  flex:1;

  min-width:0;

  padding-top:13px;
}


.emp-profile-company-heading{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;
}


.emp-profile-company-heading h2{
  margin:5px 0 0;

  color:#101828;

  font-size:17px;

  line-height:1.2;

  font-weight:820;
}


.emp-profile-company-heading p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;
}


.emp-profile-status{
  display:inline-flex;
  align-items:center;

  min-height:21px;

  padding:0 7px;

  border-radius:999px;

  background:#ecfdf3;

  color:#15803d;

  font-size:6px;

  font-weight:800;
}


.emp-profile-description{
  max-width:760px;

  margin:11px 0 0;

  color:#475467;

  font-size:8px;

  line-height:1.6;
}


.emp-profile-tags{
  display:flex;
  flex-wrap:wrap;

  gap:5px;

  margin-top:10px;
}


.emp-profile-tags span{
  display:inline-flex;
  align-items:center;

  min-height:23px;

  padding:0 7px;

  border:1px solid #e4e7ec;

  border-radius:999px;

  background:#f8fafc;

  color:#475467;

  font-size:6px;

  font-weight:700;
}


/* =========================================================
   PROFILE STATS
========================================================= */

.emp-profile-stat-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}


.emp-profile-stat-grid article{
  min-width:0;

  min-height:105px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:12px;

  border:1px solid #e4e7ec;

  border-radius:10px;

  background:#fff;
}


.emp-profile-stat-icon{
  width:35px;
  height:35px;

  flex:0 0 35px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-profile-stat-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-profile-stat-icon.green{
  background:#ecfdf3;

  color:#15803d;
}


.emp-profile-stat-icon.orange{
  background:#fff7ed;

  color:#d97706;
}


.emp-profile-stat-icon svg{
  width:17px;
  height:17px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-profile-stat-grid article > div > span{
  display:block;

  color:#667085;

  font-size:6px;

  font-weight:700;
}


.emp-profile-stat-grid article strong{
  display:block;

  margin-top:3px;

  color:#101828;

  font-size:17px;

  line-height:1;

  font-weight:830;
}


.emp-profile-stat-grid article small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:6px;
}


/* =========================================================
   PROFILE INFORMATION
========================================================= */

.emp-profile-information{
  padding:15px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;
}


.emp-profile-information-head h3,
.emp-profile-public-card h3{
  margin:4px 0 0;

  color:#101828;

  font-size:11px;

  font-weight:820;
}


.emp-profile-information-head p,
.emp-profile-public-card p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;

  line-height:1.5;
}


.emp-profile-section-kicker{
  display:block;

  color:#0a66c2;

  font-size:6px;

  font-weight:850;

  letter-spacing:.08em;
}


.emp-profile-details-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:7px;

  margin-top:13px;
}


.emp-profile-details-grid > div{
  min-width:0;

  padding:10px;

  border:1px solid #edf1f5;

  border-radius:8px;

  background:#f8fafc;
}


.emp-profile-detail-wide{
  grid-column:1 / -1;
}


.emp-profile-details-grid span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-profile-details-grid strong{
  display:block;

  margin-top:4px;

  overflow:hidden;

  color:#344054;

  font-size:8px;

  font-weight:750;

  text-overflow:ellipsis;
}


/* =========================================================
   PUBLIC PROFILE CARD
========================================================= */

.emp-profile-public-card{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding:15px;

  border:1px solid #dbeafe;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #f7fbff,
      #fff
    );
}





/* =========================================================
   AIFT EMPLOYER STUDIO
   SETTINGS
   SCHOOL-STUDIO MATCH
========================================================= */

#section-settings{
  width:100%;
  max-width:100%;
  min-width:0;
}


.employer-settings-shell{
  width:100%;
  max-width:100%;
  min-width:0;
}


/* =========================================================
   HEADER
========================================================= */

.employer-settings-header{
  width:100%;
  min-width:0;

  margin-bottom:14px;
  padding:22px 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:24px;

  border:1px solid #e4e7ec;
  border-radius:13px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(16,24,40,.035);
}


.employer-settings-header-copy{
  flex:1;
  min-width:0;
}


.employer-settings-eyebrow{
  display:block;

  margin-bottom:6px;

  color:#1570ef;

  font-size:9px;
  line-height:1.25;

  font-weight:800;

  letter-spacing:.08em;

  text-transform:uppercase;
}


.employer-settings-header p{
  max-width:760px;

  margin:0;

  color:#667085;

  font-size:10px;
  line-height:1.55;
}


.employer-settings-profile-button{
  flex:0 0 auto;

  min-height:40px;

  padding:0 14px;

  border:1px solid #1570ef;
  border-radius:9px;

  background:#1570ef;

  color:#fff;

  font:inherit;
  font-size:10px;
  font-weight:750;

  cursor:pointer;

  transition:
    background .16s ease,
    border-color .16s ease,
    transform .16s ease;
}


.employer-settings-profile-button:hover{
  border-color:#175cd3;

  background:#175cd3;

  transform:translateY(-1px);
}


/* =========================================================
   CATEGORY NAVIGATION
========================================================= */

.employer-settings-nav{
  width:100%;
  min-width:0;

  margin-bottom:14px;
  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  overflow-x:auto;
  overflow-y:hidden;

  border:1px solid #e4e7ec;
  border-radius:11px;

  background:#fff;

  scrollbar-width:none;
}


.employer-settings-nav::-webkit-scrollbar{
  display:none;
}


.employer-settings-nav-button{
  flex:0 0 auto;

  min-height:35px;

  padding:0 12px;

  border:0;
  border-radius:8px;

  background:transparent;

  color:#667085;

  font:inherit;
  font-size:9px;
  line-height:1;
  font-weight:700;

  white-space:nowrap;

  cursor:pointer;

  transition:
    background .16s ease,
    color .16s ease;
}


.employer-settings-nav-button:hover{
  background:#f8fafc;

  color:#344054;
}


.employer-settings-nav-button.active{
  background:#eff8ff;

  color:#175cd3;

  box-shadow:
    inset 0 0 0 1px
    #d1e9ff;
}


/* =========================================================
   PANELS
========================================================= */

.employer-settings-panel{
  width:100%;
  min-width:0;

  display:grid;

  gap:12px;
}


.employer-settings-panel[hidden]{
  display:none!important;
}


/* =========================================================
   CARD
========================================================= */

.employer-settings-card{
  width:100%;
  min-width:0;

  padding:20px;

  border:1px solid #e4e7ec;
  border-radius:13px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(16,24,40,.035);
}


/* =========================================================
   CARD HEADER
========================================================= */

.employer-settings-card-head{
  width:100%;
  min-width:0;

  margin-bottom:16px;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:16px;
}


.employer-settings-card-head > div{
  flex:1;
  min-width:0;
}


.employer-settings-card-head h2{
  margin:0;

  color:#101828;

  font-size:14px;
  line-height:1.35;

  font-weight:800;
}


.employer-settings-card-head p{
  max-width:760px;

  margin:4px 0 0;

  color:#667085;

  font-size:8px;
  line-height:1.5;
}


.employer-settings-text-button{
  flex-shrink:0;

  min-height:32px;

  padding:0 10px;

  border:1px solid #d0d5dd;
  border-radius:8px;

  background:#fff;

  color:#1570ef;

  font:inherit;
  font-size:8px;
  font-weight:750;

  cursor:pointer;
}


/* =========================================================
   INFORMATION GRID
========================================================= */

.employer-settings-info-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:8px;
}


.employer-settings-info{
  min-width:0;
  min-height:82px;

  padding:12px;

  border:1px solid #e4e7ec;
  border-radius:10px;

  background:#f8fafc;
}


.employer-settings-info span{
  display:block;

  color:#98a2b3;

  font-size:7px;

async function employerCareerOpportunityRequest(
  method,
  opportunityId,
  payload
){

  const path =
    opportunityId
      ? `/api/opportunities/${encodeURIComponent(
          opportunityId
        )}`
      : "/api/opportunities";


  const response =
    await fetch(
      `${API}${path}`,
      {
        method,

        headers:
          authHeaders({
            "Content-Type":
              "application/json",

            Accept:
              "application/json"
          }),

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const data =
    await safeJson(
      response
    );


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      `Opportunity request failed (${response.status}).`
    );

  }


  return data;

}

   SAVE
========================================================= */

async function saveEmployerCareerOpportunity(
  status
){

  if(employerCareerOpportunitySaving){
    return;
  }


  const id =
    employerCareerFieldValue(
      "employerCareerProgramId"
    );


  const draftButton =
    document.getElementById(
      "employerCareerProgramSaveDraft"
    );


  const publishButton =
    document.getElementById(
      "employerCareerProgramPublish"
    );


  try{

    employerCareerOpportunitySaving =
      true;


    setEmployerCareerProgramMessage("");


    const payload =
      buildEmployerCareerOpportunityPayload(
        status
      );


    if(draftButton){
      draftButton.disabled =
        true;
    }


    if(publishButton){
      publishButton.disabled =
        true;

      publishButton.textContent =
        status === "draft"
          ? "Saving..."
          : "Publishing...";
    }


    await employerCareerOpportunityRequest(
      id
        ? "PATCH"
        : "POST",
      id,
      payload
    );


    showToast(
      "Career Hub",
      status === "draft"
        ? "Opportunity saved as draft."
        : id
          ? "Opportunity updated and published."
          : "Opportunity published successfully.",
      "success"
    );


    closeEmployerCareerOpportunityBuilder();


    await loadEmployerCareerHub({
      force:true
    });


    openEmployerCareerView(
      "programs",
      {
        scroll:false
      }
    );

  }catch(error){

    console.error(
      "SAVE EMPLOYER CAREER OPPORTUNITY ERROR:",
      error
    );


    setEmployerCareerProgramMessage(
      error?.message ||
      "Unable to save the opportunity."
    );


    document
      .getElementById(
        "employerCareerProgramManager"
      )
      ?.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  }finally{

    employerCareerOpportunitySaving =
      false;


    if(draftButton){
      draftButton.disabled =
        false;
    }


    if(publishButton){

      publishButton.disabled =
        false;

      publishButton.textContent =
        "Publish Opportunity";

    }

  }

}

function wireEmployerCareerOpportunityManager(){

  const form =

      "employerCareerProgramForm"

  if(

    form.dataset.wired === "1"

  form.dataset.wired =

  form.addEventListener(

  document

  document
    .getElementById(

    );

function employerCareerDateTimeInputValue(
  value
){

  if(!value){
    return "";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }


  const local =
    new Date(
      date.getTime() -
      date.getTimezoneOffset() *
      60000
    );


  return local
    .toISOString()
    .slice(0,16);

}

/* =========================================================

========================================================= */

async function patchEmployerCareerApplication(
  applicationId,
  payload
){

  const response =
    await fetch(
      `${API}/api/internship-applications/${encodeURIComponent(
        applicationId
      )}`,
      {
        method:"PATCH",

        headers:
          authHeaders({
            "Content-Type":
              "application/json",

            Accept:
              "application/json"
          }),

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const data =
    await safeJson(response);


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      `Application update failed (${response.status}).`
    );

  }


  return (
    data?.application ||
    data?.item ||
    data
  );

}


/* =========================================================
   STATUS CHANGE
========================================================= */

async function updateEmployerCareerApplicationStatus(
  nextStatus
){

  if(employerCareerApplicationSaving){
    return;
  }


  const applicationId =
    employerCareerFieldValue(
      "employerCareerApplicationId"
    );


  const application =
    employerCareerApplicationById(
      applicationId
    );


  if(!application){
    return;
  }


  const current =
    careerStatus(application);


  const allowed =
    EMPLOYER_CAREER_APPLICATION_TRANSITIONS[
      current
    ] || [];


  if(
    !allowed.includes(
      nextStatus
    )
  ){

    showToast(
      "Career Hub",
      `Application cannot move from ${current} to ${nextStatus}.`,
      "error"
    );

    return;

  }


  try{

    employerCareerApplicationSaving =
      true;


    employerCareerSetApplicationMessage("");


    const payload = {
      status:
        nextStatus,

      notes:
        employerCareerFieldValue(
          "employerCareerApplicationNotes"
        ),

      interviewAt:
        employerCareerFieldValue(
          "employerCareerApplicationInterviewAt"
        ) || null,

      interviewLocation:
        employerCareerFieldValue(
          "employerCareerApplicationInterviewLocation"
        ),

      interviewNotes:
        employerCareerFieldValue(
          "employerCareerApplicationInterviewNotes"
        ),

      statusNote:
        `Employer moved application from ${current} to ${nextStatus}.`
    };


    await patchEmployerCareerApplication(
      applicationId,
      payload
    );


    showToast(
      "Career Hub",
      `Application moved to ${nextStatus}.`,
      "success"
    );


    await loadEmployerCareerHub({
      force:true
    });


    openEmployerCareerApplication(
      applicationId
    );


    renderEmployerCareerApplications();

  }catch(error){

    console.error(

        )

      ),

      employerCareerNullableNumber(
        "employerCareerPartnershipJobSlots"
      ),

/* =========================================================
   MANAGE EXISTING PARTNERSHIP
========================================================= */

function employerCanSetPartnershipStatus(
  partnership,
  nextStatus
){

  const current =
    careerStatus(partnership);


  if(
    !(
      EMPLOYER_CAREER_PARTNERSHIP_TRANSITIONS[
        current
      ] || []
    ).includes(nextStatus)
  ){
    return false;
  }


  const requestedBy =
    careerLower(
      partnership.requestedBy
    );


  const schoolRequested =
    requestedBy === "school";


  const companyRequested =
    requestedBy === "company" ||
    requestedBy === "employer";


  if(nextStatus === "cancelled"){

    if(
      ["pending","review"].includes(current)
    ){
      return companyRequested;
    }

    return [
      "approved",
      "active",
      "paused"
    ].includes(current);

  }


  if(
    ["review","approved","rejected"].includes(
      nextStatus
    )
  ){

    return schoolRequested;

  }


  if(
    [
      "active",
      "paused",
      "completed",
      "expired",
      "archived"
    ].includes(nextStatus)
  ){

    return true;

  }


  return false;

}

  partnershipId,
  payload

      `${API}/api/school-company-partnerships/${encodeURIComponent(

      )}`,
      {
        method:"PATCH",

        headers:
          authHeaders({
            "Content-Type":"application/json",
            Accept:"application/json"
          }),

        body:
          JSON.stringify(payload)
      }
    );


  const data =
    await safeJson(response);


  if(!response.ok){

    throw new Error(
      data?.message ||
      "Unable to update partnership."
    );

  }


  return data;

}

      "Career Hub",
      "This status change is not available to this Employer.",
      "error"
    );

    return;

  }


  try{

    await patchEmployerCareerPartnership(
      id,
      {
        status:nextStatus,

        statusNote:
          `Employer changed partnership status to ${nextStatus}.`
      }
    );


    showToast(
      "Career Hub",
      `Partnership moved to ${nextStatus}.`,
      "success"
    );


    await loadEmployerCareerHub({
      force:true
    });


    renderEmployerCareerPartnerships();


    openEmployerCareerPartnership(id);

  }catch(error){

    showToast(

            school.name ||
            item.schoolName ||
            "",

              ""

              "description",
              "objective",
              "schoolName",
              "campaignTypeLabel",
              "targetPrograms",
              "targetYearLevels",
              "targetSkills"
            ]

          careerStatus(item) ===

/* =========================================================

function employerCareerCampusEligiblePartnerships(){

  return careerArray(
    state.careerHub.partnerships
  )
    .filter(partnership => {

      const status =
        careerStatus(
          partnership
        );


      const recruitment =
        partnership.capabilities
          ?.recruitment === true;


      return (
        [
          "approved",
          "active"
        ].includes(status) &&
        recruitment
      );

    });

}

){

        .map(item =>

/* =========================================================
   BUILD PAYLOAD
========================================================= */

function buildEmployerCareerCampusPayload(
  status
){

  const title =
    employerCareerFieldValue(
      "employerCareerCampusTitle"
    );


  if(!title){

    throw new Error(
      "Campaign title is required."
    );

  }


  const partnership =
    employerCareerCampusSelectedPartnership();


  if(!partnership){

    throw new Error(
      "Please select an approved recruitment partnership."
    );

  }


  if(
    ![
      "approved",
      "active"
    ].includes(
      careerStatus(partnership)
    ) ||
    partnership.capabilities
      ?.recruitment !== true
  ){

    throw new Error(
      "The selected partnership is not currently eligible for recruitment."
    );

  }


  const school =
    employerCareerPartnershipSchool(
      partnership
    );


  const schoolId =
    careerId(school) ||
    careerText(
      partnership.schoolId
    );


  if(!schoolId){

    throw new Error(
      "The selected partnership does not contain a valid School."
    );

  }


  const startDate =
    employerCareerFieldValue(
      "employerCareerCampusStartDate"
    );


  const endDate =
    employerCareerFieldValue(
      "employerCareerCampusEndDate"
    );


  const deadline =
    employerCareerFieldValue(
      "employerCareerCampusDeadline"
    );


  if(
    startDate &&
    endDate &&
    new Date(endDate) <
    new Date(startDate)
  ){

    throw new Error(
      "Campaign end date cannot be before its start date."
    );

  }


  if(
    deadline &&
    endDate &&
    new Date(deadline) >
    new Date(endDate)
  ){

    throw new Error(
      "Application deadline cannot be after the campaign end date."
    );

  }


  const expectedStudents =
    employerCareerFieldValue(
      "employerCareerCampusExpectedStudents"
    );


  const targetHires =
    employerCareerFieldValue(
      "employerCareerCampusTargetHires"
    );


  return {

    schoolId,

    partnershipId:
      careerId(partnership),

    title,

    description:
      employerCareerFieldValue(
        "employerCareerCampusDescription"
      ),

    objective:
      employerCareerFieldValue(
        "employerCareerCampusObjective"
      ),

    campaignType:
      employerCareerFieldValue(
        "employerCareerCampusType"
      ) ||
      "campus_hiring",

    mode:
      employerCareerFieldValue(
        "employerCareerCampusMode"
      ) ||
      "hybrid",

    status,

    opportunityIds:
      employerCareerCampusSelectedOpportunityIds(),

    targetPrograms:
      employerCareerArrayFromComma(
        employerCareerFieldValue(
          "employerCareerCampusPrograms"
        )
      ),

    targetYearLevels:
      employerCareerArrayFromComma(
        employerCareerFieldValue(
          "employerCareerCampusYearLevels"
        )
      ),

    targetSkills:
      employerCareerArrayFromComma(
        employerCareerFieldValue(
          "employerCareerCampusSkills"
        )
      ),

    targetGraduationYears:
      employerCareerCampusGraduationYears(
        employerCareerFieldValue(
          "employerCareerCampusGraduationYears"
        )
      ),

    expectedStudents:
      expectedStudents === ""
        ? null
        : Number(expectedStudents),

    targetHires:
      targetHires === ""
        ? null
        : Number(targetHires),

    startDate:
      startDate ||
      null,

    endDate:
      endDate ||
      null,

    applicationDeadline:
      deadline ||
      null,

    location:{

      venue:
        employerCareerFieldValue(
          "employerCareerCampusVenue"
        ),

      address:
        employerCareerFieldValue(
          "employerCareerCampusAddress"
        ),

      meetingUrl:
        employerCareerFieldValue(
          "employerCareerCampusMeetingUrl"
        )

    },

    allowStudentApplications:
      Boolean(
        document.getElementById(
          "employerCareerCampusAllowApplications"
        )?.checked
      ),

    inviteEligibleStudents:
      Boolean(
        document.getElementById(
          "employerCareerCampusInviteStudents"
        )?.checked
      ),

    visibleToStudents:
      Boolean(
        document.getElementById(
          "employerCareerCampusVisibleStudents"
        )?.checked
      ),

    requireSchoolApproval:
      Boolean(
        document.getElementById(
          "employerCareerCampusRequireSchoolApproval"
        )?.checked
      )

  };

}


/* =========================================================
   SAVE CAMPAIGN
========================================================= */

async function saveEmployerCareerCampusCampaign(
  requestedStatus
){

  if(employerCareerCampusSaving){
    return;
  }


  const campaignId =
    employerCareerFieldValue(
      "employerCareerCampusId"
    );


  const existing =
    campaignId
      ? employerCareerCampusById(
          campaignId
        )
      : null;


  /*
   * Editing an active/scheduled campaign should not
   * accidentally push it backward into draft.
   */
  const status =
    existing &&
    ![
      "draft"
    ].includes(
      careerStatus(existing)
    )
      ? careerStatus(existing)
      : requestedStatus;


  const draftButton =
    document.getElementById(
      "employerCareerCampusSaveDraft"
    );


  const scheduleButton =
    document.getElementById(
      "employerCareerCampusSchedule"
    );


  const launchButton =
    document.getElementById(
      "employerCareerCampusLaunch"
    );


  try{

    employerCareerCampusSaving =
      true;


    const payload =
      buildEmployerCareerCampusPayload(
        status
      );


    [
      draftButton,
      scheduleButton,
      launchButton
    ].forEach(button => {

      if(button){
        button.disabled = true;
      }

    });


    const response =
      await fetch(
        campaignId
          ? `${API}/api/campus-recruitment-campaigns/${encodeURIComponent(campaignId)}`
          : `${API}/api/campus-recruitment-campaigns`,
        {
          method:
            campaignId
              ? "PATCH"
              : "POST",

          headers:
            authHeaders({
              "Content-Type":
                "application/json",

              Accept:
                "application/json"
            }),

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const data =
      await safeJson(
        response
      );


    if(!response.ok){

      throw new Error(
        data?.message ||
        `Unable to save campaign (${response.status}).`
      );

    }


    showToast(
      "Campus recruitment",
      campaignId
        ? "Recruitment campaign updated."
        : status === "draft"
          ? "Campaign saved as draft."
          : status === "scheduled"
            ? "Recruitment campaign scheduled."
            : "Recruitment campaign launched.",
      "success"
    );


    closeEmployerCareerCampusComposer();


    await loadEmployerCareerHub({
      force:true
    });


    renderEmployerCareerCampus();

  }catch(error){

    console.error(
      "SAVE CAMPUS CAMPAIGN ERROR:",
      error
    );


    const message =
      document.getElementById(
        "employerCareerCampusComposerMessage"
      );


    if(message){

      message.hidden =
        false;


      message.textContent =
        error?.message ||
        "Unable to save recruitment campaign.";

    }

  }finally{

    employerCareerCampusSaving =
      false;


    [
      draftButton,
      scheduleButton,
      launchButton
    ].forEach(button => {

      if(button){
        button.disabled = false;
      }

    });

  }

}

========================================================= */

const EMPLOYER_CAREER_CAMPUS_TRANSITIONS = {

  draft:[
    "scheduled",
    "active",
    "cancelled"
  ],

  scheduled:[
    "active",
    "cancelled"
  ],

  active:[
    "paused",
    "completed",
    "cancelled"
  ],

  paused:[
    "active",
    "completed",
    "cancelled"
  ],

  completed:[
    "archived"
  ],

  cancelled:[
    "archived"
  ],

  archived:[]

};


function renderEmployerCareerCampusStatusActions(
  campaign
){

  const wrap =
    document.getElementById(
      "employerCareerCampusStatusActions"
    );


  if(!wrap){
    return;
  }


  const status =
    careerStatus(
      campaign
    );


  const available =
    EMPLOYER_CAREER_CAMPUS_TRANSITIONS[
      status
    ] || [];


  if(!available.length){

    wrap.innerHTML = `
      <div class="empty">
        No additional campaign status actions are available.
      </div>
    `;

    return;

  }


  const labels = {

    scheduled:
      "Schedule",

    active:
      status === "paused"
        ? "Resume Campaign"
        : "Launch Campaign",

    paused:
      "Pause Campaign",

    completed:
      "Complete Campaign",

    cancelled:
      "Cancel Campaign",

    archived:
      "Archive"

  };


  wrap.innerHTML =
    available
      .map(nextStatus => `
        <button
          type="button"
          class="employer-career-stage-button ${
            nextStatus === "cancelled"
              ? "danger"
              : ""
          }"

/* =========================================================
   LOAD REAL CAMPUS CAMPAIGN METRICS
========================================================= */

async function loadEmployerCareerCampusMetrics(
  campaignId
){

  const id =
    careerText(
      campaignId
    );


  if(!id){
    return null;
  }


  try{

    const payload =
      await employerCareerApiGet(
        `/api/campus-recruitment-campaigns/${encodeURIComponent(id)}/metrics`
      );


    const metrics =
      payload?.metrics &&
      typeof payload.metrics === "object"
        ? payload.metrics
        : {};


    const conversion =
      payload?.conversion &&
      typeof payload.conversion === "object"
        ? payload.conversion
        : {};


    /*
     * The campaign remains the main Career Hub record.
     * We only replace its analytics snapshot in memory with
     * authoritative server-calculated values.
     */

    const campaign =
      employerCareerCampusById(
        id
      );


    if(campaign){

      campaign.metrics = {
        ...(campaign.metrics || {}),
        ...metrics
      };


      campaign.careerHubMetrics = {
        metrics,
        conversion,

        opportunityCount:
          Number(
            payload?.opportunityCount ||
            0
          ),

        targetHires:
          Number(
            payload?.targetHires ||
            campaign.targetHires ||
            0
          ),

        generatedAt:
          payload?.generatedAt ||
          null
      };

    }


    return {
      metrics,
      conversion,
      payload
    };


  }catch(error){

    console.error(
      "LOAD CAMPUS CAMPAIGN METRICS ERROR:",
      error
    );


    /*
     * Do not destroy the operations panel if analytics fail.
     * Existing campaign data can remain visible.
     */

    showToast(
      "Campus recruitment",
      error?.message ||
      "Unable to load live campaign metrics.",
      "error"
    );


    return null;

  }

}

/* =========================================================
   CHANGE STATUS
========================================================= */

async function updateEmployerCareerCampusStatus(
  nextStatus
){

  const id =
    employerCareerFieldValue(
      "employerCareerActiveCampusId"
    );


  const campaign =
    employerCareerCampusById(
      id
    );


  if(
    !id ||
    !campaign
  ){
    return;
  }


  const current =
    careerStatus(
      campaign
    );


  const available =
    EMPLOYER_CAREER_CAMPUS_TRANSITIONS[
      current
    ] || [];


  if(
    !available.includes(
      nextStatus
    )
  ){

    showToast(
      "Campus recruitment",
      `Campaign cannot move from ${current} to ${nextStatus}.`,
      "error"
    );

    return;

  }


  try{

    const response =
      await fetch(
        `${API}/api/campus-recruitment-campaigns/${encodeURIComponent(id)}`,
        {
          method:"PATCH",

          headers:
            authHeaders({
              "Content-Type":
                "application/json",

              Accept:
                "application/json"
            }),

          body:
            JSON.stringify({
              status:
                nextStatus,

              statusNote:
                `Employer changed campaign status from ${current} to ${nextStatus}.`
            })
        }
      );


    const data =
      await safeJson(
        response
      );


    if(!response.ok){

      throw new Error(
        data?.message ||
        "Unable to update recruitment campaign."
      );

    }


    showToast(
      "Campus recruitment",
      `Campaign moved to ${nextStatus.replaceAll("_"," ")}.`,
      "success"
    );


    await loadEmployerCareerHub({
      force:true
    });


    renderEmployerCareerCampus();


    openEmployerCareerCampusOperations(
      id
    );

  }catch(error){

    showToast(
      "Campus recruitment",
      error?.message ||
      "Unable to update campaign.",
      "error"
    );

  }

}

function employerCareerEventLocationLabel(

){

  const location =
    event?.location || {};


  return [

    location.city,
    location.province
  ]
    .filter(Boolean)
    .join(", ") ||
    event.onlinePlatform ||
    String(
      event.format ||

}


function employerCareerEventDateParts(
  value
){

  if(!value){
    return {
      month:"—",
      day:"—"
    };
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return {
      month:"—",
      day:"—"
    };
  }


  return {

    month:
      date
        .toLocaleDateString(
          undefined,
          {
            month:"short"
          }
        )
        .toUpperCase(),

    day:
      date
        .toLocaleDateString(
          undefined,
          {
            day:"2-digit"
          }
        )

  };

}


function renderEmployerCareerEventMetrics(){

  const wrap =
    document.getElementById(
      "employerCareerEventMetrics"
    );


  if(!wrap){
    return;
  }


  const events =
    careerArray(
      state.careerHub.events
    );


  const now =
    Date.now();


  const upcoming =
    events.filter(event => {

      const time =
        new Date(
          event.startAt ||
          0
        ).getTime();


      return (
        time > now &&
        ![
          "cancelled",
          "archived",
          "completed"
        ].includes(
          careerStatus(event)
        )
      );

    }).length;


  const registrations =
    events.reduce(
      (
        total,
        event
      ) =>
        total +
        Number(
          event.registeredCount ||
          0
        ),
      0
    );


  const attendance =
    events.reduce(
      (
        total,
        event
      ) =>
        total +
        Number(
          event.attendanceCount ||
          0
        ),
      0
    );


  const live =
    events.filter(
      event =>
        careerStatus(event) ===
        "ongoing"
    ).length;


  const metrics = [
    ["Upcoming", upcoming],
    ["Registrations", registrations],
    ["Attendance", attendance],
    ["Live Events", live]
  ];


  wrap.innerHTML =
    metrics
      .map(
        ([label,value]) => `
          <article class="employer-career-event-metric">

            <span>
              ${escapeHtml(label)}
            </span>

            <strong>
              ${Number(value || 0)}

      )
      .join("");

          careerIncludes(

function employerCareerDateTimeInputValue(

async function saveEmployerCareerEvent(
  requestedStatus
){

  if(employerCareerEventSaving){
    return;
  }


  const eventId =
    employerCareerFieldValue(
      "employerCareerEventId"
    );


  const existing =
    eventId
      ? employerCareerEventById(
          eventId
        )
      : null;


  /*
   * Existing events should not be forced backward to draft.
   * When editing an already published event, preserve its
   * current lifecycle status unless a dedicated lifecycle
   * action changes it.
   */
  const status =
    existing &&
    careerStatus(existing) !== "draft"
      ? careerStatus(existing)
      : requestedStatus;


  try{

    employerCareerEventSaving =
      true;


    const payload =
      buildEmployerCareerEventPayload(
        status
      );


    const response =
      await fetch(
        eventId
          ? `${API}/api/career-events/${encodeURIComponent(eventId)}`
          : `${API}/api/career-events`,
        {
          method:
            eventId
              ? "PATCH"
              : "POST",

          headers:
            authHeaders({
              "Content-Type":"application/json",
              Accept:"application/json"
            }),

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await safeJson(response);


    if(!response.ok){

      throw new Error(
        data?.message ||
        "Unable to save career event."
      );

    }


    showToast(
      "Career events",
      eventId
        ? "Career event updated."
        : status === "draft"
          ? "Event saved as draft."
          : "Career event published.",
      "success"
    );


    closeEmployerCareerEventComposer();


    await loadEmployerCareerHub({
      force:true
    });


    renderEmployerCareerEvents();

  }catch(error){

    const message =
      document.getElementById(
        "employerCareerEventComposerMessage"
      );


    if(message){

      message.hidden = false;

      message.textContent =
        error?.message ||
        "Unable to save career event.";

    }

  }finally{

    employerCareerEventSaving =
      false;

  }

}

async function updateEmployerCareerEventStatus(
  nextStatus
){

  const eventId =
    employerCareerFieldValue(
      "employerCareerActiveEventId"
    );


  if(!eventId){
    return;
  }


  const payload = {
    status:nextStatus
  };


  if(
    nextStatus === "cancelled"
  ){

    const reason =
      window.prompt(
        "Why is this event being cancelled?"
      );


    if(reason === null){
      return;
    }


    payload.cancellationReason =
      String(reason || "").trim();

  }


  try{

    const response =
      await fetch(
        `${API}/api/career-events/${encodeURIComponent(eventId)}`,
        {
          method:"PATCH",

          headers:
            authHeaders({
              "Content-Type":"application/json",
              Accept:"application/json"
            }),

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await safeJson(response);


    if(!response.ok){

      throw new Error(
        data?.message ||
        "Unable to update event status."
      );

    }


    showToast(
      "Career events",
      `Event moved to ${nextStatus.replaceAll("_"," ")}.`,
      "success"
    );


    await loadEmployerCareerHub({
      force:true
    });


    renderEmployerCareerEvents();


    await openEmployerCareerEventOperations(
      eventId
    );

  }catch(error){

    showToast(
      "Career events",
      error?.message ||
      "Unable to update event status.",
      "error"
    );

  }

}

case "discover-schools":

/* =========================================================
   API HELPER
========================================================= */

async function employerKabezyaApi(
  url,
  options = {}
){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:
          authHeaders({
            "Content-Type":
              "application/json",

            ...(
              options.headers ||
              {}
            )
          })
      }
    );


  const data =
    await safeJson(
      response
    );


  if (!response.ok) {

    const error =
      new Error(
        data?.message ||
        `Kabezya request failed (${response.status}).`
      );


    error.status =
      response.status;


    error.code =
      data?.code ||
      "";


    error.retryAfterSeconds =
      Number(
        data?.retryAfterSeconds ||
        response.headers.get(
          "Retry-After"
        ) ||
        0
      );


    throw error;

  }


  return data;

}


/* =========================================================
   NORMALIZE MESSAGE
========================================================= */

function normalizeEmployerKabezyaMessage(
  message
){

  if (!message) {
    return null;
  }


  const role =
    String(
      message.role ||
      "assistant"
    ).toLowerCase();


  const content =
    String(
      message.content ??
      message.message ??
      message.text ??
      ""
    ).trim();


  if (!content) {
    return null;
  }


  return {

    id:
      String(
        message.id ||
        message._id ||
        (
          `local-${
            Date.now()
          }-${
            Math.random()
              .toString(36)
              .slice(2)
          }`
        )
      ),

    role:
      role === "user"
        ? "user"
        : "assistant",

    content,

    createdAt:
      message.createdAt ||
      new Date()
        .toISOString(),

    updatedAt:
      message.updatedAt ||
      null,

    responseSnapshot:
      message.responseSnapshot ||
      null

  };

}


/* =========================================================
   NORMALIZE CONVERSATION
========================================================= */

function normalizeEmployerKabezyaConversation(
  conversation
){

  if (!conversation) {
    return null;
  }


  const id =
    String(
      conversation.id ||
      conversation._id ||
      ""
    ).trim();


  if (!id) {
    return null;
  }


  return {

    id,

    title:
      String(
        conversation.title ||
        "Conversation"
      ).trim(),

    mode:
      String(
        conversation.mode ||
        "assistant"
      ).trim(),

    createdAt:
      conversation.createdAt ||
      null,

    updatedAt:
      conversation.updatedAt ||
      null,

    lastMessageAt:
      conversation.lastMessageAt ||
      conversation.updatedAt ||
      conversation.createdAt ||
      null,

    context:
      conversation.context ||
      {},

    messages:
      Array.isArray(
        conversation.messages
      )
        ? conversation.messages
            .map(
              normalizeEmployerKabezyaMessage
            )
            .filter(Boolean)
        : []

  };

}

function createEmployerKabezyaMessage(
