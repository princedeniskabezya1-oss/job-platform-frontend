<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3f2ef;
}

/* LAYOUT */
.container{
  display:flex;
  max-width:1200px;
  margin:auto;
  padding-top:20px;
}

.left, .right{
  width:25%;
}

.center{
  width:50%;
}

/* CARD */
.card{
  background:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* POST INPUT */
.post-box textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  resize:none;
}

.post-box button{
  margin-top:10px;
  padding:8px 15px;
  background:#0a66c2;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* POSTS */
.post-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.post-author{
  display:flex;
  gap:10px;
}

.post-author img{
  width:45px;
  height:45px;
  border-radius:50%;
}

.post-content{
  margin:10px 0;
}

.post-actions{
  display:flex;
  justify-content:space-around;
  border-top:1px solid #eee;
  padding-top:10px;
  cursor:pointer;
}
.post-media img,
.post-media video{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <div class="card">
      <h3>Employer Panel</h3>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <!-- CREATE POST -->
    <div class="card post-box">
      <textarea id="postContent" placeholder="Share something..."></textarea>
      <button onclick="createPost()">Post</button>
    </div>

    <!-- FEED -->
    <div id="posts"></div>

  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="card">
      <h3>Tips</h3>
      <p>Post jobs and updates to attract talent.</p>
    </div>
  </div>

</div>

<script>
const API = "https://backend-1-9b6f.onrender.com";

/* =============================
   🔒 PROTECT PAGE
============================= */
if(!localStorage.getItem("employerToken")){
  window.location.href = "login.html";
}

/* =============================
   🚪 LOGOUT
============================= */
function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

/* =============================
   📝 CREATE POST
============================= */
async function createPost(){

  const content = document.getElementById("postContent").value;

  if(!content) return alert("Write something");

  await fetch(API+"/api/posts",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer " + localStorage.getItem("employerToken")
    },
    body:JSON.stringify({content})
  });

  document.getElementById("postContent").value = "";

  loadFeed();
}

/* =============================
   📰 LOAD FEED (SAME AS TALENT)
============================= */
async function loadFeed(){

  const container = document.getElementById("posts");

  if(!container) return;

  const res = await fetch(API+"/api/posts",{
    headers:{
      Authorization:"Bearer " + localStorage.getItem("employerToken")
    }
  });

  if(res.status === 401){
    alert("Session expired");
    localStorage.clear();
    window.location.href="login.html";
    return;
  }

  const posts = await res.json();

  container.innerHTML = "";

  posts.forEach(post=>{
    container.innerHTML += `
      <div class="card">

        <div class="post-header">
          <div class="post-author">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <div>
              <strong>${post.author?.name}</strong><br>
              <small>${new Date(post.createdAt).toLocaleString()}</small>
            </div>
          </div>
        </div>

        <div class="post-content">${post.content || ""}</div>

${
post.mediaUrl ? `
  <div style="margin-top:10px;">
    ${
      post.mediaType === "video"
      ? `<video controls style="width:100%;border-radius:8px;" src="${post.mediaUrl}"></video>`
      : `<img src="${post.mediaUrl}" style="width:100%;border-radius:8px;">`
    }
  </div>
` : ""
}

        <div class="post-actions">
          <div onclick="likePost('${post._id}')">Like (${post.likes.length})</div>
          <div onclick="commentPost('${post._id}')">Comment</div>
        </div>

      </div>
    `;
  });
}

/* =============================
   ❤️ LIKE
============================= */
async function likePost(id){

  await fetch(API+"/api/posts/"+id+"/like",{
    method:"PATCH",
    headers:{
      Authorization:"Bearer " + localStorage.getItem("employerToken")
    }
  });

  loadFeed();
}

/* =============================
   💬 COMMENT
============================= */
async function commentPost(id){

  const text = prompt("Write comment");
  if(!text) return;

  await fetch(API+"/api/posts/"+id+"/comment",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer " + localStorage.getItem("employerToken")
    },
    body:JSON.stringify({text})
  });

  loadFeed();
}

/* =============================
   🚀 INIT
============================= */
window.onload = () => {
  loadFeed();
};
</script>

</body>
</html>
