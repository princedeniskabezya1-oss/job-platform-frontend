/* =========================================================
   AIFT EMPLOYER â€” OPERATIONS WORKSPACE
========================================================= */

#section-ops{
  width:100%;
  min-width:0;
}


#section-ops .emp-ops-workspace{
  display:flex;
  flex-direction:column;

  gap:14px;
}


/* =========================================================
   HEADER ICON BUTTON SUPPORT
========================================================= */

#section-ops .emp-workspace-actions
svg{
  width:15px;
  height:15px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   METRICS
========================================================= */

.emp-ops-metrics{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:9px;
}


.emp-ops-metric{
  min-height:92px;

  display:grid;

  grid-template-columns:
    38px minmax(0,1fr);

  align-items:center;

  gap:11px;

  padding:13px 14px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-ops-metric-icon,
.emp-ops-panel-icon{
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;
}


.emp-ops-metric-icon{
  width:38px;
  height:38px;
}


.emp-ops-panel-icon{
  width:34px;
  height:34px;
}


.emp-ops-metric-icon svg,
.emp-ops-panel-icon svg{
  width:18px;
  height:18px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-metric-icon.blue,
.emp-ops-panel-icon.blue{
  background:#edf6ff;

  color:#0a66c2;
}


.emp-ops-metric-icon.green,
.emp-ops-panel-icon.green{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-metric-icon.purple,
.emp-ops-panel-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-ops-metric-icon.orange{
  background:#fff7ed;

  color:#d97706;
}


.emp-ops-metric span{
  display:block;

  color:#667085;

  font-size:8px;

  font-weight:650;
}


.emp-ops-metric strong{
  display:block;

  margin-top:4px;

  color:#101828;

  font-size:20px;

  line-height:1;

  font-weight:820;
}


.emp-ops-metric small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:7px;
}


/* =========================================================
   PRIMARY GRID
========================================================= */

.emp-ops-primary-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:11px;

  align-items:start;
}


/* =========================================================
   PANELS
========================================================= */

.emp-ops-panel{
  min-width:0;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);

  overflow:hidden;
}


.emp-ops-panel-head{
  min-height:61px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;

  padding:11px 13px;

  border-bottom:
    1px solid
    #eaecf0;
}


.emp-ops-panel-title{
  min-width:0;

  display:flex;
  align-items:center;

  gap:9px;
}


.emp-ops-panel-title h2{
  margin:0;

  color:#101828;

  font-size:11px;

  font-weight:800;
}


.emp-ops-panel-title p{
  margin:3px 0 0;

  color:#667085;

  font-size:7px;
}


.emp-ops-add-btn,
.emp-ops-refresh-btn{
  min-height:31px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:0 9px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  background:#fff;

  color:#344054;

  font-family:inherit;

  font-size:7px;

  font-weight:750;

  cursor:pointer;
}


.emp-ops-add-btn:hover,
.emp-ops-refresh-btn:hover{
  border-color:#b8d6f5;

  background:#f5faff;

  color:#0a66c2;
}


/* =========================================================
   OPERATIONS LIST
========================================================= */

.emp-ops-list{
  min-height:190px;

  display:grid;

  gap:8px;

  padding:9px;

  align-content:start;
}


/* =========================================================
   EMPTY STATES
========================================================= */

.emp-ops-empty{
  min-height:175px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:24px;

  text-align:center;
}


.emp-ops-empty-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:10px;

  border-radius:11px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-ops-empty-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-ops-empty-icon svg{
  width:20px;
  height:20px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.7;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-empty strong{
  color:#101828;

  font-size:10px;

  font-weight:800;
}


.emp-ops-empty span{
  max-width:300px;

  margin-top:5px;

  color:#667085;

  font-size:8px;

  line-height:1.5;
}


.emp-ops-empty button{
  min-height:31px;

  margin-top:12px;

  padding:0 10px;

  border:1px solid #b8d6f5;

  border-radius:7px;

  background:#fff;

  color:#0a66c2;

  font-size:7px;

  font-weight:750;
}


/* =========================================================
   SCHEDULE / TASK CARDS
========================================================= */

.emp-ops-item{
  min-width:0;

  padding:11px;

  border:1px solid #e8ecf1;

  border-radius:9px;

  background:#fff;

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    transform .15s ease;
}


.emp-ops-item:hover{
  transform:translateY(-1px);

  border-color:#d2dbe5;

  box-shadow:
    0 5px 16px
    rgba(16,24,40,.045);
}


.emp-ops-item-top{
  display:flex;
  align-items:center;

  gap:9px;
}


.emp-ops-avatar{
  width:38px !important;
  height:38px !important;

  flex:0 0 38px;

  border:1px solid #e4e7ec;

  border-radius:9px;

  object-fit:cover;
}


.emp-ops-item-copy{
  flex:1;

  min-width:0;
}


.emp-ops-item-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-ops-item-title-row strong{
  overflow:hidden;

  color:#101828;

  font-size:9px;

  font-weight:800;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.emp-ops-item-copy > span{
  display:block;

  margin-top:3px;

  overflow:hidden;

  color:#667085;

  font-size:7px;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================================================
   ITEM DETAILS
========================================================= */

.emp-ops-item-details{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}


.emp-ops-item-details > div{
  min-width:0;

  padding:7px 8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-ops-item-details span{
  display:block;

  color:#98a2b3;

  font-size:6px;

  font-weight:700;

  text-transform:uppercase;
}


.emp-ops-item-details strong{
  display:block;

  margin-top:3px;

  overflow:hidden;

  color:#344054;

  font-size:7px;

  font-weight:750;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================================================
   TASK META
========================================================= */

.emp-ops-task-meta{
  display:flex;
  flex-wrap:wrap;

  gap:5px;

  margin-top:9px;
}


.emp-ops-task-meta span,
.emp-ops-recurrence{
  min-height:21px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:700;
}


.emp-ops-task-control{
  margin-top:9px;
}


.emp-ops-task-control label{
  display:block;

  margin-bottom:4px;

  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-ops-task-control select{
  width:100%;

  height:31px;

  padding:0 8px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  outline:none;

  background:#f8fafc;

  color:#344054;

  font-size:7px;

  font-weight:700;
}


/* =========================================================
   STATUS + PRIORITY
========================================================= */

.emp-ops-status,
.emp-ops-priority{
  flex:0 0 auto;

  min-height:21px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  font-size:6px;

  font-weight:750;

  text-transform:capitalize;
}


.emp-ops-status.scheduled{
  background:#eef4fb;

  color:#42658a;
}


.emp-ops-status.active{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-status.done{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-priority.low{
  background:#ecfdf3;

  color:#15803d;
}


.emp-ops-priority.medium{
  background:#fff7ed;

  color:#c56a00;
}


.emp-ops-priority.high,
.emp-ops-priority.urgent{
  background:#fff1f2;

  color:#be123c;
}


/* =========================================================
   CARD FOOTER
========================================================= */

.emp-ops-item-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  margin-top:9px;

  padding-top:8px;

  border-top:1px solid #f0f2f5;
}


.emp-ops-delete-btn{
  min-height:27px;

  padding:0 8px;

  border:1px solid #fecaca;

  border-radius:6px;

  background:#fff;

  color:#b42318;

  font-family:inherit;

  font-size:6px;

  font-weight:750;

  cursor:pointer;
}


.emp-ops-delete-btn:hover{
  background:#fff5f5;
}


/* =========================================================
   LIVE AGENT ACTIVITY
========================================================= */

.emp-ops-agent-panel{
  width:100%;
}


.emp-ops-live-actions{
  display:flex;
  align-items:center;

  gap:7px;
}


.emp-ops-live-badge{
  min-height:26px;

  display:inline-flex;
  align-items:center;

  gap:5px;

  padding:0 8px;

  border-radius:999px;

  background:#ecfdf3;

  color:#15803d;

  font-size:7px;

  font-weight:750;
}


.emp-ops-live-badge span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 4px
    rgba(34,197,94,.11);
}


.emp-ops-refresh-btn svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-ops-table-wrap{
  width:100%;

  overflow-x:auto;
}


#section-ops .emp-data-table{
  width:100%;

  min-width:820px;

  border-collapse:collapse;
}


#section-ops .emp-data-table th{
  padding:9px 11px;

  background:#f8fafc;

  color:#667085;

  font-size:6px;

  font-weight:800;

  letter-spacing:.04em;

  text-transform:uppercase;
}


#section-ops .emp-data-table td{
  padding:10px 11px;

  border-bottom:1px solid #eef1f4;

  color:#344054;

  font-size:7px;
}


#section-ops .emp-data-table tbody tr:hover{
  background:#fbfcfe;
}


/* =========================================================
   AGENT STATUS + PERFORMANCE
========================================================= */

#section-ops .agent-status-dot{
  width:7px;
  height:7px;

  margin-right:6px;

  border-radius:50%;
}


#section-ops .agent-perf-bar{
  width:72px;

  height:6px;

  border-radius:999px;

  background:#eaecf0;
}


#section-ops .agent-perf-fill{
  height:100%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #22c55e
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

  .emp-ops-metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-ops-primary-grid{
    grid-template-columns:1fr;
  }

}


@media(max-width:760px){

  .emp-ops-metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-ops-primary-grid{
    grid-template-columns:1fr;
  }


  .emp-ops-panel-head{
    align-items:flex-start;
  }


  .emp-ops-item-details{
    grid-template-columns:1fr 1fr;
  }


  .emp-ops-live-actions{
    align-items:flex-end;

    flex-direction:column;
  }

}

/* =========================================================
   AIFT EMPLOYER â€” LIVE ANALYTICS
========================================================= */

#section-analytics{
  width:100%;
  min-width:0;
}


.emp-analytics-workspace{
  gap:14px;
}


/* =========================================================
   CONTROLS
========================================================= */

.emp-analytics-controls{
  display:flex;
  align-items:flex-end;

  gap:7px;
}


.emp-analytics-range-control{
  display:flex;
  flex-direction:column;

  gap:4px;
}


.emp-analytics-range-control > span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-analytics-range-control select{
  height:36px;

  padding:0 30px 0 10px;

  border:1px solid #dfe3e8;

  border-radius:8px;

  outline:none;

  background:#fff;

  color:#344054;

  font-family:inherit;

  font-size:8px;

  font-weight:700;
}


.emp-analytics-refresh{
  height:36px;

  display:inline-flex;
  align-items:center;

  gap:6px;

  padding:0 10px;

  border:1px solid #dfe3e8;

  border-radius:8px;

  background:#fff;

  color:#344054;

  font-size:8px;

  font-weight:750;

  cursor:pointer;
}


.emp-analytics-refresh:hover{
  border-color:#b8d6f5;

  background:#f5faff;

  color:#0a66c2;
}


.emp-analytics-refresh svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   CUSTOM DATE RANGE
========================================================= */

#section-analytics .emp-custom-dates{
  display:flex;
  align-items:flex-end;

  gap:8px;

  width:max-content;

  max-width:100%;

  padding:10px;

  border:1px solid #e4e7ec;

  border-radius:9px;

  background:#fff;
}


#section-analytics .emp-custom-dates.hidden{
  display:none;
}


#section-analytics .emp-custom-dates > div{
  display:flex;
  flex-direction:column;

  gap:4px;
}


#section-analytics .emp-custom-dates > div > span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


#section-analytics .emp-custom-dates input{
  height:35px;

  padding:0 9px;

  border:1px solid #dfe3e8;

  border-radius:7px;

  outline:none;

  font-size:8px;
}


.emp-analytics-date-arrow{
  padding-bottom:9px;

  color:#98a2b3;

  font-size:8px;
}


/* =========================================================
   KPI SUMMARY
========================================================= */

.emp-analytics-summary{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:9px;
}


.emp-analytics-kpi{
  position:relative;

  min-width:0;

  min-height:155px;

  display:flex;
  flex-direction:column;

  padding:13px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  overflow:hidden;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-analytics-kpi::after{
  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:3px;

  background:#0a66c2;
}


.emp-analytics-kpi.purple::after{
  background:#7c3aed;
}


.emp-analytics-kpi.green::after{
  background:#16a34a;
}


.emp-analytics-kpi.orange::after{
  background:#f59e0b;
}


.emp-analytics-kpi-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-analytics-kpi-icon{
  width:32px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-analytics-kpi.purple
.emp-analytics-kpi-icon{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-analytics-kpi.green
.emp-analytics-kpi-icon{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-kpi.orange
.emp-analytics-kpi-icon{
  background:#fff7ed;

  color:#d97706;
}


.emp-analytics-kpi-icon svg{
  width:16px;
  height:16px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-analytics-kpi-trend{
  min-height:23px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:750;
}


.emp-analytics-kpi-trend.up{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-kpi-trend.down{
  background:#fff1f2;

  color:#be123c;
}


.emp-analytics-kpi-label{
  margin-top:11px;

  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-analytics-kpi > strong{
  display:block;

  margin-top:4px;

  color:#101828;

  font-size:23px;

  line-height:1;

  font-weight:830;
}


.emp-analytics-kpi > small{
  margin-top:5px;

  color:#98a2b3;

  font-size:6px;

  line-height:1.4;
}


/* =========================================================
   MINI CHART
========================================================= */

.emp-analytics-mini-chart{
  height:38px;

  margin-top:auto;

  padding-top:9px;

  overflow:hidden;
}


.emp-analytics-mini-chart
.crypto-line-chart{
  width:100%;
  height:100%;
}


.emp-analytics-mini-chart
.crypto-chart-grid{
  display:none;
}


/* =========================================================
   KPI PROGRESS
========================================================= */

.emp-analytics-progress{
  width:100%;

  height:6px;

  margin-top:auto;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-analytics-progress > div{
  width:0;

  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #4da1f2
    );

  transition:
    width .45s ease;
}


.emp-analytics-kpi.green
.emp-analytics-progress > div{
  background:
    linear-gradient(
      90deg,
      #16a34a,
      #4ade80
    );
}


.emp-analytics-kpi.orange
.emp-analytics-progress > div{
  background:
    linear-gradient(
      90deg,
      #d97706,
      #fbbf24
    );
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.emp-analytics-dashboard{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;

  align-items:stretch;
}


.emp-analytics-wide{
  grid-column:
    span 2;

   ANALYTICS PANEL
========================================================= */

.emp-analytics-panel{
  min-width:0;

  min-height:280px;

  display:flex;
  flex-direction:column;

  padding:13px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);

}


.emp-analytics-panel:hover{
  transform:translateY(-1px);

  border-color:#d4dce5;

  box-shadow:
    0 7px 20px
    rgba(16,24,40,.045);
}


.emp-analytics-panel-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;
}


.emp-analytics-panel-kicker{
  display:block;

  color:#0a66c2;

  font-size:6px;

  font-weight:850;

  letter-spacing:.08em;

  text-transform:uppercase;
}


.emp-analytics-panel-head h2{
  margin:4px 0 0;

  color:#101828;

  font-size:11px;

  font-weight:820;
}


.emp-analytics-panel-head p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;

  line-height:1.45;
}


/* =========================================================
   HEALTH BADGE
========================================================= */

.emp-analytics-health{
  min-height:23px;

  display:inline-flex;
  align-items:center;

  padding:0 7px;

  border-radius:999px;

  background:#f2f4f7;

  color:#667085;

  font-size:6px;

  font-weight:750;
}


.emp-analytics-health.up{
  background:#ecfdf3;

  color:#15803d;
}


.emp-analytics-health.down{
  background:#fff1f2;

  color:#be123c;
}


/* =========================================================
   LARGE CHARTS
========================================================= */

.emp-analytics-large-chart{
  flex:1;

  min-height:145px;

  margin-top:13px;
}


.emp-analytics-large-chart
.crypto-line-chart,
.emp-analytics-job-chart
.crypto-line-chart,
.emp-analytics-operations-chart
.crypto-line-chart{
  width:100%;
  height:100%;
}


.emp-analytics-large-chart
.crypto-chart-area{
  fill:
    rgba(10,102,194,.10);
}


.emp-analytics-large-chart
.crypto-chart-line{
  stroke:#0a66c2;

  stroke-width:2.4;
}


.emp-analytics-job-chart,
.emp-analytics-operations-chart{
  height:110px;

  margin-top:18px;
}


/* =========================================================
   CHART FOOTER
========================================================= */

.emp-analytics-chart-footer{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}


.emp-analytics-chart-footer > div,
.emp-analytics-single-total > div{
  padding:8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-analytics-chart-footer span,
.emp-analytics-single-total span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-chart-footer strong,
.emp-analytics-single-total strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;

  font-weight:800;
}


.positive{
  color:#15803d !important;
}


/* =========================================================
   FUNNEL
========================================================= */

.emp-funnel{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-top:18px;
}


.emp-funnel-label{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  margin-bottom:5px;
}


.emp-funnel-label span{
  color:#667085;

  font-size:7px;

  font-weight:700;
}


.emp-funnel-label strong{
  color:#101828;

  font-size:8px;
}


.emp-funnel-track{
  width:100%;

  height:9px;

  border-radius:999px;

  background:#f2f4f7;

  overflow:hidden;
}


.emp-funnel-track > div{
  height:100%;

  border-radius:inherit;

  background:#0a66c2;

  transition:
    width .45s ease;
}


.emp-funnel-row.purple
.emp-funnel-track > div{
  background:#7c3aed;
}


.emp-funnel-row.orange
.emp-funnel-track > div{
  background:#f59e0b;
}


.emp-funnel-row.teal
.emp-funnel-track > div{
  background:#0891b2;
}


.emp-funnel-row.green
.emp-funnel-track > div{
  background:#16a34a;
}


/* =========================================================
   FUNNEL RATES
========================================================= */

.emp-analytics-rate-grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:5px;

  margin-top:auto;

  padding-top:14px;
}


.emp-analytics-rate-grid > div{
  padding:7px;

  border-radius:7px;

  background:#f8fafc;

  text-align:center;
}


.emp-analytics-rate-grid span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-rate-grid strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;
}


/* =========================================================
   EMPLOYER BRAND PERFORMANCE
========================================================= */

.emp-brand-performance{
  flex:1;

  display:flex;
  flex-direction:column;

  justify-content:center;

  margin-top:14px;
}


.emp-brand-big-number{
  padding:12px;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      #eef6ff,
      #f8fbff
    );
}


.emp-brand-big-number span{
  display:block;

  color:#667085;

  font-size:7px;
}


.emp-brand-big-number strong{
  display:block;

  margin-top:4px;

  color:#0a66c2;

  font-size:25px;

  line-height:1;

  font-weight:830;
}


.emp-brand-big-number small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:6px;
}


.emp-brand-stats{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:8px;
}


.emp-brand-stats > div{
  padding:8px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-brand-stats span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-brand-stats strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:10px;
}


/* =========================================================
   OPERATIONS SUMMARY
========================================================= */

.emp-analytics-operations-summary{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:5px;

  margin-top:8px;
}


.emp-analytics-operations-summary > div{
  padding:7px;

  border-radius:7px;

  background:#f8fafc;
}


.emp-analytics-operations-summary span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-analytics-operations-summary strong{
  display:block;

  margin-top:3px;

  color:#344054;

  font-size:9px;
}


.emp-analytics-completion{
  margin-top:auto;

  padding-top:12px;
}


.emp-analytics-completion > div:first-child{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-analytics-completion span{
  color:#667085;

  font-size:7px;
}


.emp-analytics-completion strong{
  color:#344054;

  font-size:8px;
}


.emp-analytics-completion-track{
  height:6px;

  margin-top:6px;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-analytics-completion-track > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #0a66c2,
      #22c55e
    );
}


/* =========================================================
   JOB TOTAL
========================================================= */

.emp-analytics-single-total{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:auto;
}


/* =========================================================
   EMPLOYER HEALTH
========================================================= */

.emp-health-score-list{
  display:flex;
  flex-direction:column;

  gap:14px;

  margin-top:18px;
}


.emp-health-score-list
> div
> div:first-child{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}


.emp-health-score-list span{
  color:#667085;

  font-size:7px;
}


.emp-health-score-list strong{
  color:#344054;

  font-size:8px;
}


.emp-health-track{
  width:100%;

  height:7px;

  margin-top:6px;

  border-radius:999px;

  background:#eef1f5;

  overflow:hidden;
}


.emp-health-track > div{
  height:100%;

  border-radius:inherit;
}


.emp-health-track.green > div{
  background:#16a34a;
}


.emp-health-track.blue > div{
  background:#0a66c2;
}


.emp-health-track.purple > div{
  background:#7c3aed;
}


.emp-health-track.orange > div{
  background:#f59e0b;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

  .emp-analytics-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-dashboard{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-wide{
    grid-column:
      span 2;
  }

}


@media(max-width:760px){

  .emp-analytics-controls{
    align-items:stretch;

    flex-direction:column;

    width:100%;
  }


  .emp-analytics-range-control,
  .emp-analytics-range-control select,
  .emp-analytics-refresh{
    width:100%;
  }


  #section-analytics
  .emp-custom-dates{
    width:100%;

    align-items:stretch;

    flex-direction:column;
  }


  .emp-analytics-date-arrow{
    padding:0;

    text-align:center;
  }


  .emp-analytics-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .emp-analytics-dashboard{
    grid-template-columns:1fr;
  }


  .emp-analytics-wide{
    grid-column:auto;
  }


  .emp-analytics-chart-footer,
  .emp-analytics-operations-summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

/* =========================================================
   AIFT EMPLOYER
   PROFILE + SETTINGS
========================================================= */

#section-profile,
#section-settings{
  width:100%;
  min-width:0;
}


/* =========================================================
   SHARED ACTIONS
========================================================= */

.emp-profile-header-actions,
.emp-profile-public-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}


.emp-primary-action,
.emp-secondary-action{
  min-height:36px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:0 11px;

  border-radius:8px;

  font-family:inherit;
  font-size:8px;
  font-weight:750;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}


.emp-primary-action{
  border:1px solid #0a66c2;

  background:#0a66c2;

  color:#fff;
}


.emp-primary-action:hover{
  background:#0756a6;

  border-color:#0756a6;
}


.emp-secondary-action{
  border:1px solid #d8e0e9;

  background:#fff;

  color:#344054;
}


.emp-secondary-action:hover{
  border-color:#a9cbed;

  background:#f7fbff;

  color:#0a66c2;
}


.emp-primary-action svg,
.emp-secondary-action svg{
  width:13px;
  height:13px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   PROFILE DASHBOARD
========================================================= */

.emp-profile-dashboard{
  display:grid;

  grid-template-columns:
    minmax(0,1.35fr)
    minmax(260px,.65fr);

  gap:10px;
}


/* =========================================================
   PROFILE IDENTITY
========================================================= */

.emp-profile-identity-card{
  min-width:0;

  overflow:hidden;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);
}


.emp-profile-cover{
  width:100%;
  height:145px;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  background-color:#e8eef5;
}


.emp-profile-cover.empty{
  background:
    linear-gradient(
      135deg,
      #dcecff 0%,
      #eef6ff 48%,
      #f8fafc 100%
    );
}


.emp-profile-identity-body{
  display:flex;
  align-items:flex-start;

  gap:15px;

  padding:0 16px 17px;
}


.emp-profile-company-logo{
  width:86px !important;
  height:86px !important;

  min-width:86px;

  margin-top:-43px;

  border:4px solid #fff;

  border-radius:16px;

  object-fit:cover;

  background:#fff;

  box-shadow:
    0 8px 22px
    rgba(16,24,40,.12);
}


.emp-profile-company-main{
  flex:1;

  min-width:0;

  padding-top:13px;
}


.emp-profile-company-heading{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;
}


.emp-profile-company-heading h2{
  margin:5px 0 0;

  color:#101828;

  font-size:17px;

  line-height:1.2;

  font-weight:820;
}


.emp-profile-company-heading p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;
}


.emp-profile-status{
  display:inline-flex;
  align-items:center;

  min-height:21px;

  padding:0 7px;

  border-radius:999px;

  background:#ecfdf3;

  color:#15803d;

  font-size:6px;

  font-weight:800;
}


.emp-profile-description{
  max-width:760px;

  margin:11px 0 0;

  color:#475467;

  font-size:8px;

  line-height:1.6;
}


.emp-profile-tags{
  display:flex;
  flex-wrap:wrap;

  gap:5px;

  margin-top:10px;
}


.emp-profile-tags span{
  display:inline-flex;
  align-items:center;

  min-height:23px;

  padding:0 7px;

  border:1px solid #e4e7ec;

  border-radius:999px;

  background:#f8fafc;

  color:#475467;

  font-size:6px;

  font-weight:700;
}


/* =========================================================
   PROFILE STATS
========================================================= */

.emp-profile-stat-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}


.emp-profile-stat-grid article{
  min-width:0;

  min-height:105px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:12px;

  border:1px solid #e4e7ec;

  border-radius:10px;

  background:#fff;
}


.emp-profile-stat-icon{
  width:35px;
  height:35px;

  flex:0 0 35px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  background:#edf6ff;

  color:#0a66c2;
}


.emp-profile-stat-icon.purple{
  background:#f5f3ff;

  color:#7c3aed;
}


.emp-profile-stat-icon.green{
  background:#ecfdf3;

  color:#15803d;
}


.emp-profile-stat-icon.orange{
  background:#fff7ed;

  color:#d97706;
}


.emp-profile-stat-icon svg{
  width:17px;
  height:17px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.emp-profile-stat-grid article > div > span{
  display:block;

  color:#667085;

  font-size:6px;

  font-weight:700;
}


.emp-profile-stat-grid article strong{
  display:block;

  margin-top:3px;

  color:#101828;

  font-size:17px;

  line-height:1;

  font-weight:830;
}


.emp-profile-stat-grid article small{
  display:block;

  margin-top:5px;

  color:#98a2b3;

  font-size:6px;
}


/* =========================================================
   PROFILE INFORMATION
========================================================= */

.emp-profile-information{
  padding:15px;

  border:1px solid #e4e7ec;

  border-radius:11px;

  background:#fff;
}


.emp-profile-information-head h3,
.emp-profile-public-card h3{
  margin:4px 0 0;

  color:#101828;

  font-size:11px;

  font-weight:820;
}


.emp-profile-information-head p,
.emp-profile-public-card p{
  margin:4px 0 0;

  color:#667085;

  font-size:7px;

  line-height:1.5;
}


.emp-profile-section-kicker{
  display:block;

  color:#0a66c2;

  font-size:6px;

  font-weight:850;

  letter-spacing:.08em;
}


.emp-profile-details-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:7px;

  margin-top:13px;
}


.emp-profile-details-grid > div{
  min-width:0;

  padding:10px;

  border:1px solid #edf1f5;

  border-radius:8px;

  background:#f8fafc;
}


.emp-profile-detail-wide{
  grid-column:1 / -1;
}


.emp-profile-details-grid span{
  display:block;

  color:#98a2b3;

  font-size:6px;
}


.emp-profile-details-grid strong{
  display:block;

  margin-top:4px;

  overflow:hidden;

  color:#344054;

  font-size:8px;

  font-weight:750;

  text-overflow:ellipsis;
}


/* =========================================================
   PUBLIC PROFILE CARD
========================================================= */

.emp-profile-public-card{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding:15px;

  border:1px solid #dbeafe;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #f7fbff,
      #fff
    );
}





/* =========================================================
   AIFT EMPLOYER STUDIO
   SETTINGS
   SCHOOL-STUDIO MATCH
========================================================= */

#section-settings{
  width:100%;
  max-width:100%;
  min-width:0;
}


.employer-settings-shell{
  width:100%;
  max-width:100%;
  min-width:0;
}


/* =========================================================
   HEADER
========================================================= */

.employer-settings-header{
  width:100%;
  min-width:0;

  margin-bottom:14px;
  padding:22px 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:24px;

  border:1px solid #e4e7ec;
  border-radius:13px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(16,24,40,.035);
}


.employer-settings-header-copy{
  flex:1;
  min-width:0;
}


.employer-settings-eyebrow{
  display:block;

  margin-bottom:6px;

  color:#1570ef;

  font-size:9px;
  line-height:1.25;

  font-weight:800;

  letter-spacing:.08em;

  text-transform:uppercase;
}


.employer-settings-header p{
  max-width:760px;

  margin:0;

  color:#667085;

  font-size:10px;
  line-height:1.55;
}


.employer-settings-profile-button{
  flex:0 0 auto;

  min-height:40px;

  padding:0 14px;

  border:1px solid #1570ef;
  border-radius:9px;

  background:#1570ef;

  color:#fff;

  font:inherit;
  font-size:10px;
  font-weight:750;

  cursor:pointer;

  transition:
    background .16s ease,
    border-color .16s ease,
    transform .16s ease;
}


.employer-settings-profile-button:hover{
  border-color:#175cd3;

  background:#175cd3;

  transform:translateY(-1px);
}


/* =========================================================
   CATEGORY NAVIGATION
========================================================= */

.employer-settings-nav{
  width:100%;
  min-width:0;

  margin-bottom:14px;
  padding:5px;

  display:flex;
  align-items:center;

  gap:4px;

  overflow-x:auto;
  overflow-y:hidden;

  border:1px solid #e4e7ec;
  border-radius:11px;

  background:#fff;

  scrollbar-width:none;
}


.employer-settings-nav::-webkit-scrollbar{
  display:none;
}


.employer-settings-nav-button{
  flex:0 0 auto;

  min-height:35px;

  padding:0 12px;

  border:0;
  border-radius:8px;

  background:transparent;

  color:#667085;

  font:inherit;
  font-size:9px;
  line-height:1;
  font-weight:700;

  white-space:nowrap;

  cursor:pointer;

  transition:
    background .16s ease,
    color .16s ease;
}


.employer-settings-nav-button:hover{
  background:#f8fafc;

  color:#344054;
}


.employer-settings-nav-button.active{
  background:#eff8ff;

  color:#175cd3;

  box-shadow:
    inset 0 0 0 1px
    #d1e9ff;
}


/* =========================================================
   PANELS
========================================================= */

.employer-settings-panel{
  width:100%;
  min-width:0;

  display:grid;

  gap:12px;
}


.employer-settings-panel[hidden]{
  display:none!important;
}


/* =========================================================
   CARD
========================================================= */

.employer-settings-card{
  width:100%;
  min-width:0;

  padding:20px;

  border:1px solid #e4e7ec;
  border-radius:13px;

  background:#fff;

  box-shadow:
    0 2px 8px
    rgba(16,24,40,.035);
}


/* =========================================================
   CARD HEADER
========================================================= */

.employer-settings-card-head{
  width:100%;
  min-width:0;

  margin-bottom:16px;

  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:16px;
}


.employer-settings-card-head > div{
  flex:1;
  min-width:0;
}


.employer-settings-card-head h2{
  margin:0;

  color:#101828;

  font-size:14px;
  line-height:1.35;

  font-weight:800;
}


.employer-settings-card-head p{
  max-width:760px;

  margin:4px 0 0;

  color:#667085;

  font-size:8px;
  line-height:1.5;
}


.employer-settings-text-button{
  flex-shrink:0;

  min-height:32px;

  padding:0 10px;

  border:1px solid #d0d5dd;
  border-radius:8px;

  background:#fff;

  color:#1570ef;

  font:inherit;
  font-size:8px;
  font-weight:750;

  cursor:pointer;
}


/* =========================================================
   INFORMATION GRID
========================================================= */

.employer-settings-info-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:8px;
}


.employer-settings-info{
  min-width:0;
  min-height:82px;

  padding:12px;

  border:1px solid #e4e7ec;
  border-radius:10px;

  background:#f8fafc;
}


.employer-settings-info span{
  display:block;

  color:#98a2b3;

  font-size:7px;
  line-height:1.3;

  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.04em;
}


.employer-settings-info strong{
  display:block;

  margin-top:7px;

  overflow-wrap:anywhere;

  color:#101828;

  font-size:10px;
  line-height:1.45;

  font-weight:750;
}


/* =========================================================
   CONTROL LIST
========================================================= */

.employer-settings-control-list,
.employer-settings-action-list{
  width:100%;

  display:grid;

  gap:0;
}


.employer-settings-control,
.employer-settings-toggle-row,
.employer-settings-action-row{
  width:100%;
  min-width:0;

  min-height:66px;

  padding:12px 0;

  border-bottom:1px solid #e4e7ec;
}


.employer-settings-control:first-child,
.employer-settings-toggle-row:first-child,
.employer-settings-action-row:first-child{
  padding-top:2px;
}


.employer-settings-control:last-child,
.employer-settings-toggle-row:last-child,
.employer-settings-action-row:last-child{
  padding-bottom:2px;

  border-bottom:0;
}


/* =========================================================
   SELECT ROW
========================================================= */

.employer-settings-control{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(180px,240px);

  align-items:center;

  gap:20px;
}


.employer-settings-control-copy{
  min-width:0;
}


.employer-settings-control-copy strong,
.employer-settings-toggle-row
> span:first-child strong,
.employer-settings-action-row
> div strong{
  display:block;

  color:#101828;

  font-size:9px;
  line-height:1.4;

  font-weight:750;
}


.employer-settings-control-copy span,
.employer-settings-toggle-row
> span:first-child small,
.employer-settings-action-row
> div span{
  display:block;

  margin-top:3px;

  color:#667085;

  font-size:7px;
  line-height:1.5;

  font-weight:400;
}


.employer-settings-control select{
  width:100%;
  height:38px;

  padding:
    0 32px
    0 10px;

  border:1px solid #d0d5dd;
  border-radius:9px;

  background:#fff;

  color:#344054;

  font:inherit;
  font-size:9px;
  font-weight:650;

  outline:none;
}


.employer-settings-control select:focus{
  border-color:#84adff;

  box-shadow:
    0 0 0 3px
    rgba(21,112,239,.08);
}


/* =========================================================
   SWITCHES
========================================================= */

.employer-settings-toggle-row{
  position:relative;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    42px;

  align-items:center;

  gap:18px;

  cursor:pointer;
}


.employer-settings-toggle-row input{
  position:absolute;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;
}


.employer-settings-switch{
  position:relative;

  width:38px;
  height:22px;

  justify-self:end;

  border:1px solid #c9ced6;
  border-radius:999px;

  background:#d8dde5;

  transition:
    background .18s ease,
    border-color .18s ease;
}


.employer-settings-switch::after{
  content:"";

  position:absolute;

  top:2px;
  left:2px;

  width:16px;
  height:16px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 1px 3px
    rgba(15,23,42,.22);

  transition:
    transform .18s ease;
}


.employer-settings-toggle-row
input:checked
+
.employer-settings-switch{
  border-color:#1570ef;

  background:#1570ef;
}


.employer-settings-toggle-row
input:checked
+
.employer-settings-switch::after{
  transform:
    translateX(16px);
}


/* =========================================================
   ACTION ROWS
========================================================= */

.employer-settings-action-row{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  align-items:center;

  gap:18px;
}


.employer-settings-action-row button{
  min-height:34px;

  padding:0 11px;

  border:1px solid #d0d5dd;
  border-radius:8px;

  background:#fff;

  color:#344054;

  font:inherit;
  font-size:8px;
  font-weight:750;

  cursor:pointer;
}


.employer-settings-action-row button:hover{
  border-color:#84adff;

  background:#f8fbff;

  color:#175cd3;
}


.employer-settings-action-row.danger button{
  border-color:#fda29b;

  color:#b42318;
}


/* =========================================================
   ACCOUNT GRID
========================================================= */

.employer-settings-account-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:8px;
}


.employer-settings-account-grid article{
  min-width:0;
  min-height:82px;

  padding:12px;

  border:1px solid #e4e7ec;
  border-radius:10px;

  background:#f8fafc;
}


.employer-settings-account-grid span,
.employer-settings-account-grid small{
  display:block;

  color:#98a2b3;

  font-size:7px;
}


.employer-settings-account-grid strong{
  display:block;

  margin-top:6px;

  color:#344054;

  font-size:10px;

  font-weight:750;
}


.emp-settings-account-active{
  color:#039855!important;
}


/* =========================================================
   THEME OPTIONS
========================================================= */

.employer-theme-options{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;
}


.employer-theme-option{
  min-width:0;

  padding:10px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  border:1px solid #d0d5dd;
  border-radius:11px;

  background:#fff;

  color:#101828;

  text-align:left;

  cursor:pointer;
}


.employer-theme-option.active{
  border-color:#1570ef;

  background:#eff8ff;

  box-shadow:
    0 0 0 2px
    rgba(21,112,239,.06);
}


.employer-theme-option strong{
  margin-top:9px;

  font-size:9px;
}


.employer-theme-option small{
  margin-top:3px;

  color:#667085;

  font-size:7px;
}


.employer-theme-preview{
  position:relative;

  width:100%;
  height:86px;

  overflow:hidden;

  border:1px solid #e4e7ec;
  border-radius:9px;
}


.employer-theme-preview.light{
  background:#f5f7fa;
}


.employer-theme-preview.dark{
  border-color:#344054;

  background:#101828;
}


.employer-theme-preview.system{
  background:
    linear-gradient(
      90deg,
      #f5f7fa 0 50%,
      #101828 50% 100%
    );
}


/* dark preview internal surfaces */

.employer-theme-preview.dark::before,
.employer-theme-preview.dark::after{
  background:#1d2939;
}


.employer-theme-preview.dark::after{
  box-shadow:
    0 26px 0 #1d2939,
    0 52px 0 #1d2939;
}


.employer-theme-preview::before{
  content:"";

  position:absolute;

  top:10px;
  left:10px;

  width:24%;
  height:calc(100% - 20px);

  border-radius:5px;

  background:#fff;
}


.employer-theme-preview::after{
  content:"";

  position:absolute;

  top:10px;
  right:10px;

  width:58%;
  height:17px;

  border-radius:5px;

  background:#fff;

  box-shadow:
    0 26px 0 #fff,
    0 52px 0 #fff;
}

    transform .16s ease;

}

}

  box-shadow:

}

/* =========================================================

========================================================= */

}


/* =========================================================

========================================================= */

#section-settings

}

[data-settings-content="security"]

[data-settings-content="security"]

/* =========================================================
   SECURITY SESSION LIST
========================================================= */

.employer-security-session-list{
  width:100%;

  display:flex;
  flex-direction:column;

  gap:8px;

  margin-top:14px;
}


/* =========================================================
   SECURITY SESSION CARD
========================================================= */

.employer-security-session-card{
  width:100%;

  display:flex;

.employer-security-session-card:hover{

/* =========================================================
   SESSION MAIN CONTENT
========================================================= */

.employer-security-session-main{
  min-width:0;
  flex:1;
}


/* =========================================================
   SESSION TITLE
========================================================= */

.employer-security-session-title{

  align-items:center;
  flex-wrap:wrap;

  gap:7px;

  margin-bottom:5px;
}

.employer-security-session-title strong{

  font-size:12px;
  font-weight:700;
  line-height:1.4;
}


/* =========================================================
   CURRENT DEVICE BADGE
========================================================= */

.employer-security-current-badge{

  padding:2px 7px;

  font-size:9px;
  font-weight:700;
  line-height:1;
}


/* =========================================================
   DEVICE META
========================================================= */

.employer-security-session-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  margin-bottom:5px;

  color:#667085;

  font-size:10px;
  line-height:1.45;
}

.employer-security-session-meta span{

}

.employer-security-session-meta
span:not(:last-child)::after{
  content:"";

  position:absolute;

  top:50%;
  right:-8px;

  width:3px;
  height:3px;

  transform:translateY(-50%);

  background:#d0d5dd;

  border-radius:50%;
}


/* =========================================================
   SESSION DETAILS
========================================================= */

.employer-security-session-details{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:4px 17px;

  color:#667085;

  font-size:10px;
  line-height:1.5;
}

.employer-security-session-details span{

  align-items:center;

  gap:4px;
}

.employer-security-session-details strong{

  font-weight:600;
}


/* =========================================================
   SESSION ACTION
========================================================= */

.employer-security-session-actions{
  flex:0 0 auto;

  display:flex;
  align-items:center;
}

.employer-security-session-actions button{
  min-height:32px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:6px 11px;

  color:#475467;
  background:#ffffff;

  border:1px solid #d0d5dd;
  border-radius:7px;

  font-family:inherit;
  font-size:10px;
  font-weight:650;

  cursor:pointer;

  transition:
    color .16s ease,
    background .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;

  background:#fef3f2;
  border-color:#fecdca;
}

.employer-security-session-actions button:focus-visible{
  outline:none;

  box-shadow:
    0 0 0 3px
    rgba(10,102,194,.12);
}


/* =========================================================
   EMPTY SESSION STATE
========================================================= */

.employer-security-session-empty{
  width:100%;

  padding:18px 16px;

  color:#667085;
  background:#f9fafb;

  border:1px dashed #d0d5dd;
  border-radius:10px;

  font-size:11px;
  font-weight:500;
  line-height:1.5;

  text-align:center;
}


/* =========================================================
   SETTINGS INLINE MESSAGE
========================================================= */

.employer-settings-inline-message{
  width:100%;

  margin-top:12px;
  padding:9px 11px;

  color:#344054;
  background:#f9fafb;

  border:1px solid #eaecf0;
  border-radius:8px;

  font-size:10px;
  font-weight:500;
  line-height:1.5;
}

.employer-settings-inline-message[data-type="success"]{

  background:#ecfdf3;
  border-color:#abefc6;
}

.employer-settings-inline-message[data-type="error"]{

  background:#fef3f2;

}

========================================================= */

.employer-settings-card button:disabled{

========================================================= */

.employer-security-modal{
  position:fixed;

  z-index:100000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

========================================================= */

.employer-security-modal-backdrop{

========================================================= */

.employer-security-modal-dialog{

  width:min(100%,480px);

========================================================= */

@media(max-width:1200px){

  #section-help .emp-help-category-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  #section-help .emp-help-main-grid{
    grid-template-columns:
      minmax(0,1fr)
      260px;
  }

}


@media(max-width:900px){

  #section-help .emp-help-hero{
    grid-template-columns:
      1fr;
  }

  #section-help .emp-help-hero-visual{
    display:none;
  }

  #section-help .emp-help-main-grid{
    grid-template-columns:
      1fr;
  }

  #section-help .emp-help-support-column{
    display:grid;

    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}


@media(max-width:700px){

  #section-help .emp-help-hero{
    min-height:0;

    padding:20px 16px;
  }

  #section-help .emp-help-hero h1{
    font-size:24px;
  }

  #section-help .emp-help-category-grid{
    grid-template-columns:
      1fr;
  }

  #section-help .emp-help-support-column{
    grid-template-columns:
      1fr;
  }

  #section-help .emp-help-account-strip{
    grid-template-columns:
      40px
      minmax(0,1fr);
  }

  #section-help .emp-help-account-strip button{
    grid-column:
      1 / -1;

    width:100%;
  }

}

/* =========================================================
   AIFT EMPLOYER HELP CENTER
   MODALS / FORMS / DIAGNOSTICS
========================================================= */

body.employer-help-modal-open{
  overflow:hidden!important;
}


/* =========================================================
   SHARED BACKDROPS
========================================================= */

.emp-help-guide-viewer-backdrop,
.emp-help-form-backdrop{
  position:fixed;
  inset:0;

  z-index:99990;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  background:
    rgba(15,23,42,.48);

  backdrop-filter:
    blur(3px);

  -webkit-backdrop-filter:
    blur(3px);

  animation:
    employerHelpBackdropIn
    .16s ease;
}


@keyframes employerHelpBackdropIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* =========================================================
   GUIDE VIEWER
========================================================= */

.emp-help-guide-viewer{
  width:min(
    620px,
    100%
  );

  max-height:
    min(
      760px,
      calc(100vh - 48px)
    );

  overflow-y:auto;

  padding:22px;

  border:
    1px solid
    #e4e7ec;

  border-radius:16px;

  background:#fff;

  box-shadow:
    0 24px 70px
    rgba(15,23,42,.20);

  animation:
    employerHelpDialogIn
    .18s ease;
}


@keyframes employerHelpDialogIn{

  from{
    opacity:0;

    transform:
      translateY(8px)
      scale(.985);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   GUIDE HEADER
========================================================= */

.emp-help-guide-viewer-head{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:18px;

  margin-bottom:12px;
}


.emp-help-guide-viewer-head h2{
  margin:0;

  color:#101828;

  font-size:18px;

  line-height:1.3;

  font-weight:800;
}


.emp-help-guide-viewer-head
.emp-help-section-kicker,
.emp-help-form-head
.emp-help-section-kicker{
  display:block;

  margin-bottom:7px;

  color:#0a66c2;

  font-size:9px;

  line-height:1;

  font-weight:850;

  letter-spacing:.08em;
}


.emp-help-guide-viewer-close{
  flex:0 0 auto;

  width:32px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:
    1px solid
    #e4e7ec;

  border-radius:8px;

  background:#fff;

  color:#667085;

  font-family:inherit;

  font-size:20px;

  font-weight:400;

  line-height:1;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease;
}


.emp-help-guide-viewer-close:hover{
  border-color:#d0d5dd;

  background:#f9fafb;

  color:#101828;
}


.emp-help-guide-viewer-description{
  margin:
    0 0 18px;

  padding-bottom:16px;

  border-bottom:
    1px solid
    #eaecf0;

  color:#667085;

  font-size:10px;

  line-height:1.65;
}


/* =========================================================
   GUIDE STEPS
========================================================= */

.emp-help-guide-viewer-steps{
  display:flex;

  flex-direction:column;

  gap:9px;
}


.emp-help-guide-viewer-step{
  display:grid;

  grid-template-columns:
    28px
    minmax(0,1fr);

  align-items:flex-start;

  gap:10px;

  padding:11px;

  border:
    1px solid
    #eaecf0;

  border-radius:10px;

  background:#fcfcfd;
}


.emp-help-guide-viewer-step > span{
  width:28px;
  height:28px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#edf6ff;

  color:#0a66c2;

  font-size:9px;

  font-weight:850;
}


.emp-help-guide-viewer-step p{
  align-self:center;

  margin:0;

  color:#344054;

  font-size:9px;

  line-height:1.6;

  font-weight:550;
}


/* =========================================================
   GUIDE FOOTER
========================================================= */

.emp-help-guide-viewer-footer{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:18px;

  padding-top:15px;

  border-top:
    1px solid
    #eaecf0;
}


.emp-help-guide-viewer-footer
.emp-help-primary-action,
.emp-help-guide-viewer-footer
.emp-help-secondary-action{
  width:auto;

  min-width:100px;
  min-height:35px;

  padding:
    0 13px;

  border-radius:8px;

  font-family:inherit;

  font-size:8px;

  font-weight:800;

  cursor:pointer;
}


.emp-help-guide-viewer-footer
.emp-help-primary-action{
  border:
    1px solid
    #0a66c2;

  background:#0a66c2;

  color:#fff;
}


.emp-help-guide-viewer-footer
.emp-help-secondary-action{
  border:
    1px solid
    #d0d5dd;

  background:#fff;

  color:#344054;
}


/* =========================================================
   SUPPORT / REPORT DIALOG
========================================================= */

.emp-help-form-dialog{
  width:min(
    600px,
    100%
  );

  max-height:
    min(
      780px,
      calc(100vh - 48px)
    );

  overflow-y:auto;

  padding:22px;

  border:
    1px solid
    #e4e7ec;

  border-radius:16px;

  background:#fff;

  box-shadow:
    0 24px 70px
    rgba(15,23,42,.20);

  animation:
    employerHelpDialogIn
    .18s ease;
}


/* =========================================================
   FORM HEADER
========================================================= */

.emp-help-form-head{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:18px;

  margin-bottom:18px;

  padding-bottom:15px;

  border-bottom:
    1px solid
    #eaecf0;
}


.emp-help-form-head > div{
  min-width:0;
}


.emp-help-form-head h2{
  margin:0;

  color:#101828;

  font-size:18px;

  line-height:1.3;

  font-weight:800;
}


.emp-help-form-head p{
  max-width:470px;

  margin:
    7px 0 0;

  color:#667085;

  font-size:9px;

  line-height:1.6;
}


/* =========================================================
   FORM FIELDS
========================================================= */

#employerHelpRequestForm{
  display:flex;

  flex-direction:column;

  gap:14px;
}


.emp-help-form-field{
  display:flex;

  flex-direction:column;

  gap:6px;
}


.emp-help-form-field > span{
  color:#344054;

  font-size:9px;

  line-height:1.3;

  font-weight:750;
}


.emp-help-form-field input,
.emp-help-form-field textarea{
  width:100%;

  border:
    1px solid
    #d0d5dd;

  border-radius:9px;

  outline:none;

  background:#fff;

  color:#101828;

  font-family:inherit;

  font-size:10px;

  line-height:1.5;

  box-shadow:
    0 1px 2px
    rgba(16,24,40,.025);

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}


.emp-help-form-field input{
  height:40px;

  padding:
    0 11px;
}


.emp-help-form-field textarea{
  min-height:130px;

  padding:10px 11px;

  resize:vertical;
}


.emp-help-form-field input::placeholder,
.emp-help-form-field textarea::placeholder{
  color:#98a2b3;
}


.emp-help-form-field input:focus,
.emp-help-form-field textarea:focus{
  border-color:#84adff;

  box-shadow:
    0 0 0 3px
    rgba(10,102,194,.09);
}


/* =========================================================
   WORKSPACE CONTEXT
========================================================= */

.emp-help-form-context{
  display:flex;

  flex-direction:column;

  gap:4px;

  padding:11px 12px;

  border:
    1px solid
    #e4e7ec;

  border-radius:9px;

  background:#f9fafb;
}


.emp-help-form-context strong{
  color:#344054;

  font-size:8px;

  font-weight:800;
}


.emp-help-form-context span{
  overflow-wrap:anywhere;

  color:#667085;

  font-size:8px;

  line-height:1.45;
}


/* =========================================================
   INLINE FORM MESSAGE
========================================================= */

.emp-help-form-message{
  padding:
    9px 11px;

  border:
    1px solid
    #fecdca;

  border-radius:8px;

  background:#fef3f2;

  color:#b42318;

  font-size:8px;

  line-height:1.5;

  font-weight:650;
}


.emp-help-form-message[hidden]{
  display:none!important;
}


/* =========================================================
   FORM ACTIONS
========================================================= */

.emp-help-form-actions{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  gap:8px;

  margin-top:3px;

  padding-top:14px;

  border-top:
    1px solid
    #eaecf0;
}


.emp-help-form-actions
.emp-help-primary-action,
.emp-help-form-actions
.emp-help-secondary-action{
  width:auto;

  min-width:105px;
  min-height:36px;

  padding:
    0 13px;

  border-radius:8px;

  font-family:inherit;

  font-size:8px;

  font-weight:800;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    opacity .15s ease;
}


.emp-help-form-actions
.emp-help-primary-action{
  border:
    1px solid
    #0a66c2;

  background:#0a66c2;

  color:#fff;
}


.emp-help-form-actions
.emp-help-primary-action:hover{
  border-color:#064b91;

  background:#064b91;
}


.emp-help-form-actions
.emp-help-secondary-action{
  border:
    1px solid
    #d0d5dd;

  background:#fff;

  color:#344054;
}


.emp-help-form-actions
.emp-help-secondary-action:hover{
  background:#f9fafb;
}


.emp-help-form-actions button:disabled{
  cursor:not-allowed;

  opacity:.6;
}


/* =========================================================
   DIAGNOSTICS
========================================================= */

.emp-help-diagnostics-dialog{
  width:min(
    620px,
    100%
  );
}


.emp-help-diagnostic-status{
  display:flex;

  flex-direction:column;

  gap:4px;

  margin-bottom:14px;

  padding:12px;

  border:
    1px solid
    transparent;

  border-radius:10px;
}


.emp-help-diagnostic-status.success{
  border-color:#abefc6;

  background:#ecfdf3;
}


.emp-help-diagnostic-status.warning{
  border-color:#fedf89;

  background:#fffaeb;
}


.emp-help-diagnostic-status strong{
  font-size:9px;

  font-weight:850;
}


.emp-help-diagnostic-status.success strong{
  color:#067647;
}


.emp-help-diagnostic-status.warning strong{
  color:#b54708;
}


.emp-help-diagnostic-status span{
  font-size:8px;

  line-height:1.55;
}


.emp-help-diagnostic-status.success span{
  color:#067647;
}


.emp-help-diagnostic-status.warning span{
  color:#93370d;
}


/* =========================================================
   DIAGNOSTIC GRID
========================================================= */

.emp-help-diagnostic-grid{
  overflow:hidden;

  border:
    1px solid
    #eaecf0;

  border-radius:10px;

  background:#fff;
}


.emp-help-diagnostic-row{
  min-height:43px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:16px;

  padding:
    9px 12px;

  border-bottom:
    1px solid
    #f2f4f7;
}


.emp-help-diagnostic-row:last-child{
  border-bottom:0;
}


.emp-help-diagnostic-row > span{
  color:#667085;

  font-size:8px;

  font-weight:600;
}


.emp-help-diagnostic-row > strong{
  max-width:65%;

  overflow-wrap:anywhere;

  color:#344054;

  font-size:8px;

  font-weight:800;

  text-align:right;
}


/* =========================================================
   DARK MODE â€” DIALOGS

html[data-employer-theme="dark"]

html[data-employer-theme="dark"]
.emp-help-guide-viewer-footer,

.emp-help-form-head,
html[data-employer-theme="dark"]

.emp-help-form-field input:focus,

.emp-help-form-context span{

}

.emp-help-diagnostic-grid{

}


html[data-employer-theme="dark"]
.emp-help-diagnostic-row{

}


html[data-employer-theme="dark"]
.emp-help-diagnostic-row > span{

}


html[data-employer-theme="dark"]
.emp-help-diagnostic-row > strong{

}


html[data-employer-theme="dark"]
.emp-help-guide-viewer-footer
.emp-help-secondary-action,
html[data-employer-theme="dark"]
.emp-help-form-actions
.emp-help-secondary-action{
  border-color:#475467;

  background:#1d2939;

  color:#d0d5dd;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .emp-help-guide-viewer-backdrop,
  .emp-help-form-backdrop{
    align-items:flex-end;

    padding:0;
  }


  .emp-help-guide-viewer,
  .emp-help-form-dialog{
    width:100%;

    max-height:
      92vh;

    padding:
      18px 16px
      calc(
        18px +
        env(safe-area-inset-bottom)
      );

    border-left:0;
    border-right:0;
    border-bottom:0;

    border-radius:
      18px 18px
      0 0;
  }


  .emp-help-guide-viewer-head h2,
  .emp-help-form-head h2{
    font-size:16px;
  }


  .emp-help-guide-viewer-footer,
  .emp-help-form-actions{
    display:grid;

    grid-template-columns:
      1fr 1fr;
  }


  .emp-help-guide-viewer-footer
  .emp-help-primary-action,
  .emp-help-guide-viewer-footer
  .emp-help-secondary-action,
  .emp-help-form-actions
  .emp-help-primary-action,
  .emp-help-form-actions
  .emp-help-secondary-action{
    width:100%;
  }

}


@media(max-width:440px){

  .emp-help-guide-viewer-footer,
  .emp-help-form-actions{
    grid-template-columns:
      1fr;
  }


  .emp-help-diagnostic-row{
    align-items:flex-start;

    flex-direction:column;

    gap:4px;
  }


  .emp-help-diagnostic-row > strong{
    max-width:100%;

    text-align:left;
  }

}

/* =========================================================
   AIFT EMPLOYER â€” KABEZYA AI
   CLEAN CONVERSATION WORKSPACE
========================================================= */

#section-kabezya{
  --kabezya-primary:#6d28d9;
  --kabezya-primary-hover:#5b21b6;
  --kabezya-primary-soft:#f5f3ff;

  --kabezya-text:#172033;
  --kabezya-body:#344054;
  --kabezya-muted:#667085;
  --kabezya-soft:#98a2b3;

  --kabezya-border:#e4e7ec;
  --kabezya-border-soft:#eef0f3;

  --kabezya-success:#15803d;
  --kabezya-success-soft:#f0fdf4;
  --kabezya-success-border:#bbf7d0;

  width:100%;
  min-width:0;
}


/* =========================================================
   WORKSPACE
========================================================= */

.emp-kabezya-workspace{
  width:100%;

  max-width:1600px;

  margin:0 auto;

  padding:
    10px
    28px
    28px;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.emp-kabezya-layout{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    280px;

  gap:20px;

  align-items:start;

  width:100%;
  min-width:0;
}

/* =========================================================
   CHATGPT-STYLE CONVERSATION AREA
========================================================= */

.emp-kabezya-chat-panel{
  position:relative;

  display:flex;
  flex-direction:column;

  width:100%;
  min-width:0;

  height:
    calc(
      100vh -
      var(--topbar-h,66px) -
      36px
    );

  min-height:620px;

  overflow:hidden;

  border:0;
  border-radius:0;

  background:transparent;

  box-shadow:none;
}


/* =========================================================
   SCROLLABLE CONVERSATION
========================================================= */

.emp-kabezya-chat-body{
  position:relative;

  flex:1 1 auto;

  width:100%;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    20px
    0
    150px;

  overscroll-behavior:contain;

  scrollbar-width:thin;
  scrollbar-color:#d0d5dd transparent;
}

.emp-kabezya-chat-body::-webkit-scrollbar{
  width:6px;
}

.emp-kabezya-chat-body::-webkit-scrollbar-track{
  background:transparent;
}

.emp-kabezya-chat-body::-webkit-scrollbar-thumb{
  border-radius:999px;
  background:#d0d5dd;
}


/* =========================================================
   CONVERSATION CONTENT WIDTH
========================================================= */

.emp-kabezya-welcome,
.emp-kabezya-messages,
.emp-kabezya-thinking{
  width:min(100%,820px);

  margin-left:auto;
  margin-right:auto;
}


/* =========================================================
   EMPTY / START STATE
========================================================= */

.emp-kabezya-welcome{
  display:flex;

  flex-direction:column;

  align-items:flex-start;
  justify-content:center;

  min-height:
    calc(
      100% -
      80px
    );

  padding:
    80px
    22px
    120px;

  text-align:left;
}

.emp-kabezya-welcome[hidden]{
  display:none !important;
}


/* No giant K logo */

.emp-kabezya-welcome-mark{
  display:none !important;
}

.emp-kabezya-welcome h2{
  margin:0;

  color:#101828;

  font-size:28px;
  font-weight:650;
  line-height:1.2;

  letter-spacing:-.025em;
}

.emp-kabezya-welcome > p{
  max-width:600px;

  margin:10px 0 26px;

  color:var(--kabezya-muted);

  font-size:14px;
  line-height:1.6;
}


/* =========================================================
   QUICK PROMPTS
========================================================= */

.emp-kabezya-prompt-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:9px;

  width:100%;
  max-width:650px;
}

.emp-kabezya-prompt,
.emp-kabezya-prompt-card{
  display:flex;

  align-items:flex-start;

  gap:10px;

  min-height:68px;

  padding:12px;

  border:1px solid #e4e7ec;
  border-radius:12px;

  background:rgba(255,255,255,.7);

  color:#344054;

  font:inherit;

  text-align:left;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease;
}

.emp-kabezya-prompt:hover,
.emp-kabezya-prompt-card:hover{
  border-color:#d6bbfb;

  background:#faf9ff;
}

.emp-kabezya-prompt-icon{
  display:grid;

  place-items:center;

  width:30px;
  height:30px;

  flex:0 0 30px;

  border-radius:8px;

  background:#f5f3ff;

  color:var(--kabezya-primary);
}

.emp-kabezya-prompt-icon svg{
  width:15px;
  height:15px;

  fill:none;

  stroke:currentColor;
  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.emp-kabezya-prompt strong,
.emp-kabezya-prompt-card strong{
  display:block;

  margin:0;

  color:#344054;

  font-size:12px;
  font-weight:650;
  line-height:1.35;
}

.emp-kabezya-prompt small,
.emp-kabezya-prompt-card small{
  display:block;

  margin-top:3px;

  color:#98a2b3;

  font-size:10px;
  line-height:1.4;
}

/* =========================================================
   KABEZYA CONVERSATION
   CHATGPT-STYLE MESSAGE FLOW
========================================================= */


/* =========================================================
   MESSAGES CONTAINER

   Important:
   Do NOT use min-height:100%.
   Messages must occupy only the space they actually need so
   the thinking indicator and assistant response follow the
   user's message immediately.
========================================================= */

.emp-kabezya-messages{
  width:min(100%,820px);

  min-height:0;

  margin:
    0
    auto;

  padding:
    clamp(105px,15vh,155px)
    22px
    54px;
}

.emp-kabezya-messages[hidden]{
  display:none !important;
}


/* =========================================================
   MESSAGE ROW
========================================================= */

.emp-kabezya-message{
  display:flex;

  width:100%;

  margin:0;

  padding:0;

  border:0;

  background:transparent;
}


/* =========================================================
   DISTANCE BETWEEN USER AND KABEZYA

   Similar to ChatGPT:
   user prompt,
   small breathing room,
   assistant response.
========================================================= */

.emp-kabezya-message.is-user{
  justify-content:flex-end;

  margin-bottom:34px;
}

.emp-kabezya-message.is-assistant{
  justify-content:flex-start;

  margin-bottom:34px;
}


/* =========================================================
   REMOVE LEGACY IDENTITY UI
========================================================= */

.emp-kabezya-message-avatar,
.emp-kabezya-message-meta{
  display:none !important;
}

.emp-kabezya-message-main{
  width:100%;

  min-width:0;
}


/* =========================================================
   USER MESSAGE
========================================================= */

.emp-kabezya-message.is-user
.emp-kabezya-message-main{
  display:flex;

  flex-direction:column;

  align-items:flex-end;
}

.emp-kabezya-message.is-user
.emp-kabezya-message-content{
  display:block;

  width:auto;

  max-width:
    min(
      72%,
      620px
    );

  padding:
    10px
    15px;

  border:0;

  border-radius:
    18px
    18px
    5px
    18px;

  background:#e9e9ee;

  color:#202123;

  font-size:14px;

  font-weight:400;

  line-height:1.5;

  overflow-wrap:anywhere;
}


/* =========================================================
   USER MESSAGE TYPOGRAPHY

   User input should remain simple.
========================================================= */

.emp-kabezya-message.is-user
.emp-kabezya-message-content p{
  margin:0;
}

.emp-kabezya-message.is-user
.emp-kabezya-message-content > *{
  margin-top:0;
  margin-bottom:0;
}


/* =========================================================
   KABEZYA RESPONSE

   No bubble.
   No avatar.
   No label.
   No white card.
========================================================= */

.emp-kabezya-message.is-assistant
.emp-kabezya-message-main{
  width:100%;

  display:block;
}

.emp-kabezya-message.is-assistant
.emp-kabezya-message-content{
  width:100%;

  max-width:none;

  padding:0;

  border:0;

  border-radius:0;

  background:transparent;

  color:#202123;

  font-size:14px;

  font-weight:400;

  line-height:1.72;

  overflow-wrap:anywhere;
}


/* =========================================================
   RESPONSE PARAGRAPHS
========================================================= */

.emp-kabezya-message.is-assistant
.emp-kabezya-message-content > :first-child{
  margin-top:0;
}

.emp-kabezya-message.is-assistant
.emp-kabezya-message-content > :last-child{
  margin-bottom:0;
}

.emp-kabezya-message.is-assistant
.emp-kabezya-message-content p{
  margin:
    0
    0
    16px;
}


/* =========================================================
   RESPONSE HEADINGS
========================================================= */
