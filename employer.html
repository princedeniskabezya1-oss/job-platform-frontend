<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIFT Employer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0a66c2;
  --bg:#f3f2ef;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Inter;}

body{
  background:var(--bg);
  color:var(--text);
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  z-index:1000;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
}

.search{
  flex:1;
  margin:0 10px;
}

.search input{
  width:100%;
  padding:8px 12px;
  border-radius:20px;
  border:1px solid #ddd;
}

.icon{
  font-size:20px;
  cursor:pointer;
}

/* LAYOUT */
.layout{
  display:flex;
  margin-top:60px;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:white;
  border-right:1px solid var(--border);
  padding:15px;
  transition:.3s;
}

.sidebar.collapsed{
  width:70px;
}

.sidebar button{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:none;
  background:#f3f4f6;
  cursor:pointer;
  border-radius:8px;
}

.sidebar button:hover{
  background:#e5e7eb;
}

/* MAIN */
.main{
  flex:1;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

/* RIGHT PANEL */
.right{
  width:300px;
  border-left:1px solid var(--border);
  padding:15px;
  background:white;
  transition:.3s;
}

.right.collapsed{
  width:70px;
}

/* FEED SECTION */
.feed{
  display:none;
}

.feed.active{
  display:block;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar,.right{
    display:none;
  }
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="top-left">
    <img id="avatar" class="avatar" src="">
    <span><b>AIFT</b></span>
  </div>

  <div class="search">
    <input type="text" placeholder="Search...">
  </div>

  <div class="icon" onclick="window.location='messages.html'">💬</div>
</div>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="sidebar" id="leftPanel">

    <button onclick="toggleLeft()">☰</button>

    <button onclick="loadView('dashboard')">Dashboard</button>
    <button onclick="loadView('agents')">Agents</button>
    <button onclick="loadView('jobs')">Jobs</button>
    <button onclick="loadView('analytics')">Analytics</button>
    <button onclick="loadView('feed')">Company Feed</button>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="card feed active">
      <h3>Overview</h3>
      <p>Welcome to your employer dashboard.</p>
    </div>

    <!-- AGENTS -->
    <div id="agents" class="card feed">
      <h3>Agents Management</h3>
      <p>Manage your agents here.</p>
    </div>

    <!-- JOBS -->
    <div id="jobs" class="card feed">
      <h3>Career Tools & Jobs</h3>
      <p>Post and manage jobs.</p>
    </div>

    <!-- ANALYTICS -->
    <div id="analytics" class="card feed">
      <h3>Analytics</h3>
      <p>Track performance.</p>
    </div>

    <!-- FEED -->
    <div id="feed" class="card feed">
      <h3>Company Feed</h3>

      <textarea id="postText" placeholder="Share something..." style="width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;"></textarea>
      <button onclick="postFeed()" style="margin-top:10px;">Post</button>

      <div id="posts"></div>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right" id="rightPanel">

    <button onclick="toggleRight()">☰</button>

    <div class="card">
      <h4>Quick Stats</h4>
      <p>Jobs: 0</p>
      <p>Applicants: 0</p>
    </div>

  </div>

</div>

<script>

const API = "https://backend-1-9b6f.onrender.com";

const role = localStorage.getItem("role");
const token = localStorage.getItem("employerToken");

if(!token || role !== "employer"){
  window.location="login.html";
}

function loadView(view){
  document.querySelectorAll(".feed").forEach(el=>el.classList.remove("active"));
  document.getElementById(view).classList.add("active");
}

function toggleLeft(){
  document.getElementById("leftPanel").classList.toggle("collapsed");
}

function toggleRight(){
  document.getElementById("rightPanel").classList.toggle("collapsed");
}

/* PROFILE */
async function loadProfile(){
  const res = await fetch(API+"/api/users/me",{
    headers:{Authorization:"Bearer "+token}
  });

  const data = await res.json();
  document.getElementById("avatar").src = data.profileImage || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
}

loadProfile();

/* FEED */
async function postFeed(){

  const text = document.getElementById("postText").value;

  await fetch(API+"/api/posts",{
    method:"POST",
    headers:{
      Authorization:"Bearer "+token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({content:text})
  });

  loadPosts();
}

async function loadPosts(){

  const res = await fetch(API+"/api/posts",{
    headers:{Authorization:"Bearer "+token}
  });

  const posts = await res.json();

  const container = document.getElementById("posts");
  container.innerHTML="";

  posts.forEach(p=>{
    container.innerHTML += `
      <div class="card">
        <b>${p.author?.name || "Company"}</b>
        <p>${p.content}</p>
      </div>
    `;
  });

}

loadPosts();

</script>

</body>
</html>
