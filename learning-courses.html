<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Courses | AIFT Learning</title>
  <link rel="icon" href="images/aift-logo.png">
  <style>
    :root{--blue:#1787e8;--ink:#122037;--muted:#718096;--line:#dfe7f0;--bg:#f5f8fc;--card:#fff;--soft:#eaf4ff}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.topbar-inner{max-width:1380px;height:66px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:14px}.icon-btn{width:40px;height:40px;display:grid;place-items:center;color:#43536a;background:#fff;border:1px solid var(--line);border-radius:50%}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:70px;height:32px;object-fit:contain}.brand span{padding-left:10px;color:var(--blue);border-left:1px solid var(--line)}.theme-btn{margin-left:auto}.hero{padding:38px 22px 26px;background:radial-gradient(circle at 84% 0,#dff1ff,transparent 28%),linear-gradient(180deg,#fff,var(--bg))}.hero-inner,.content{max-width:1380px;margin:auto}.eyebrow{margin:0 0 8px;color:#159874;font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,5vw,54px);letter-spacing:-.055em}.hero p{max-width:640px;margin:10px 0 0;color:var(--muted);line-height:1.55}.controls{margin-top:22px;display:grid;grid-template-columns:minmax(250px,1fr) 220px;gap:10px}.search,.filter{height:48px;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}.search input,.filter select{width:100%;border:0;outline:0;color:var(--ink);background:transparent}.content{padding:24px 22px 48px}.summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.summary h2{margin:0;font-size:20px}.summary span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.course{min-width:0;overflow:hidden;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(40,65,96,.08);transition:.2s}.course:hover{transform:translateY(-3px);border-color:#acd3f8;box-shadow:0 16px 34px rgba(40,65,96,.13)}.cover{position:relative;aspect-ratio:1.45;background:linear-gradient(145deg,#dff0ff,#dcf7eb);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover-icon{height:100%;display:grid;place-items:center;color:var(--blue)}.cover-icon svg{width:42px;height:42px}.certificate{position:absolute;top:9px;right:9px;padding:5px 8px;color:#946000;background:rgba(255,247,219,.94);border-radius:999px;font-size:9px;font-weight:850}.course-body{padding:13px}.course-body h3{min-height:42px;margin:0;font-size:15px;line-height:1.35}.provider{margin:7px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:11px;display:flex;gap:5px;flex-wrap:wrap}.chip{padding:5px 7px;color:#536176;background:#f2f5f8;border-radius:999px;font-size:9px;font-weight:750}.state{grid-column:1/-1;min-height:260px;display:grid;place-items:center;align-content:center;padding:30px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px}.spinner{width:34px;height:34px;margin-bottom:12px;border:3px solid #dceeff;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.state h3{margin:0 0 7px}.state p{margin:0;color:var(--muted)}
    html[data-learning-theme="dark"]{color-scheme:dark;--ink:#f3f7fc;--muted:#aab7c9;--line:#304055;--bg:#101923;--card:#172230;--soft:#1f3851}html[data-learning-theme="dark"] .topbar{background:rgba(16,25,35,.9)}html[data-learning-theme="dark"] .icon-btn{color:#c4d0df;background:#172230;border-color:#34445a}html[data-learning-theme="dark"] .hero{background:radial-gradient(circle at 84% 0,rgba(20,68,112,.55),transparent 30%),linear-gradient(180deg,#172230,var(--bg))}html[data-learning-theme="dark"] .chip{color:#b7c3d2;background:#202d3d}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.topbar-inner{height:58px;padding:0 11px;gap:8px}.icon-btn{width:36px;height:36px}.brand img{width:60px;height:28px}.brand span{padding-left:7px;font-size:14px}.hero{padding:28px 12px 19px}.hero h1{font-size:31px}.hero p{font-size:13px}.controls{margin-top:16px;grid-template-columns:1fr 118px;gap:7px}.search,.filter{height:43px;padding:0 10px;border-radius:12px}.filter select,.search input{font-size:12px}.content{padding:15px 10px 32px}.summary h2{font-size:16px}.summary span{font-size:11px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.course{border-radius:12px;box-shadow:0 6px 16px rgba(40,65,96,.07)}.cover{aspect-ratio:1}.certificate{top:5px;right:5px;padding:3px 5px;font-size:7px}.cover-icon svg{width:29px;height:29px}.course-body{padding:8px 7px 9px}.course-body h3{min-height:34px;font-size:11px;line-height:1.3}.provider{margin-top:4px;font-size:8.5px}.meta{margin-top:7px;gap:3px}.chip{max-width:100%;padding:3px 5px;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{min-height:220px;padding:20px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><button class="icon-btn" type="button" onclick="location.href='groups.html'" aria-label="Back to Learning"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button><div class="brand"><img src="images/aift-logo.png" alt="AIFT"><span>Courses</span></div><button class="icon-btn theme-btn" id="themeButton" type="button" onclick="toggleTheme()" aria-label="Use dark theme"><svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg></button></div></header>
  <section class="hero"><div class="hero-inner"><p class="eyebrow">Learn a skill</p><h1>Courses built for real growth.</h1><p>Explore active AIFT classes, practical projects and certificate-ready learning opportunities.</p><div class="controls"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="search" type="search" placeholder="Search courses" aria-label="Search courses"></label><label class="filter"><select id="category" aria-label="Filter courses"><option value="">All subjects</option></select></label></div></div></section>
  <main class="content"><div class="summary"><h2>Available courses</h2><span id="count"></span></div><div class="grid" id="grid"><div class="state"><div class="spinner"></div><h3>Loading courses</h3><p>Retrieving published AIFT classes.</p></div></div></main>
  <script>
    const API="https://backend-1-9b6f.onrender.com",state={items:[],query:"",category:""};
    const token=()=>localStorage.getItem("schoolToken")||localStorage.getItem("teacherToken")||localStorage.getItem("studentToken")||localStorage.getItem("adminToken")||localStorage.getItem("employerToken")||localStorage.getItem("talentToken")||localStorage.getItem("agentToken")||localStorage.getItem("token");
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const id=value=>String(value?._id||value?.id||value||"");const name=(value,fallback="AIFT")=>String(value?.name||value?.schoolName||value?.companyName||fallback);const image=value=>/^https:\/\//i.test(String(value||""))||/^data:image\//i.test(String(value||""))||/^(?:\.\/)?images\//i.test(String(value||""))?String(value):"";
    function notifyChrome(active){if(parent!==window)parent.postMessage({type:"aift:learning-chrome",active:!!active},location.origin)}
    function applyTheme(value){const dark=value==="dark";document.documentElement.dataset.learningTheme=dark?"dark":"light";const button=document.getElementById("themeButton");button.setAttribute("aria-label",dark?"Use light theme":"Use dark theme");button.innerHTML=dark?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>':'<svg viewBox="0 0 24 24"><path d="M20.5 14.4A8 8 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></svg>'}
    function toggleTheme(){const next=document.documentElement.dataset.learningTheme==="dark"?"light":"dark";localStorage.setItem("aiftLearningTheme",next);applyTheme(next)}
    function searchable(item){return[item.title,item.subtitle,item.subject,item.category,item.description,item.level,item.language,name(item.schoolId,""),name(item.teacherId,"")].join(" ").toLowerCase()}
    function render(){const grid=document.getElementById("grid"),q=state.query.trim().toLowerCase(),items=state.items.filter(item=>(!q||searchable(item).includes(q))&&(!state.category||String(item.subject||item.category||"")===state.category));document.getElementById("count").textContent=`${items.length} shown`;if(!items.length){grid.innerHTML='<div class="state"><h3>No matching courses</h3><p>Try another subject or keyword.</p></div>';return}grid.innerHTML=items.map(item=>{const cover=image(item.coverImage||item.appearanceSettings?.thumbnailImage||item.bannerImage),title=item.title||"Untitled class",school=name(item.schoolId,"AIFT school"),chips=[item.subject||item.category,item.level].filter(Boolean);return`<button class="course" type="button" onclick="location.href='class-view.html?classId=${encodeURIComponent(id(item))}&from=learning'"><div class="cover">${cover?`<img src="${esc(cover)}" alt="">`:'<span class="cover-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path></svg></span>'}${item.learningSettings?.certificatesEnabled?'<span class="certificate">Certificate</span>':""}</div><div class="course-body"><h3>${esc(title)}</h3><p class="provider">${esc(school)}</p><div class="meta">${chips.map(chip=>`<span class="chip">${esc(chip)}</span>`).join("")}</div></div></button>`}).join("")}
    async function load(){try{const response=await fetch(`${API}/api/classes/discover?limit=60`,{headers:{Accept:"application/json",Authorization:`Bearer ${token()}`}}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"Courses could not be loaded");state.items=Array.isArray(data)?data:data.classes||[];const categories=[...new Set(state.items.map(item=>String(item.subject||item.category||"").trim()).filter(Boolean))].sort();document.getElementById("category").innerHTML='<option value="">All subjects</option>'+categories.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("");render()}catch(error){document.getElementById("grid").innerHTML=`<div class="state"><h3>Unable to load courses</h3><p>${esc(error.message)}</p></div>`}}
    function init(){if(!token()){location.replace("login.html");return}applyTheme(localStorage.getItem("aiftLearningTheme"));notifyChrome(true);addEventListener("pagehide",()=>notifyChrome(false),{once:true});const params=new URLSearchParams(location.search),search=document.getElementById("search");search.value=params.get("q")||"";state.query=search.value;search.addEventListener("input",event=>{state.query=event.target.value;render()});document.getElementById("category").addEventListener("change",event=>{state.category=event.target.value;render()});if(params.get("focus")==="search")setTimeout(()=>search.focus(),250);load()}
    init();
  </script>
</body>
</html>
