<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>AIFT | Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="messages.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

<div id="toast" class="toast"></div>

<div id="messageActionBar" class="message-action-bar hidden">
  <button onclick="replyToSelected()">Reply</button>
  <button onclick="copySelectedMessage()">Copy</button>
  <button onclick="deleteSelectedFromView()">Delete</button>
  <button onclick="clearSelectedMessage()">Cancel</button>
</div>

<div id="appShell" class="messages-shell">

  <aside id="sidebar" class="sidebar">

    <header class="sidebar-header">
      <div class="brand-row">
        <a href="home.html" class="brand">
          <img src="images/aift-logo.png" alt="AIFT">
        </a>

        <button class="icon-btn" onclick="focusUserSearch()" title="New chat">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>

        <input
          id="userSearchInput"
          type="search"
          placeholder="Search people or companies"
          autocomplete="off"
        >
      </div>

      <div id="searchResults" class="search-results hidden"></div>
    </header>

    <div class="conversation-tabs">
      <button class="active" onclick="setConversationFilter('all', this)">All</button>
      <button onclick="setConversationFilter('unread', this)">Unread</button>
      <button onclick="setConversationFilter('pinned', this)">Pinned</button>
    </div>

    <section id="conversationList" class="conversation-list">
      <div class="loading-card">Loading conversations...</div>
    </section>

  </aside>

  <main class="chat-panel">

    <header class="chat-header">

      <div class="chat-user-wrap">

        <button class="mobile-back" onclick="showSidebar()">
          <svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <img id="activeUserImage" class="chat-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">

        <div class="chat-user-info">
          <h1 id="activeUserName">Messages</h1>
          <p id="activeUserStatus">Select a conversation</p>
        </div>

      </div>

      <div class="chat-actions">

        <button class="icon-btn" onclick="startAudioCall()" title="Audio call">
          <svg viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6.04-6.04A19.8 19.8 0 0 1 2.08 4.09 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.63 2.62a2 2 0 0 1-.45 2.11L8 9.94a16 16 0 0 0 6.06 6.06l1.49-1.24a2 2 0 0 1 2.11-.45c.84.3 1.72.51 2.62.63A2 2 0 0 1 22 16.92z"/>
          </svg>
        </button>

        <button class="icon-btn" onclick="startVideoCall()" title="Video call">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="6" width="13" height="12" rx="2"></rect>
            <path d="M16 10l5-3v10l-5-3z"></path>
          </svg>
        </button>

        <button class="icon-btn" onclick="openChatInfo()" title="Chat info">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
        </button>

      </div>

    </header>

    <section id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 5h16v11H7l-3 3V5z"></path>
          </svg>
        </div>

        <h2>Your AIFT messages</h2>
        <p>
          Start private conversations with students, employers, schools,
          recruiters, teachers, and job seekers.
        </p>

        <button onclick="focusUserSearch()">Start new chat</button>
      </div>
    </section>

    <section id="messagesBox" class="messages-box hidden"></section>

    <section id="replyBar" class="reply-bar hidden">
      <div>
        <strong id="replyTitle">Replying</strong>
        <p id="replyText"></p>
      </div>

      <button onclick="clearReply()">
        <svg viewBox="0 0 24 24">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
      </button>
    </section>

    <section id="attachmentPreview" class="attachment-preview hidden"></section>

    <footer class="composer">

      <button class="composer-btn" onclick="toggleAttachmentMenu()" title="Attach">
        <svg viewBox="0 0 24 24">
          <path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.19 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/>
        </svg>
      </button>

      <div id="attachmentMenu" class="attachment-menu hidden">
        <button onclick="chooseAttachment('image')">Image</button>
        <button onclick="chooseAttachment('video')">Video</button>
        <button onclick="chooseAttachment('audio')">Audio</button>
        <button onclick="chooseAttachment('document')">Document</button>
      </div>

      <input id="fileInput" type="file" hidden>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Write a message"
      ></textarea>

      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <path d="M22 2L11 13"></path>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      </button>

    </footer>

  </main>

</div>

<script src="messages.js"></script>
</body>
</html>
