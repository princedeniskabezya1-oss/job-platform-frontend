<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>AIFT | Messages</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/princedeniskabezya1-oss/job-platform-frontend/a488d1fe1b5247a4ac48e392d76e40da82a39f6b/messages.html',{cache:'no-store'});if(!r.ok)throw new Error('Unable to load Messages');let html=await r.text();
const gestureCode=`function storyDistance(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}
function storyAngle(a,b){return Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)*180/Math.PI}
function storyNormalizeRotation(value){let n=Number(value)||0;while(n>180)n-=360;while(n<-180)n+=360;return n}

function bindStoryLayerDrag(){document.querySelectorAll('[data-story-layer]').forEach(node=>{const pointers=new Map();let start=null,moved=false;node.style.touchAction='none';node.onpointerdown=event=>{event.stopPropagation();const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer),preview=document.getElementById('storyPreview');if(!item||!preview)return;storyState.selectedElement=item.id;syncStoryInspector();moved=false;pointers.set(event.pointerId,event);node.setPointerCapture?.(event.pointerId);if(pointers.size===1)start={x:item.x,y:item.y,clientX:event.clientX,clientY:event.clientY,scale:item.scale||1,rotation:item.rotation||0};if(pointers.size===2){event.preventDefault();moved=true;const pts=[...pointers.values()];start={x:item.x,y:item.y,midX:(pts[0].clientX+pts[1].clientX)/2,midY:(pts[0].clientY+pts[1].clientY)/2,distance:storyDistance(pts[0],pts[1]),angle:storyAngle(pts[0],pts[1]),scale:item.scale||1,rotation:item.rotation||0};}};
node.onpointermove=event=>{if(!pointers.has(event.pointerId)||!start)return;pointers.set(event.pointerId,event);const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer),preview=document.getElementById('storyPreview');if(!item||!preview)return;const rect=preview.getBoundingClientRect(),pts=[...pointers.values()],travel=Math.hypot(event.clientX-(start.clientX??event.clientX),event.clientY-(start.clientY??event.clientY));if(pts.length>=2||travel>5){event.preventDefault();moved=true;}if(pts.length>=2){const midX=(pts[0].clientX+pts[1].clientX)/2,midY=(pts[0].clientY+pts[1].clientY)/2;item.x=Math.max(3,Math.min(97,start.x+((midX-start.midX)/rect.width)*100));item.y=Math.max(3,Math.min(97,start.y+((midY-start.midY)/rect.height)*100));item.scale=Math.max(.35,Math.min(5,start.scale*(storyDistance(pts[0],pts[1])/Math.max(1,start.distance))));item.rotation=storyNormalizeRotation(start.rotation+(storyAngle(pts[0],pts[1])-start.angle));}else if(moved){item.x=Math.max(3,Math.min(97,start.x+((event.clientX-start.clientX)/rect.width)*100));item.y=Math.max(3,Math.min(97,start.y+((event.clientY-start.clientY)/rect.height)*100));}node.style.left=item.x+'%';node.style.top=item.y+'%';node.style.transform='translate(-50%,-50%) scale('+item.scale+') rotate('+item.rotation+'deg)';};
const end=event=>{const wasMoved=moved;pointers.delete(event.pointerId);try{node.releasePointerCapture?.(event.pointerId)}catch{}const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer);if(pointers.size===1&&item){const p=[...pointers.values()][0];start={x:item.x,y:item.y,clientX:p.clientX,clientY:p.clientY,scale:item.scale||1,rotation:item.rotation||0};}else if(!pointers.size){start=null;syncStoryInspector();if(!wasMoved&&item&&(item.kind==='text'||item.kind==='caption')){const editor=document.getElementById('storyText'),composer=document.getElementById('storyComposer');if(editor){editor.value=item.text||'';composer?.classList.add('story-text-editing');requestAnimationFrame(()=>{editor.focus({preventScroll:true});editor.setSelectionRange?.(editor.value.length,editor.value.length);});}}}};node.onpointerup=end;node.onpointercancel=end;});}`;

const mediaGesture=`function bindStoryMediaGestures(){const node=document.querySelector('#storyPreview [data-story-media]'),preview=document.getElementById('storyPreview');if(!node||!preview)return;const pointers=new Map();let start=null,moved=false;node.style.touchAction='none';const clampPan=()=>{const t=storyState.mediaTransform,rect=preview.getBoundingClientRect(),maxX=rect.width*Math.max(.12,(t.scale-1)*.55+.12),maxY=rect.height*Math.max(.08,(t.scale-1)*.55+.08);t.x=Math.max(-maxX,Math.min(maxX,t.x));t.y=Math.max(-maxY,Math.min(maxY,t.y));};const apply=()=>{const t=storyState.mediaTransform||{x:0,y:0,scale:1,rotation:0};clampPan();node.style.transform='translate('+t.x+'px,'+t.y+'px) scale('+t.scale+') rotate('+t.rotation+'deg)';};node.onpointerdown=e=>{if(document.getElementById('storyComposer')?.classList.contains('story-text-editing')){e.preventDefault();e.stopPropagation();storyFinishTextEditing();return;}e.preventDefault();e.stopPropagation();moved=false;pointers.set(e.pointerId,e);node.setPointerCapture?.(e.pointerId);const t=storyState.mediaTransform;if(pointers.size===1)start={x:t.x,y:t.y,clientX:e.clientX,clientY:e.clientY,scale:t.scale,rotation:t.rotation};if(pointers.size===2){moved=true;const p=[...pointers.values()];start={x:t.x,y:t.y,midX:(p[0].clientX+p[1].clientX)/2,midY:(p[0].clientY+p[1].clientY)/2,distance:storyDistance(p[0],p[1]),angle:storyAngle(p[0],p[1]),scale:t.scale,rotation:t.rotation};}};node.onpointermove=e=>{if(!pointers.has(e.pointerId)||!start)return;e.preventDefault();pointers.set(e.pointerId,e);const p=[...pointers.values()],t=storyState.mediaTransform;if(p.length>=2){moved=true;const mx=(p[0].clientX+p[1].clientX)/2,my=(p[0].clientY+p[1].clientY)/2;t.x=start.x+(mx-start.midX);t.y=start.y+(my-start.midY);t.scale=Math.max(1,Math.min(5,start.scale*(storyDistance(p[0],p[1])/Math.max(1,start.distance))));t.rotation=storyNormalizeRotation(start.rotation+(storyAngle(p[0],p[1])-start.angle));}else if(Math.hypot(e.clientX-start.clientX,e.clientY-start.clientY)>5){moved=true;t.x=start.x+(e.clientX-start.clientX);t.y=start.y+(e.clientY-start.clientY);}apply();};const end=e=>{pointers.delete(e.pointerId);try{node.releasePointerCapture?.(e.pointerId)}catch{}if(pointers.size===1){const p=[...pointers.values()][0],t=storyState.mediaTransform;start={x:t.x,y:t.y,clientX:p.clientX,clientY:p.clientY,scale:t.scale,rotation:t.rotation};}else{start=null;apply();}};node.onpointerup=end;node.onpointercancel=end;}
async function prepareStoryMediaForUpload(){if(!storyState.file||!storyState.file.type.startsWith('image/'))return storyState.file;const t=storyState.mediaTransform||{x:0,y:0,scale:1,rotation:0};if(Math.abs(t.x)<1&&Math.abs(t.y)<1&&Math.abs(t.scale-1)<.001&&Math.abs(t.rotation)<.1)return storyState.file;const image=new Image();image.src=storyState.objectUrl||URL.createObjectURL(storyState.file);await image.decode();const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const cover=Math.max(canvas.width/image.width,canvas.height/image.height),w=image.width*cover,h=image.height*cover,preview=document.getElementById('storyPreview'),pw=Math.max(1,preview?.clientWidth||canvas.width),ph=Math.max(1,preview?.clientHeight||canvas.height);ctx.save();ctx.translate(canvas.width/2+t.x*(canvas.width/pw),canvas.height/2+t.y*(canvas.height/ph));ctx.rotate(t.rotation*Math.PI/180);ctx.scale(t.scale,t.scale);ctx.drawImage(image,-w/2,-h/2,w,h);ctx.restore();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));return blob?new File([blob],storyState.file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}):storyState.file;}`;

const comfort=`<style>#storyComposer .story-compose-preview:before,#storyComposer .story-compose-preview:after{display:none!important;content:none!important}#storyComposer .story-compose-preview{background:#000!important}#storyComposer .story-compose-preview [data-story-media]{filter:none!important;-webkit-filter:none!important;user-select:none!important;-webkit-user-drag:none!important}#storyComposer .story-compose-card>textarea+.story-compose-controls+.story-compose-controls{opacity:0!important;pointer-events:none!important}#storyComposer.story-text-editing .story-compose-card>textarea+.story-compose-controls+.story-compose-controls{opacity:1!important;pointer-events:auto!important}#storyComposer:not(.story-text-editing)>.story-compose-card>textarea{pointer-events:none!important;opacity:0!important}#storyComposer.story-text-editing>.story-compose-card>textarea{pointer-events:auto!important;opacity:1!important}</style><script>(function(){function finish(){if(typeof storyFinishTextEditing==='function')storyFinishTextEditing();}document.addEventListener('pointerdown',function(e){const composer=document.getElementById('storyComposer');if(!composer||composer.classList.contains('hidden'))return;const preview=e.target.closest('#storyPreview');if(preview&&!e.target.closest('[data-story-layer]')&&!e.target.closest('[data-story-media]'))finish();},true);document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('storyComposer')?.classList.contains('story-text-editing'))finish();});document.addEventListener('focusin',function(e){if(e.target?.id==='storyText')document.getElementById('storyComposer')?.classList.add('story-text-editing');});document.addEventListener('focusout',function(e){if(e.target?.id==='storyText')setTimeout(()=>document.getElementById('storyComposer')?.classList.remove('story-text-editing'),0);});})();<\/script>`;
