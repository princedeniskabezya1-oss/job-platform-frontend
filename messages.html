<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>AIFT | Messages</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/princedeniskabezya1-oss/job-platform-frontend/a488d1fe1b5247a4ac48e392d76e40da82a39f6b/messages.html',{cache:'no-store'});if(!r.ok)throw new Error('Unable to load Messages');let html=await r.text();
const gestureCode=`function storyDistance(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)}
function storyAngle(a,b){return Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)*180/Math.PI}
function bindStoryLayerDrag(){document.querySelectorAll('[data-story-layer]').forEach(node=>{const pointers=new Map();let start=null;node.onpointerdown=event=>{event.preventDefault();event.stopPropagation();const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer),preview=document.getElementById('storyPreview');if(!item||!preview)return;storyState.selectedElement=item.id;syncStoryInspector();pointers.set(event.pointerId,event);node.setPointerCapture?.(event.pointerId);if(pointers.size===1)start={x:item.x,y:item.y,clientX:event.clientX,clientY:event.clientY,scale:item.scale||1,rotation:item.rotation||0};if(pointers.size===2){const pts=[...pointers.values()];start={x:item.x,y:item.y,midX:(pts[0].clientX+pts[1].clientX)/2,midY:(pts[0].clientY+pts[1].clientY)/2,distance:storyDistance(pts[0],pts[1]),angle:storyAngle(pts[0],pts[1]),scale:item.scale||1,rotation:item.rotation||0};}}
node.onpointermove=event=>{if(!pointers.has(event.pointerId)||!start)return;pointers.set(event.pointerId,event);const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer),preview=document.getElementById('storyPreview');if(!item||!preview)return;const rect=preview.getBoundingClientRect(),pts=[...pointers.values()];if(pts.length>=2){const midX=(pts[0].clientX+pts[1].clientX)/2,midY=(pts[0].clientY+pts[1].clientY)/2;item.x=Math.max(0,Math.min(100,start.x+((midX-start.midX)/rect.width)*100));item.y=Math.max(0,Math.min(100,start.y+((midY-start.midY)/rect.height)*100));item.scale=Math.max(.4,Math.min(4,start.scale*(storyDistance(pts[0],pts[1])/Math.max(1,start.distance))));item.rotation=start.rotation+(storyAngle(pts[0],pts[1])-start.angle);}else{item.x=Math.max(0,Math.min(100,start.x+((event.clientX-start.clientX)/rect.width)*100));item.y=Math.max(0,Math.min(100,start.y+((event.clientY-start.clientY)/rect.height)*100));}node.style.left=item.x+'%';node.style.top=item.y+'%';node.style.transform='translate(-50%,-50%) scale('+item.scale+') rotate('+item.rotation+'deg)';};
const end=event=>{pointers.delete(event.pointerId);try{node.releasePointerCapture?.(event.pointerId)}catch{}const item=storyState.elements.find(entry=>entry.id===node.dataset.storyLayer);if(pointers.size===1&&item){const p=[...pointers.values()][0];start={x:item.x,y:item.y,clientX:p.clientX,clientY:p.clientY,scale:item.scale||1,rotation:item.rotation||0};}else if(!pointers.size){start=null;syncStoryInspector();}};node.onpointerup=end;node.onpointercancel=end;});}`;
html=html.replace(/function bindStoryLayerDrag\(\)\{[\s\S]*?\}\nwindow\.openStoryTagSearch=/,gestureCode+'\nwindow.openStoryTagSearch=');
html=html.replace("music:{startAt:0,duration:15,volume:1,muted:false}","mediaTransform:{x:0,y:0,scale:1,rotation:0},music:{startAt:0,duration:15,volume:1,muted:false}");
html=html.replace("storyState.music={startAt:0,duration:15,volume:1,muted:false};","storyState.mediaTransform={x:0,y:0,scale:1,rotation:0};storyState.music={startAt:0,duration:15,volume:1,muted:false};");
html=html.replace("media=storyState.file.type.startsWith('video/')?`<video src=\"${escapeHtml(storyState.objectUrl)}\" autoplay loop muted playsinline></video>`:`<img src=\"${escapeHtml(storyState.objectUrl)}\" alt=\"Story preview\">`;","const mt=storyState.mediaTransform||{x:0,y:0,scale:1,rotation:0};const mediaStyle=`transform:translate(${mt.x}px,${mt.y}px) scale(${mt.scale}) rotate(${mt.rotation}deg);transform-origin:center;touch-action:none;`;media=storyState.file.type.startsWith('video/')?`<video data-story-media src=\"${escapeHtml(storyState.objectUrl)}\" style=\"${mediaStyle}\" autoplay loop muted playsinline></video>`:`<img data-story-media src=\"${escapeHtml(storyState.objectUrl)}\" style=\"${mediaStyle}\" alt=\"Story preview\">`;");
html=html.replace("preview.innerHTML=media+layers;bindStoryLayerDrag();","preview.innerHTML=media+layers;bindStoryLayerDrag();bindStoryMediaGestures();");
const mediaGesture=`function bindStoryMediaGestures(){const node=document.querySelector('#storyPreview [data-story-media]'),preview=document.getElementById('storyPreview');if(!node||!preview)return;const pointers=new Map();let start=null;const apply=()=>{const t=storyState.mediaTransform||{x:0,y:0,scale:1,rotation:0};node.style.transform='translate('+t.x+'px,'+t.y+'px) scale('+t.scale+') rotate('+t.rotation+'deg)';};node.onpointerdown=e=>{e.preventDefault();pointers.set(e.pointerId,e);node.setPointerCapture?.(e.pointerId);const t=storyState.mediaTransform;if(pointers.size===1)start={x:t.x,y:t.y,clientX:e.clientX,clientY:e.clientY,scale:t.scale,rotation:t.rotation};if(pointers.size===2){const p=[...pointers.values()];start={x:t.x,y:t.y,midX:(p[0].clientX+p[1].clientX)/2,midY:(p[0].clientY+p[1].clientY)/2,distance:storyDistance(p[0],p[1]),angle:storyAngle(p[0],p[1]),scale:t.scale,rotation:t.rotation};}};node.onpointermove=e=>{if(!pointers.has(e.pointerId)||!start)return;pointers.set(e.pointerId,e);const p=[...pointers.values()],t=storyState.mediaTransform;if(p.length>=2){const mx=(p[0].clientX+p[1].clientX)/2,my=(p[0].clientY+p[1].clientY)/2;t.x=start.x+(mx-start.midX);t.y=start.y+(my-start.midY);t.scale=Math.max(1,Math.min(5,start.scale*(storyDistance(p[0],p[1])/Math.max(1,start.distance))));t.rotation=start.rotation+(storyAngle(p[0],p[1])-start.angle);}else{t.x=start.x+(e.clientX-start.clientX);t.y=start.y+(e.clientY-start.clientY);}apply();};const end=e=>{pointers.delete(e.pointerId);try{node.releasePointerCapture?.(e.pointerId)}catch{}if(pointers.size===1){const p=[...pointers.values()][0],t=storyState.mediaTransform;start={x:t.x,y:t.y,clientX:p.clientX,clientY:p.clientY,scale:t.scale,rotation:t.rotation};}else start=null;};node.onpointerup=end;node.onpointercancel=end;}
async function prepareStoryMediaForUpload(){if(!storyState.file||!storyState.file.type.startsWith('image/'))return storyState.file;const t=storyState.mediaTransform||{x:0,y:0,scale:1,rotation:0};if(Math.abs(t.x)<1&&Math.abs(t.y)<1&&Math.abs(t.scale-1)<.001&&Math.abs(t.rotation)<.1)return storyState.file;const image=new Image();image.src=storyState.objectUrl||URL.createObjectURL(storyState.file);await image.decode();const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const cover=Math.max(canvas.width/image.width,canvas.height/image.height),w=image.width*cover,h=image.height*cover;ctx.save();ctx.translate(canvas.width/2+t.x*(canvas.width/Math.max(1,document.getElementById('storyPreview')?.clientWidth||canvas.width),canvas.height/2+t.y*(canvas.height/Math.max(1,document.getElementById('storyPreview')?.clientHeight||canvas.height)));ctx.rotate(t.rotation*Math.PI/180);ctx.scale(t.scale,t.scale);ctx.drawImage(image,-w/2,-h/2,w,h);ctx.restore();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));return blob?new File([blob],storyState.file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}):storyState.file;}`;
html=html.replace("window.openStoryTagSearch=",mediaGesture+'\nwindow.openStoryTagSearch=');
html=html.replace("if(storyState.file)form.append('file',storyState.file);","if(storyState.file){const uploadFile=await prepareStoryMediaForUpload();form.append('file',uploadFile);}");
document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<main style="font-family:Arial,sans-serif;padding:24px"><h1>Messages</h1><p>Unable to load Messages. Please refresh.</p></main>';}})();</script></body></html>
