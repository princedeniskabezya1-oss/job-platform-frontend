function bindPanels(){const sp=document.getElementById('aiftStoryStylePanel'),mp=document.getElementById('aiftStoryMusicPanel');sp.querySelector('[data-story-style-done]').onclick=()=>{sp.classList.add('hidden');storyFinishTextEditing();};sp.querySelectorAll('[data-story-font]').forEach(b=>b.onclick=()=>{const i=selected();if(i){i.font=b.dataset.storyFont;document.getElementById('storyFont').value=[...document.getElementById('storyFont').options].some(o=>o.value===i.font)?i.font:document.getElementById('storyFont').value;paintText(i);syncPanel();}});sp.querySelectorAll('[data-story-style]').forEach(b=>b.onclick=()=>{const i=selected();if(i){i.style=b.dataset.storyStyle;paintText(i);syncPanel();}});sp.querySelectorAll('[data-story-color]').forEach(b=>b.onclick=()=>{const i=selected();if(i){i.color=b.dataset.storyColor;const c=document.getElementById('storyColor');if(c)c.value=i.color;paintText(i);}});sp.querySelectorAll('[data-story-bg]').forEach(b=>b.onclick=()=>{const i=selected();if(i){i.background=b.dataset.storyBg;paintText(i);syncPanel();}});sp.querySelector('[data-story-align]').onclick=()=>{const i=selected();if(!i)return;const values=['left','center','right'];i.align=values[(values.indexOf(i.align||'center')+1)%values.length];paintText(i);};sp.querySelector('[data-story-size]').oninput=e=>{const i=selected();if(!i)return;i.fontSize=Math.max(12,Math.min(120,Number(e.target.value)||34));const size=document.getElementById('storyFontSize');if(size)size.value=String(i.fontSize);sp.querySelector('[data-story-size-label]').textContent=String(Math.round(i.fontSize));paintText(i);};mp.querySelector('[data-story-music-done]').onclick=()=>mp.classList.add('hidden');mp.querySelector('[data-story-music-start]').oninput=syncMusic;mp.querySelector('[data-story-music-length]').oninput=syncMusic;mp.querySelector('[data-story-music-preview]').ontimeupdate=e=>{const end=(storyState.music.startAt||0)+(storyState.music.duration||15);if(e.target.currentTime>=end){e.target.currentTime=storyState.music.startAt||0;e.target.play().catch(()=>{});}};}
function enhance(){ensurePanels();document.querySelectorAll('#storyComposer button').forEach(btn=>{if(btn.dataset.aiftBound)return;const label=(btn.textContent||'').trim().toLowerCase();if(label==='text'||label==='caption'){btn.dataset.aiftBound='1';btn.addEventListener('click',()=>setTimeout(openStyle,40));}if(label==='music'){btn.dataset.aiftBound='1';btn.addEventListener('click',()=>setTimeout(openMusic,120));}});document.querySelectorAll('[data-story-layer]').forEach(n=>{const i=storyState.elements.find(e=>e.id===n.dataset.storyLayer);paintText(i);});}
const oldRender=window.renderStoryComposerPreview;if(typeof oldRender==='function')window.renderStoryComposerPreview=function(){const out=oldRender.apply(this,arguments);setTimeout(enhance,0);return out;};document.addEventListener('change',e=>{if(e.target?.id==='storyMusicInput'||e.target?.accept?.includes?.('audio'))setTimeout(openMusic,120);},true);document.addEventListener('pointerdown',e=>{const composer=document.getElementById('storyComposer');if(!composer||composer.classList.contains('hidden'))return;const preview=e.target.closest('#storyPreview');if(preview&&!e.target.closest('[data-story-layer]')&&!e.target.closest('[data-story-media]')){if(typeof storyFinishTextEditing==='function')storyFinishTextEditing();document.getElementById('aiftStoryStylePanel')?.classList.add('hidden');}},true);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('storyComposer')?.classList.contains('story-text-editing')&&typeof storyFinishTextEditing==='function')storyFinishTextEditing();});document.addEventListener('focusin',e=>{if(e.target?.id==='storyText'){document.getElementById('storyComposer')?.classList.add('story-text-editing');setTimeout(openStyle,0);}});document.addEventListener('focusout',e=>{if(e.target?.id==='storyText')setTimeout(()=>document.getElementById('storyComposer')?.classList.remove('story-text-editing'),0);});setTimeout(enhance,250);})();<\/script>`;
