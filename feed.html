<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AIFT | Feed</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="feed.css" />

  <style>
    body{
      margin:0;
      background:#f3f2ef;
      font-family:Inter,Arial,sans-serif;
    }

    .feed-page{
      width:min(680px,calc(100% - 24px));
      margin:16px auto 48px;
    }

    .feed-topbar{
      position:sticky;
      top:0;
      z-index:50;
      background:#fff;
      border-bottom:1px solid #d8d8d8;
    }

    .feed-topbar-inner{
      width:min(1128px,calc(100% - 24px));
      height:58px;
      margin:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .feed-logo{
      width:34px;
      height:34px;
      border-radius:8px;
      background:#0a66c2;
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
    }

    .feed-title strong{
      display:block;
      font-size:14px;
    }

    .feed-title span{
      display:block;
      color:#666;
      font-size:12px;
    }
  </style>
</head>

<body>
  <header class="feed-topbar">
    <div class="feed-topbar-inner">
      <div class="feed-logo">A</div>
      <div class="feed-title">
        <strong>AIFT Feed</strong>
        <span>Shared feed system</span>
      </div>
    </div>
  </header>

  <main class="feed-page">
    <div id="aiftFeed"></div>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="feed.js"></script>

  <script>
    AIFTFeed.mount("aiftFeed", {
      mode: "home",
      showComposer: true,
      infiniteScroll: true,
      realtime: true
    });
  </script>
</body>
</html>
