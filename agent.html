<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard | AIFT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
:root{
  --primary:#0a66c2;
  --primary-dark:#004182;
  --green:#16a34a;
  --red:#ef4444;
  --yellow:#f59e0b;
  --bg:#f3f2ef;
  --card:#ffffff;
  --text:#191919;
  --muted:#64748b;
  --border:#d8d8d8;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);
}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#111827;
  color:white;
  height:100vh;
  padding:22px 16px;
  position:fixed;
  transition:0.3s ease;
  z-index:1000;
}
.sidebar h2{
  margin:0 0 24px;
  font-size:18px;
  letter-spacing:-.02em;
}
.sidebar .agent-small{
  color:#cbd5e1;
  font-size:12px;
  line-height:1.45;
  margin-bottom:18px;
}
.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  margin-bottom:6px;
  border-radius:10px;
  cursor:pointer;
  color:#cbd5e1;
  text-decoration:none;
  transition:0.2s;
  font-weight:700;
  font-size:14px;
}
.sidebar a:hover{background:#1f2937;color:white;}
.sidebar a.active{background:var(--primary);color:white;}
.sidebar.hidden{transform:translateX(0);}

.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:900;
}
.overlay.active{display:block;}

/* MAIN */
.main{
  margin-left:260px;
  padding:20px;
  width:100%;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  box-shadow:var(--shadow);
}
.hamburger{
  display:none;
  font-size:24px;
  cursor:pointer;
}
.topbar h1{
  font-size:20px;
  margin:0;
  font-weight:800;
  letter-spacing:-.02em;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.agent-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:999px;
  background:#eef3f8;
  color:#334155;
  font-size:12px;
  font-weight:800;
}
.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#94a3b8;
}
.status-dot.online{
  background:var(--green);
  box-shadow:0 0 0 4px rgba(22,163,74,.12);
}
.status-dot.offline{background:#94a3b8;}

button{
  padding:8px 13px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  transition:.2s ease;
}
button:hover{transform:translateY(-1px);}
.primary{background:var(--primary);color:white;}
.primary:hover{background:var(--primary-dark);}
.success{background:var(--green);color:white;}
.logout{background:#fee2e2;color:#991b1b;}
.soft{background:#fff;color:var(--primary);border:1px solid var(--primary);}
.gray{background:#eef3f8;color:#334155;}

/* CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
  margin-bottom:14px;
}
.card{
  background:white;
  padding:18px;
  border-radius:12px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:0.25s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.09);}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;}
.card p{font-size:22px;font-weight:800;margin:0;}
.card small{display:block;margin-top:6px;color:var(--muted);line-height:1.45;}

.grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:14px;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.section-head h2{
  margin:0;
  font-size:17px;
}
.section-head p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted);
}
.table-wrapper{overflow-x:auto;}
table{
  width:100%;
  border-collapse:collapse;
  min-width:680px;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eef2f7;
  text-align:left;
  font-size:13px;
}
th{
  background:#f8fafc;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#64748b;
}
tr:hover td{background:#f8fbff;}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:900;
}
.badge.green{background:#dcfce7;color:#166534;}
.badge.red{background:#fee2e2;color:#991b1b;}
.badge.blue{background:#e0f2fe;color:#075985;}
.badge.yellow{background:#fef3c7;color:#92400e;}

.task-card,.schedule-card{
  border:1px solid #eef2f7;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  background:#fff;
}
.task-card h4,.schedule-card h4{
  margin:0 0 6px;
  font-size:14px;
}
.task-card p,.schedule-card p{
  margin:0;
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}
.actions-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.notice{
  padding:12px 14px;
  border-radius:12px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  font-size:13px;
  line-height:1.55;
  margin-bottom:14px;
}
.empty{
  padding:18px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:12px;
  background:#fff;
}
.timer{
  font-size:34px;
  font-weight:900;
  letter-spacing:-.04em;
  margin:8px 0;
}
.timeline{
  display:grid;
  gap:10px;
}
.timeline-item{
  border-left:3px solid var(--primary);
  padding:8px 0 8px 12px;
}
.timeline-item b{
  display:block;
  font-size:13px;
}
.timeline-item span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.active{transform:translateX(0);}
  .sidebar.hidden{transform:translateX(-100%);}
  .main{margin-left:0;padding:12px;}
  .hamburger{display:block;}
  .grid{grid-template-columns:1fr;}
  .topbar{align-items:flex-start;}
}
@media(max-width:640px){
  .topbar{flex-direction:column;align-items:stretch;}
  .topbar-right{width:100%;}
  .topbar-right button{flex:1;}
  .stats{grid-template-columns:1fr 1fr;}
  .timer{font-size:28px;}
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar hidden" id="sidebar">
  <h2>AIFT Agent</h2>
  <div class="agent-small" id="sidebarAgent">Loading agent...</div>

  <a onclick="showSection('dashboard')" class="active">Dashboard</a>
  <a onclick="showSection('schedule')">My Schedule</a>
  <a onclick="showSection('tasks')">My Tasks</a>
  <a onclick="showSection('activity')">Login / Logout</a>
  <a onclick="showSection('referrals')">My Referrals</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="hamburger" onclick="toggleSidebar()">☰</span>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div style="font-size:12px;color:#64748b;margin-top:3px;">Agent workspace connected to schedules, tasks, and activity tracking.</div>
      </div>
    </div>

    <div class="topbar-right">
      <span class="agent-pill"><span class="status-dot" id="liveDot"></span><span id="liveStatusText">Offline</span></span>
      <button class="success" onclick="clockIn()">Clock In</button>
      <button class="logout" onclick="clockOut()">Clock Out</button>
      <button class="gray" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
const API="https://backend-1-9b6f.onrender.com";

/* ===============================
   TOKEN SYSTEM (FIXED)
================================ */

function getToken(){
  return (
    localStorage.getItem("agentToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("token")
  );
}

let token = getToken();

if(!token){
  window.location.href="login.html";
}

function authHeaders(extra={}){
  return {
    Authorization: "Bearer " + getToken(),
    ...extra
  };
}

/* ===============================
   GLOBAL STATE
================================ */

let agentData=null;
let activeSession=null;

/* ===============================
   LOAD USER
================================ */

async function loadMe(){
  try{
    agentData = await fetch(API+"/api/auth/me",{
      headers: authHeaders()
    }).then(r=>r.json());

    document.getElementById("sidebarAgent").innerHTML = `
      <b>${agentData.name || "User"}</b><br>
      ${agentData.email || ""}
    `;

  }catch(e){
    console.error(e);
  }
}

/* ===============================
   CLOCK IN / OUT (FIXED)
================================ */

async function clockIn(){
  try{
    await fetch(`${API}/api/agent-sessions/clock-in`,{
      method:"POST",
      headers: authHeaders()
    });

    loadSession();

  }catch(e){
    console.error("ClockIn Error:", e);
  }
}

async function clockOut(){
  try{
    await fetch(`${API}/api/agent-sessions/clock-out`,{
      method:"POST",
      headers: authHeaders()
    });

    loadSession();

  }catch(e){
    console.error("ClockOut Error:", e);
  }
}

/* ===============================
   LOAD SESSION
================================ */

async function loadSession(){
  try{
    const sessions = await fetch(`${API}/api/agent-sessions/me`,{
      headers: authHeaders()
    }).then(r=>r.json());

    activeSession = sessions.find(s => !s.logoutTime);

    updateStatus();

  }catch(e){
    console.error(e);
  }
}

/* ===============================
   STATUS UI
================================ */

function updateStatus(){
  const dot = document.getElementById("liveDot");
  const text = document.getElementById("liveStatusText");

  if(activeSession){
    dot.className = "status-dot online";
    text.innerText = "Online";
  }else{
    dot.className = "status-dot offline";
    text.innerText = "Offline";
  }
}

/* ===============================
   TASKS (FIXED)
================================ */

async function loadTasks(){
  try{
    const data = await fetch(`${API}/api/work-tasks`,{
      headers: authHeaders()
    }).then(r=>r.json());

    renderTasks(data);

  }catch(e){
    console.error(e);
  }
}

function renderTasks(tasks){
  const content = document.getElementById("content");

  content.innerHTML = `
    <div class="card">
      <h2>My Tasks</h2>

      ${tasks.map(t=>`
        <div class="task-card">
          <h4>${t.title}</h4>
          <p>${t.category}</p>

          <button onclick="updateTask('${t._id}','done')">Complete</button>
        </div>
      `).join("")}

    </div>
  `;
}

async function updateTask(id,status){
  await fetch(`${API}/api/work-tasks/${id}`,{
    method:"PATCH",
    headers: authHeaders({"Content-Type":"application/json"}),
    body: JSON.stringify({status})
  });

  loadTasks();
}

/* ===============================
   NAVIGATION
================================ */

function showSection(section){
  document.getElementById("pageTitle").innerText = section;

  if(section==="tasks"){
    loadTasks();
  }

  if(section==="activity"){
    loadSession();
  }
}

/* ===============================
   LOGOUT
================================ */

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}

/* ===============================
   INIT
================================ */

(async function(){
  await loadMe();
  await loadSession();
})();
  </script>
</body>
</html>
