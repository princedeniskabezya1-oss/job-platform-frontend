<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Dashboard | AIFT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="agent-mobile.css">

<style>
*{box-sizing:border-box}
:root{
  --primary:#0a66c2;
  --primary-dark:#004182;
  --green:#16a34a;
  --red:#ef4444;
  --yellow:#f59e0b;
  --bg:#f3f2ef;
  --card:#ffffff;
  --text:#191919;
  --muted:#64748b;
  --border:#d8d8d8;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);
}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:260px;
  background:#fff;
  color:#172033;
  height:100vh;
  padding:18px 14px;
  position:fixed;
  border-right:1px solid #e4eaf2;
  box-shadow:none;
  transition:.3s ease;
  z-index:1000;
}

.agent-brand{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 8px 16px;
  margin-bottom:12px;
  border-bottom:1px solid #eef2f7;
}

.agent-brand img{
  width:105px;
  height:auto;
  object-fit:contain;
}

.agent-small{
  background:#f8fafc;
  border:1px solid #e4eaf2;
  border-radius:14px;
  color:#667085;
  font-size:12px;
  line-height:1.45;
  padding:12px;
  margin-bottom:14px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 13px;
  margin-bottom:6px;
  border-radius:12px;
  cursor:pointer;
  color:#344054;
  text-decoration:none;
  transition:.2s;
  font-weight:800;
  font-size:14px;
}

.sidebar a:hover{
  background:#f4f7fb;
  color:#0a66c2;
}

.sidebar a.active{
  background:#eef6ff;
  color:#0a66c2;
  box-shadow:inset 4px 0 0 #0a66c2;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:900;
}
.overlay.active{display:block}
.main{margin-left:260px;padding:20px;width:100%}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  box-shadow:var(--shadow);
}
.hamburger{display:none;font-size:24px;cursor:pointer}
.topbar h1{font-size:20px;margin:0;font-weight:800}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agent-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:999px;
  background:#eef3f8;
  color:#334155;
  font-size:12px;
  font-weight:800;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.status-dot.online{background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.12)}
button{
  padding:8px 13px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  transition:.2s ease;
}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.primary{background:var(--primary);color:white}
.success{background:var(--green);color:white}
.logout{background:#fee2e2;color:#991b1b}
.gray{background:#eef3f8;color:#334155}
.soft{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
  margin-bottom:14px;
}
.card{
  background:#fff;
  padding:18px;
  border-radius:12px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}
.card p{font-size:22px;font-weight:800;margin:0}
.card small{display:block;margin-top:6px;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{margin:0;font-size:17px}
.section-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:12px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}
th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.blue{background:#e0f2fe;color:#075985}
.badge.yellow{background:#fef3c7;color:#92400e}
.task-card,.schedule-card{
  border:1px solid #eef2f7;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  background:#fff;
}
.task-card h4,.schedule-card h4{margin:0 0 6px;font-size:14px}
.task-card p,.schedule-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.55;margin-bottom:14px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:#fff}
.timer{font-size:34px;font-weight:900;letter-spacing:-.04em;margin:8px 0}
.timeline{display:grid;gap:10px}
.timeline-item{border-left:3px solid var(--primary);padding:8px 0 8px 12px}
.timeline-item b{display:block;font-size:13px}
.timeline-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.toast-wrap{position:fixed;right:18px;bottom:18px;display:grid;gap:10px;z-index:3000}
.toast{background:#111827;color:#fff;border-radius:12px;padding:12px 14px;min-width:260px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.toast.error{background:#7f1d1d}
.toast.success{background:#14532d}

</style>
</head>

<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <a class="agent-brand" href="home.html">
  <img src="images/aift-logo.png" alt="AIFT">
</a>
  <div class="agent-small" id="sidebarAgent">Loading agent...</div>
  <a data-section="dashboard" onclick="showSection('dashboard')" class="active">Dashboard</a>
  <a data-section="schedule" onclick="showSection('schedule')">My Schedule</a>
  <a data-section="tasks" onclick="showSection('tasks')">My Tasks</a>
  <a data-section="activity" onclick="showSection('activity')">Login / Logout</a>
  <a data-section="referrals" onclick="showSection('referrals')">My Referrals</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="hamburger" onclick="toggleSidebar()">☰</span>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div style="font-size:12px;color:#64748b;margin-top:3px;">Agent workspace connected to schedules, tasks, and activity tracking.</div>
      </div>
    </div>

    <div class="topbar-right">
      <span class="agent-pill"><span class="status-dot" id="liveDot"></span><span id="liveStatusText">Offline</span></span>
     <button class="soft" onclick="openPublicPage()">View Profile</button>
<button class="success" id="clockInBtn" onclick="clockIn()">Clock In</button>
<button class="logout" id="clockOutBtn" onclick="clockOut()">Clock Out</button>
<button class="gray" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API = "https://backend-1-9b6f.onrender.com";

function getToken(){
  return (
    localStorage.getItem("agentToken") ||
    localStorage.getItem("employerToken") ||
    localStorage.getItem("adminToken") ||
    localStorage.getItem("token")
  );
}

if(!getToken()){
  window.location.href = "login.html";
}

function authHeaders(extra = {}){
  return {
    Authorization: "Bearer " + getToken(),
    ...extra
  };
}

let agentData = null;
let schedules = [];
let tasks = [];
let sessions = [];
let activeSession = null;
let activeSection = "dashboard";
let timerInterval = null;

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){
  if(!value) return "Not set";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return escapeHTML(value);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}

function formatDateTime(value){
  if(!value) return "—";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "—";
  return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function durationBetween(start,end){
  if(!start) return "—";
  const s = new Date(start).getTime();
  const e = end ? new Date(end).getTime() : Date.now();
  if(Number.isNaN(s) || Number.isNaN(e)) return "—";
  const mins = Math.max(0, Math.floor((e - s) / 60000));
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${m}m`;
}

function showToast(title,msg="",type="success"){
  const wrap = document.getElementById("toastWrap");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.innerHTML = `<b>${escapeHTML(title)}</b><div style="font-size:12px;margin-top:4px;opacity:.9;">${escapeHTML(msg)}</div>`;
  wrap.appendChild(toast);
  setTimeout(()=>toast.remove(),3500);
}

async function fetchJSON(url, options = {}){
  const res = await fetch(url, options);
  let data = null;
  try{ data = await res.json(); }catch{ data = null; }

  if(!res.ok){
    const message = data?.message || data?.msg || `Request failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function closeSidebarMobile(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

async function loadMe(){
  agentData = await fetchJSON(`${API}/api/auth/me`, { headers: authHeaders() });
  if(agentData?._id){
  localStorage.setItem("userId", agentData._id);
}

if(agentData?.role){
  localStorage.setItem("role", agentData.role);
}

  document.getElementById("sidebarAgent").innerHTML = `
    <b>${escapeHTML(agentData.name || "User")}</b><br>
    ${escapeHTML(agentData.email || "")}<br>
    <span style="color:#93c5fd;">${escapeHTML(agentData.role || "")}</span>
  `;

  const canClock = agentData.role === "agent";
  document.getElementById("clockInBtn").disabled = !canClock;
  document.getElementById("clockOutBtn").disabled = !canClock;

  if(!canClock){
    document.getElementById("liveStatusText").innerText = "Employer/Admin View";
  }
}

async function loadSchedules(){
  schedules = await fetchJSON(`${API}/api/schedules`, { headers: authHeaders() });
  return schedules;
}

async function loadTasks(){
  tasks = await fetchJSON(`${API}/api/work-tasks`, { headers: authHeaders() });
  return tasks;
}

async function loadSessions(){
  if(agentData?.role !== "agent"){
    sessions = [];
    activeSession = null;
    updateStatus();
    return sessions;
  }

  sessions = await fetchJSON(`${API}/api/agent-sessions/me`, { headers: authHeaders() });
  activeSession = sessions.find(s => !s.logoutTime) || null;
  updateStatus();
  return sessions;
}

function updateStatus(){
  const dot = document.getElementById("liveDot");
  const text = document.getElementById("liveStatusText");

  if(agentData?.role !== "agent"){
    dot.className = "status-dot";
    text.innerText = "Employer/Admin View";
    return;
  }

  if(activeSession){
    dot.className = "status-dot online";
    text.innerText = "Online";
  }else{
    dot.className = "status-dot";
    text.innerText = "Offline";
  }
}

async function clockIn(){
  try{
    if(agentData?.role !== "agent"){
      showToast("Clock-in disabled","Only an agent account can clock in.","error");
      return;
    }

    await fetchJSON(`${API}/api/agent-sessions/clock-in`, {
      method:"POST",
      headers: authHeaders({"Content-Type":"application/json"}),
      body: JSON.stringify({ device: navigator.platform || "browser" })
    });

    await loadSessions();
    renderCurrentSection();
    showToast("Clocked in","Your session is now active.");
  }catch(err){
    showToast("Clock-in failed",err.message,"error");
  }
}

async function clockOut(){
  try{
    if(agentData?.role !== "agent"){
      showToast("Clock-out disabled","Only an agent account can clock out.","error");
      return;
    }

    await fetchJSON(`${API}/api/agent-sessions/clock-out`, {
      method:"POST",
      headers: authHeaders()
    });

    await loadSessions();
    renderCurrentSection();
    showToast("Clocked out","Your session has been closed.");
  }catch(err){
    showToast("Clock-out failed",err.message,"error");
  }
}

async function updateTask(id,status){
  try{
    await fetchJSON(`${API}/api/work-tasks/${id}`, {
      method:"PATCH",
      headers: authHeaders({"Content-Type":"application/json"}),
      body: JSON.stringify({ status })
    });

    await loadTasks();
    renderCurrentSection();
    showToast("Task updated",`Task marked as ${status.replaceAll("_"," ")}.`);
  }catch(err){
    showToast("Task update failed",err.message,"error");
  }
}

function dashboardHTML(){
  const totalTasks = tasks.length;
  const doneTasks = tasks.filter(t => t.status === "done").length;
  const openTasks = tasks.filter(t => t.status !== "done" && t.status !== "cancelled").length;
  const today = new Date().toISOString().slice(0,10);
  const todaySchedules = schedules.filter(s => String(s.startDate || s.date || "").slice(0,10) === today);

  return `
    <div class="stats">
      <div class="card"><h3>Status</h3><p>${activeSession ? "Online" : "Offline"}</p><small>${activeSession ? "Current session active" : "No active session"}</small></div>
      <div class="card"><h3>Today Schedule</h3><p>${todaySchedules.length}</p><small>Assigned shift(s) today</small></div>
      <div class="card"><h3>Open Tasks</h3><p>${openTasks}</p><small>Tasks requiring action</small></div>
      <div class="card"><h3>Completed</h3><p>${doneTasks}</p><small>${totalTasks ? Math.round((doneTasks/totalTasks)*100) : 0}% completion rate</small></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-head">
          <div><h2>Today’s Work</h2><p>Your live schedules and assigned tasks.</p></div>
          <button class="soft" onclick="refreshAll()">Refresh</button>
        </div>
        ${todaySchedules.length ? todaySchedules.map(scheduleCard).join("") : `<div class="empty">No schedule for today.</div>`}
        <div style="height:12px;"></div>
        ${tasks.slice(0,5).map(taskCard).join("") || `<div class="empty">No tasks assigned yet.</div>`}
      </div>

      <div class="card">
        <div class="section-head">
          <div><h2>Current Session</h2><p>Login/logout tracking.</p></div>
        </div>
        ${activeSession ? `
          <div class="timer" id="liveTimer">${durationBetween(activeSession.loginTime)}</div>
          <small>Started: ${formatDateTime(activeSession.loginTime)}</small>
          <div class="actions-row"><button class="logout" onclick="clockOut()">Clock Out</button></div>
        ` : `
          <div class="notice">You are currently offline. Clock in when your shift starts.</div>
          <div class="actions-row"><button class="success" onclick="clockIn()" ${agentData?.role !== "agent" ? "disabled" : ""}>Clock In</button></div>
        `}
      </div>
    </div>
  `;
}

function scheduleCard(s){
  const agent = s.agentId || {};
  return `
    <div class="schedule-card">
      <h4>${escapeHTML(s.title || "Untitled schedule")}</h4>
      <p>
        ${formatDate(s.startDate)} ${escapeHTML(s.startTime || "")} - ${escapeHTML(s.endTime || "")}<br>
        ${escapeHTML(s.shiftType || "custom")} · ${escapeHTML(s.locationType || "onsite")}<br>
        ${agent?.name ? `Agent: ${escapeHTML(agent.name)}` : ""}
      </p>
      ${s.notes ? `<p style="margin-top:8px;">${escapeHTML(s.notes)}</p>` : ""}
    </div>
  `;
}

function taskCard(t){
  const statusClass = t.status === "done" ? "green" : t.status === "blocked" ? "red" : t.status === "in_progress" ? "blue" : "yellow";
  return `
    <div class="task-card">
      <h4>${escapeHTML(t.title || "Untitled task")}</h4>
      <p>${escapeHTML(t.description || "No description")}</p>
      <div class="actions-row">
        <span class="badge ${statusClass}">${escapeHTML((t.status || "todo").replaceAll("_"," "))}</span>
        <span class="badge blue">${escapeHTML(t.priority || "medium")}</span>
        ${t.dueDate ? `<span class="badge yellow">Due ${formatDate(t.dueDate)}</span>` : ""}
      </div>
      <div class="actions-row">
        <button class="gray" onclick="updateTask('${t._id}','in_progress')">Start</button>
        <button class="success" onclick="updateTask('${t._id}','done')">Complete</button>
        <button class="logout" onclick="updateTask('${t._id}','blocked')">Block</button>
      </div>
    </div>
  `;
}

function renderDashboard(){
  document.getElementById("content").innerHTML = dashboardHTML();
  startTimer();
}

function renderSchedule(){
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="section-head">
        <div><h2>My Schedule</h2><p>Schedules assigned by your employer.</p></div>
        <button class="soft" onclick="refreshAll()">Refresh</button>
      </div>
      ${schedules.length ? schedules.map(scheduleCard).join("") : `<div class="empty">No schedules assigned yet.</div>`}
    </div>
  `;
}

function renderTasks(){
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="section-head">
        <div><h2>My Tasks</h2><p>Tasks assigned by your employer.</p></div>
        <button class="soft" onclick="refreshAll()">Refresh</button>
      </div>
      ${tasks.length ? tasks.map(taskCard).join("") : `<div class="empty">No tasks assigned yet.</div>`}
    </div>
  `;
}

function renderActivity(){
  document.getElementById("content").innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="section-head">
          <div><h2>Login / Logout</h2><p>Your attendance session tracking.</p></div>
        </div>
        ${agentData?.role !== "agent" ? `
          <div class="notice">You are viewing this page with an employer/admin account. Clock-in and clock-out are only available for agent accounts.</div>
        ` : activeSession ? `
          <div class="timer" id="liveTimer">${durationBetween(activeSession.loginTime)}</div>
          <small>Clocked in: ${formatDateTime(activeSession.loginTime)}</small>
          <div class="actions-row"><button class="logout" onclick="clockOut()">Clock Out</button></div>
        ` : `
          <div class="notice">You are offline.</div>
          <div class="actions-row"><button class="success" onclick="clockIn()">Clock In</button></div>
        `}
      </div>

      <div class="card">
        <div class="section-head">
          <div><h2>Recent Sessions</h2><p>Latest login/logout history.</p></div>
          <button class="soft" onclick="refreshAll()">Refresh</button>
        </div>
        <div class="timeline">
          ${sessions.length ? sessions.slice(0,12).map(s => `
            <div class="timeline-item">
              <b>${formatDateTime(s.loginTime)}</b>
              <span>Logout: ${formatDateTime(s.logoutTime)} · Duration: ${durationBetween(s.loginTime,s.logoutTime)}</span>
            </div>
          `).join("") : `<div class="empty">No sessions found yet.</div>`}
        </div>
      </div>
    </div>
  `;
  startTimer();
}

function renderReferrals(){
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="section-head">
        <div><h2>My Referrals</h2><p>Your referral info from your account.</p></div>
      </div>
      <div class="stats">
        <div class="card"><h3>Referral Code</h3><p>${escapeHTML(agentData?.referralCode || "N/A")}</p><small>Share this code with referrals.</small></div>
        <div class="card"><h3>Commission</h3><p>${Number(agentData?.commissionEarned || 0).toLocaleString()}</p><small>Total commission recorded.</small></div>
      </div>
    </div>
  `;
}

function renderCurrentSection(){
  if(activeSection === "dashboard") renderDashboard();
  if(activeSection === "schedule") renderSchedule();
  if(activeSection === "tasks") renderTasks();
  if(activeSection === "activity") renderActivity();
  if(activeSection === "referrals") renderReferrals();
}

function setActiveNav(section){
  document.querySelectorAll(".sidebar a[data-section]").forEach(a=>{
    a.classList.toggle("active", a.dataset.section === section);
  });
}

async function showSection(section){
  activeSection = section;
  setActiveNav(section);
  closeSidebarMobile();

  const titles = {
    dashboard:"Dashboard",
    schedule:"My Schedule",
    tasks:"My Tasks",
    activity:"Login / Logout",
    referrals:"My Referrals"
  };

  document.getElementById("pageTitle").innerText = titles[section] || "Dashboard";
  document.getElementById("content").innerHTML = `<div class="card"><div class="empty">Loading...</div></div>`;

  try{
    await refreshAll(false);
    renderCurrentSection();
  }catch(err){
    document.getElementById("content").innerHTML = `<div class="card"><div class="notice">${escapeHTML(err.message)}</div></div>`;
  }
}

async function refreshAll(shouldRender = true){
  await Promise.all([
    loadSchedules().catch(err => { schedules = []; console.error(err); }),
    loadTasks().catch(err => { tasks = []; console.error(err); }),
    loadSessions().catch(err => { sessions = []; activeSession = null; console.error(err); })
  ]);

  if(shouldRender) renderCurrentSection();
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const el = document.getElementById("liveTimer");
    if(el && activeSession){
      el.innerText = durationBetween(activeSession.loginTime);
    }
  }, 30000);
}
function openPublicPage(){
  if(!agentData?._id){
    showToast("Profile unavailable", "Agent profile is still loading.", "error");
    return;
  }

  window.location.href = `agent-public-profile.html?id=${agentData._id}`;
}
function logout(){
  localStorage.removeItem("agentToken");
  localStorage.removeItem("employerToken");
  localStorage.removeItem("adminToken");
  localStorage.removeItem("talentToken");
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("userId");
  window.location.href = "login.html";
}

(async function init(){
  try{
    await loadMe();
    await refreshAll(false);
    renderDashboard();
  }catch(err){
    document.getElementById("content").innerHTML = `<div class="card"><div class="notice">${escapeHTML(err.message)}</div></div>`;
  }
})();
</script>
</body>
